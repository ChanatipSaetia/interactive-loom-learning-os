<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom UMD: Standalone OKF Parser & Editor Playground</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Loom Sections Stylesheet (loads from public CDN first, falls back to local build) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/loom-learning-sections@1.4.0/loom-sections.css" onerror="this.onerror=null;this.href='../dist-lib/loom-sections.css';">
</head>

<body>

  <!-- Container where Loom Sections will render -->
  <div id="loom-root"></div>

  <!-- Loom Sections UMD Bundle (loads from public CDN first, falls back to local build) -->
  <script src="https://cdn.jsdelivr.net/npm/loom-learning-sections@1.4.0/loom-sections.umd.js" onerror="this.onerror=null;this.src='../dist-lib/loom-sections.umd.js';"></script>

  <script>
    // Embedded sample OKF bundle for offline file:// static execution without local web server
    const SAMPLE_OKF_BUNDLE = [
      {
        meta: { type: 'intro', title: 'System Architecture & OKF Overview', resource: '.' },
        data: {
          type: 'intro',
          title: 'System Architecture & OKF Overview',
          subtitle: 'Interactive learning platform powered by Open Knowledge Format (OKF)',
          estimatedTime: '10 min',
          moduleCount: 4,
          what: { summary: 'An interactive learning platform with animated flowcharts, trade-off sandboxes, taxonomy browsers, and live OKF section editing.' },
          why: { summary: 'Enables rapid conceptual learning and live content authoring without complex tooling.' },
          roadmap: ['1. Architectural Concepts', '2. Practice Quiz', '3. Concept Map']
        },
        sectionFolder: '01-intro',
        sectionBody: ''
      },
      {
        meta: { type: 'text', title: 'Core Concepts & Principles', resource: '.' },
        data: {
          type: 'text',
          paragraphs: [
            'Open Knowledge Format (OKF) separates structural UI presentation from raw learning content.',
            'Each section can be edited in real time using the Visual Schema Form or Raw YAML text editor tab.'
          ]
        },
        sectionFolder: '02-text',
        sectionBody: ''
      },
      {
        meta: { type: 'bullets', title: 'Key Features & Capabilities', resource: '.' },
        data: {
          type: 'bullets',
          items: [
            { text: 'Standalone UMD CDN Bundle: Runs anywhere without npm serve or Node server.' },
            { text: 'Bi-directional Real-Time Sync: Edits in Visual Form update Raw YAML instantly.' },
            { text: 'Live Preview Pane: Renders updated component state immediately as you type.' },
            { text: 'Offline File Downloads: Export section.md and data.yaml files straight from the browser.' }
          ]
        },
        sectionFolder: '03-bullets',
        sectionBody: ''
      },
      {
        meta: { type: 'quiz', title: 'Knowledge Check Quiz', resource: '.' },
        data: {
          type: 'quiz',
          questions: [
            {
              id: 'q1',
              question: 'Can this static HTML example edit its OKF without running a local web server (npm serve)?',
              choices: [
                { id: 'c1', text: 'Yes, it works directly on file:// or static hosting with in-memory rendering and file export.', correct: true, explanation: 'Correct! LoomSections supports direct in-memory bundle rendering and Blob file downloads.' },
                { id: 'c2', text: 'No, a backend server is strictly required.', correct: false, explanation: 'Incorrect! LoomSections works 100% serverless.' }
              ],
              hint: 'Check LoomSections.renderOKF capabilities.'
            }
          ]
        },
        sectionFolder: '04-quiz',
        sectionBody: ''
      },
      {
        meta: { type: 'concept-map', title: 'Architecture Concept Map', resource: '.' },
        data: {
          type: 'concept-map',
          nodes: {
            'okf-spec': { id: 'okf-spec', title: 'OKF Schema Specification', category: 'core' },
            'umd-bundle': { id: 'umd-bundle', title: 'Standalone UMD Library', category: 'distribution' },
            'visual-editor': { id: 'visual-editor', title: 'Visual Section Editor', category: 'editor' }
          },
          edges: [
            { from: 'okf-spec', to: 'umd-bundle', label: 'compiled into' },
            { from: 'umd-bundle', to: 'visual-editor', label: 'powers' }
          ]
        },
        sectionFolder: '05-concept-map',
        sectionBody: ''
      }
    ];

    async function initLoomSections() {
      const options = {
        title: "Interactive OKF Catalog & Visual Editor",
        theme: "frappe",
        header: {
          brandTitle: "Learning OS",
          showAudioToggle: true,
          showThemePicker: true,
          statusBadge: "⚡ Standalone UMD Mode",
        },
      };

      if (window.location.protocol !== 'file:') {
        try {
          await LoomSections.loadAndRenderOKF(document.getElementById("loom-root"), 'okf-data', '.', options);
          return;
        } catch (e) {
          console.warn("Fetch failed, falling back to embedded OKF sample bundle:", e);
        }
      }

      LoomSections.renderOKF(document.getElementById("loom-root"), SAMPLE_OKF_BUNDLE, options);
    }

    window.addEventListener('DOMContentLoaded', initLoomSections);
  </script>
</body>

</html>
