<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom MCP test host</title>
  <style>
    body { margin: 0; font: 14px system-ui; background: #232634; color: #c6d0f5; }
    #chat { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #414559; max-width: 80%; }
    .model { background: #292c3c; }
    .context { font-size: 12px; opacity: .7; }
    .error { background: #e78284; color: #232634; }
    iframe { width: 100%; height: 320px; border: 0; border-radius: 18px; background: transparent; }
    body.light { background: #eff1f5; color: #4c4f69; }
    body.light .user { background: #ccd0da; }
    body.light .model { background: #e6e9ef; }
    body.fullscreen iframe { position: fixed; inset: 0; width: 100vw; height: 100vh !important; border-radius: 0; z-index: 10; background: #232634; }
    body.fullscreen.light iframe { background: #eff1f5; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module" src="./host.ts"></script>
</body>
</html>
