type: "taxonomy-category"
icon: ShieldAlert
title: ระบบช่วงล่างและเบรก
subtitle: ความปลอดภัยและการทรงตัว
color: green
description: ระบบที่คอยรับแรงกระแทกและควบคุมการหยุดรถ
details: ปัญหาช่วงล่างทำให้ควบคุมรถยากและเสี่ยงเกิดอุบัติเหตุสูง หากโช้คอัพแตกจะมีน้ำมันซึมและทำให้รถเด้งไม่หยุด ส่วนปัญหาเบรกอาจเกิดจากผ้าเบรกหมดจนเหล็กสีกับจานเบรก หรือมีฟองอากาศในระบบน้ำมันเบรก
analogy: เหมือนรองเท้าและระบบประสาทสั่งการหยุด หากรองเท้าลื่นหรือสั่งหยุดไม่ได้ก็เตรียมตัวล้ม
primaryFocus: "น้ำมันเบรก, ความหนาผ้าเบรก, ซีลโช้คอัพ, และลมยาง"
inScope:
  - เบรกจม เบรกไม่อยู่
  - ตกหลุมแล้วมีเสียงกระแทกแรงๆ (โช้คยัน)
  - คอรถฝืด เลี้ยวแล้วฝืนๆ (ลูกปืนคอแตก)
  - หน้าส่ายเวลาขับความเร็วสูง
outOfScope:
  - แฮนด์สั่นเพราะเครื่องยนต์สั่น
  - ล้อหมุนไม่ไปเพราะเข้าเกียร์ค้าง
