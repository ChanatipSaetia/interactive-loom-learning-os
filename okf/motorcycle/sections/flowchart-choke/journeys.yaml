- id: "choke-cold-start"
  label: สตาร์ทเครื่องเย็น (Cold Start)
  description: เปิดโช้ค → สตาร์ท → เครื่องอุ่น → ปิดโช้ค → ผสมส่วนปกติ
  steps:
    - stepId: choke_on
      name: "เปิดโช้ค"
      description: "ดึงโช้คปิดช่องอากาศ ลดอากาศเข้าเพื่อให้ส่วนผสมเข้มข้นขึ้น เหมาะแก่การสตาร์ทเครื่องเย็น"
    - stepId: cold_start
      name: "สตาร์ทเครื่อง"
      description: "ส่วนผสมเข้มข้นช่วยให้จุดระเบิดง่ายขึ้น เครื่องติดและเริ่มทำงาน"
    - stepId: choke_off
      name: "ปิดโช้ค"
      description: "เมื่อเครื่องอุ่นแล้ว ปล่อยโช้คกลับมาเพื่อเปิดช่องอากาศให้กลับสู่การทำงานปกติ"

- id: "choke-forgot-off"
  label: ลืมปิดโช้ค (Forgot to Turn Off Choke)
  description: เปิดโช้ค → ลืมปิด → วิ่งโช้คค้าง → รถเร่งไม่ขึ้น
  steps:
    - stepId: choke_on
      name: "เปิดโช้ค"
      description: "ดึงโช้คเพื่อสตาร์ทเครื่องเย็น"
    - stepId: ride_choke
      name: "วิ่งโช้คค้าง"
      description: "ลืมปล่อยโช้ค เครื่องได้รับส่วนผสมเข้มข้นเกินไป ทำให้เร่งไม่ขึ้น มีควันดำ และสิ้นเปลืองน้ำมัน"
