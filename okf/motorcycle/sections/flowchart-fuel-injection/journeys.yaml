- id: "fuel-injection-normal"
  label: หัวฉีดปกติ (Normal Fuel Injection)
  description: บิดคันเร่ง → ECU คำนวณ → หัวฉีดพ่น → ละอองน้ำมัน → ผสมส่วนแม่นยำ
  steps:
    - nodeId: inject_throttle
      description: ผู้ขับขี่บิดคันเร่ง เซ็นเซอร์ตรวจวัดการบิด
    - nodeId: sensor_read
      description: กล่อง ECU รับสัญญาณจากเซ็นเซอร์หลายตัว
    - nodeId: sensor_read
      description: ข้อมูลรอบเครื่อง ตำแหน่งคันเร่ง อุณหภูมิเครื่อง อากาศเข้า
    - nodeId: inject_fuel
      description: ECU คำนวณปริมาณน้ำมันที่เหมาะสมตามสภาวะ
    - nodeId: fuel_atomized
      description: หัวฉีดพ่นละอองน้ำมันเข้าสู่ท่อไอดี
    - nodeId: fuel_atomized
      description: น้ำมันเป็นละอองละเอียด ผสมกับอากาศ
    - nodeId: precise_mix
      description: ใช้ส่วนผสมที่คำนวณแม่นยำตามสภาวะ
    - nodeId: precise_mix
      description: ได้อัตราส่วนแม่นยำ ประหยัดน้ำมันและสตาร์ทง่าย
- id: "fuel-injection-cold"
  label: เพิ่มส่วนผสมอัตโนมัติ (Auto Cold Enrichment)
  description: บิดคันเร่ง → ECU ตรวจเครื่องเย็น → เพิ่มน้ำมันอัตโนมัติ
  steps:
    - nodeId: inject_throttle
      description: ผู้ขับขี่บิดคันเร่ง เซ็นเซอร์ตรวจวัดการบิด
    - nodeId: sensor_read
      description: กล่อง ECU รับสัญญาณจากเซ็นเซอร์หลายตัว
    - nodeId: sensor_read
      description: ข้อมูลรอบเครื่อง ตำแหน่งคันเร่ง อุณหภูมิเครื่อง อากาศเข้า
    - nodeId: inject_fuel
      description: ECU ตรวจพบเครื่องเย็น สั่งเพิ่มส่วนผสม
    - nodeId: inject_cold
      description: ECU เพิ่มปริมาณน้ำมันอัตโนมัติ
    - nodeId: inject_cold_auto
      description: หัวฉีดพ่นน้ำมันมากขึ้นเพื่อช่วยสตาร์ทเครื่องเย็น
    - nodeId: inject_cold_auto
      description: ไม่ต้องใช้โช้ค ระบบปรับอัตโนมัติ
