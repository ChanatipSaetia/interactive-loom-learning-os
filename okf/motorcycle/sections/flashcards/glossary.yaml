- id: carburetor
  word: คาร์บูเรเตอร์ (Carburetor)
  pronunciation: "คา-บู-เร-เต้อ"
  category: engine
  shortDefinition: ตัวผสมน้ำมันและอากาศในรถรุ่นเก่า
  detailedDefinition: อุปกรณ์ทำหน้าที่ผสมน้ำมันเชื้อเพลิงกับอากาศให้เป็นละอองก่อนเข้าสู่ห้องเผาไหม้ ใช้หลักการทางแรงดูดและกลไก มักพบในรถรุ่นเก่า สามารถปรับจูนแบบแมนนวลได้
  whyItMatters: หากคาร์บูเรเตอร์สกปรกหรือจูนไม่ดี รถจะเร่งไม่ขึ้น กินน้ำมัน หรือเบาดับ
- id: injector
  word: หัวฉีด (Fuel Injector)
  pronunciation: "หัว-ฉีด"
  category: engine
  shortDefinition: ระบบจ่ายน้ำมันเชื้อเพลิงไฟฟ้า
  detailedDefinition: ระบบจ่ายน้ำมันเชื้อเพลิงด้วยหัวฉีดอิเล็กทรอนิกส์ ควบคุมปริมาณการจ่ายด้วยกล่อง ECU ให้ความแม่นยำสูง ละอองน้ำมันฝอยละเอียดกว่า และปรับจูนผ่านคอมพิวเตอร์
  whyItMatters: ทำให้สตาร์ทติดง่ายและประหยัดน้ำมันกว่าคาร์บูเรเตอร์ แต่ซ่อมเองยากกว่า
- id: "spark-plug"
  word: หัวเทียน (Spark Plug)
  pronunciation: "หัว-เทียน"
  category: electrical
  shortDefinition: ตัวจุดประกายไฟในเครื่องยนต์
  detailedDefinition: อุปกรณ์ทำหน้าที่จุดประกายไฟแรงสูงในห้องเผาไหม้เพื่อให้เกิดการระเบิดผลักลูกสูบ
  whyItMatters: หากหัวเทียนบอด (หมดสภาพ) รถจะสตาร์ทไม่ติดเลย เป็นอะไหล่พื้นฐานที่ควรเปลี่ยนตามระยะ
- id: sprocket
  word: สเตอร์ (Sprocket)
  pronunciation: "สะ-เต้อ"
  category: drivetrain
  shortDefinition: เฟืองขับเคลื่อนล้อ
  detailedDefinition: เฟืองจักรยานยนต์ มีทั้งสเตอร์หน้า (ติดเครื่อง) และสเตอร์หลัง (ติดล้อ) ทำงานร่วมกับโซ่เพื่อถ่ายทอดกำลังจากเครื่องยนต์ไปยังล้อหลัง
  whyItMatters: "หากสเตอร์ฟันแหลมหรือโซ่หย่อนมากจนตั้งไม่ได้แล้ว ต้องเปลี่ยนใหม่ยกชุด (โซ่-สเตอร์)"
- id: gasket
  word: ปะเก็น (Gasket)
  pronunciation: "ปะ-เก็น"
  category: engine
  shortDefinition: แผ่นซีลป้องกันการรั่วซึม
  detailedDefinition: แผ่นซีลที่คั่นกลางระหว่างชิ้นส่วนเครื่องยนต์ที่เป็นเหล็กประกบกัน เพื่อป้องกันการรั่วซึมของน้ำมันเครื่อง น้ำหล่อเย็น หรือกำลังอัด
  whyItMatters: หากปะเก็นแตกหรือเสื่อมสภาพ น้ำมันเครื่องจะรั่วซึมออกมา ทำให้เครื่องสกปรกและระดับน้ำมันเครื่องลดลง
- id: choke
  word: โช้ค (Choke)
  pronunciation: โช้ค
  category: engine
  shortDefinition: วาล์วเพิ่มส่วนผสมน้ำมันสำหรับสตาร์ทเครื่องเย็น
  detailedDefinition: "กลไกปิดช่องอากาศบางส่วนเพื่อจำกัดปริมาณอากาศที่เข้าสู่คาร์บูเรเตอร์ ทำให้สัดส่วนน้ำมัน:อากาศสูงขึ้น (ส่วนผสมรวยน้ำมัน) เหมาะสำหรับการสตาร์ทเครื่องยนต์ที่ยังเย็นอยู่"
  whyItMatters: หากเปิดโช้คสตาร์ทแล้วลืมปิด รถจะกินน้ำมันมาก หัวเทียนสกปรก และเร่งไม่ขึ้น
- id: ecu
  word: กล่อง ECU (Electronic Control Unit)
  pronunciation: "อี-ซี-ยู"
  category: electrical
  shortDefinition: สมองกลควบคุมเครื่องยนต์
  detailedDefinition: "หน่วยประมวลผลอิเล็กทรอนิกส์ที่ควบคุมการทำงานต่างๆ ของเครื่องยนต์ รับข้อมูลจากเซ็นเซอร์หลายตัว (รอบเครื่อง, ตำแหน่งคันเร่ง, อุณหภูมิ, อากาศเข้า) แล้วคำนวณสั่งงานหัวฉีดและระบบอื่นๆ ให้ทำงานเหมาะสมกับสภาวะปัจจุบัน"
  whyItMatters: ในรถหัวฉีด ECU ทำหน้าที่แทนคาร์บูเรเตอร์และโช้ค ให้ความแม่นยำสูงและปรับจูนอัตโนมัติ
- id: piston
  word: ลูกสูบ (Piston)
  pronunciation: "ลูก-สูบ"
  category: engine
  shortDefinition: ตัวเคลื่อนที่ในกระบอกสูบ
  detailedDefinition: "ชิ้นส่วนกระบอกสูบที่เคลื่อนที่ขึ้น-ลง 4 จังหวะ: ดูด (ไอดีเข้า) อัด (อัดส่วนผสม) ระเบิด (ถูกแรงระเบิดดันลง) คาย (ดันไอเสียออก) การเคลื่อนที่นี้ส่งกำลังผ่านก้านสูบไปยังเพลาข้อเหวี่ยง"
  whyItMatters: หากลูกสูบหรือวงแหวนลูกสูบสึกหรอ กำลังอัดจะลด เครื่องจะไม่มีกำลังและควันออกท่อไอเสีย
- id: crankshaft
  word: เพลาข้อเหวี่ยง (Crankshaft)
  pronunciation: "ครังก์-ชาฟท์"
  category: engine
  shortDefinition: เปลี่ยนการเคลื่อนที่ตรงเป็นหมุน
  detailedDefinition: "เพลาที่รับแรงจากก้านสูบ (การเคลื่อนที่ขึ้น-ลง) แล้วเปลี่ยนเป็นการหมุน เพื่อส่งกำลังผ่านระบบเกียร์ไปยังล้อ"
  whyItMatters: หากเพลาข้อเหวี่ยงเบี้ยวหรือลูกปืนแตก เครื่องจะสั่นรุนแรงจนไม่สามารถใช้งานได้
- id: transmission
  word: ระบบเกียร์ (Transmission)
  pronunciation: "_TRANสมิช-ชั่น"
  category: drivetrain
  shortDefinition: ทดรอบและส่งกำลังสู่ล้อ
  detailedDefinition: ระบบถ่ายทอดกำลังจากเครื่องยนต์ไปยังล้อหลัง มีทั้งระบบเกียร์เท้าปั่น (manual) ที่ให้ควบคุมรอบเครื่องได้แม่นยำ และระบบเกียร์อัตโนมัติ (CVT) ที่สะดวกและเหมาะสมกับการจราจรในเมือง
  whyItMatters: หากคลัตช์ลื่น (รถเกียร์) หรือสายพานยืด (รถออโตเมติก) เครื่องจะเร่งไม่ขึ้นแม้รอบเครื่องจะสูง
- id: "brake-caliper"
  word: แคลิเพอร์เบรก (Brake Caliper)
  pronunciation: "แค-ลิ-เพ้อ"
  category: brake
  shortDefinition: กดผ้าเบรกประกบจานเบรก
  detailedDefinition: อุปกรณ์ที่ครอบอยู่รอบจานเบรก มีลูกสูบที่เลื่อนออกเมื่อได้รับแรงดันน้ำมันเบรก ดันผ้าเบรกประกบจานเบรกทั้งสองด้าน สร้างแรงเสียดทานเพื่อหน่วงการหมุนของล้อ
  whyItMatters: หากซีลแคลิเพอร์แตก น้ำมันเบรกจะรั่วซึม เบรกจะจมและไม่อยู่
- id: "brake-disc"
  word: จานเบรก (Brake Disc)
  pronunciation: "จาน-เบรก"
  category: brake
  shortDefinition: จานหมุนที่ผ้าเบรกประกบ
  detailedDefinition: จานโลหะที่หมุนไปพร้อมกับล้อ เมื่อผ้าเบรกประกบจาน จะเกิดแรงเสียดทานที่เปลี่ยนพลังงานจลน์ของรถเป็นความร้อน ทำให้รถช้าลงหรือหยุด
  whyItMatters: หากจานเบรกเป็นร่องลึกหรือบิดงอ เบรกจะสั่นและประสิทธิภาพลดลง ควรลับหรือเปลี่ยนจานเบรกตามระยะ
- id: "brake-master"
  word: กระปุกเบรก (Master Cylinder)
  pronunciation: "มา-สเต้อ-ซิ-ลิน-เดอร์"
  category: brake
  shortDefinition: เปลี่ยนแรงกดเป็นแรงดันไฮดรอลิก
  detailedDefinition: กระบอกสูบที่เปลี่ยนแรงกดจากคันเบรกหรือแป้นเบรกเป็นแรงดันไฮดรอลิกในน้ำมันเบรก ส่งแรงดันผ่านท่อไปยังแคลิเพอร์ที่ล้อ
  whyItMatters: หากกระปุกเบรกมีปัญหา ซีลภายในแตก เบรกจะจมหรือไม่มีแรงเบรก
- id: "brake-fade"
  word: เบรกจม (Brake Fade)
  pronunciation: "เบรก-เฟด"
  category: brake
  shortDefinition: ประสิทธิภาพเบรกลดลงเพราะความร้อนสูง
  detailedDefinition: ภาวะที่เบรกทำงานหนักต่อเนื่อง ทำให้จานเบรกและผ้าเบรกมีความร้อนสูงเกินจุดทำงานปกติ แรงเสียดทานลดลง เบรกจึงไม่อยู่หรือจม
  whyItMatters: อันตรายมากเมื่อลงเขาหรือเบรกหนักต่อเนื่อง ควรใช้เกียร์ช่วยเบรกและพักเบรกเป็นระยะ
- id: "intake-valve"
  word: วาล์วไอดี (Intake Valve)
  pronunciation: "แอิน-เทรก-แวลว์"
  category: engine
  shortDefinition: วาล์วเปิดรับส่วนผสมเข้ากระบอกสูบ
  detailedDefinition: วาล์วที่เปิดเมื่อลูกสูบเคลื่อนที่ลง (จังหวะดูด) อนุญาตให้ส่วนผสมน้ำมันและอากาศไหลเข้าสู่กระบอกสูบ จากนั้นปิดสนิทในจังหวะอัด ระเบิด และคาย
  whyItMatters: หากวาล์วไอดีปิดไม่สนิท กำลังอัดจะรั่ว เครื่องจะไม่มีกำลังและทำงานไม่เรียบ
- id: "exhaust-valve"
  word: วาล์วไอเสีย (Exhaust Valve)
  pronunciation: "เอ็ก-ซอส-แวลว์"
  category: engine
  shortDefinition: วาล์วเปิดปล่อยไอเสียออก
  detailedDefinition: วาล์วที่เปิดเมื่อลูกสูบเคลื่อนที่ขึ้นในจังหวะคาย อนุญาตให้ก๊าซไอเสียถูกดันออกจากกระบอกสูบ จากนั้นปิดสนิทในจังหวะดูด อัด และระเบิด
  whyItMatters: หากวาล์วไอเสียไหม้หรือปิดไม่สนิท ไอเสียจะไหลย้อนกลับ เครื่องจะทำงานผิดปกติและควันออกท่อมาก
