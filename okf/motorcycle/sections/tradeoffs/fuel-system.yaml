id: "fuel-system"
title: ระบบจ่ายเชื้อเพลิง (Fuel Delivery System)
description: เลือกระบบจ่ายเชื้อเพลิงที่เหมาะกับรถและพฤติกรรมการใช้งานของคุณ
metrics:
  - id: precision
    label: ความแม่นยำส่วนผสม
    baseValue: 0
  - id: coldstart
    label: สตาร์ทง่าย (เครื่องเย็น)
    baseValue: 0
  - id: maintenance
    label: ความสะดวกในการบำรุงรักษา
    baseValue: 0
  - id: price
    label: ความประหยัด (ราคา)
    baseValue: 0
    direction: lower
steps:
  - id: "fuel-system-type"
    title: เลือกระบบจ่ายเชื้อเพลิง
    description: ระบบจ่ายเชื้อเพลิงที่เหมาะสมกับรถของคุณ
    recommended: "fuel-injection"
    choices:
      - id: "fuel-injection"
        label: หัวฉีด (Fuel Injection / EFI)
        description: ระบบอิเล็กทรอนิกส์ที่ ECU คำนวณและควบคุมการพ่นละอองน้ำมันเชื้อเพลิงอย่างแม่นยำ
        metrics:
          precision: 90
          coldstart: 95
          maintenance: 60
          price: -80
        pros:
          - title: ส่วนผสมแม่นยำ
            description: ECU คำนวณจากเซ็นเซอร์หลายตัว ปรับตามสภาวะจริง ทำให้ประหยัดน้ำมันและได้กำลังเต็มที่
          - title: สตาร์ทง่าย
            description: เพิ่มส่วนผสมอัตโนมัติเมื่อเครื่องเย็น ไม่ต้องเปิดโช้ค
          - title: ไม่ต้องจูน
            description: ปรับจูนอัตโนมัติ ไม่ต้องยุ่งกับสกรูจูนคาร์บู
        cons:
          - title: ราคาสูง
            description: ค่าอะไหล่และค่าซ่อมสูง ต้องใช้เครื่องมือพิเศษในการวินิจฉัย
          - title: ซ่อมเองยาก
            description: ต้องเข้าใจระบบไฟฟ้าและอ่านค่าจากสแกนเนอร์
        whyThisFits: เป็นมาตรฐานของรถรุ่นใหม่ ให้ความแม่นยำสูงและใช้งานสะดวกที่สุด
        whenToUse: เมื่อต้องการรถที่สตาร์ทง่าย ประหยัดน้ำมัน และไม่ต้องจูนบ่อย
      - id: carburetor
        label: คาร์บูเรเตอร์ (Carburetor)
        description: ระบบกลไกผสมน้ำมันและอากาศด้วยแรงดูด ควบคุมด้วยสกรูและโช้ค
        metrics:
          precision: 40
          coldstart: 45
          maintenance: 85
          price: -20
        pros:
          - title: ซ่อมง่าย
            description: เห็นการทำงานด้วยตาเปล่า ถอดล้างและจูนเองได้ ไม่ต้องใช้เครื่องมือพิเศษ
          - title: ราคาถูก
            description: อะไหล่ถูกและหาซื้อง่าย ช่างส่วนใหญ่ซ่อมได้
          - title: ปรับแต่งง่าย
            description: เปลี่ยนเจ็ทหรือจูนสกรูอากาศเพื่อเพิ่มกำลังได้โดยตรง
        cons:
          - title: ส่วนผสมไม่แม่นยำ
            description: ไม่สามารถปรับตามสภาวะได้จริง กินน้ำมันมากกว่าหัวฉีด
          - title: สตาร์ทติดยาก
            description: ต้องเปิดโช้คช่วย และถ้าลืมปิดโช้ค รถจะเร่งไม่ขึ้นและหัวเทียนสกปรก
          - title: ต้องจูนบ่อย
            description: สภาพอากาศและระดับความสูงส่งผลต่อส่วนผสม ต้องจูนใหม่
        whenToUse: เหมาะสำหรับรถรุ่นเก่า ที่ต้องการซ่อมเองได้ และชอบปรับแต่งด้วยมือ
