name: AI experience contracts
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Playwright's pinned browser build supports Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run evaluate:offline
      - run: npm run oui:schema -- --check
      - run: npm run build:worker
      - run: node --test tests/build/local-mcp.test.mjs tests/build/worker-runtime.test.mjs
      - run: npm run check:worker
      # The supported GitHub image ships Chrome's runtime libraries. Download the
      # pinned test browser without a redundant, potentially stalled apt upgrade.
      - run: npx playwright install chromium
      - name: MCP integration and browser checks
        run: |
          npm run mcp:host > /tmp/loom-mcp-host.log 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8090/ > /dev/null; then break; fi
            sleep 1
          done
          npm run mcp:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-experience-results
          path: |
            artifacts/ai-experience-evaluation.json
            artifacts/ai-representation-review.json
            artifacts/ai-workflow-benchmark.json
            tests/mcp-host/results/layout-review.json
            tests/mcp-host/results/layout-failure.json
            tests/mcp-host/results/layout-*.png
            tests/mcp-host/results/results.json
