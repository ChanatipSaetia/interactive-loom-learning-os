# Deploys the hosted Loom MCP endpoint to Cloudflare Workers (slice 5 in grill-log-adaptive-learning.md).
# Runs in the `cloudflare` environment, which holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# allows only the branches set there and waits for its required reviewer to approve each deploy.
name: Deploy Loom MCP to Cloudflare Workers

on:
  push:
    branches: ['ccr-399ddc4d-f64k4o']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update OKF build manifest
        run: node scripts/update-okf-manifest.js

      # The site at the Worker's root (VITE_BASE_PATH=/), then the Worker itself
      - name: Build
        run: npm run build:worker

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.146.0 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url/mcp" >> "$GITHUB_OUTPUT"
          echo "Loom MCP endpoint: $url/mcp" >> "$GITHUB_STEP_SUMMARY"
