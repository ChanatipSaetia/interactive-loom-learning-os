# Deploy the whole site and /mcp together from master.
# The cloudflare environment supplies the credentials and must allow master.
name: Deploy Loom to Cloudflare

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in the cloudflare environment"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the cloudflare environment"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Update OKF build manifest
        run: node scripts/update-okf-manifest.js

      # The site at the Worker's root (VITE_BASE_PATH=/), then the Worker itself
      - name: Build
        run: npm run build:worker

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.146.0 deploy | tee deploy.log
          url=$(grep -m 1 -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log)
          echo "url=$url/" >> "$GITHUB_OUTPUT"
          echo "Loom site: $url/" >> "$GITHUB_STEP_SUMMARY"
          echo "Loom MCP endpoint: $url/mcp" >> "$GITHUB_STEP_SUMMARY"
