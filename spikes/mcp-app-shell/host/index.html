<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom spike host</title>
  <style>
    body { margin: 0; font: 14px system-ui; background: #232634; color: #c6d0f5; }
    #chat { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #414559; }
    .model { background: #292c3c; }
    .context { font-size: 12px; opacity: .7; }
    .error { background: #e78284; color: #232634; }
    iframe { width: 100%; height: 260px; border: 1px solid #51576d; border-radius: 10px; background: #232634; }
    body.light { background: #eff1f5; color: #4c4f69; }
    body.light .user { background: #ccd0da; }
    body.light .model { background: #e6e9ef; }
    body.light iframe { border-color: #bcc0cc; background: #eef1f8; }
    body.fullscreen iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; border-radius: 0; z-index: 10; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module" src="./host.bundle.js"></script>
</body>
</html>
