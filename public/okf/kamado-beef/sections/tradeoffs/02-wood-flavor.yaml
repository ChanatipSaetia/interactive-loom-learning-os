id: wood-flavor
title: "การจับคู่ไม้รมควันกับเนื้อวัว (Wood Chunks Selection)"
description: "เลือกท่อนไม้รมควัน (Wood Chunks) เพื่อสร้างโปรไฟล์กลิ่นและรสชาติที่ส่งเสริมเนื้อวัวอย่างลงตัว"
metrics:
  - id: smoke_intensity
    label: "ความเข้มข้นของกลิ่นควัน (Smoke Boldness)"
    baseValue: 50
    min: 0
    max: 100
    direction: higher
  - id: sweetness_balance
    label: "ความกลมกล่อมอมหวาน (Sweetness Balance)"
    baseValue: 50
    min: 0
    max: 100
    direction: higher
  - id: versatility
    label: "ความเข้ากันได้กับเนื้อทุกส่วน (Versatility)"
    baseValue: 50
    min: 0
    max: 100
    direction: higher

steps:
  - id: wood_selection
    title: "ชนิดไม้รมควัน (Wood Variety)"
    description: "เลือกไม้รมควันใส่ลงบนกองถ่าน 1-2 ท่อน (Wood Chunks ห้ามใช้ Wood Chips เพราะจะไหม้เร็วเกินไป)"
    recommended: oak_post
    choices:
      - id: oak_post
        label: "ไม้โอ๊ค (Post Oak / White Oak)"
        description: "ราชาแห่งไม้รมควันสไตล์เท็กซัส กลิ่นควันสะอาด ละมุน หนักแน่นกำลังดี"
        metrics:
          smoke_intensity: 15
          sweetness_balance: 15
          versatility: 30
        pros:
          - title: "กลิ่นควันกลมกล่อมคลาสสิก"
            description: "ชูรสเนื้อวัวธรรมชาติโดยไม่บดบังรสชาติของไขมันและเกลือพริกไทย"
          - title: "ควันสะอาดติดไฟง่าย"
            description: "ให้ควันสีฟ้าใส (Thin Blue Smoke) ได้ง่าย"
        cons:
          - title: "กลิ่นอาจไม่หวือหวา"
            description: "เน้นความเรียบหรูและสมดุลมากกว่ากลิ่นหวานจัด"
        whyThisFits: "ไม้โอ๊คคือมาตรฐานทองคำของการย่างและรมควันเนื้อวัว เข้าได้กับทั้ง Reverse Sear สเต๊ก และ Brisket"

      - id: hickory_wood
        label: "ไม้ฮิคคอรี่ (Hickory)"
        description: "กลิ่นควันสไตล์เบคอน เข้มข้น ฉุนหนักแน่นแบบดั้งเดิมของอเมริกาใต้"
        metrics:
          smoke_intensity: 30
          sweetness_balance: 5
          versatility: 10
        pros:
          - title: "กลิ่นหอมรมควันทรงพลัง"
            description: "สร้างกลิ่นแบบบาร์บีคิวขนานแท้ ชัดเจนแม้ใช้เพียงท่อนเดียว"
        cons:
          - title: "เสี่ยงกลิ่นฉุนเกินไป"
            description: "หากใส่มากเกินไป กลิ่นอาจกลบรสชาติเนื้อพรีเมียมและทำให้มีรสขมฝาด"
        whenToUse: "เหมาะกับเนื้อส่วนที่มีไขมันแทรกและรสเข้ม เช่น Short Ribs และ Brisket"

      - id: fruitwood_cherry
        label: "ไม้ผลเชอร์รี่ / แอปเปิ้ล (Cherry & Apple Wood)"
        description: "กลิ่นควันหอมหวาน ผลไม้ นุ่มนวล ละเมียดละไม"
        metrics:
          smoke_intensity: -10
          sweetness_balance: 25
          versatility: 15
        pros:
          - title: "สร้างสีผิวแดงสวยงาม (Mahogany Color)"
            description: "ไม้เชอร์รี่ทำให้ผิวเปลือก Bark ของเนื้อมีสีแดงมะฮอกกานีสวยงามน่ารับประทาน"
          - title: "กลิ่นหวานละมุน"
            description: "ไม่ฉุน เหมาะสำหรับผู้ที่ไม่ชอบควันหนัก"
        cons:
          - title: "กลิ่นอาจเบาไปสำหรับเนื้อรสเข้ม"
            description: "หากใช้กับเนื้อชิ้นหนามาก กลิ่นควันอาจไม่ซึมลึกเท่าโอ๊ค"
        whenToUse: "เหมาะสำหรับสเต๊ก Ribeye แบบ Reverse Sear สั้นๆ หรือผสมคู่กับไม้โอ๊ค"
