variables:
  - id: thickness_cm
    label: "ความหนาของเนื้อสเต๊ก (cm)"
    min: 2
    max: 8
    step: 0.5
    defaultValue: 4
  - id: oven_temp_c
    label: "อุณหภูมิเตาอบทางอ้อม (°C)"
    min: 95
    max: 135
    step: 5
    defaultValue: 110
  - id: target_doneness_level
    label: "ระดับความสุก (1=Rare, 2=Med-Rare, 3=Med, 4=Med-Well)"
    min: 1
    max: 4
    step: 1
    defaultValue: 2

metrics:
  - id: pull_temp_c
    label: "อุณหภูมิแกนกลางที่ต้องยกเนื้อออกเพื่อเตรียม Sear (°C)"
    formula: "Math.round((46 + (target_doneness_level * 4)) - 4)"
    description: "อุณหภูมิที่อ่านได้จาก Meat Probe ในช่วงจบการอบทางอ้อม โดยต้องยกออกก่อนถึงความสุกจริง 3-4°C เพื่อเผื่อความร้อนที่จะเพิ่มขึ้นตอน Sear และ Rest"
    analogy: "เหมือนการเหยียบเบรกรถก่อนถึงไฟแดงเพื่อไม่ให้ล้ำเส้น"
    inScope:
      - "การยกเนื้อออกมาพักชั่วคราวเพื่อรอเตาเร่งอุณหภูมิ Sear"
      - "การป้องกันไม่ให้เนื้อสุกเกินระดับเป้าหมาย"
    outOfScope:
      - "การย่างสเต๊กบางที่สุกเร็วเกินกว่าจะวัดอุณหภูมิช่วงอบได้"

  - id: target_internal_temp_c
    label: "อุณหภูมิแกนกลางสุดท้ายหลังพักเนื้อ (°C)"
    formula: "Math.round(46 + (target_doneness_level * 4))"
    description: "อุณหภูมิสุดท้ายของใจกลางเนื้อหลังผ่านการ Sear และกระบวนการ Carryover Cooking ในช่วงพักเนื้อ (Medium Rare อยู่ที่ประมาณ 54°C)"
    analogy: "เหมือนเป้าหมายปลายทางที่รถจะหยุดนิ่งพอดี"
    inScope:
      - "การวัดความสุกด้วยโพรบดิจิทัลมาตรฐานสากล"
    outOfScope:
      - "การใช้นิ้วกดกะความสุกแบบดั้งเดิมซึ่งไม่แม่นยำสำหรับเนื้อชิ้นหนา"

  - id: indirect_time_min
    label: "เวลาอบทางอ้อมโดยประมาณ (นาที)"
    formula: "Math.round((thickness_cm * 12) * (110 / oven_temp_c) * (0.8 + (target_doneness_level * 0.15)))"
    description: "ระยะเวลาที่เนื้อต้องอยู่ในเตาช่วงอุณหภูมิ 105-120°C เพื่อให้ความร้อนค่อยๆ ซึมเข้าสู่ใจกลางเนื้ออย่างนุ่มนวล"
    analogy: "เหมือนเวลาในการแช่ออนเซ็นให้น้ำอุ่นซึมลึกถึงกล้ามเนื้อ"
    inScope:
      - "การคำนวณเวลาเบื้องต้นเพื่อเตรียมตารางการทำอาหาร"
    outOfScope:
      - "การยึดเวลาเป็นตัวตัดสินความสุกแทนการดูอุณหภูมิโพรบจริง"

  - id: resting_time_min
    label: "เวลาพักเนื้อที่แนะนำ (นาที)"
    formula: "Math.max(5, Math.round(thickness_cm * 2))"
    description: "ระยะเวลาวางพักเนื้อหลัง Sear เพื่อให้เส้นใยกล้ามเนื้อคลายตัวและดูดซับของเหลวกลับเข้าสู่เซลล์"
    analogy: "เหมือนการให้ฟองน้ำดูดน้ำกลับคืนหลังจากถูกบีบด้วยความร้อน"
    inScope:
      - "การวางพักบนตะแกรงโปร่งในที่อุณหภูมิห้อง"
    outOfScope:
      - "การหั่นเนื้อทันทีที่ยกออกจากเตา (จะทำให้น้ำเนื้อไหลทะลักสูญเสียความฉ่ำ)"
