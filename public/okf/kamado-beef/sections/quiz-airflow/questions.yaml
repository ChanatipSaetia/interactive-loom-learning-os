- id: q1
  question: "หน้าที่หลักของแผ่นหินกันความร้อน (Ceramic Heat Deflector) ในเตา Kamado คืออะไร?"
  hint: "นึกถึงการจัดโซนความร้อนสำหรับการทำสเต๊กหรือการรมควัน"
  choices:
    - id: a
      text: "กั้นเปลวไฟตรง แปลงเตาเป็นเตาอบ Convection สำหรับการย่างทางอ้อม (Indirect Cooking)"
      correct: true
      explanation: "ถูกต้อง! Heat Deflector ทำหน้าที่บังเปลวไฟและรังสีความร้อนตรง ทำให้ความร้อนไหลเวียนรอบๆ เหมาะสำหรับ Low & Slow และการอบช่วงแรกของ Reverse Sear"
    - id: b
      text: "ใช้ดับไฟในกล่อง Firebox ทันทีเมื่อย่างเสร็จ"
      correct: false
      explanation: "ไม่ถูกต้อง แผ่น Deflector ไม่ได้ใช้ดับไฟ แต่ใช้กั้นความร้อนระหว่างกองถ่านกับตะแกรง"
    - id: c
      text: "เพิ่มอุณหภูมิเปลวไฟให้สูงขึ้นถึง 500°C"
      correct: false
      explanation: "ไม่ถูกต้อง แผ่น Deflector มีไว้กั้นความร้อนตรง ไม่ได้มีหน้าที่เร่งไฟ"

- id: q2
  question: "ในการควบคุมอุณหภูมิเตา Kamado ประตูวาล์วลมล่าง (Bottom Draft Door) มีบทบาทอย่างไร?"
  hint: "เปรียบเทียบระหว่างการปรับแบบหยาบกับการปรับแบบละเอียด"
  choices:
    - id: a
      text: "ใช้ปรับลมขาออกอย่างละเอียดระดับมิลลิเมตร"
      correct: false
      explanation: "การปรับลมขาออกละเอียดระดับมิลลิเมตรเป็นหน้าที่ของ Top Vent ด้านบน"
    - id: b
      text: "เป็นช่องรับออกซิเจนหลักเข้าสู่กองถ่าน ใช้ควบคุมอุณหภูมิช่วงกว้างแบบหยาบ (Coarse Tuning)"
      correct: true
      explanation: "ถูกต้อง! วาล์วล่างทำหน้าที่ป้อนออกซิเจนเข้าเตา ยิ่งเปิดกว้างออกซิเจนยิ่งเข้ามาก ไฟยิ่งลุกแรง"
    - id: c
      text: "ใช้ระบายควันขี้เถ้าและไอน้ำออกจากเตา"
      correct: false
      explanation: "ควันและไอน้ำจะระบายออกทางวาล์วด้านบน (Top Vent) ไม่ใช่วาล์วล่าง"

- id: q3
  question: "ฝาครอบเซรามิกหนาพิเศษ (Ceramic Dome) ช่วยให้สเต๊กสุกสม่ำเสมอได้อย่างไร?"
  hint: "พิจารณาคุณสมบัติของวัสดุเซรามิกและการสะท้อนความร้อน"
  choices:
    - id: a
      text: "ดูดซับความร้อนทั้งหมดแล้วปล่อยให้เตาเย็นลงอย่างรวดเร็ว"
      correct: false
      explanation: "เซรามิกกักเก็บความร้อนสูงและปล่อยออกมาอย่างช้าๆ ต่อเนื่อง ไม่ได้ทำให้เตาเย็นลง"
    - id: b
      text: "สะท้อนรังสีความร้อนอินฟราเรดกลับลงมาที่ผิวเนื้อ ทำให้เนื้อสุกรอบทิศทางโดยไม่ต้องเปิดฝาบ่อย"
      correct: true
      explanation: "ถูกต้อง! ผนังเซรามิกสะท้อนรังสีความร้อนอินฟราเรดกระจายทั่วห้องเตา ทำให้เนื้อได้รับความร้อนรอบด้านอย่างสม่ำเสมอ"
    - id: c
      text: "ปล่อยให้น้ำมันหยดลงบนถ่านเพื่อสร้างควันดำ"
      correct: false
      explanation: "ควันดำเกิดจากการเผาไหม้ไม่สมบูรณ์ ไม่ใช่ข้อดีของฝาครอบเซรามิก"

- id: q4
  question: "หากไม่ทำความสะอาดลิ้นชักรองขี้เถ้า (Ash Drawer) จนขี้เถ้าสะสมเต็มก้นเตา จะเกิดผลเสียใด?"
  hint: "คิดถึงสิ่งที่กองถ่านต้องการสำหรับการเผาไหม้"
  choices:
    - id: a
      text: "ขี้เถ้าจะอุดตันช่องลมเข้า ทำให้ออกซิเจนไหลเวียนไม่สะดวก และคุมอุณหภูมิได้ยาก"
      correct: true
      explanation: "ถูกต้อง! เมื่อขี้เถ้าทับถมปิดช่องอากาศ อากาศบริสุทธิ์จะไม่สามารถไหลผ่านตะแกรงก้นเตาขึ้นมาเลี้ยงกองถ่านได้ ทำให้ไฟหรี่ลงหรือไม่สม่ำเสมอ"
    - id: b
      text: "ทำให้เนื้อสเต๊กเค็มขึ้นโดยไม่ตั้งใจ"
      correct: false
      explanation: "ขี้เถ้าด้านล่างไม่ได้สัมผัสกับเนื้อโดยตรง"
    - id: c
      text: "ทำให้ตัวเตาเซรามิกแตกหักในทันที"
      correct: false
      explanation: "ขี้เถ้าไม่ได้ทำให้เซรามิกแตก แต่ทำให้กระแสลมถูกบล็อก"
