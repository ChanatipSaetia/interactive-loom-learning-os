id: overheat-crisis
title: "วิกฤตความร้อนเตาพุ่งเกิน (The Runaway Temperature Crisis)"
intro: "คุณกำลังเตรียมย่าง Tomahawk หนา 2.5 นิ้วด้วยวิธี Reverse Sear ที่ต้องการอุณหภูมิ 110°C แต่เผลอเปิดวาล์วทิ้งไว้จนกลับมาดูอีกที เข็มวัดความร้อนพุ่งทะลุ 230°C และมวลเซรามิกกำลังดูดซับความร้อนมหาศาล!"
nodes:
  start:
    prompt: "อุณหภูมิเตาพุ่งไปที่ 230°C ในขณะที่คุณยังไม่ได้ใส่เนื้อ คุณจะตัดสินใจทำสิ่งใดเป็นอันดับแรก?"
    choices:
      - id: choke_vents_wait
        text: "หรี่วาล์วล่างเหลือ 2 มม. และวาล์วบนเกือบปิดสนิทเพื่อตัดออกซิเจน รอให้ความร้อนเซรามิกค่อยๆ ถ่ายเทลงมา"
        next: outcome_choke_success
      - id: open_dome_wide
        text: "เปิดฝาครอบเซรามิกอ้าทิ้งไว้กว้างๆ เพื่อหวังให้ความร้อนระบายออกสู่อากาศภายนอกอย่างรวดเร็ว"
        next: branch_open_dome
      - id: spray_water_fire
        text: "เปิดฝาแล้วนำฟ็อกกี้ฉีดน้ำใส่กองถ่านและแผ่นเซรามิกเพื่อดับความร้อนทันที"
        next: outcome_water_disaster

  branch_open_dome:
    prompt: "เมื่อคุณเปิดฝาค้างไว้ ออกซิเจนปริมาณมหาศาลไหลกรูเข้าสู่กองถ่าน ทำให้ถ่านไม้ธรรมชาติลุกไหม้เป็นเปลวไฟสีส้มรุนแรง คุณจะแก้ไขอย่างไรต่อ?"
    choices:
      - id: close_and_seal
        text: "รีบปิดฝาลงทันที และปิดวาล์วล่างให้สนิทเพื่อตัดออกซิเจนก่อนที่เปลวไฟจะลาม"
        next: outcome_late_seal
      - id: put_meat_in
        text: "ตัดสินใจใส่เนื้อลงไปย่างทันทีเพราะคิดว่าไหนๆ ไฟก็แรงแล้ว"
        next: outcome_ruined_steak

  outcome_choke_success:
    outcome:
      verdict: "คุณควบคุมสถานการณ์ได้อย่างยอดเยี่ยมและเข้าใจธรรมชาติของมวลเซรามิก!"
      lesson: "เตา Kamado ควบคุมด้วยออกซิเจน การหรี่วาล์วเกือบสนิทจะทำให้กองถ่านสงบลง แม้เซรามิกจะคายความร้อนช้า (ใช้เวลา ~20-30 นาที) แต่จะทำให้อุณหภูมิกลับมาคงที่ 110°C ได้อย่างปลอดภัยโดยเนื้อไม่เสียหาย"
      rating: a

  outcome_late_seal:
    outcome:
      verdict: "กอบกู้ได้บางส่วน แต่เสียเวลาและเปลืองถ่านโดยไม่จำเป็น"
      lesson: "การเปิดฝาเตา Kamado ทิ้งไว้ไม่ได้ช่วยระบายความร้อน แต่เป็นการเติมเชื้อไฟให้ถ่านลุกแรงขึ้น เมื่อปิดฝาจึงต้องใช้เวลานานขึ้นเป็นสองเท่ากว่าเตาจะเย็นลง"
      rating: b-plus

  outcome_ruined_steak:
    outcome:
      verdict: "สเต๊ก Tomahawk ชิ้นหนาของคุณไหม้เกรียมด้านนอกแต่ด้านในยังดิบเย็นจัด"
      lesson: "การใส่เนื้อหนาลงในเตาที่ร้อนจัดโดยไม่มีการอบไฟอ่อนทางอ้อม จะทำลายโครงสร้างเนื้อ เกิด Grey Band หนาเตอะ และสูญเสียเนื้อพรีเมียมราคาแพง"
      rating: c

  outcome_water_disaster:
    outcome:
      verdict: "หายนะ! เตาเซรามิกเกิดภาวะช็อกความร้อน (Thermal Shock) และขี้เถ้าฟุ้งกระจาย"
      lesson: "ห้ามฉีดน้ำหรือสาดน้ำลงในเตาเซรามิก Kamado ที่ร้อนจัดโดยเด็ดขาด เพราะความแตกต่างของอุณหภูมิจะทำให้เซรามิกแตกร้าวเสียหายถาวร และทำให้เถ้าถ่านฟุ้งติดเตา"
      rating: c
