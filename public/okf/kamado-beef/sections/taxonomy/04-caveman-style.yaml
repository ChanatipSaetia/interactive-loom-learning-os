type: taxonomy-category
icon: Sparkles
title: "Caveman Style (ย่างบนถ่านไม้ธรรมชาติโดยตรง)"
subtitle: "Dirty Steak - สัมผัสถ่านไม้ก้อนแดงฉานแบบคนยุคหิน"
color: teal
description: "วางชิ้นเนื้อหนาลงบนก้อนถ่านไม้ธรรมชาติ (Natural Hardwood Lump Charcoal) ที่คุแดงไร้เปลวไฟโดยตรง โดยไม่ใช้ตะแกรงย่าง"
details: "อาศัยการนำความร้อนแบบสัมผัสโดยตรง (Direct Conduction) ก่อให้เกิดเปลือก Crust ที่กรอบเกรียมลึก มีกลิ่นหอมเฉพาะตัว เถ้าถ่านธรรมชาติแท้จะไม่ติดเนื้อเมื่อปัดออกเล็กน้อย"
analogy: "เหมือนการประทับตราเหล็กร้อนลงบนแผ่นหนังอย่างรวดเร็วและทรงพลัง"
primaryFocus: "การเลือกถ่านไม้เนื้อแข็งแท้คุณภาพพรีเมียมไร้สารเคมี, การพัดขี้เถ้าส่วนเกินออกก่อนวางเนื้อ, และการกลับด้านรวดเร็ว"
inScope:
  - "เนื้อสเต๊กชิ้นหนา เช่น T-Bone, Porterhouse, Ribeye Cap"
  - "ถ่านไม้ธรรมชาติก้อนใหญ่ (Hardwood Lump Charcoal) คุณภาพสูงเท่านั้น"
outOfScope:
  - "การใช้ถ่านอัดก้อน (Briquettes) ที่มีสารประสานทางเคมีและขี้เถ้าหนา (อันตรายต่อสุขภาพ)"
  - "เนื้อบางหรือเนื้อหมักซอสหวาน (จะไหม้ดำทันที)"
