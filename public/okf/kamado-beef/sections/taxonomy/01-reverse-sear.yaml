type: taxonomy-category
icon: Flame
title: "Reverse Sear (ย่างย้อนศร)"
subtitle: "เทคนิคที่ดีที่สุดสำหรับสเต๊กชิ้นหนา (1.5 - 3 นิ้ว)"
color: red
description: "อบเนื้อด้วยความร้อนทางอ้อม (Indirect Low Heat 105-120°C) จนอุณหภูมิแกนกลางใกล้ถึงเป้าหมาย แล้วพักเนื้อก่อนนำมา Sear ผิวไฟแรงสุด (300-350°C) 45-60 วินาทีต่อด้าน"
details: "ช่วยขจัดปัญหาขอบเนื้อสุกเกินจนกลายเป็นสีเทา (Grey Band) ทำให้ได้เนื้อในสีชมพูสม่ำเสมอตั้งแต่ขอบจรดขอบ (Edge-to-edge pink) พร้อมผิวกรอบสีน้ำตาลเข้มจาก Maillard Reaction"
analogy: "เหมือนการอุ่นเค้กให้ร้อนทั่วถึงจากข้างในก่อนแล้วค่อยพ่นไฟเคลือบน้ำตาลด้านบน"
primaryFocus: "การควบคุมอุณหภูมิแกนกลาง (Internal Temp) และการสร้าง Crust กรอบโดยไม่ทำลายความฉ่ำ"
inScope:
  - "สเต๊กเนื้อหนา เช่น Tomahawk, Cowboy Ribeye, Thick T-Bone, Picanha Block"
  - "การใช้แผ่น Ceramic Heat Deflector ในช่วงแรก"
  - "การใช้โพรบวัดอุณหภูมิเนื้อ (Meat Probe) ตรวจสอบความสุก"
outOfScope:
  - "สเต๊กบางต่ำกว่า 1 นิ้ว (เสี่ยงสุกเกินไปในช่วง Sear)"
  - "เนื้อส่วนที่มีพังผืดเหนียวมากที่ต้องใช้เวลาละลายคอลลาเจนหลายชั่วโมง"
