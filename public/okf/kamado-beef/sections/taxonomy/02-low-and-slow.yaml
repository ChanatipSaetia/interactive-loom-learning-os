type: taxonomy-category
icon: Wind
title: "Low & Slow Smoking (รมควันไฟอ่อนระยะยาว)"
subtitle: "ศิลปะการปรุงเนื้อส่วนเหนียวและคอลลาเจนสูง"
color: peach
description: "รมควันเนื้อที่อุณหภูมิคงที่ 105-120°C ต่อเนื่องเป็นเวลา 6-12 ชั่วโมง โดยใส่แผ่น Heat Deflector เต็มแผ่นพร้อมท่อนไม้รมควัน (Wood Chunks)"
details: "ความร้อนต่ำและเวลาที่ยาวนานจะค่อยๆ สลายเส้นใยคอลลาเจน (Collagen) ให้กลายเป็นเจลาติน (Gelatin) ที่นุ่มชุ่มฉ่ำ พร้อมสร้างเปลือก Bark สีดำเข้มที่มีกลิ่นหอมรมควันอันเป็นเอกลักษณ์"
analogy: "เหมือนการตุ๋นหม้อเซรามิกโบราณแต่ใช้อากาศร้อนและควันหอมเป็นตัวปรุงแทนน้ำซุป"
primaryFocus: "การสลายคอลลาเจน, การคุมความชื้น (Moisture Retention), และการก้าวข้ามช่วงอุณหภูมิชะงัก (The BBQ Stall)"
inScope:
  - "เนื้อเสือร้องไห้/เนื้ออก (Beef Brisket)"
  - "ซี่โครงเนื้อชิ้นโต (Beef Short Ribs / Dinosaur Ribs)"
  - "เนื้อสันคอ/น่องลาย (Beef Chuck Roast)"
outOfScope:
  - "สเต๊กเนื้อนุ่มพรีเมียมอย่าง Tenderloin หรือ Flat Iron"
  - "การปรุงด่วนที่ต้องการรับประทานภายใน 30 นาที"
