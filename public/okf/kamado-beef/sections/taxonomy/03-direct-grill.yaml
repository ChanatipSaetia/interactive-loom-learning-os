type: taxonomy-category
icon: Zap
title: "Direct High-Heat Grilling (ย่างไฟแรงตรง)"
subtitle: "ย่างด่วนบนเปลวไฟและตะแกรงเหล็กหล่อ 250-350°C"
color: mauve
description: "ย่างชิ้นเนื้อบนเปลวถ่านโดยตรงโดยไม่ใส่แผ่น Heat Deflector โดยอาศัยความร้อนจากการแผ่รังสีและตะแกรงเหล็กหล่อสะสมความร้อน"
details: "เหมาะสำหรับชิ้นเนื้อที่นุ่มโดยธรรมชาติแต่มีความหนาปานกลางถึงบาง ใช้เวลาสั้น พลิกกลับด้านรวดเร็วเพื่อสร้างลวดลายกริลล์ (Grill Marks) และกลิ่นเกรียมหอมหวานของไขมันที่หยดลงถ่าน"
analogy: "เหมือนการย่างยากินิกุหรือเนื้อเสียบไม้แบบญี่ปุ่นด้วยเตาชิจิรินแต่พลังความร้อนสูงกว่า"
primaryFocus: "การสร้างเปลือกเกรียมรวดเร็ว, การป้องกันเนื้อสุกเกินไปข้างใน, และการควบคุมไฟลุก (Flare-ups)"
inScope:
  - "สเต๊กเนื้อบางต่ำกว่า 1.2 นิ้ว (Thin Ribeye / Striploin)"
  - "เนื้อใบบัว/เนื้อชายโครง (Skirt Steak / Flank Steak)"
  - "เนื้อลูกเต๋าเสียบไม้ คุชิยากิ (Beef Skewers / Kebabs)"
outOfScope:
  - "สเต๊กหนาพิเศษ เช่น Tomahawk (ข้างในจะยังดิบเย็นขณะที่ผิวนอกไหม้)"
  - "เนื้อ Brisket ทั้งก้อน (จะเหนียวเคี้ยวไม่ได้)"
