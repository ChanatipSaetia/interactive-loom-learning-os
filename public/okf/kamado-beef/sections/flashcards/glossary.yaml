- id: maillard-reaction
  word: "Maillard Reaction"
  pronunciation: "มาย-ยาร์ด รี-แอก-ชัน"
  category: "วิทยาศาสตร์อาหาร"
  shortDefinition: "ปฏิกิริยาเคมีระหว่างกรดอะมิโนและน้ำตาลโมเลกุลเดี่ยวเมื่อโดนความร้อนสูงกว่า 140°C"
  detailedDefinition: "กระบวนการสร้างสารประกอบกลิ่นหอมและรสชาติใหม่อีกนับร้อยชนิด ทำให้ผิวนอกของเนื้อเปลี่ยนเป็นสีน้ำตาลทองและเกิดความกรอบหอมอูมามิ"
  whyItMatters: "หากไม่มีปฏิกิริยานี้ สเต๊กจะมีรสชาติเหมือนเนื้อต้มและขาดกลิ่นหอมของการย่างไฟ"
  dialogue:
    user: "ทำไมสเต๊กที่ย่างเตา Kamado ถึงมี Crust สีน้ำตาลทองกรอบหอมกว่าเตาแก๊ส?"
    aiThoughts: "ผู้ใช้ต้องการเข้าใจกลไกความร้อนสูงของตะแกรงเหล็กหล่อและรังสีอินฟราเรดจากเซรามิกที่เร่งปฏิกิริยาเมลลาร์ด"
    aiQuestion: "คุณได้ซับผิวเนื้อให้แห้งสนิทก่อนนำลง Sear หรือไม่ เพราะความชื้นส่วนเกินจะขัดขวางไม่ให้อุณหภูมิผิวแตะ 140°C?"

- id: heat-deflector
  word: "Heat Deflector"
  pronunciation: "ฮีต ดิ-เฟล็ก-เทอร์"
  category: "อุปกรณ์เตา"
  shortDefinition: "แผ่นหินเซรามิกครึ่งวงกลมหรือเต็มวงสำหรับกั้นเปลวไฟตรงจากกองถ่าน"
  detailedDefinition: "ทำหน้าที่แปลงเตาย่างเปลวไฟให้กลายเป็นเตาอบ Convection ช่วยให้ความร้อนแผ่กระจายรอบตัวเนื้อ เหมาะสำหรับ Low & Slow และช่วงอบของ Reverse Sear"
  whyItMatters: "หัวใจสำคัญที่ทำให้เตา Kamado ทำงานได้อเนกประสงค์ทั้งการย่าง อบ รมควัน และทำพิซซ่า"
  dialogue:
    user: "ลืมใส่ Heat Deflector แล้วนำเนื้อ Tomahawk ลงย่าง จะเกิดอะไรขึ้น?"
    aiThoughts: "การย่างเนื้อหนาโดยไม่มี Deflector จะทำให้ผิวนอกไหม้เป็นถ่านก่อนที่ข้างในจะสุก"
    aiQuestion: "สเต๊กของคุณมีความหนาเกิน 1.5 นิ้วหรือไม่ หากหนาควรยกเนื้อออกแล้วใส่ Deflector ก่อนอบไฟอ่อน"

- id: blue-smoke
  word: "Thin Blue Smoke"
  pronunciation: "ธิน บลู สโมก"
  category: "การควบคุมไฟ"
  shortDefinition: "ควันสีฟ้าใสจางๆ ที่เกิดจากการเผาไหม้ไม้และถ่านไม้อย่างสมบูรณ์และสะอาด"
  detailedDefinition: "ควันที่ให้กลิ่นหอมหวานละมุน ไร้รสขมฝาด ต่างจากควันสีขาวหนาทึบ (White Acrid Smoke) ซึ่งเต็มไปด้วยเขม่าและน้ำมันดิบที่ทำให้เนื้อมีรสขมเปรี้ยว"
  whyItMatters: "สัญญาณบอกว่าเตาและท่อนไม้รมควันพร้อมสำหรับการนำเนื้อลงย่างแล้ว"
  dialogue:
    user: "เพิ่งจุดเตาแล้วควันขาวฟุ้งเต็มไปหมด ใส่เนื้อลงไปได้เลยไหม?"
    aiThoughts: "ควันขาวในช่วงแรกมีสารระเหยที่เป็นกรดและเขม่าดำ ซึ่งจะทำให้เนื้อเสียรสชาติ"
    aiQuestion: "คุณสามารถรออีกประมาณ 15-20 นาทีให้ควันขาวเปลี่ยนเป็นควันสีฟ้าใสก่อนวางเนื้อได้หรือไม่?"

- id: carryover-cooking
  word: "Carryover Cooking"
  pronunciation: "แคร์-รี-โอ-เวอร์ คุก-กิง"
  category: "เทคนิคการปรุง"
  shortDefinition: "ปรากฏการณ์ที่อุณหภูมิแกนกลางเนื้อยังคงเพิ่มขึ้นต่อเนื่องแม้จะยกออกจากเตาแล้ว"
  detailedDefinition: "ความร้อนที่สะสมอยู่ที่ผิวนอกจะยังคงนำพาความร้อนซึมลึกเข้าสู่แกนกลางอย่างช้าๆ ทำให้อุณหภูมิแกนกลางเพิ่มขึ้นอีกประมาณ 2-4°C ในช่วงพักเนื้อ"
  whyItMatters: "ต้องยกเนื้อออกจากเตาก่อนถึงอุณหภูมิเป้าหมายเสมอ มิฉะนั้นเนื้อจะสุกเกิน (Overcooked)"
  dialogue:
    user: "ต้องการสเต๊ก Medium Rare ที่ 54°C ควรยกเนื้อออกจากเตาที่อุณหภูมิเท่าใด?"
    aiThoughts: "ต้องคำนวณเผื่อความร้อนแฝง Carryover Cooking ประมาณ 3-4°C"
    aiQuestion: "คุณควรยกเนื้อออกจากเตาที่ 50-51°C แล้วปล่อยให้ความร้อนแฝงดันอุณหภูมิไปแตะ 54°C ระหว่างพักเนื้อ"

- id: the-stall
  word: "The BBQ Stall"
  pronunciation: "เดอะ สตอลล์"
  category: "วิทยาศาสตร์อาหาร"
  shortDefinition: "ภาวะที่อุณหภูมิแกนกลางของเนื้อหยุดนิ่งอยู่ที่ช่วง 65-75°C เป็นเวลานานหลายชั่วโมง"
  detailedDefinition: "เกิดจากการระเหยของน้ำออกจากผิวเนื้อ (Evaporative Cooling) ซึ่งดึงความร้อนออกไปในอัตราเดียวกับที่เตาป้อนความร้อนเข้ามา"
  whyItMatters: "เป็นปรากฏการณ์ธรรมชาติในการทำ Brisket ไม่ควรตกใจเร่งไฟ แต่สามารถแก้ด้วยการห่อฟอยล์หรือ Butcher Paper (Texas Crutch)"
  dialogue:
    user: "รมควันเนื้อ Brisket มา 4 ชั่วโมงแล้ว อุณหภูมิค้างอยู่ที่ 70°C ไม่ขยับเลย เตาดับหรือเปล่า?"
    aiThoughts: "เนื้อกำลังเข้าสู่ช่วง Stall จากการระเหยของความชื้น"
    aiQuestion: "คุณต้องการห่อเนื้อด้วย Butcher Paper เพื่อกักเก็บความชื้นและเร่งให้ข้ามช่วง Stall หรือไม่?"

- id: edge-to-edge-pink
  word: "Edge-to-Edge Pink"
  pronunciation: "เอจ-ทู-เอจ พิงก์"
  category: "ความสมบูรณ์แบบ"
  shortDefinition: "ลักษณะเนื้อสเต๊กที่มีระดับความสุกสีชมพูสม่ำเสมอตั้งแต่ขอบนอกจรดแกนกลาง ไร้แถบสีเทา"
  detailedDefinition: "ผลลัพธ์ระดับสูงสุดของการย่างแบบ Reverse Sear โดยการทำให้เนื้อสุกทั่วถึงด้วยความร้อนต่ำ ก่อนใช้เวลาสั้นมากในการ Sear ผิวนอก"
  whyItMatters: "เป็นตัวชี้วัดความเชี่ยวชาญของ Pitmaster ในการควบคุมอุณหภูมิอย่างแม่นยำ"
  dialogue:
    user: "ทำไมสเต๊กที่ย่างบนกระทะทั่วไปมักมีขอบสีเทาหนาเตอะรอบเนื้อ?"
    aiThoughts: "เกิดจากการใช้ความร้อนสูงเป็นเวลานานเกินไปทำให้ความร้อนซึมสุกเกินเข้ามาในชั้นเนื้อ"
    aiQuestion: "คุณพร้อมที่จะลองวิธี Reverse Sear บนเตา Kamado เพื่อสัมผัสเนื้อแบบ Edge-to-Edge Pink แล้วหรือยัง?"
