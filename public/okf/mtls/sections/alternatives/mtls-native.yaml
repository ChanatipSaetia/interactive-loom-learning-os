type: taxonomy-category
icon: Shield
title: "Traditional mTLS with PKI"
subtitle: "Mutual TLS — the gold standard for zero-trust service authentication"
color: mauve
description: "Both client and server present X.509 certificates during the TLS handshake, providing strong mutual authentication rooted in a trusted Certificate Authority."
details: "Every service holds a private key and certificate signed by a CA the peer trusts. The TLS 1.3 handshake validates both sides before any application data flows. This gives you cryptographic assurance of identity — not just IP allowlists or shared secrets. The cost is operational: you must provision, rotate, revoke, and store certificates across every service in the mesh."
analogy: "Like both parties at a business meeting flashing government-issued IDs verified by the same authority before sharing any confidential information."
primaryFocus: "Strong cryptographic identity for every endpoint"
inScope:
  - "Zero-trust internal service-to-service authentication"
  - "Regulated environments requiring mutual verification (finance, healthcare, defense)"
  - "Scenarios where you control both client and server certificate lifecycle"
outOfScope:
  - "Third-party integrations that can't manage X.509 certificates"
  - "Rapid prototyping where certificate overhead slows iteration"
  - "Public-facing consumer APIs where clients are browsers or mobile apps"
