# Canonical system nodes
client:
  title: "Client"
  desc: "mTLS-enabled client application initiating the handshake"
  type: aggregate
server:
  title: "Server"
  desc: "mTLS-enabled server requiring mutual authentication"
  type: aggregate
tls_stack:
  title: "TLS Protocol Stack"
  desc: "TLS handshake state machine handling cryptographic operations"
  type: aggregate
key_store:
  title: "Key Store"
  desc: "Secure storage for private keys and trusted CA certificates"
  type: aggregate
ca_service:
  title: "Certificate Authority"
  desc: "Trusted third-party CA that issued and can validate certificates"
  type: external

