# Canonical system nodes
client:
  title: "Client"
  desc: "mTLS-enabled client application initiating the handshake"
  type: aggregate
server:
  title: "Server"
  desc: "mTLS-enabled server requiring mutual authentication"
  type: aggregate
tls_stack:
  title: "TLS Protocol Stack"
  desc: "TLS handshake state machine handling cryptographic operations"
  type: aggregate
key_store:
  title: "Key Store"
  desc: "Secure storage for private keys and trusted CA certificates"
  type: aggregate
ca_service:
  title: "Certificate Authority"
  desc: "Trusted third-party CA that issued and can validate certificates"
  type: external

# Per-step duplicates with collapsedTo mapping
client_hello:
  title: "Client"
  desc: "Sends ClientHello with supported TLS versions and cipher suites"
  type: aggregate
  collapsedTo: client
server_hello:
  title: "Server"
  desc: "Responds with ServerHello selecting protocol parameters"
  type: aggregate
  collapsedTo: server
server_cert:
  title: "Server"
  desc: "Presents its certificate chain to prove identity"
  type: aggregate
  collapsedTo: server
server_req_cert:
  title: "Server"
  desc: "Sends CertificateRequest message requiring client authentication"
  type: aggregate
  collapsedTo: server
client_cert:
  title: "Client"
  desc: "Sends its certificate in response to CertificateRequest"
  type: aggregate
  collapsedTo: client
server_verify:
  title: "Server"
  desc: "Validates client certificate against trusted CA chain"
  type: aggregate
  collapsedTo: server
server_verify_fail:
  title: "Server"
  desc: "Rejects invalid client certificate and terminates handshake"
  type: aggregate
  collapsedTo: server
client_verify:
  title: "Client"
  desc: "Validates server certificate against trusted CA chain"
  type: aggregate
  collapsedTo: client
key_exchange:
  title: "TLS Protocol Stack"
  desc: "Both parties complete key exchange and derive session keys"
  type: aggregate
  collapsedTo: tls_stack
handshake_done:
  title: "TLS Protocol Stack"
  desc: "Handshake complete, encrypted bidirectional channel active"
  type: aggregate
  collapsedTo: tls_stack
