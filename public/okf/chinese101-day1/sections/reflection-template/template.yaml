challenges:
  - prompt: "Complete the statement explaining study duration vs fatigue (Part 1):"
    template: "Increasing the daily practice duration leads to a {zone-1} number of active words retained. However, studying for excessive lengths without spacing significantly {zone-2} cognitive fatigue."
    chips:
      - id: "chip-larger"
        text: "larger"
      - id: "chip-smaller"
        text: "smaller"
      - id: "chip-increases"
        text: "increases"
      - id: "chip-decreases"
        text: "decreases"
    solution:
      zone-1: "chip-larger"
      zone-2: "chip-increases"
    explanation: "<strong>Correct!</strong> Practice increases raw volume, but marathon sessions trigger high mental fatigue, harming consistency."
  - prompt: "Complete the statement explaining spaced review intervals (Part 2):"
    template: "Applying a high spacing multiplier reviews words at wider intervals, which {zone-1} long-term retention. This methodology {zone-2} the daily review burden."
    chips:
      - id: "chip-boosts"
        text: "boosts"
      - id: "chip-degrades"
        text: "degrades"
      - id: "chip-lowers"
        text: "lowers"
      - id: "chip-raises"
        text: "raises"
    solution:
      zone-1: "chip-boosts"
      zone-2: "chip-lowers"
    explanation: "<strong>Correct!</strong> Expanding spacing intervals triggers active recall memory boosts and reduces the daily stack load."
