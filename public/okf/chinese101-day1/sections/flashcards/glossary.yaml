- id: greeting-hello
  word: "你好"
  pronunciation: "nǐ hǎo (นี-ฮ่าว)"
  category: greeting
  shortDefinition: "สวัสดี"
  detailedDefinition: "คำทักทายพื้นฐานที่สุดของภาษาจีน ใช้ได้ทั้งทางการและไม่ทางการ แปลตรงตัวว่า 'คุณดี' เหมือนกับ 'คุณสบายดีไหม'"
  whyItMatters: "เป็นคำแรกที่ต้องจำ ใช้ได้ตลอดเวลาตลอดทั้งวัน"
  dialogue:
    user: "ฉันอยากทักทายเพื่อนจีน"
    aiThoughts: "ผู้ใช้ต้องการคำทักทายพื้นฐานสำหรับภาษาจีน"
    aiQuestion: "ลองพูด '你好' (nǐ hǎo) ดู! พยายามเน้นเสียงที่ '好' (hǎo) ให้เป็นเสียงที่ 3"

- id: greeting-hi
  word: "嗨"
  pronunciation: "hāi (ไฮ)"
  category: greeting
  shortDefinition: "สวัสดี (ไม่ทางการ)"
  detailedDefinition: "คำยืมจากภาษาอังกฤษ 'hi' ใช้ในการสนทนาที่ไม่ทางการกับเพื่อนสนิท"
  whyItMatters: "ทำให้บทสนทนากับเพื่อนดูเป็นกันเองมากขึ้น"
  dialogue:
    user: "มีวิธีทักทายที่เป็นกันเองไหม?"
    aiThoughts: "ผู้ใช้ต้องการคำทักทายที่ไม่ทางการ"
    aiQuestion: "'嗨' (hāi) เป็นตัวเลือกที่ดีสำหรับเพื่อนสนิท แต่จำไว้ว่าใช้เฉพาะกับคนที่สนิทเท่านั้นนะ"

- id: greeting-goodbye
  word: "再见"
  pronunciation: "zài jiàn (จ้าย-เจียน)"
  category: greeting
  shortDefinition: "ลาก่อน"
  detailedDefinition: "คำว่า 'ลาก่อน' หรือ 'พบกันใหม่' แปลตรงตัวว่า 'พบอีกครั้ง' ใช้ได้ทั้งทางการและไม่ทางการ"
  whyItMatters: "สำคัญสำหรับตอนจบบทสนทนา"
  dialogue:
    user: "จะบอกลาเพื่อนจีนยังไง?"
    aiThoughts: "ผู้ใช้ต้องการคำว่าลาก่อน"
    aiQuestion: "พูด '再见' (zài jiàn) แปลว่า 'พบกันใหม่' ลองออกเสียงดู"

- id: thanks
  word: "谢谢"
  pronunciation: "xiè xie (เซี่ย-เซี่ย)"
  category: greeting
  shortDefinition: "ขอบคุณ"
  detailedDefinition: "คำว่า 'ขอบคุณ' ภาษาจีน ใช้ได้ทั้งสถานการณ์ทางการและไม่ทางการ"
  whyItMatters: "มารยาทพื้นฐานที่ใช้ได้ทุกวัน"
  dialogue:
    user: "มีคนช่วยฉัน จะขอบคุณยังไง?"
    aiThoughts: "ผู้ใช้ต้องการคำว่าขอบคุณ"
    aiQuestion: "พูด '谢谢' (xiè xie) ลองออกเสียงให้ถูกต้อง — เสียงที่ 4 ทั้งสองคำ"

- id: sorry
  word: "对不起"
  pronunciation: "duì bu qǐ (ทไว-บู้-ฉี่)"
  category: greeting
  shortDefinition: "ขอโทษ"
  detailedDefinition: "คำว่า 'ขอโทษ' แปลตรงตัวว่า '对不起คุณ' ใช้เมื่อทำผิดหรือรบกวนใคร"
  whyItMatters: "สำคัญสำหรับมารยาทในการสื่อสาร"
  dialogue:
    user: "ฉันเดินชนคน จะขอโทษยังไง?"
    aiThoughts: "ผู้ใช้ต้องการคำว่าขอโทษ"
    aiQuestion: "พูด '对不起' (duì bu qǐ) เร็วๆ ก่อนที่อีกฝ่ายจะหันมา"

- id: number-1
  word: "一"
