- id: phrase-name
  word: "我叫…"
  pronunciation: "wǒ jiào… (อ่อ-เจี้ยว)"
  category: phrase
  shortDefinition: "ฉันชื่อ…"
  detailedDefinition: "ประโยคแนะนำตัวเอง '我叫' แปลว่า 'ฉันถูกเรียกว่า' ตามด้วยชื่อตัวเอง"
  calledBy: "我叫"
  whyItMatters: "ประโยคสำคัญที่สุดในการแนะนำตัวเอง"
  dialogue:
    user: "จะแนะนำตัวเองเป็นจีนยังไง?"
    aiThoughts: "ผู้ใช้ต้องการประโยคแนะนำตัวเอง"
    aiQuestion: "พูด '我叫...' (wǒ jiào) แล้วตามด้วยชื่อ เช่น '我叫小明' (ฉันชื่อเสี่ยวหมิง)"

- id: phrase-what-name
  word: "你叫什么名字？"
  pronunciation: "nǐ jiào shénme míngzi? (นี-เจี้ยว-ชเน่อ-หมิงจื่อ)"
  category: phrase
  shortDefinition: "คุณชื่ออะไร?"
  detailedDefinition: "ประโยคถามชื่อ '什么' (shénme) = อะไร '名字' (míngzi) = ชื่อ"
  whyItMatters: "ใช้เริ่มบทสนทนาและทำความรู้จัก"
  dialogue:
    user: "จะถามชื่อคนอื่นเป็นจีนยังไง?"
    aiThoughts: "ผู้ใช้ต้องการประโยคถามชื่อ"
    aiQuestion: "พูด '你叫什么名字？' (nǐ jiào shénme míngzi?) ลองออกเสียงดู"

- id: phrase-how-are-you
  word: "你好吗？"
  pronunciation: "nǐ hǎo ma? (นี-ฮ่าว-หมา?)"
  category: phrase
  shortDefinition: "คุณสบายดีไหม?"
  detailedDefinition: "ประโยคถามความเป็นอยู่ '吗' (ma) เป็นคำกริยาช่วยเปลี่ยนประโยคให้เป็นคำถาม"
  whyItMatters: "ใช้แสดงความสนใจในอีกฝ่าย"
  dialogue:
    user: "จะถามว่าเพื่อนสบายดีไหมเป็นจีน?"
    aiThoughts: "ผู้ใช้ต้องการประโยคถามความเป็นอยู่"
    aiQuestion: "พูด '你好吗？' (nǐ hǎo ma?) — '吗' ทำให้ประโยคเป็นคำถาม"

- id: phrase-very-good
  word: "很好"
  pronunciation: "hěn hǎo (เหิน-ฮ่าว)"
  category: phrase
  shortDefinition: "ดีมาก"
  detailedDefinition: "คำตอบของ '你好吗？' '很' (hěn) = มาก '好' (hǎo) = ดี"
  whyItMatters: "คำตอบมาตรฐานเมื่อมีคนถามความเป็นอยู่"
  dialogue:
    user: "มีคนถามว่าสบายดีไหม จะตอบยังไง?"
    aiThoughts: "ผู้ใช้ต้องการคำตอบ"
    aiQuestion: "ตอบ '很好' (hěn hǎo) = ดีมาก"

- id: word-i
