- id: word-china
  word: "中国"
  pronunciation: "zhōng guó (จง-กว๋อ)"
  category: word
  shortDefinition: "ประเทศจีน"
  detailedDefinition: "'中' (zhōng) = กลาง '国' (guó) = ประเทศ แปลว่า 'ประเทศแห่งกลางโลก'"
  whyItMatters: "คำสำคัญทางวัฒนธรรม"
