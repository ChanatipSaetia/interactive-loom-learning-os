estimatedTime: "5 min read"
moduleCount: 6

what:
  definition: "ภาษาจีนกลาง (Mandarin Chinese) เป็นภาษาที่มีผู้พูดเป็นภาษาแม่มากที่สุดในโลก ใช้ระบบพินอิน (Pinyin) ในการออกเสียงและวรรณยุกต์ 4 เสียงในการเปลี่ยนความหมาย"
  summary: "ปูพื้นฐานการเรียนภาษาจีนวันแรก เข้าใจระบบพินอิน วรรณยุกต์ และการทักทายพื้นฐาน"
  bullets:
    - "ระบบออกเสียง พินอิน (Pinyin) และพยัญชนะ สระ"
    - "วรรณยุกต์ 4 เสียงและการเปลี่ยนความหมาย"
    - "บทสนทนาทักทายและประโยคพื้นฐานในชีวิตประจำวัน"
  tags:
    - "Chinese 101"
    - "Pinyin"
    - "Tones"
    - "Greetings"

why:
  summary: "การเรียนภาษาจีนโดยไม่ออกเสียงวรรณยุกต์ให้ถูกต้อง อาจทำให้สื่อสารผิดความหมายอย่างสิ้นเชิง"
  impact: "การฝึกระบบเสียงพินอินตั้งแต่แรก จะทำให้ฟังออก พูดชัด และสื่อสารได้อย่างมั่นใจ"

