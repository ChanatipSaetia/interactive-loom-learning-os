id: airport-meeting
title: "การพบปะที่สนามบิน"
intro: "คุณเดินทางมาที่สนามบินปักกิ่งเป็นครั้งแรก เพื่อนจีนชื่อ '李明' (Lǐ Míng) กำลังรอคุณอยู่ คุณจะเริ่มบทสนทนาอย่างไร?"
nodes:
  start:
    prompt: "คุณเห็น李明 ยืนถือป้ายชื่อของคุณ จะทักทายอย่างไร?"
    choices:
      - id: say-hello
        text: "你好！我是朋友。(Nǐ hǎo! Wǒ shì péngyou.) — สวัสดี! ฉันเป็นเพื่อน"
        next: hello-result
      - id: say-name
        text: "我叫… (Wǒ jiào…) — ฉันชื่อ…"
        next: name-result
      - id: wave
        text: "แค่ยิ้มและโบกมือ"
        next: wave-result
  hello-result:
    outcome:
      verdict: "李明 ยิ้มและตอบ '你好！很高兴认识你！' (สวัสดี! ยินดีที่ได้รู้จัก!)"
      lesson: "การทักทายด้วย '你好' เป็นวิธีที่ดีที่สุดในการเริ่มต้นบทสนทนา กับคนจีน การทักทายแบบสุภาพจะสร้างความประทับใจแรกที่ดี"
      rating: a
  name-result:
    outcome:
      verdict: "李明 ตอบ '你好！我叫李明！' (สวัสดี! ฉันชื่อ李明)"
      lesson: "การแนะนำตัวเองด้วยชื่อเป็นวิธีที่ดีมาก คนจีนชอบเมื่อชาวต่างชาติพยายามพูดภาษาจีน แม้จะแค่ประโยคเดียว"
      rating: a
  wave-result:
    outcome:
      verdict: "李明 ยิ้มและทักทายก่อน '你好！欢迎来到中国！' (สวัสดี! ยินดีต้อนรับสู่ประเทศจีน!)"
      lesson: "การยิ้มเป็นสากล แต่ลองพยายามพูด '你好' ดู下次 (ครั้งหน้า) เพื่อสร้างความประทับใจมากขึ้น"
      rating: b-plus
