- text: "เนื้อทุเรียนดิบหรือทุเรียนอ่อน 900 กรัม"
  children:
    - text: "เลือกทุเรียนที่ยังไม่สุก เนื้อแน่นแข็ง"
    - text: "พันธุ์ Monthong (หมอนทอง) เหมาะที่สุดเพราะเนื้อเยอะเมล็ดเล็ก"
    - text: "แยกเนื้อออกจากเมล็ดและก้าง"
- text: "น้ำเกลือ — เกลือ 1 ช้อนโต๊ะ + น้ำเปล่า 400 มิลลิลิตร"
  children:
    - text: "ผสมให้เกลือละลายก่อน"
    - text: "เตรียมไว้เติมในกระทะตอนทอด"
    - text: "ช่วยให้ทุเรียนกรอบและไม่อมน้ำมัน"
- text: "น้ำมันพืชสำหรับทอด"
  children:
    - text: "ใช้น้ำมันพืชทั่วไป (ถั่วเหลือง ปาล์ม)"
    - text: "น้ำมันต้องลึกพอท่วมชิ้นทุเรียน"
    - text: "อุณหภูมิที่เหมาะสมประมาณ 170-180°C"
- text: "น้ำตาลทรายหรือน้ำตาลปี๊บ (สำหรับเคลือบ)"
  children:
    - text: "น้ำตาลทราย: รสหวานสะอาด"
    - text: "น้ำตาลปี๊บ: รสหวานลึกหอมอ้อย"
    - text: "ตามชอบ — หรือทานเปล่าไม่ต้องเคลือบ"
