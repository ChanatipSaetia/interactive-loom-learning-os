- id: journey_plain
  label: "ทุเรียนทอดเปล่า"
  description: "กระบวนการทำทุเรียนทอดแบบไม่เคลือบน้ำตาล"
  steps:
    - stepId: step_1
      name: "เตรียมเนื้อทุเรียน"
      description: "แยกเนื้อทุเรียนดิบออกจากเมล็ด"
      processGroup: planning
    - stepId: step_2
      name: "หั่นทุเรียน"
      description: "หั่นเป็นชิ้นบางสม่ำเสมอเตรียมพร้อมทอด"
      processGroup: planning
    - stepId: step_3
      name: "เตรียมน้ำมันทอด"
      description: "ตั้งน้ำมันให้ร้อน 170-180°C เติมน้ำเกลือ"
      processGroup: execution
    - stepId: step_4
      name: "ทอดทุเรียน"
      description: "ทอดไฟกลางจนเหลืองทองกรอบ"
      processGroup: execution
    - stepId: step_5
      name: "สะเด็ดน้ำมัน"
      description: "ยกขึ้นพักบนกระดาษซับมัน"
      processGroup: evaluation
    - stepId: branch_plain
      name: "เสิร์ฟทุเรียนทอดเปล่า"
      description: "จัดเสิร์ฟทุเรียนทอดเปล่ากรอบอร่อย"
      processGroup: evaluation

