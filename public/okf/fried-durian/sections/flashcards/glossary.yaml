- id: durian_oen
  word: "ทุเรียนอ่อน"
  pronunciation: "du-rian on"
  category: วัตถุดิบ
  shortDefinition: "ทุเรียนที่ยังไม่สุก เนื้อแน่น適合สำหรับทอด"
  detailedDefinition: "ทุเรียนอ่อนคือทุเรียนที่เก็บเกี่ยวก่อนสุกเต็มที่ เนื้อจะแข็งและแน่นกว่าทุเรียนสุก เหมาะสำหรับการนำไปทอดเพราะจะกรอบเมื่อสัมผัสความร้อน"
  whyItMatters: "ทุเรียนสุกเกินไปจะนิ่มและเละเมื่อทอด ต้องเลือกทุเรียนดิบหรืออ่อนเท่านั้น"

- id: nam_gluea
  word: "น้ำเกลือ"
  pronunciation: "nam glua"
  category: วัตถุดิบ
  shortDefinition: "น้ำที่ผสมเกลือ ใช้ตอนทอดช่วยให้กรอบ"
  detailedDefinition: "น้ำเกลือทำจากเกลือ 1 ช้อนโต๊ะ ผสมน้ำเปล่า 400 มิลลิลิตร เติมลงไปในน้ำมันตอนทอดช่วยให้ทุเรียนกรอบนานและไม่ดูดซับน้ำมัน"
  whyItMatters: "เคล็ดลับสำคัญที่ทำให้ทุเรียนทอดกรอบนาน ไม่อมน้ำมัน"

- id: tan
  word: "ทอด"
  pronunciation: "thon"
  category: กระบวนการ
  shortDefinition: "การปรุงอาหารด้วยน้ำมันร้อน"
  detailedDefinition: "ทอดคือกระบวนการนำอาหารใส่ลงในน้ำมันร้อน (ประมาณ 170-180°C) จนสุกและกรอบ สำหรับทุเรียนทอด ใช้ไฟกลาง ไม่ต้องทอดนาน"
  whyItMatters: "การทอดเป็นหัวใจของสูตรนี้ ต้องควบคุมอุณหภูมิและเวลาให้เหมาะสม"

- id: krapong
  word: "กรอบ"
  pronunciation: "krapong"
  category: คุณลักษณะ
  shortDefinition: "เนื้อสัมผัสที่แข็งและ碎裂เมื่อเคี้ยว"
  detailedDefinition: "กรอบคือเป้าหมายหลักของทุเรียนทอด — เนื้อทุเรียนดิบเมื่อผ่านการทอดจะเปลี่ยนจากเนื้อแน่นเป็นเนื้อกรอบ เคี้ยวกรุบกรอบ"
  whyItMatters: "ทุเรียนทอดที่ไม่กรอบคือการทอดที่ล้มเหลว"

- id: nueng_tan_iip
  word: "น้ำตาลปี๊บ"
  pronunciation: "nam-than peep"
  category: วัตถุดิบ
  shortDefinition: "น้ำตาล棕อ้อยแบบไทย ใช้เคลือบทุเรียนทอด"
  detailedDefinition: "น้ำตาลปี๊บเป็นน้ำตาล棕อ้อยที่熬จนเป็นก้อน มีรสหวานลึกและกลิ่นหอมเฉพาะตัว นิยมใช้เคลือบทุเรียนทอดเพื่อเพิ่มรสชาติ"
  whyItMatters: "น้ำตาลปี๊บให้รสชาติและกลิ่นที่แตกต่างจากน้ำตาลทราย"

- id: krating
  word: "กระทะ"
  pronunciation: "kha-ta"
  category: อุปกรณ์
  shortDefinition: "ภาชนะสำหรับทอด"
  detailedDefinition: "กระทะสำหรับทอดทุเรียนควรเป็นกระทะที่ลึกพอที่จะใส่น้ำมันได้เพียงพอ ครอบคลุมชิ้นทุเรียน ใช้กระทะเหล็กหรือกระทะเทฟลอนได้"
  whyItMatters: "กระทะที่เหมาะสมช่วยควบคุมอุณหภูมิและทำให้ทอดได้สม่ำเสมอ"
