- id: q1
  question: "ทุเรียนทอดควรใช้ทุเรียนแบบไหน?"
  hint: "คิดว่าทุเรียนแบบไหนจะกรอบเมื่อทอด"
  choices:
    - id: a
      text: "ทุเรียนสุกเต็มผล"
      correct: false
      explanation: "ทุเรียนสุกจะนิ่มและเละเมื่อทอด ไม่กรอบ"
    - id: b
      text: "ทุเรียนดิบหรือทุเรียนอ่อน"
      correct: true
      explanation: "ถูกต้อง! ทุเรียนดิบเนื้อแน่น เมื่อทอดจะกรอบนอกนุ่มใน"
    - id: c
      text: "ทุเรียนแช่เย็น"
      correct: false
      explanation: "ทุเรียนแช่เย็นอาจมีน้ำแข็งเกาะ ทำให้ทอดแล้วน้ำมันกระเด็น"

- id: q2
  question: "น้ำเกลือช่วยอะไรในการทอดทุเรียน?"
  hint: "คิดถึงเนื้อสัมผัสและน้ำมัน"
  choices:
    - id: a
      text: "ทำให้รสชาติเค็มอร่อย"
      correct: false
      explanation: "ไม่ใช่เป้าหมายหลัก — น้ำเกลือใช้ในปริมาณน้อยในกระทะ ไม่ได้เคลือบ"
    - id: b
      text: "ช่วยให้กรอบนานและไม่ดูดซับน้ำมัน"
      correct: true
      explanation: "ถูกต้อง! น้ำเกลือช่วยสร้างเกราะป้องกันทำให้ทุเรียนกรอบและไม่อมน้ำมัน"
    - id: c
      text: "ทำให้สีสวยขึ้น"
      correct: false
      explanation: "สีทองมาจากการทอดที่อุณหภูมิเหมาะสม ไม่ใช่จากเกลือ"

- id: q3
  question: "อุณหภูมิที่เหมาะสมในการทอดทุเรียน是多少?"
  hint: "ไฟกลาง ไม่แรงเกินไปไม่เบาเกินไป"
  choices:
    - id: a
      text: "100-120°C (ไฟเบา)"
      correct: false
      explanation: "อุณหภูมิต่ำเกินไป ทุเรียนจะดูดซับน้ำมันและไม่กรอบ"
    - id: b
      text: "170-180°C (ไฟกลาง)"
      correct: true
      explanation: "ถูกต้อง! อุณหภูมินี้ทำให้ทุเรียนกรอบทองเหลืองอร่าม"
    - id: c
      text: "220-250°C (ไฟแรง)"
      correct: false
      explanation: "อุณหภูมิสูงเกินไป ทุเรียนจะไหม้ด้านนอกแต่ข้างในยังไม่กรอบ"

- id: q4
  question: "เจมุดเจมุดทุเรียนต่างจากทุเรียนทอดธรรมดาอย่างไร?"
  hint: "คิดว่าวัตถุดิบหลักต่างกัน"
  choices:
    - id: a
      text: "ใช้ทุเรียนสุกบดผสมกับแป้ง"
      correct: true
      explanation: "ถูกต้อง! เจมุดเจมุดใช้ทุเรียนสุกบดผสมแป้งแล้วคลึงทอด"
    - id: b
      text: "ทอดในน้ำมันมากกว่า"
      correct: false
      explanation: "ปริมาณน้ำมันไม่ต่างกัน ความต่างอยู่ที่วัตถุดิบและวิธีการเตรียม"
    - id: c
      text: "ไม่ใช้น้ำตาล"
      correct: false
      explanation: "เจมุดเจมุดมีส่วนผสมของน้ำตาลในแป้ง"

- id: q5
  question: "พันธุ์ทุเรียนอะไรเหมาะสำหรับทำทุเรียนทอดมากที่สุด?"
  hint: "พันธุ์ที่เนื้อเยอะ เมล็ดเล็ก"
  choices:
    - id: a
      text: "หมอนทอง (Monthong)"
      correct: true
      explanation: "ถูกต้อง! หมอนทองมีเนื้อเยอะ เมล็ดเล็ก และหาได้ง่าย"
    - id: b
      text: "หมากขี้หอย"
      correct: false
      explanation: "หมากขี้หอยเนื้อน้อย เมล็ดใหญ่ ไม่คุ้มค่าสำหรับทอด"
    - id: c
      text: "กระดุม"
      correct: false
      explanation: "กระดุมมีขนาดเล็ก เนื้อน้อย ไม่เหมาะสำหรับหั่นชิ้นทอด"
