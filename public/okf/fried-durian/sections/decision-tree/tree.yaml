id: durian-advisor
title: "ที่ปรึกษาทุเรียนทอด"
root: experience
nodes:
  experience:
    prompt: "คุณมีประสบการณ์ในการทำอาหารมากน้อยแค่ไหน?"
    choices:
      - id: beginner
        text: "มือใหม่ — ไม่เคยทำ"
        next: taste_pref_beginner
        rationale: "เริ่มจากสูตรง่ายๆ ก่อน"
        recommended: true
      - id: experienced
        text: "เคยทำ —有经验"
        next: taste_pref_pro
        rationale: "ลองสูตรที่ซับซ้อนขึ้น"

  taste_pref_beginner:
    prompt: "คุณชอบรสชาติแบบไหน?"
    choices:
      - id: sweet
        text: "ชอบหวาน"
        next: rec_plain_sugar
        rationale: "หวานกรอบคือทางที่ง่ายและอร่อย"
      - id: natural
        text: "ชอบรสธรรมชาติ"
        next: rec_plain
        rationale: "แบบเปล่ายิ่งง่ายที่สุด"

  taste_pref_pro:
    prompt: "คุณอยากได้ทุเรียนทอดแบบไหน?"
    choices:
      - id: premium
        text: "รสจัด สีสวย ระดับพรีเมียม"
        next: rec_palm_sugar_chanee
        rationale: "ชะนี+น้ำตาลปี๊บ = รสเข้มข้นระดับท็อป"
      - id: crunchy
        text: "กรอบที่สุด"
        next: rec_deep_fry
        rationale: "ทอดน้ำมันท่วมกรอบทุกด้าน"

  rec_plain:
    leaf:
      recommendation: "ทุเรียนทอดเปล่า"
      explanation: "เลือกหมอนทองหั่นบาง ทอดในน้ำมันที่เติมน้ำเกลือ ทอดไฟกลางจนสีทอง สะเด็ดน้ำมัน ทานได้เลย ง่ายที่สุด เน้นกลิ่นทุเรียนแท้"
      tradeoffs:
        - "รสชาติเรียบง่าย ไม่หวาน"
        - "กรอบนานเพราะไม่เคลือบ"
        - "เหมาะสำหรับมือใหม่ที่สุด"

  rec_plain_sugar:
    leaf:
      recommendation: "ทุเรียนทอดเคลือบน้ำตาลทราย"
      explanation: "หมอนทองหั่นบางทอดกรอบ แล้วคลุกน้ำตาลทรายที่熬ละลายบางๆ หวานกรอบอร่อย เป็นสูตรยอดนิยม ทำไม่ยาก"
      tradeoffs:
        - "ความหวานเพิ่มเข้ามา"
        - "ความกรอบลดลงเล็กน้อยจากน้ำตาล"
        - "เป็นรูปแบบที่คนส่วนใหญ่ชอบ"

  rec_palm_sugar_chanee:
    leaf:
      recommendation: "ทุเรียนชะนีทอดเคลือบน้ำตาลปี๊บ"
      explanation: "ใช้ทุเรียนชะนีที่กลิ่นหอมจัด ทอดกรอบแล้วเคลือบน้ำตาลปี๊บ熬ละลาย ได้ทุเรียนทอดรสเข้มข้น สีน้ำตาลทองสวย เป็นระดับพรีเมียม"
      tradeoffs:
        - "ทำยากกว่า ต้องควบคุม熬น้ำตาลปี๊บ"
        - "ชะนีหาซื้อยากกว่าหมอนทอง"
        - "ความกรอบน้อยกว่าเพราะน้ำตาลปี๊บมีความชื้น"

  rec_deep_fry:
    leaf:
      recommendation: "ทุเรียนทอดน้ำมันท่วม"
      explanation: "หมอนทองหั่นบาง ทอดในน้ำมันที่ท่วมชิ้น 170-180°C กรอบเท่ากันทุกด้าน สะเด็ดน้ำมัน แล้วเคลือบน้ำตาลตามชอบ"
      tradeoffs:
        - "ใช้น้ำมันเยอะ"
        - "กรอบที่สุด"
        - "ต้องระวังอุณหภูมิน้ำมัน"
