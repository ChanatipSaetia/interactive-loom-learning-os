- id: "fuel-injection-normal"
  label: หัวฉีดปกติ (Normal Fuel Injection)
  description: บิดคันเร่ง → ECU คำนวณ → หัวฉีดพ่น → ละอองน้ำมัน → ผสมส่วนแม่นยำ
  steps:
    - stepId: inject_throttle
      name: "บิดคันเร่ง"
      description: "ผู้ขับขี่บิดคันเร่ง เซนเซอร์ส่งสัญญาณปริมาณอากาศเข้าเครื่องไปยัง ECU"
    - stepId: inject_fuel
      name: "พ่นหัวฉีด"
      description: "ECU คำนวณปริมาณน้ำมันที่เหมาะสม สั่งหัวฉีดพ่นน้ำมันเป็นละอองฝอย"
    - stepId: precise_mix
      name: "ผสมส่วนแม่นยำ"
      description: "ละอองน้ำมันผสมกับอากาศในอัตราส่วนที่ ECU คำนวณไว้ ให้การเผาไหม้สมบูรณ์"

- id: "fuel-injection-cold"
  label: เพิ่มส่วนผสมอัตโนมัติ (Auto Cold Enrichment)
  description: บิดคันเร่ง → ECU ตรวจเครื่องเย็น → เพิ่มน้ำมันอัตโนมัติ
  steps:
    - stepId: inject_throttle
      name: "บิดคันเร่ง"
      description: "ผู้ขับขี่บิดคันเร่ง เซนเซอร์ส่งข้อมูลไปยัง ECU"
    - stepId: inject_fuel
      name: "พ่นหัวฉีด"
      description: "ECU คำนวณปริมาณน้ำมันพื้นฐานจากข้อมูลเซนเซอร์"
    - stepId: inject_cold
      name: "เพิ่มส่วนผสม"
      description: "เซนเซอร์ตรวจพบอุณหภูมิเครื่องเย็น ECU สั่งเพิ่มปริมาณน้ำมันเพื่อสตาร์ทง่าย"
