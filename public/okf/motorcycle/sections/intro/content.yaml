estimatedTime: "8 min read"
moduleCount: 15

what:
  definition: "รถมอเตอร์ไซค์ (Motorcycle) คือยานพาหนะสองล้อขับเคลื่อนด้วยเครื่องยนต์สันดาปภายในหรือไฟฟ้า ทำงานผ่านระบบเชื้อเพลิง ระบบจุดระเบิด และระบบส่งกำลังไปยังล้อหลัง"
  summary: "คู่มือเรียนรู้กลไกหลักการทำงานของรถมอเตอร์ไซค์ ระบบเครื่องยนต์ 4 จังหวะ และเทคนิคการขับขี่ปลอดภัย"
  bullets:
    - "วัฏจักรการทำงานของเครื่องยนต์ 4 จังหวะ (ดูด-อัด-ระเบิด-คาย)"
    - "การทำงานของระบบฉีดเชื้อเพลิง (EFI) และระบบโช้คสตาร์ท"
    - "ระบบเบรค hydraulic และความสมดุลขณะขับขี่"
  tags:
    - "Motorcycle Mechanics"
    - "4-Stroke Engine"
    - "Fuel Injection"
    - "Safety"

why:
  summary: "การขับขี่โดยไม่เข้าใจกลไกและข้อจำกัดของระบบเบรค/ระบบส่งกำลัง เป็นสาเหตุหลักของการเกิดอุบัติเหตุบนท้องถนน"
  impact: "เข้าใจการตอบสนองของเครื่องยนต์และเทคนิคการกระจายแรงเบรค ช่วยเพิ่มความปลอดภัยและยืดอายุการใช้งานยานพาหนะ"

