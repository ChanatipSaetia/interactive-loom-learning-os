- type: linear
  id: choke_on
  initiatedBy: rider
  command: เปิดโช้ค (Turn Choke On)
  policy: ใช้ส่วนผสมรวยน้ำมัน (Rich Mix Decision)
  handledBy: choke_valve
  resultEvents:
    - id: rich_mix
      title: ส่วนผสมรวยน้ำมัน (Rich Mixture)
      desc: "อัตราส่วนน้ำมัน:อากาศสูงกว่าปกติ"
  continuesAs: "rich-mix-branch"
- type: branch
  id: "rich-mix-branch"
  event: rich_mix
  branches:
    - id: cold_start
      label: สตาร์ทเครื่อง
      policy: เลือกสตาร์ทเครื่อง (Choose Cold Start)
      command: สตาร์ทเครื่องเย็น (Cold Start Engine)
      handledBy: engine_warm
      resultEvents:
        - id: engine_warm
          title: เครื่องอุ่นแล้ว (Engine Warm)
          desc: อุณหภูมิเครื่องยนต์ถึงระดับทำงานปกติ
      continuesAs: choke_off
    - id: ride_choke
      label: ลืมปิดโช้ค
      dashed: true
      policy: ลืมปิดโช้ค (Forgot Choke)
      command: ขี่รถโดยลืมปิดโช้ค (Ride With Choke)
      handledBy: choke_valve
      resultEvents:
        - id: choke_forget
          title: วิ่ง โช้คค้าง (Riding With Choke On)
          desc: ส่วนผสมรวยน้ำมันเกินไป ทำให้หัวเทียนสกปรกและกินน้ำมัน
- type: linear
  id: choke_off
  policy: ปิดโช้ค (Turn Choke Off)
  command: ปิดโช้ค (Choke Off)
  handledBy: choke_valve
  resultEvents:
    - id: normal_mix
      title: ส่วนผสมปกติ (Normal Mixture)
      desc: "อัตราส่วนน้ำมัน:อากาศกลับสู่ค่ามาตรฐาน"
