id: motorcycle-diag
title: "ตัวช่วยวินิจฉัยปัญหา"
root: symptom
nodes:
  symptom:
    prompt: "รถมีอาการแบบไหน?"
    choices:
      - id: no-start
        text: "สตาร์ทไม่ติด"
        next: start-check
        rationale: "สตาร์ทไม่ติดเป็นปัญหาที่พบบ่อย มีหลายสาเหตุ"
      - id: no-power
        text: "เร่งไม่ขึ้น หรือรอบขึ้นแต่รถไม่วิ่ง"
        next: power-check
        rationale: "อาการนี้มักเกี่ยวกับระบบส่งกำลังหรือระบบจุดระเบิด"
        recommended: true
      - id: brake-issue
        text: "เบรกจม หรือเบรกไม่อยู่"
        next: brake-check
        rationale: "ปัญหาระบบเบรกต้องแก้ไขทันทีเพื่อความปลอดภัย"
  start-check:
    prompt: "ลองฟังเสียงตอนสตาร์ท"
    choices:
      - id: no-sound
        text: "ไม่มีเสียงอะไรเลย"
        next: rec-electric
        rationale: "ไม่มีเสียงอาจหมายถึงระบบไฟฟ้ามีปัญหา"
      - id: crank-no-fire
        text: "เครื่องหมุนแต่ไม่ติด"
        next: rec-fuel
        rationale: "เครื่องหมุนได้แต่ไม่ติด มักเกี่ยวกับน้ำมันหรือหัวเทียน"
  power-check:
    prompt: "ลองฟังเสียงเพิ่มเติม"
    choices:
      - id: chain-noise
        text: "มีเสียงแคร่กๆ เวลาขับขี่"
        next: rec-chain
        rationale: "เสียงโซ่เป็นสัญญาณว่าระบบส่งกำลังมีปัญหา"
      - id: no-noise
        text: "ไม่มีเสียงผิดปกติ แต่รอบขึ้นรถไม่วิ่ง"
        next: rec-clutch
        rationale: "คลัตช์ลื่นเป็นสาเหตุพบบ่อยของอาการนี้"
  brake-check:
    prompt: "ลองกดเบรกดู"
    choices:
      - id: brake-soft
        text: "เบรกนุ่ม กดจมง่าย"
        next: rec-brake-fluid
        rationale: "เบรกนุ่มมักเกิดจากฟองอากาศหรือซีลแตก"
      - id: brake-slow
        text: "เบรกแข็งแต่ไม่อยู่"
        next: rec-brake-pad
        rationale: "เบรกแข็งแต่ไม่อยู่อาจเพราะผ้าเบรกหมด"
  rec-electric:
    leaf:
      recommendation: "เช็คระบบไฟฟ้า: แบตเตอรี่, สวิตช์, ฟิวส์ และสตาร์ทเตอร์"
      explanation: "ถ้าไม่มีเสียงตอนสตาร์ท ให้เริ่มเช็คจากแบตเตอรี่ก่อน แล้วตามด้วยฟิวส์และสวิตช์ ถ้าแบตเตอรี่ดี อาจเป็นสตาร์ทเตอร์เสีย"
      tradeoffs:
        - "การเช็คระบบไฟฟ้าทำได้เองเบื้องต้น"
        - "ถ้าสตาร์ทเตอร์เสียอาจต้องส่งร้าน"
  rec-fuel:
    leaf:
      recommendation: "เช็คหัวเทียนและระบบจ่ายน้ำมัน"
      explanation: "ถ้าเครื่องหมุนแต่ไม่ติด ให้เริ่มจากหัวเทียนก่อน — ถอดออกมาดูว่ายังมีประกายไฟหรือไม่ ถ้ามี เช็คคาร์บูเรเตอร์หรือหัวฉีด"
      tradeoffs:
        - "การเปลี่ยนหัวเทียนทำได้เอง"
        - "การล้างคาร์บูเรเตอร์หรือซ่อมหัวฉีดอาจต้องส่งร้าน"
  rec-chain:
    leaf:
      recommendation: "เช็คความตึงโซ่และสภาพสเตอร์"
      explanation: "โซ่หย่อนเกินไปทำให้สูญเสียกำลังและเสียงดัง ตั้งความตึงโซ่ให้อยู่ในระดับที่พอดี (ระยะฟรีประมาณ 2-3 ซม.)"
      tradeoffs:
        - "การตั้งโซ่ทำได้เอง"
        - "ถ้าสเตอร์ฟันแหลมหรือโซ่ตาย ต้องเปลี่ยนใหม่ยกชุด"
  rec-clutch:
    leaf:
      recommendation: "เช็คแผ่นคลัตช์ (รถเกียร์) หรือสายพาน (รถออโตเมติก)"
      explanation: "ถ้ารอบเครื่องขึ้นแต่รถไม่วิ่ง คลัตช์ลื่น (รถเกียร์) หรือสายพานยืด (รถออโตเมติก) เป็นสาเหตุหลัก"
      tradeoffs:
        - "การเช็คคลัตช์/สายพานต้องถอดชิ้นส่วน"
        - "ควรส่งร้านที่มีเครื่องมือ"
  rec-brake-fluid:
    leaf:
      recommendation: "ไล่อากาศน้ำมันเบรก หรือเช็คซีลกระปุกเบรก"
      explanation: "เบรกนุ่มกดจมง่ายมักเกิดจากฟองอากาศในระบบหรือซีลแตก ตรวจสอบระดับน้ำมันเบรกที่กระปุกเบรกบน"
      tradeoffs:
        - "การไล่อากาศทำได้เองถ้ามีผู้ช่วย"
        - "ถ้าซีลแตกต้องเปลี่ยนซีลที่ร้าน"
  rec-brake-pad:
    leaf:
      recommendation: "เช็คความหนาผ้าเบรกและสภาพจานเบรก"
      explanation: "ผ้าเบรกที่บางเกินไปทำให้เหล็กเสียดสีกับจานเบรก ทำให้เบรกไม่อยู่และจานเบรกเป็นรอย"
      tradeoffs:
        - "การเปลี่ยนผ้าเบรกทำได้เองเบื้องต้น"
        - "ถ้าจานเบรกเป็นร่องลึก ต้องลับหรือเปลี่ยนจาน"
