id: motorcycle-troubleshoot
title: "รถมีปัญหา ต้องทำอย่างไร?"
intro: "คุณกำลังขับรถมอเตอร์ไซค์แล้วเจอปัญหา คุณจะใช้วิธีไหนในการแก้ไข?"
nodes:
  start:
    prompt: "คุณกำลังลงเขาสูงและเบรกเริ่มร้อนมาก ควรทำอย่างไร?"
    choices:
      - id: brake-hard
        text: "เบรกต่อไปเรื่อยๆ จนกว่าจะถึงด้านล่าง"
        next: brake-fade-outcome
      - id: engine-brake
        text: "ใช้เกียร์ช่วยเบรก (Engine Brake) และพักเบรกเป็นระยะ"
        next: engine-brake-outcome
      - id: coast
        text: "เลิกเบรกแล้วปล่อยให้รถไหลลงเขา"
        next: coast-outcome
  brake-fade-outcome:
    outcome:
      verdict: "เบรกจมจากความร้อนสูง ทำให้เบรกไม่อยู่และเสี่ยงอุบัติเหตุรุนแรง"
      lesson: "เมื่อเบรกใช้งานหนักต่อเนื่อง ควรใช้เกียร์ช่วยเบรกและพักเบรกเป็นระยะเพื่อไม่ให้จานเบรกและผ้าเบรกร้อนเกินจุดทำงานปกติ"
      rating: c
  engine-brake-outcome:
    outcome:
      verdict: "คุณควบคุมความเร็วได้ดีด้วยเกียร์และเบรกเป็นระยะ เบรกไม่ร้อนเกินไป"
      lesson: "การใช้เกียร์ช่วยเบรก (Engine Brake) เป็นวิธีที่ปลอดภัยที่สุดเมื่อลงเขาสูง ช่วยลดภาระของระบบเบรก"
      rating: a
  coast-outcome:
    outcome:
      verdict: "รถไหลเร็วขึ้นเรื่อยๆ คุณไม่สามารถควบคุมความเร็วได้"
      lesson: "การปล่อยรถไหลโดยไม่ควบคุมความเร็วเป็นอันตรายมาก ควรใช้เกียร์และเบรกควบคู่กัน"
      rating: c
