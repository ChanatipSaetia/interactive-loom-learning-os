- id: "4-stroke-cycle"
  label: วัฏจักรเครื่องยนต์ 4 จังหวะ และการส่งกำลัง
  description: ขั้นตอนการทำงานตั้งแต่บิดคันเร่งจนถึงการส่งกำลังไปที่ล้อ
  steps:
    - stepId: throttle
      name: "บิดคันเร่ง"
      description: "ผู้ขับขี่บิดคันเร่งเพื่อสั่งให้เครื่องยนต์เพิ่มรอบและสร้างกำลัง"
    - stepId: intake
      name: "จังหวะดูด"
      description: "ลูกสูบเคลื่อนลง วาล์วน้ำมันเปิด ผสมอากาศ-น้ำมันไหลเข้ากระบอกสูบ"
    - stepId: compression
      name: "จังหวะอัด"
      description: "ลูกสูบเคลื่อนขึ้น วาล์วปิดทั้งสองข้าง อัดส่วนผสมให้มีความหนาแน่นสูง"
    - stepId: combustion
      name: "จังหวะระเบิด"
      description: "หัวเทียนจุดระเบิด ส่วนผสมถูกอัดจนระเบิด ผลักลูกสูบลง สร้างกำลังขับเคลื่อน"
    - stepId: exhaust
      name: "จังหวะไอเสีย"
      description: "วาล์วไอเสียเปิด ลูกสูบเคลื่อนขึ้น ผลักไอเสียที่ถูกเผาไหม้ออก"
    - stepId: transmission
      name: "ส่งกำลัง"
      description: "กำลังจากการระเบิดถูกส่งผ่านคลัตช์ เกียร์ และโซ่ ไปยังล้อหลัง"
