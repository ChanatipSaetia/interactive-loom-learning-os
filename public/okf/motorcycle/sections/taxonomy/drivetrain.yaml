type: "taxonomy-category"
icon: Folder
title: ระบบส่งกำลัง (Drivetrain)
subtitle: การถ่ายทอดกำลังสู่ล้อ
color: blue
description: ปัญหาที่ทำให้เครื่องยนต์ทำงานปกติ แต่รถไม่เคลื่อนที่หรือวิ่งได้ไม่เต็มประสิทธิภาพ
details: แม้เครื่องยนต์จะแรงแค่ไหน หากระบบส่งกำลังมีปัญหาก็เปล่าประโยชน์ ปัญหาในรถเกียร์มักเป็นโซ่หย่อน โซ่ตาย หรือคลัตช์ลื่น ในขณะที่รถออโตเมติกมักเป็นปัญหาสายพานยืด ชามสึก หรือเม็ดตุ้มน้ำหนักแตก
analogy: เหมือนกระดูกและกล้ามเนื้อขาที่คอยส่งแรงจากร่างกายไปที่พื้น หากขาเจ็บก็วิ่งไม่ออก
primaryFocus: โซ่ สเตอร์ แผ่นคลัตช์ (รถเกียร์) หรือ สายพาน ชาม เม็ด (รถออโตเมติก)
inScope:
  - เข้าเกียร์แล้วรถกระตุก
  - เร่งเครื่องแล้วรอบขึ้นแต่รถไม่วิ่ง (คลัตช์ลื่น)
  - มีเสียงแคร่กๆ เวลาขับขี่ (โซ่หย่อน)
  - ความเร็วปลายหดหาย
outOfScope:
  - เครื่องยนต์ดับกลางอากาศ
  - เบรกไม่อยู่
