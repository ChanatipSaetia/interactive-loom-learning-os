type: "taxonomy-category"
icon: Flame
title: ระบบเครื่องยนต์ (Engine System)
subtitle: แหล่งกำเนิดพลังงานหลักของรถ
color: red
description: ปัญหาที่ส่งผลโดยตรงต่อการสตาร์ทเครื่องยนต์หรือกำลังของเครื่องยนต์
details: "ระบบเครื่องยนต์มีปัญหาถือเป็นเรื่องใหญ่ที่สุด มักเกิดจากความร้อนสะสม หรือการขาดการบำรุงรักษาน้ำมันเครื่อง อาการที่พบคือ สตาร์ทไม่ติด, เครื่องร้อนจัด, มีควันขาวพุ่งออกจากท่อไอเสีย, หรือเร่งเครื่องแล้วมีเสียงดังผิดปกติภายในเครื่อง"
analogy: เหมือนหัวใจของร่างกายมนุษย์ หากหัวใจเต้นผิดจังหวะหรือหยุดทำงาน ร่างกายทั้งหมดก็ขยับไม่ได้
primaryFocus: "ตรวจสอบระบบจุดระเบิด (หัวเทียน), ระบบจ่ายเชื้อเพลิง, และระบบหล่อลื่น (น้ำมันเครื่อง)"
inScope:
  - สตาร์ทไม่ติด หรือสตาร์ทติดยาก
  - เครื่องร้อนจัด (Overheat)
  - กินน้ำมันเครื่อง/ควันขาว
  - เครื่องสั่นหรือมีเสียงดังคล้ายเหล็กกระทบกัน
outOfScope:
  - ปัญหาล้อฝืด (มักเป็นที่เบรก)
  - ระบบไฟส่องสว่างไม่ติด
