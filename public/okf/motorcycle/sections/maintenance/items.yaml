- text: การเปลี่ยนถ่ายน้ำมันเครื่อง (Engine Oil)
  children:
    - text: "ควรเปลี่ยนตามระยะทางที่คู่มือกำหนด (เช่น ทุกๆ 2,000 - 4,000 กม. ขึ้นอยู่กับรุ่น)"

    - text: หมั่นตรวจเช็คระดับน้ำมันเครื่องผ่านก้านวัด หรือตาแมวข้างแคร้งเครื่อง

- text: การเช็คลมยางและสภาพยาง
  children:
    - text: เติมลมยางตามค่ามาตรฐานที่สติ๊กเกอร์สวิงอาร์มหรือใต้เบาะระบุไว้

    - text: เช็คดอกยาง หากดอกยางโล้นหรือยางมีรอยแตกลายงาควรเปลี่ยนทันที เพื่อความปลอดภัยในการยึดเกาะถนน

- text: โซ่และสเตอร์ (สำหรับรถเกียร์)
  children:
    - text: หล่อลื่นโซ่สม่ำเสมอด้วยสเปรย์ฉีดโซ่หรือน้ำมันหยอดโซ่

    - text: "ตั้งความตึงโซ่ให้อยู่ในระดับที่พอดี ไม่ตึงหรือหย่อนจนเกินไป (ระยะฟรีประมาณ 2-3 ซม.)"

- text: ระบบเบรก
  children:
    - text: "เช็คระดับน้ำมันเบรกที่กระปุกปั๊มเบรกบน ว่าอยู่ในระดับ MAX-MIN หรือไม่"

    - text: ตรวจสอบความหนาของผ้าเบรก หากผ้าเบรกบางเกินไปจะทำให้เหล็กเสียดสีกับจานเบรกจนเป็นรอยและเบรกไม่อยู่

