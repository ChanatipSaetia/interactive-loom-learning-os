challenges:
  - prompt: "Complete the statement explaining cylinder dimensions and engine volume (Part 1):"
    template: "Increasing the cylinder bore size or piston stroke length results in a {zone-1} swept volume (displacement). This swept volume allows the engine to ingest more air and fuel, which directly {zone-2} the peak torque and power outputs."
    chips:
      - id: "chip-larger"
        text: "larger"
      - id: "chip-smaller"
        text: "smaller"
      - id: "chip-increases"
        text: "increases"
      - id: "chip-decreases"
        text: "decreases"
    solution:
      zone-1: "chip-larger"
      zone-2: "chip-increases"
    explanation: "<strong>Correct!</strong> Swept volume (displacement) increases with larger bore and stroke. Larger cylinder size holds more fuel charge, which increases combustion pressure force."
  - prompt: "Complete the statement explaining high-revving performance dynamics (Part 2):"
    template: "Operating the engine at high RPMs increases the horsepower but {zone-1} the fuel efficiency. This is because high revs require {zone-2} fuel injection cycles per second."
    chips:
      - id: "chip-reduces"
        text: "reduces"
      - id: "chip-boosts"
        text: "boosts"
      - id: "chip-more"
        text: "more"
      - id: "chip-fewer"
        text: "fewer"
    solution:
      zone-1: "chip-reduces"
      zone-2: "chip-more"
    explanation: "<strong>Correct!</strong> Higher speed requires more cycles per second, consuming more fuel and dropping economy metrics."
