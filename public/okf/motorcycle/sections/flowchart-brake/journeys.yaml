- id: "brake-normal"
  label: เบรกปกติ (Normal Braking)
  description: กดเบรก → ไฮดรอลิก → แคลิเพอร์ประกบจาน → รถช้าลง
  steps:
    - stepId: brake
      name: "กดเบรก"
      description: "ผู้ขับขี่กดแฮนด์เบรก หรือแป้นเบรก เพื่อสั่งให้ระบบเบรกทำงาน"
    - stepId: caliper_squeeze
      name: "แคลิเพอร์ประกบจาน"
      description: "แรงไฮดรอลิกส่งต่อเข้าแคลิเพอร์ กดผ้าเบรกประกบจานเบรกทั้งสองด้าน"
    - stepId: brake_normal
      name: "รถช้าลง"
      description: "แรงเสียดทานระหว่างผ้าเบรกและจานเบรกทำให้ล้อช้าลง รถหยุดหรือลดความเร็วตามที่ต้องการ"

- id: "brake-fade"
  label: เบรกจม (Brake Fade)
  description: กดเบรก → เบรกหนักต่อเนื่อง → ร้อนเกิน → ประสิทธิภาพลด
  steps:
    - stepId: brake
      name: "กดเบรก"
      description: "ผู้ขับขี่กดเบรกเพื่อลดความเร็ว"
    - stepId: caliper_squeeze
      name: "แคลิเพอร์ประกบจาน"
      description: "แคลิเพอร์กดผ้าเบรกประกบจานเบรก ใช้แรงเสียดทานในการหยุดล้อ"
    - stepId: brake_fade
      name: "เบรกจม"
      description: "เบรกหนักต่อเนื่องทำให้จานและผ้าเบรกร้อนเกินจุดทนทาน แรงเสียดทานลด เบรกไม่ทำงานเต็มประสิทธิภาพ"
