- id: q1
  question: "ลูกสูบทำงานกี่จังหวะ?"
  hint: "คิดถึงการเคลื่อนที่ขึ้น-ลงของลูกสูบ"
  choices:
    - id: a
      text: "2 จังหวะ (ดูด-คาย)"
      correct: false
      explanation: "เครื่องยนต์มอเตอร์ไซค์ส่วนใหญ่เป็น 4 จังหวะ ไม่ใช่ 2 จังหวะ"
    - id: b
      text: "4 จังหวะ (ดูด-อัด-ระเบิด-คาย)"
      correct: true
      explanation: "ถูกต้อง! เครื่องยนต์สันดาปภายในทำงาน 4 จังหวะ: ดูดส่วนผสมเข้า, อัดส่วนผสม, ระเบิดดันลูกสูบลง, คายไอเสียออก"
    - id: c
      text: "6 จังหวะ"
      correct: false
      explanation: "เครื่องยนต์มอเตอร์ไซค์มาตรฐานใช้ 4 จังหวะ"

- id: q2
  question: "หัวเทียนทำหน้าที่อะไร?"
  hint: "หัวเทียนอยู่ในห้องเผาไหม้"
  choices:
    - id: a
      text: "ผสมน้ำมันกับอากาศ"
      correct: false
      explanation: "การผสมน้ำมันและอากาศเป็นหน้าที่ของคาร์บูเรเตอร์หรือหัวฉีด"
    - id: b
      text: "จุดประกายไฟในห้องเผาไหม้"
      correct: true
      explanation: "ถูกต้อง! หัวเทียนจุดประกายไฟแรงสูงเพื่อให้เกิดการระเบิดผลักลูกสูบ"
    - id: c
      text: "ส่งกำลังไปยังเพลาข้อเหวี่ยง"
      correct: false
      explanation: "การส่งกำลังเป็นหน้าที่ของก้านสูบและเพลาข้อเหวี่ยง"

- id: q3
  question: "ถ้ารถสตาร์ทไม่ติดเลย สาเหตุที่เป็นไปได้มากที่สุดคืออะไร?"
  hint: "ลองคิดว่าอะไรจำเป็นสำหรับเครื่องยนต์จะทำงาน"
  choices:
    - id: a
      text: "โซ่หย่อน"
      correct: false
      explanation: "โซ่หย่อนทำให้รถวิ่งได้ไม่เต็มประสิทธิภาพ แต่ไม่ทำให้สตาร์ทไม่ติด"
    - id: b
      text: "เบรกจม"
      correct: false
      explanation: "เบรกจมเป็นปัญหาระบบเบรก ไม่เกี่ยวกับการสตาร์ทเครื่อง"
    - id: c
      text: "หัวเทียนบอด (หมดสภาพ)"
      correct: true
      explanation: "ถูกต้อง! หากหัวเทียนบอด ไม่มีประกายไฟจุดระเบิด เครื่องยนต์จึงสตาร์ทไม่ติด"

- id: q4
  question: "ระบบหัวฉีดแตกต่างจากคาร์บูเรเตอร์อย่างไร?"
  hint: "ลองคิดว่าอะไรควบคุมการจ่ายน้ำมัน"
  choices:
    - id: a
      text: "หัวฉีดใช้กลไก คาร์บูเรเตอร์ใช้ไฟฟ้า"
      correct: false
      explanation: "恰恰相反 — คาร์บูเรเตอร์ใช้กลไก หัวฉีดใช้ไฟฟ้า"
    - id: b
      text: "หัวฉีดควบคุมด้วยกล่อง ECU ให้ละอองน้ำมันฝอยละเอียดและแม่นยำกว่า"
      correct: true
      explanation: "ถูกต้อง! หัวฉีดอิเล็กทรอนิกส์ที่ควบคุมด้วย ECU ให้ความแม่นยำสูงกว่าคาร์บูเรเตอร์แบบกลไก"
    - id: c
      text: "ไม่มีความแตกต่าง ทั้งสองระบบเหมือนกัน"
      correct: false
      explanation: "หัวฉีดและคาร์บูเรเตอร์ทำงานต่างกันโดยสิ้นเชิง — หัวฉีดแม่นยำและประหยัดกว่า"

- id: q5
  question: "เบรกจม (Brake Fade) เกิดจากอะไร?"
  hint: "ลองคิดเกี่ยวกับสิ่งที่เกิดขึ้นเมื่อเบรกใช้งานหนัก"
  choices:
    - id: a
      text: "น้ำมันเบรกรั่ว"
      correct: false
      explanation: "น้ำมันเบรกรั่วทำให้เบรกจมได้ แต่ไม่เรียกว่า เบรก Fade"
    - id: b
      text: "ความร้อนสูงจากเบรกใช้งานหนักต่อเนื่อง"
      correct: true
      explanation: "ถูกต้อง! เบรก Fade เกิดจากจานเบรกและผ้าเบรกมีความร้อนสูงเกินจุดทำงานปกติ ทำให้แรงเสียดทานลดลง"
    - id: c
      text: "จานเบรกบิดงอ"
      correct: false
      explanation: "จานเบรกบิดงอทำให้เบรกสั่น แต่ไม่ใช่สาเหตุของเบรก Fade โดยตรง"

- id: q6
  question: "ปะเก็นทำหน้าที่อะไรในเครื่องยนต์?"
  hint: "ปะเก็นอยู่ระหว่างชิ้นส่วนที่ประกบกัน"
  choices:
    - id: a
      text: "ป้องกันการรั่วซึมของน้ำมัน น้ำ หรือกำลังอัด"
      correct: true
      explanation: "ถูกต้อง! ปะเก็นเป็นแผ่นซีลที่ป้องกันการรั่วซึมระหว่างชิ้นส่วนเครื่องยนต์ที่ประกบกัน"
    - id: b
      text: "จุดระเบิดส่วนผสม"
      correct: false
      explanation: "การจุดระเบิดเป็นหน้าที่ของหัวเทียน"
    - id: c
      text: "ส่งกำลังไปยังล้อ"
      correct: false
      explanation: "การส่งกำลังเป็นหน้าที่ของระบบเกียร์และสเตอร์"

- id: q7
  question: "ถ้าเปิดโช้คแล้วลืมปิด จะเกิดอะไรขึ้น?"
  hint: "โช้คทำให้ส่วนผสมรวยน้ำมัน"
  choices:
    - id: a
      text: "รถจะประหยัดน้ำมันขึ้น"
      correct: false
      explanation: "โช้คเปิดทำให้มีน้ำมันมากเกิน — รถจะกินน้ำมันมากขึ้น"
    - id: b
      text: "รถจะกินน้ำมันมาก หัวเทียนสกปรก และเร่งไม่ขึ้น"
      correct: true
      explanation: "ถูกต้อง! โช้คปิดช่องอากาศเพื่อเพิ่มสัดส่วนน้ำมัน การเปิดโช้คตลอดทำให้ส่วนผสมรวยน้ำมันเกินไป"
    - id: c
      text: "ไม่มีผลอะไร"
      correct: false
      explanation: "การเปิดโช้คตลอดมีผลเสียต่อเครื่องยนต์อย่างมาก"

- id: q8
  question: "ระบบส่งกำลัง (Drivetrain) มีอะไรบ้าง?"
  hint: "คิดถึงการถ่ายทอดกำลังจากเครื่องไปยังล้อ"
  choices:
    - id: a
      text: "โซ่ สเตอร์ และระบบเกียร์"
      correct: true
      explanation: "ถูกต้อง! ระบบส่งกำลังรวมระบบเกียร์ โซ่ และสเตอร์ที่ถ่ายทอดกำลังจากเครื่องยนต์ไปยังล้อหลัง"
    - id: b
      text: "จานเบรกและผ้าเบรก"
      correct: false
      explanation: "จานเบรกและผ้าเบรกเป็นส่วนหนึ่งของระบบเบรก ไม่ใช่ระบบส่งกำลัง"
    - id: c
      text: "หัวเทียนและกล่อง ECU"
      correct: false
      explanation: "หัวเทียนและกล่อง ECU เป็นส่วนหนึ่งของระบบเครื่องยนต์และระบบไฟฟ้า"
