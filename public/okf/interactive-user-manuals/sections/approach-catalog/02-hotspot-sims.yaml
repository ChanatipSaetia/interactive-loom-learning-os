icon: MousePointerClick
title: "Hotspot Simulations"
subtitle: "Recorded screens with clickable spots"
description: "Screen-capture hotspot simulations turn recorded screens into clickable steps, but every UI change means re-recording the affected screens."
details: "An authoring tool records the real software as an expert performs the task, then turns each captured screen into a slide with an invisible 'hotspot' on the right button or field. The learner must click the right spot or type the right value to advance, and can get hints or feedback on wrong clicks. It works for desktop and web software alike. The catch: each slide is still a picture, so when a button moves in the next release, those screens have to be recorded again."
analogy: "A pop-up book: parts move when you pull the right tab, but you can't redraw a page without printing a new book."
primaryFocus: "Real practice for any software, built by instructional designers"
inScope:
  - "Click and type steps on captured screens"
  - "Hints and feedback for wrong clicks"
  - "Desktop and web applications"
outOfScope:
  - "Free exploration off the recorded path"
color: yellow
