- id: least-privilege
  word: "Least Privilege"
  pronunciation: "leest priv-uh-lij"
  category: "Access"
  shortDefinition: "Giving each person only the permissions their current job needs."
  detailedDefinition: "A security principle under which accounts get the smallest set of roles necessary. It is why trainees often can't perform the very actions a manual must teach."
  whyItMatters: "It's the most common reason learners can't practise in the real system."
- id: fidelity
  word: "Fidelity"
  pronunciation: "fi-del-i-tee"
  category: "Design"
  shortDefinition: "How closely a simulation matches the real software."
  detailedDefinition: "The fidelity ladder runs from annotated screenshots to click-through walkthroughs, interactive simulations with fake data and a full sandbox. Higher fidelity gives more realistic practice at higher build and upkeep cost."
  whyItMatters: "Choosing the right rung is the first trade-off of any interactive manual."
- id: selective-fidelity
  word: "Selective Fidelity"
  pronunciation: "si-lek-tiv fi-del-i-tee"
  category: "Design"
  shortDefinition: "Exact on the task path, simplified everywhere else."
  detailedDefinition: "Controls, labels and order on the path the learner practises match the real software exactly; areas off the path can be static or disabled."
  whyItMatters: "It keeps practice realistic where it counts while keeping cost down."
- id: hotspot
  word: "Hotspot"
  pronunciation: "hot-spot"
  category: "Approach"
  shortDefinition: "A clickable area placed over a recorded screen."
  detailedDefinition: "In hotspot simulations, an invisible click target sits on the correct button or field of a captured screen. Clicking it advances the step; clicking elsewhere can trigger feedback."
  whyItMatters: "Hotspots make recorded screens practisable, but the screens under them go stale with every UI change."
- id: dom
  word: "DOM Capture"
  pronunciation: "dom kap-cher"
  category: "Approach"
  shortDefinition: "Saving a web page's HTML structure instead of a picture of it."
  detailedDefinition: "The DOM (Document Object Model) is the structure a browser renders. Capturing it gives a crisp, realistic copy whose text and data can be edited without re-recording."
  whyItMatters: "It's why DOM-capture demos are easier to update than screenshots, but only for web apps."
- id: msw
  word: "Mock Service Worker (MSW)"
  pronunciation: "em es dub-uhl-yoo"
  category: "Tool"
  shortDefinition: "A library that answers an app's network requests with fake data."
  detailedDefinition: "MSW intercepts requests in the browser and returns prepared responses, so a UI clone runs with no real server."
  whyItMatters: "It's the fake backend of a UI clone."
- id: scorm-xapi
  word: "SCORM / xAPI"
  pronunciation: "skorm / eks ay pee eye"
  category: "Tool"
  shortDefinition: "Standard formats that let an LMS host a course and record results."
  detailedDefinition: "Authoring tools such as Storyline, Captivate and iSpring publish SCORM or xAPI packages. The LMS uses them to track completion and scores; xAPI can also record detailed events such as wrong clicks."
  whyItMatters: "It's how you measure who finished training and where they struggled."
- id: synthetic-data
  word: "Synthetic Data"
  pronunciation: "sin-thet-ik day-tuh"
  category: "Data"
  shortDefinition: "Invented records that look real but belong to nobody."
  detailedDefinition: "Fake customers, tickets or orders created with tools such as Faker, Mockaroo or Tonic.ai and shared as fixtures across simulations."
  whyItMatters: "Realistic practice without privacy risk."
- id: drift
  word: "Drift"
  pronunciation: "drift"
  category: "Maintenance"
  shortDefinition: "When the manual no longer matches the real software."
  detailedDefinition: "Every release can move buttons, rename labels or change steps. Unless someone updates the simulation, learners rehearse screens that no longer exist."
  whyItMatters: "It's the central failure mode of interactive manuals: the Drifted Phantom UI."
- id: visual-regression
  word: "Visual Regression Testing"
  pronunciation: "vizh-oo-uhl ri-gresh-uhn"
  category: "Maintenance"
  shortDefinition: "Comparing new screenshots with approved ones to spot changes."
  detailedDefinition: "Services such as Chromatic and Percy capture screens on every build and highlight pixel differences against a baseline."
  whyItMatters: "It tells you which manual screens a release has changed."
- id: as-code
  word: "As Code"
  pronunciation: "az kohd"
  category: "Maintenance"
  shortDefinition: "Keeping the manual as text files in git, reviewed and built by CI."
  detailedDefinition: "UI clones, sandbox definitions and scripted screenshot guides live in git, so changes are pull requests, tests run automatically and everything can be rebuilt."
  whyItMatters: "It makes upkeep reviewable, testable and repeatable."
- id: watch-try-test
  word: "Watch → Try → Test"
  pronunciation: "woch, trahy, test"
  category: "Design"
  shortDefinition: "Demo, guided practice with hints, then unguided assessment."
  detailedDefinition: "The three simulation modes: Watch shows the task, Try lets the learner do it with hints and feedback, and Test checks they can do it alone."
  whyItMatters: "It moves learners from seeing to doing to proving."
