title: "Interactive User Manuals"
subtitle: "Teach people to use IT systems and software in a safe copy, when they can't touch the real thing"
estimatedTime: "45 min"
what:
  definition: "An interactive user manual is a simulation of a software system that lets people practise real tasks (clicking, typing, making mistakes) without using the live system."
  summary: "Trainees often aren't allowed to touch the real software: they lack the role, it holds real people's data, or one wrong click sends real money. This topic covers why we simulate, the five ways to build a simulation and the tools for each, how to keep it matching the real software release after release (including as code and with AI), and the principles that make a simulation actually teach."
  bullets:
    - "Why simulate: least privilege, production data, irreversible actions and licence cost"
    - "Five approaches, from screenshot guides to hotspot simulations, DOM capture, UI clones and training sandboxes, and their tools"
    - "Maintainability: upkeep cost, drift detection, version labels, and what can be done as code or with AI"
    - "Creation principles: task-first, selective fidelity, safe to fail, and Watch → Try → Test"
  tags:
    - documentation
    - training
    - simulation
    - software-adoption
    - maintainability
why:
  summary: "A manual people can practise in beats a manual people read, but only while it still matches the real software."
  impact: "Teams that pick an approach without thinking about upkeep end up with the Drifted Phantom UI: a simulation of screens that no longer exist, which trains people to do the wrong thing with confidence."
