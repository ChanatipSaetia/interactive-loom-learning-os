- id: journey_happy
  label: "Happy Path: Watch → Try → Test"
  description: "The learner watches, practises with hints, then passes the unguided test"
  steps:
    - stepId: step_watch
      name: "Watch"
      description: "Watch mode demonstrates the task once"
    - stepId: step_try
      name: "Try"
      description: "Try mode lets the learner do each step, with hints available"
    - stepId: branch_correct
      name: "Guided practice done"
      description: "Every step was performed correctly with support"
    - stepId: step_test
      name: "Test"
      description: "Test mode removes hints: an unguided assessment"
    - stepId: step_record
      name: "Recorded"
      description: "The score and wrong clicks go to the LMS"

- id: journey_wrong_click
  label: "Wrong Click in Try Mode"
  description: "A wrong action gets immediate, specific feedback instead of silence"
  steps:
    - stepId: step_watch
      name: "Watch"
      description: "The learner watches the demo"
    - stepId: step_try
      name: "Try"
      description: "The learner clicks the wrong control"
    - stepId: branch_wrong
      name: "Feedback"
      description: "The player explains why that was wrong and gives a hint, then the learner tries again"
