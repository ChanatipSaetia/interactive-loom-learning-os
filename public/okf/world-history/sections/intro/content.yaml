estimatedTime: "10 min read"
moduleCount: 11

what:
  definition: "ประวัติศาสตร์โลก (World History) คือการศึกษาเรื่องราว วิวัฒนาการ เหตุการณ์ และความเปลี่ยนแปลงของสังคมมนุษย์ตั้งแต่ยุคก่อนประวัติศาสตร์ การก่อกำเนิดอารยธรรมโบราณ จนถึงยุคปัจจุบัน"
  summary: "คู่มือการเรียนรู้เชิงปฏิสัมพันธ์เกี่ยวกับประวัติศาสตร์โลก ครอบคลุมอารยธรรมสำคัญ จุดเปลี่ยนทางสังคม การปฏิวัติอุตสาหกรรม และบทเรียนที่มีผลต่อโลกปัจจุบัน"
  bullets:
    - "ลำดับเหตุการณ์และยุคสมัยทางประวัติศาสตร์สากล (Prehistory, Ancient, Medieval, Modern, Contemporary)"
    - "อารยธรรมลุ่มแม่น้ำสายหลักของโลกและมรดกทางวัฒนธรรมและกฎหมาย"
    - "พลวัตการปฏิวัติวิทยาศาสตร์และอุตสาหกรรมที่เปลี่ยนโฉมเศรษฐกิจโลก"
    - "การทดลองตัดสินใจเชิงยุทธศาสตร์และสถานการณ์จำลองทางประวัติศาสตร์"
  tags:
    - "World History"
    - "Civilization"
    - "Timeline"
    - "Industrial Revolution"

why:
  summary: "การเรียนรู้ประวัติศาสตร์ไม่ได้เป็นเพียงการท่องจำปี ค.ศ. แต่คือการเข้าใจเหตุและผลที่หล่อหลอมระเบียบโลก การเมือง เศรษฐกิจ และวัฒนธรรมในปัจจุบัน"
  impact: "ช่วยให้ผู้เรียนพัฒนาทักษะการคิดเชิงวิพากษ์ ถอดบทเรียนจากความผิดพลาดในอดีต และมองเห็นแนวโน้มการเปลี่ยนแปลงของอนาคต"

roadmap:
