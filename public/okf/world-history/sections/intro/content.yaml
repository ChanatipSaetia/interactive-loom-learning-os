    type: "text"
    description: "ทำความเข้าใจเกณฑ์การแบ่งยุคสมัยและลักษณะเด่นของแต่ละยุค"
  - sectionId: "concept-map"
    title: "แผนผังมโนทัศน์ประวัติศาสตร์"
    type: "concept-map"
    description: "สำรวจมิติด้านการเมือง เศรษฐกิจ สังคม และนวัตกรรม"
  - sectionId: "flashcards"
    title: "คำศัพท์และมโนทัศน์สำคัญ"
    type: "flashcards"
