- id: q1
  question: "แนวคิดมนุษยนิยม (Humanism) ในยุคฟื้นฟูศิลปวิทยาการ (Renaissance) ให้ความสำคัญกับสิ่งใดมากที่สุด?"
  hint: "เปรียบเทียบกับยุคกลางที่ทุกอย่างขึ้นอยู่กับพระเจ้าและศาสนจักร"
  choices:
    - id: a
      text: "การสวดอ้อนวอนและการละทิ้งความสุขทางโลก"
      correct: false
      explanation: "นั่นเป็นแนวคิดทางศาสนาแบบยุคกลางดั้งเดิม"
    - id: b
      text: "คุณค่า ศักยภาพ การใช้เหตุผล และความสามารถของมนุษย์"
      correct: true
      explanation: "ถูกต้อง มนุษยนิยมเน้นความเชื่อมั่นในสติปัญญา ศักยภาพ และความงดงามของมนุษย์ในการค้นหาความจริง"
    - id: c
      text: "การรวมศูนย์อำนาจสู่กษัตริย์โดยสมบูรณ์"
      correct: false
      explanation: "การรวมศูนย์อำนาจเกิดขึ้นในยุคสมบูรณาญาสิทธิราชย์ ไม่ใช่แก่นของมนุษยนิยม"
    - id: d
      text: "การรื้อฟื้นระบอบศักดินาและระบบขุนนาง"
      correct: false
      explanation: "ยุคเรเนซองส์มุ่งลดบทบาทความงมงายและระบบศักดินา ไม่ใช่การรื้อฟื้น"

- id: q2
  question: "การแลกเปลี่ยนโคลัมเบียน (Columbian Exchange) ในยุคแห่งการสำรวจทางทะเลส่งผลต่อประวัติศาสตร์โลกอย่างไร?"
  hint: "การถ่ายโอนพืช สัตว์ โรคระบาด และประชากรระหว่างโลกเก่า (Old World) และโลกใหม่ (New World)"
  choices:
    - id: a
      text: "การแพร่กระจายของพืชผล (เช่น ข้าวโพด มันฝรั่ง) เชื้อโรค และสัตว์เลี้ยงข้ามมหาสมุทรแอตแลนติก เปลี่ยนโฉมประชากรและโภชนาการโลก"
      correct: true
      explanation: "ถูกต้อง มันฝรั่งและข้าวโพดช่วยเพิ่มประชากรในยุโรปและเอเชีย ขณะที่โรคระบาด (ไข้ทรพิษ) ทำให้ประชากรพื้นเมืองอเมริกาลดลงอย่างมาก"
    - id: b
      text: "การปิดเส้นทางการค้าทางทะเลและหันกลับมาใช้เส้นทางสายไหมทางบกเพียงอย่างเดียว"
      correct: false
      explanation: "การสำรวจทางทะเลทำให้การค้าทางมหาสมุทรกลายเป็นเส้นทางหลักของโลกแทนเส้นทางสายไหม"
    - id: c
      text: "การยกเลิกการค้าทาสและการสถาปนาความเท่าเทียมทางชาติพันธุ์ทั่วโลกทันที"
      correct: false
      explanation: "ในทางกลับกัน ยุคนี้กลับนำไปสู่การค้าทาสข้ามมหาสมุทรแอตแลนติก (Transatlantic Slave Trade)"
    - id: d
      text: "การรวมยุโรปทั้งหมดให้กลายเป็นประเทศเดียวภายใต้สันตะปาปา"
      correct: false
      explanation: "ยุคนี้เกิดการแยกตัวของรัฐชาติ (Nation-States) และการปฏิรูปศาสนา ไม่ใช่การรวมประเทศ"

- id: q3
  question: "การปฏิวัติอุตสาหกรรมในศตวรรษที่ 18 มีจุดเริ่มต้นที่ประเทศใดและเกิดจากการพัฒนาเทคโนโลยีใด?"
  hint: "ประเทศที่เป็นเกาะในยุโรปและเครื่องจักรที่ใช้พลังงานจากน้ำเดือด"
  choices:
    - id: a
      text: "ฝรั่งเศส — กังหันลมพลังงานลม"
      correct: false
      explanation: "ฝรั่งเศสเกิดการปฏิวัติทางการเมืองในปี 1789 แต่ไม่ใช่จุดเริ่มต้นการปฏิวัติอุตสาหกรรม"
    - id: b
      text: "อังกฤษ — เครื่องจักรไอน้ำ (Steam Engine)"
      correct: true
      explanation: "ถูกต้อง อังกฤษมีทรัพยากรถ่านหินและเหล็กอุดมสมบูรณ์ ผสานกับการพัฒนาเครื่องจักรไอน้ำของเจมส์ วัตต์"
    - id: c
      text: "เยอรมนี — เครื่องยนต์สันดาปภายใน"
      correct: false
      explanation: "เยอรมนีมีบทบาทสำคัญในการปฏิวัติอุตสาหกรรมระลอกสองช่วงปลายศตวรรษที่ 19"
    - id: d
      text: "สหรัฐอเมริกา — ไฟฟ้ากระแสสลับ"
      correct: false
      explanation: "สหรัฐฯ มีบทบาทในยุคอุตสาหกรรมระลอกสองเช่นกัน"

- id: q4
  question: "เหตุการณ์วิกฤตการณ์ขีปนาวุธคิวบา (Cuban Missile Crisis, 1962) ในยุคสงครามเย็นมีความสำคัญเชิงประวัติศาสตร์อย่างไร?"
  hint: "ช่วงเวลาที่โลกเข้าใกล้สงครามนิวเคลียร์ล้างโลกมากที่สุด"
  choices:
    - id: a
      text: "เป็นจุดที่สหรัฐฯ และสหภาพโซเวียตเข้าใกล้สงครามนิวเคลียร์ล้างโลกมากที่สุด ก่อนคลี่คลายด้วยการเจรจาทางการทูต"
      correct: true
      explanation: "ถูกต้อง การเผชิญหน้าระหว่างเคนเนดีและครุชชอฟในประเด็นการติดตั้งขีปนาวุธในคิวบาเกือบนำไปสู่สงครามนิวเคลียร์ แต่จบลงด้วยการถอนขีปนาวุธและการตั้งสายด่วนฮอตไลน์"
    - id: b
      text: "จุดเริ่มต้นของการรวมชาติเยอรมนีและการทำลายกำแพงเบอร์ลิน"
      correct: false
      explanation: "กำแพงเบอร์ลินล่มสลายในปี ค.ศ. 1989 ซึ่งเป็นช่วงปลายของสงครามเย็น"
    - id: c
      text: "การลงนามสนธิสัญญาก่อตั้งองค์การสหประชาชาติ (UN)"
      correct: false
      explanation: "สหประชาชาติก่อตั้งขึ้นในปี ค.ศ. 1945 หลังสงครามโลกครั้งที่ 2 ยุติ"
    - id: d
      text: "การรบทางบกโดยตรงระหว่างกองทัพสหรัฐฯ และกองทัพโซเวียตในทวีปยุโรป"
      correct: false
      explanation: "ทั้งสองฝ่ายไม่เคยทำสงครามรบกันโดยตรง (Direct Military Clash) แต่ใช้การแข่งขันผ่านสงครามตัวแทนและการป้องปราม"

- id: q5
  question: "เหตุใดการประชุมเบอร์ลิน (Berlin Conference, 1884–1885) จึงถือเป็นจุดเปลี่ยนสำคัญในยุคจักรวรรดินิยม?"
  hint: "คิดถึงการแบ่งเค้กดินแดนในทวีปแอฟริกาของชาติมหาอำนาจยุโรป"
  choices:
    - id: a
      text: "เป็นการกำหนดกติกาในการแบ่งดินแดนทวีปแอฟริกา (Scramble for Africa) โดยไม่คำนึงถึงขอบเขตวัฒนธรรมของชนพื้นเมือง"
      correct: true
      explanation: "ถูกต้อง ชาติมหาอำนาจยุโรปตกลงแบ่งดินแดนแอฟริกาเพื่อแสวงหาวัตถุดิบและตลาดการค้า ส่งผลกระทบต่อภูมิรัฐศาสตร์แอฟริกาจนถึงปัจจุบัน"
    - id: b
      text: "เป็นการยุติการล่าอาณานิคมทั้งหมดในทวีปเอเชีย"
      correct: false
      explanation: "การล่าอาณานิคมในเอเชียยังคงดำเนินต่อไปอย่างเข้มข้นในยุคนั้น"
    - id: c
      text: "การสถาปนาสหภาพยุโรปเพื่อรวมกลุ่มเศรษฐกิจ"
      correct: false
      explanation: "สหภาพยุโรปเกิดขึ้นในยุคหลังสงครามโลกครั้งที่สอง"
    - id: d
      text: "การประกาศสงครามโลกครั้งที่หนึ่งระหว่างกลุ่มพันธมิตร"
      correct: false
      explanation: "สงครามโลกครั้งที่หนึ่งเริ่มต้นในปี ค.ศ. 1914"

- id: q6
  question: "เหตุการณ์การล่มสลายของกำแพงเบอร์ลินในปี ค.ศ. 1989 สะท้อนถึงจุดเปลี่ยนใดของประวัติศาสตร์โลก?"
  hint: "สัญลักษณ์แห่งการสิ้นสุดความแตกแยกในยุโรปและการปิดฉากสงครามเย็น"
  choices:
    - id: a
      text: "การสิ้นสุดของสงครามเย็น การเสื่อมสลายของระบอบคอมมิวนิสต์ในยุโรปตะวันออก และการรวมชาติเยอรมนี"
      correct: true
      explanation: "ถูกต้อง การพังทลายของกำแพงเบอร์ลินเป็นสัญลักษณ์สำคัญที่สุดของการสิ้นสุดการแบ่งขั้วอำนาจสงครามเย็นและการรวมเยอรมนีตะวันออกกับตะวันตก"
    - id: b
      text: "การเริ่มต้นของสงครามโลกครั้งที่สอง"
      correct: false
      explanation: "สงครามโลกครั้งที่สองเกิดขึ้นระหว่างปี ค.ศ. 1939–1945"
    - id: c
      text: "การปฏิวัติการปกครองของฝรั่งเศสสู่ระบอบสาธารณรัฐ"
      correct: false
      explanation: "การปฏิวัติฝรั่งเศสเกิดขึ้นในปี ค.ศ. 1789"
    - id: d
      text: "การลงนามในสนธิสัญญาไม่แพร่ขยายอาวุธนิวเคลียร์ฉบับแรก"
      correct: false
      explanation: "สนธิสัญญา NPT มีขึ้นตั้งแต่ปี ค.ศ. 1968"
