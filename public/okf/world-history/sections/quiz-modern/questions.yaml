- id: q1
  question: "แนวคิดมนุษยนิยม (Humanism) ในยุคฟื้นฟูศิลปวิทยาการ (Renaissance) ให้ความสำคัญกับสิ่งใดมากที่สุด?"
  hint: "เปรียบเทียบกับยุคกลางที่ทุกอย่างขึ้นอยู่กับพระเจ้าและศาสนจักร"
  choices:
    - id: a
      text: "การสวดอ้อนวอนและการละทิ้งความสุขทางโลก"
      correct: false
      explanation: "นั่นเป็นแนวคิดทางศาสนาแบบยุคกลางดั้งเดิม"
    - id: b
      text: "คุณค่า ศักยภาพ การใช้เหตุผล และความสามารถของมนุษย์"
      correct: true
      explanation: "ถูกต้อง มนุษยนิยมเน้นความเชื่อมั่นในสติปัญญา ศักยภาพ และความงดงามของมนุษย์ในการค้นหาความจริง"
    - id: c
      text: "การรวมศูนย์อำนาจสู่กษัตริย์โดยสมบูรณ์"
      correct: false
      explanation: "การรวมศูนย์อำนาจเกิดขึ้นในยุคสมบูรณาญาสิทธิราชย์ ไม่ใช่แก่นของมนุษยนิยม"
    - id: d
      text: "การรื้อฟื้นระบอบศักดินาและระบบขุนนาง"
      correct: false
      explanation: "ยุคเรเนซองส์มุ่งลดบทบาทความงมงายและระบบศักดินา ไม่ใช่การรื้อฟื้น"

- id: q2
  question: "การแลกเปลี่ยนโคลัมเบียน (Columbian Exchange) ในยุคแห่งการสำรวจทางทะเลส่งผลต่อประวัติศาสตร์โลกอย่างไร?"
  hint: "การถ่ายโอนพืช สัตว์ โรคระบาด และประชากรระหว่างโลกเก่าและโลกใหม่"
  choices:
    - id: a
      text: "การแพร่กระจายของพืชผล (เช่น ข้าวโพด มันฝรั่ง) เชื้อโรค และสัตว์เลี้ยงข้ามมหาสมุทรแอตแลนติก เปลี่ยนโฉมประชากรและโภชนาการโลก"
      correct: true
      explanation: "ถูกต้อง มันฝรั่งและข้าวโพดช่วยเพิ่มประชากรในยุโรปและเอเชีย ขณะที่โรคระบาดส่งผลกระทบต่อประชากรพื้นเมืองในอเมริกา"
    - id: b
      text: "การปิดเส้นทางการค้าทางทะเลและหันกลับมาใช้เส้นทางสายไหมทางบกเพียงอย่างเดียว"
      correct: false
      explanation: "การสำรวจทางทะเลทำให้การค้าทางมหาสมุทรกลายเป็นเส้นทางหลักของโลก"
    - id: c
      text: "การยกเลิกการค้าทาสทันที"
      correct: false
      explanation: "ในทางกลับกัน ยุคนี้กลับนำไปสู่การค้าทาสข้ามมหาสมุทรแอตแลนติก"
    - id: d
      text: "การรวมยุโรปทั้งหมดให้กลายเป็นประเทศเดียว"
      correct: false
      explanation: "ยุคนี้เกิดการแยกตัวของรัฐชาติ ไม่ใช่การรวมประเทศ"

- id: q3
  question: "การปฏิวัติอุตสาหกรรมในศตวรรษที่ 18 มีจุดเริ่มต้นที่ประเทศใดและเกิดจากการพัฒนาเทคโนโลยีใด?"
  hint: "ประเทศที่เป็นเกาะในยุโรปและเครื่องจักรที่ใช้พลังงานจากไอน้ำ"
  choices:
    - id: a
      text: "ฝรั่งเศส — กังหันลมพลังงานลม"
      correct: false
      explanation: "ฝรั่งเศสเกิดการปฏิวัติทางการเมืองในปี 1789 แต่ไม่ใช่จุดเริ่มต้นการปฏิวัติอุตสาหกรรม"
    - id: b
      text: "อังกฤษ — เครื่องจักรไอน้ำ (Steam Engine)"
      correct: true
      explanation: "ถูกต้อง อังกฤษมีทรัพยากรถ่านหินและเหล็กอุดมสมบูรณ์ ผสานกับการพัฒนาเครื่องจักรไอน้ำของเจมส์ วัตต์"
    - id: c
      text: "เยอรมนี — เครื่องยนต์สันดาปภายใน"
      correct: false
      explanation: "เยอรมนีมีบทบาทสำคัญในยุคอุตสาหกรรมระลอกสองปลายศตวรรษที่ 19"
    - id: d
      text: "สหรัฐอเมริกา — ไฟฟ้ากระแสสลับ"
      correct: false
      explanation: "สหรัฐฯ มีบทบาทในยุคอุตสาหกรรมระลอกสองเช่นกัน"

- id: q4
  question: "หนังสือ Principia (1687) ของเซอร์ไอแซก นิวตัน มีความสำคัญต่อการปฏิวัติวิทยาศาสตร์อย่างไร?"
  hint: "คิดถึงกฎแรงโน้มถ่วงสากลและกลศาสตร์"
  choices:
    - id: a
      text: "วางรากฐานของฟิสิกส์คลาสสิก กฎการเคลื่อนที่ และกฎแรงโน้มถ่วงสากลที่อธิบายจักรวาลด้วยคณิตศาสตร์"
      correct: true
      explanation: "ถูกต้อง นิวตันได้พิสูจน์ว่าปรากฏการณ์บนโลกและบนท้องฟ้าอยู่ภายใต้กฎฟิสิกส์เดียวกัน"
    - id: b
      text: "การสนับสนุนแนวคิดที่ว่าโลกแบนและเป็นศูนย์กลางของจักรวาล"
      correct: false
      explanation: "นิวตันสนับสนุนระบบสุริยะศูนย์กลางและฟิสิกส์เชิงคณิตศาสตร์"
    - id: c
      text: "การเขียนตำราเวทมนตร์และการเล่นแร่แปรธาตุเป็นทางการ"
      correct: false
      explanation: "Principia เป็นตำราคณิตศาสตร์และฟิสิกส์ที่เข้มงวด"
    - id: d
      text: "การก่อตั้งองค์การสหประชาชาติ"
      correct: false
      explanation: "สหประชาชาติก่อตั้งในปี ค.ศ. 1945"

- id: q5
  question: "คำประกาศว่าด้วยสิทธิมนุษยชนและพลเมือง (Declaration of the Rights of Man, 1789) ในการปฏิวัติฝรั่งเศส สถาปนาหลักการใด?"
  hint: "คำขวัญสำคัญของการปฏิวัติฝรั่งเศส"
  choices:
    - id: a
      text: "เสรีภาพ เสมอภาค และภราดรภาพ (Liberty, Equality, Fraternity) และความเท่าเทียมตามธรรมชาติของมนุษย์"
      correct: true
      explanation: "ถูกต้อง คำประกาศนี้เป็นเอกสารสิทธิมนุษยชนชิ้นประวัติศาสตร์ที่ลบล้างอภิสิทธิ์ชนชั้นขุนนางในฝรั่งเศส"
    - id: b
      text: "การมอบสิทธิขาดให้แก่สถาบันกษัตริย์ในการเก็บภาษีโดยไม่ต้องผ่านสภา"
      correct: false
      explanation: "คำประกาศมุ่งจำกัดอำนาจกษัตริย์และมอบอำนาจอธิปไตยแก่ปวงชน"
    - id: c
      text: "การห้ามราษฎรทุกคนเข้าถึงการศึกษา"
      correct: false
      explanation: "การปฏิวัติส่งเสริมสิทธิและความเท่าเทียมของพลเมือง"
    - id: d
      text: "การบังคับให้ทุกประเทศนับถือศาสนาคาทอลิกเท่านั้น"
      correct: false
      explanation: "การปฏิวัติให้เสรีภาพในการนับถือศาสนาและความคิด"

- id: q6
  question: "เหตุใดการประชุมเบอร์ลิน (Berlin Conference, 1884–1885) จึงถือเป็นจุดเปลี่ยนสำคัญในยุคจักรวรรดินิยม?"
  hint: "คิดถึงการแบ่งเค้กดินแดนในทวีปแอฟริกาของชาติมหาอำนาจยุโรป"
  choices:
    - id: a
      text: "เป็นการกำหนดกติกาในการแบ่งดินแดนทวีปแอฟริกา (Scramble for Africa) เพื่อแสวงหาวัตถุดิบและตลาดอุตสาหกรรม"
      correct: true
      explanation: "ถูกต้อง ชาติมหาอำนาจยุโรปตกลงแบ่งดินแดนแอฟริกาโดยไม่คำนึงถึงขอบเขตวัฒนธรรมของชนพื้นเมือง ส่งผลกระทบต่อภูมิรัฐศาสตร์จนถึงปัจจุบัน"
    - id: b
      text: "เป็นการยุติการล่าอาณานิคมทั้งหมดในทวีปเอเชีย"
      correct: false
      explanation: "การล่าอาณานิคมในเอเชียยังคงดำเนินต่อไปอย่างเข้มข้นในยุคนั้น"
    - id: c
      text: "การสถาปนาสหภาพยุโรปเพื่อรวมกลุ่มเศรษฐกิจ"
      correct: false
      explanation: "สหภาพยุโรปเกิดขึ้นในยุคหลังสงครามโลกครั้งที่สอง"
    - id: d
      text: "การประกาศสงครามโลกครั้งที่หนึ่งระหว่างกลุ่มพันธมิตร"
      correct: false
      explanation: "สงครามโลกครั้งที่หนึ่งเริ่มต้นในปี ค.ศ. 1914"
