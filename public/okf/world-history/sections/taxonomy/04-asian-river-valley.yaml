type: taxonomy-category
icon: Compass
title: "อารยธรรมลุ่มน้ำสินธุและฮวงโห"
subtitle: "สองเสาหลักอารยธรรมเอเชียโบราณ"
color: mauve
description: "สินธุ (โมเฮนโจ-ดาโร) โดดเด่นด้านการวางผังเมืองและระบบระบายน้ำ ส่วนฮวงโห (จีน) สร้างระบบอักษรจีน ปรัชญาขงจื๊อ และระบบราชการสอบจอหงวน"
details: "จีนประดิษฐ์ 4 สุดยอดนวัตกรรมโบราณ ได้แก่ กระดาษ ดินปืน เข็มทิศ และการพิมพ์แท่น ส่วนอินเดียให้กำเนิดแนวคิดทางปรัชญาและศาสนาสำคัญของโลก"
analogy: "เปรียบเหมือนรากเหง้าภูมิปัญญาตะวันออกที่ให้ความสำคัญกับดุลยภาพ สังคม และจริยธรรม"
primaryFocus: "ผังเมืองขั้นสูง, 4 นวัตกรรมสิ่งประดิษฐ์จีน, ปรัชญาและระบบจริยธรรม"
inScope:
  - "การวางผังเมืองโมเฮนโจ-ดาโรและฮารัปปา"
  - "ปรัชญาขงจื๊อและเต๋า"
  - "4 สุดยอดนวัตกรรมจีน (กระดาษ ดินปืน เข็มทิศ การพิมพ์)"
outOfScope:
  - "ระบบนครรัฐอิสระแบบโพลิสของกรีก"
