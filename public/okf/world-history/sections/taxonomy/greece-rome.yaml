title: "อารยธรรมกรีกและโรมัน"
subtitle: "รากฐานอารยธรรมตะวันตกคลาสสิก"
color: sky
description: "กรีกมอบประชาธิปไตย ปรัชญา และโอลิมปิก ส่วนโรมันขยายจักรวรรดิด้วยระบบกฎหมาย วิศวกรรมถนน และท่อส่งน้ำ (Aqueducts)"
details: "นักคิดกรีกเช่น โสกราตีส เพลโต อริสโตเติล วางรากฐานตรรกศาสตร์ ส่วนโรมันวางรากฐานระบบกฎหมายสิบสองโต๊ะและสาธารณรัฐ"
analogy: "เปรียบเสมือนพิมพ์เขียวของระบบกฎหมาย รัฐศาสตร์ และสถาปัตยกรรมของโลกตะวันตกยุคปัจจุบัน"
primaryFocus: "ประชาธิปไตย, ปรัชญา, ระบบกฎหมาย, วิศวกรรมโครงสร้างพื้นฐาน"
inScope:
  - "ประชาธิปไตยเอเธนส์และสาธารณรัฐโรมัน"
  - "กฎหมายสิบสองโต๊ะ (Twelve Tables)"
  - "วิศวกรรมถนน ท่อส่งน้ำ และโคลอสเซียม"
outOfScope:
  - "การปกครองแบบสมบูรณาญาสิทธิราชย์รวมศูนย์แบบเอเชีย"
