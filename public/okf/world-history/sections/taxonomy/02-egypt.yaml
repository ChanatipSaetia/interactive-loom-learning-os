type: taxonomy-category
icon: Pyramid
title: "อารยธรรมอียิปต์โบราณ"
subtitle: "ของขวัญแห่งแม่น้ำไนล์ (Gift of the Nile)"
color: yellow
description: "อารยธรรมที่รุ่งเรืองริมแม่น้ำไนล์ โดดเด่นด้วยสถาปัตยกรรมพีระมิด ความเชื่อเรื่องชีวิตหลังความตาย และระบบกษัตริย์ฟาโรห์ที่เป็นสมมติเทพ"
details: "คิดค้นอักษรไฮโรกลิฟิกบนกระดาษปาปิรุส มีความก้าวหน้าทางการแพทย์ การทำมัมมี่ ดาราศาสตร์ และการคำนวณปฏิทินสุริยคติ 365 วัน"
analogy: "เปรียบเหมือนอนุสรณ์สถานแห่งความศรัทธาและความเป็นอมตะที่ผสานวิทยาการเรขาคณิต"
primaryFocus: "การปกครองแบบเทวสิทธิ์, สถาปัตยกรรมหิน, การแพทย์และความเชื่อหลังความตาย"
inScope:
  - "พีระมิดและมัมมี่"
  - "อักษรไฮโรกลิฟิก (Hieroglyphs)"
  - "ระบบฟาโรห์และการเกษตรลุ่มน้ำไนล์"
outOfScope:
  - "ระบบปรัชญาวิพากษ์แบบกรีก"
