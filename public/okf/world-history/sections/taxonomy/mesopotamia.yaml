type: taxonomy-category
icon: Landmark
title: "อารยธรรมเมโสโปเตเมีย"
subtitle: "ดินแดนระหว่างแม่น้ำไทกริสและยูเฟรทีส"
color: peach
description: "แหล่งกำเนิดอารยธรรมที่เก่าแก่ที่สุดในโลก (ดินแดนพระจันทร์เสี้ยวอันอุดมสมบูรณ์) สร้างสรรค์อักษรรูปลิ่ม ซิกกูแรต และประมวลกฎหมายฮัมมูราบี"
details: "ประกอบด้วยชนชาติต่างๆ เช่น สุเมเรียน บาบิโลน อัสซีเรีย มีผลงานสำคัญคือการแบ่งเวลา 60 นาที/วินาที และการชลประทาน"
analogy: "เปรียบเสมือนห้องทดลองแรกเริ่มของมนุษยชาติในการสร้างระบบเมือง กฎหมาย และการเขียน"
primaryFocus: "การชลประทาน, การประดิษฐ์ตัวอักษร, ประมวลกฎหมายลายลักษณ์อักษร"
inScope:
  - "อักษรรูปลิ่ม (Cuneiform)"
  - "ประมวลกฎหมายฮัมมูราบี (ตาต่อตา ฟันต่อฟัน)"
  - "ซิกกูแรต (Ziggurat)"
outOfScope:
  - "ระบบประชาธิปไตยโดยตรง"
