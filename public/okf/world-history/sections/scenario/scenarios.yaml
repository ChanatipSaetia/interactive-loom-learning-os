id: industrial_era_crisis
title: "วิกฤตการณ์เปลี่ยนผ่านสู่ยุคอุตสาหกรรม"
intro: "คุณเป็นผู้นำประเทศในยุคศตวรรษที่ 19 โรงงานอุตสาหกรรมกำลังขยายตัวอย่างรวดเร็ว แต่เกิดความตึงเครียดเรื่องสภาพความเป็นอยู่ของคนงาน มลพิษ และสินค้าล้นตลาด คุณจะเลือกตัดสินใจอย่างไร?"
nodes:
  start:
    prompt: "ปัญหาแรกที่ต้องเผชิญ: สหภาพแรงงานชุมนุมประท้วงสภาพการทำงาน 14 ชั่วโมงต่อวันและค่าจ้างต่ำ คุณจะรับมืออย่างไร?"
    choices:
      - id: pass_reforms
        text: "เปิดการเจรจาและตรากฎหมายคุ้มครองแรงงาน (จำกัดเวลาทำงาน 10 ชม. จัดระบบสุขอนามัย)"
        next: node_reform_path
      - id: suppress_protest
        text: "ใช้กำลังทหารเข้าสลายการชุมนุมเพื่อปกป้องผลประโยชน์ของนายทุนและรักษาระเบียบโรงงาน"
        next: node_suppress_path
  node_reform_path:
    prompt: "การปฏิรูปทำให้แรงงานสงบลง แต่นายทุนเริ่มกังวลเรื่องต้นทุนการผลิตที่สูงขึ้น คุณจะส่งเสริมเศรษฐกิจอย่างไรต่อไป?"
    choices:
      - id: invest_innovation
        text: "สนับสนุนเงินกู้และการศึกษาวิจัยเพื่อพัฒนาเครื่องจักรและระบบรถไฟขนส่ง"
        next: outcome_sustainable_leader
      - id: impose_tariffs
        text: "ตั้งกำแพงภาษีนำเข้าสูงเพื่อกีดกันสินค้าต่างชาติและปกป้องโรงงานในประเทศ"
        next: outcome_tariff_protection
  node_suppress_path:
    prompt: "การสลายการชุมนุมทำให้เกิดความโกรธแค้นใต้ดินและเสี่ยงต่อการปฏิวัติล้มล้าง คุณจะแก้สถานการณ์อย่างไร?"
    choices:
      - id: concession_late
        text: "ยอมประนีประนอมในภายหลังและมอบสวัสดิการบางส่วนเพื่อคลายความตึงเครียด"
        next: outcome_delayed_peace
      - id: authoritarian_rule
        text: "เพิ่มมาตรการควบคุมเข้มงวดและปิดกั้นสื่อหนังสือพิมพ์ทั้งหมด"
        next: outcome_revolution_disaster
  outcome_sustainable_leader:
    outcome:
      verdict: "คุณนำพาประเทศสู่มหาอำนาจทางอุตสาหกรรมได้อย่างยั่งยืน!"
      lesson: "การปฏิรูปแรงงานควบคู่กับการลงทุนในนวัตกรรมช่วยสร้างเสถียรภาพทางสังคมและกระตุ้นการเติบโตทางเศรษฐกิจในระยะยาวได้อย่างแท้จริง"
      rating: a
  outcome_tariff_protection:
    outcome:
      verdict: "เศรษฐกิจในประเทศเติบโต แต่เกิดสงครามการค้ากับประเทศเพื่อนบ้าน"
      lesson: "การตั้งกำแพงภาษีช่วยปกป้องอุตสาหกรรมภายในระยะสั้น แต่ลดทอนประสิทธิภาพการแข่งขันในระดับสากล"
      rating: b-plus
  outcome_delayed_peace:
    outcome:
      verdict: "รอดพ้นจากการลุกฮือมาได้ แต่สูญเสียความเชื่อมั่นทางการเมืองไปมาก"
      lesson: "การปฏิรูปที่ล่าช้าหลังเกิดความรุนแรงทำให้ต้องเสียต้นทุนทางสังคมสูงกว่าการแก้ปัญหาตั้งแต่แรกเริ่ม"
      rating: b-minus
  outcome_revolution_disaster:
    outcome:
      verdict: "เกิดการลุกฮือปฏิวัติทั่วประเทศ ระบบเศรษฐกิจและการปกครองพังทลาย"
      lesson: "การกดขี่โดยไร้การประนีประนอมในยุคแห่งการตื่นรู้ของประชาชนนำไปสู่จุดจบอันหายนะของระบอบการปกครอง"
      rating: c
