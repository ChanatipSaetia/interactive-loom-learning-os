id: history_study_advisor
title: "เครื่องมือแนะนำแนวทางศึกษาประวัติศาสตร์ (History Study Advisor)"
root: interest_domain
nodes:
  interest_domain:
    prompt: "คุณสนใจศึกษาประวัติศาสตร์ในมิติใดมากที่สุด?"
    choices:
      - id: politics_war
        text: "การเมือง จักรวรรดิ และความขัดแย้ง/สงคราม"
        next: era_politics
        rationale: "เหมาะสำหรับผู้ที่สนใจกลยุทธ์ ภูมิรัฐศาสตร์ และการเปลี่ยนแปลงอำนาจ"
      - id: ideas_culture
        text: "ความคิด ปรัชญา ศิลปะ และวิทยาการ"
        next: era_culture
        recommended: true
        rationale: "เหมาะสำหรับผู้ที่ต้องการเข้าใจวิวัฒนาการทางสติปัญญาและจิตวิญญาณมนุษย์"
      - id: economy_tech
        text: "เศรษฐกิจ เทคโนโลยี และการปฏิวัติอุตสาหกรรม"
        next: era_economy
        rationale: "เหมาะสำหรับผู้ที่สนใจกลไกการผลิต วิถีชีวิต และความมั่งคั่งของโลก"
  era_politics:
    prompt: "คุณต้องการเน้นช่วงเวลาใด?"
    choices:
      - id: ancient_classical
        text: "ยุคโบราณและคลาสสิก (กรีก โรมัน สามก๊ก)"
        next: leaf_ancient_strategy
        recommended: true
        rationale: "รากฐานของยุทธศาสตร์การรบและการกำเนิดจักรวรรดิ"
      - id: modern_contemporary
        text: "ยุคใหม่และสงครามโลก / สงครามเย็น"
        next: leaf_modern_diplomacy
        rationale: "บทเรียนโดยตรงต่อภูมิรัฐศาสตร์โลกปัจจุบัน"
  era_culture:
    prompt: "คุณสนใจพัฒนาการทางความคิดแบบใด?"
    choices:
      - id: classical_philosophy
        text: "ปรัชญากรีก-โรมันและศาสนาโบราณ"
        next: leaf_classical_thought
        rationale: "จุดเริ่มต้นของตรรกศาสตร์ จริยศาสตร์ และคุณค่าชีวิต"
      - id: renaissance_enlightenment
        text: "ยุคเรเนซองส์และยุคภูมิธรรม (Enlightenment)"
        next: leaf_enlightenment
        recommended: true
        rationale: "การกำเนิดสิทธิ เสรีภาพ ประชาธิปไตย และวิทยาศาสตร์สมัยใหม่"
  era_economy:
    prompt: "คุณสนใจกลไกเศรษฐกิจในมิติใด?"
    choices:
      - id: trade_silkroad
        text: "การค้าข้ามทวีปโบราณและเส้นทางสายไหม"
        next: leaf_silkroad_trade
        rationale: "การแลกเปลี่ยนสินค้าและวัฒนธรรมข้ามทวีปยุคแรกเริ่ม"
      - id: industrial_globalization
        text: "การปฏิวัติอุตสาหกรรมและทุนนิยมโลกาภิวัตน์"
        next: leaf_industrial_modern
        recommended: true
        rationale: "เข้าใจระบบเศรษฐกิจโรงงาน การเงิน และห่วงโซ่อุปทานโลกปัจจุบัน"
  leaf_ancient_strategy:
    leaf:
      recommendation: "ศึกษาประวัติศาสตร์การทหารและจักรวรรดิโบราณ (Classical Empire Strategy)"
      explanation: "เริ่มจากประวัติศาสตร์จักรวรรดิโรมัน สงครามเปอร์เซีย และสามก๊ก เพื่อทำความเข้าใจการบริหารดินแดนกว้างใหญ่และยุทธศาสตร์การปกครอง"
      tradeoffs:
        - "ได้หลักคิดเชิงยุทธศาสตร์ที่ทรงคุณค่าเหนือกาลเวลา"
        - "บริบทสังคมแตกต่างจากโลกปัจจุบันมาก ต้องระวังการนำมาเทียบเคียงตรงๆ"
  leaf_modern_diplomacy:
    leaf:
      recommendation: "ศึกษาประวัติศาสตร์สงครามโลก สงครามเย็น และภูมิรัฐศาสตร์ร่วมสมัย"
      explanation: "เน้นวิกฤตการณ์ทางการทูต สนธิสัญญาแวร์ซาย สนธิสัญญาเบรตตันวูดส์ และการแข่งขันในสงครามเย็น ซึ่งเป็นโครงสร้างของโลกปัจจุบัน"
      tradeoffs:
        - "เชื่อมโยงกับข่าวสารและการเมืองโลกปัจจุบันได้ทันที"
        - "มีข้อมูลและหลักฐานซับซ้อนหลากหลายมุมมองที่ต้องวิเคราะห์อย่างรอบคอบ"
  leaf_classical_thought:
    leaf:
      recommendation: "ศึกษาประวัติศาสตร์ปรัชญาและอารยธรรมคลาสสิก (Classical Thought & Ethics)"
      explanation: "อ่านงานของโสกราตีส เพลโต ขงจื๊อ และเต๋า เพื่อเข้าใจฐานคิดเรื่องความยุติธรรม คุณธรรม และการจัดระเบียบสังคม"
      tradeoffs:
        - "ช่วยบ่มเพาะความคิดเชิงปรัชญาและการให้เหตุผลอย่างลึกซึ้ง"
        - "ต้องใช้เวลาทำความเข้าใจแนวคิดเชิงนามธรรม"
  leaf_enlightenment:
    leaf:
      recommendation: "ศึกษายุคฟื้นฟูศิลปวิทยาการและยุคภูมิธรรม (Renaissance & Enlightenment)"
      explanation: "สำรวจแนวคิดของวอลแตร์ จอห์น ล็อก รุสโซ และนิวตัน ซึ่งเป็นจุดกำเนิดของรัฐธรรมนูญ สิทธิมนุษยชน และวิธีคิดแบบวิทยาศาสตร์"
      tradeoffs:
        - "เป็นรากฐานของระบอบเสรีนิยมประชาธิปไตยและนวัตกรรมตะวันตก"
        - "สะท้อนมุมมองที่เน้นยุโรปเป็นศูนย์กลาง (Eurocentric) ควรศึกษาควบคู่กับมุมมองโลกอื่น"
  leaf_silkroad_trade:
    leaf:
      recommendation: "ศึกษาประวัติศาสตร์เส้นทางการค้าโลกโบราณ (Ancient Trade Networks)"
      explanation: "ติดตามเส้นทางสายไหม เส้นทางเครื่องเทศ และการเดินทางของมาร์โค โปโลและเจิ้งเหอ เพื่อเห็นพลังของการค้าในการเชื่อมโยงมนุษยชาติ"
      tradeoffs:
        - "มองเห็นการผสมผสานทางวัฒนธรรมและศาสนาอย่างเห็นภาพชัดเจน"
        - "ข้อมูลสถิติทางเศรษฐกิจในยุคโบราณมีบันทึกน้อยกว่ายุคใหม่"
  leaf_industrial_modern:
    leaf:
      recommendation: "ศึกษาประวัติศาสตร์การปฏิวัติอุตสาหกรรมและเศรษฐกิจโลก (Industrial & Economic History)"
      explanation: "วิเคราะห์การกำเนิดเครื่องจักรไอน้ำ รถไฟ ระบบธนาคาร ตลาดทุน และการขยายตัวของเมืองใหญ่ เพื่อเข้าใจวิวัฒนาการสู่เศรษฐกิจดิจิทัล"
      tradeoffs:
        - "ประยุกต์ใช้ทำความเข้าใจการปฏิวัติอุตสาหกรรมระลอก 4 (AI/Automation) ในปัจจุบันได้ดีเยี่ยม"
        - "ต้องเข้าใจสถิติและตัวแปรทางเศรษฐศาสตร์เบื้องต้น"
