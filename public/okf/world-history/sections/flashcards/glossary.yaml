- id: cuneiform
  word: "Cuneiform (อักษรรูปลิ่ม)"
  pronunciation: "kyoo-nee-uh-fawrm"
  category: civilization
  shortDefinition: "ระบบการเขียนยุคแรกสุดของโลก ประดิษฐ์โดยชาวสุเมเรียนในเมโสโปเตเมีย"
  detailedDefinition: "อักษรรูปลิ่มเขียนโดยใช้ก้านอ้อกดลงบนแผ่นดินเหนียวเปียกแล้วนำไปตากแห้งหรือเผาไฟ เป็นจุดเริ่มต้นของการบันทึกประวัติศาสตร์ กฎหมาย และการค้า"
  whyItMatters: "ถือเป็นจุดแบ่งแยกระหว่างยุคก่อนประวัติศาสตร์และยุคประวัติศาสตร์ของมนุษยชาติอย่างเป็นทางการ"

- id: feudalism
  word: "Feudalism (ระบบฟิวดัล / ศักดินาสวามิภักดิ์)"
  pronunciation: "fyoo-dl-iz-uhm"
  category: society
  shortDefinition: "โครงสร้างความสัมพันธ์ทางสังคม การเมือง และการถือครองที่ดินในยุโรปยุคกลาง"
  detailedDefinition: "เป็นระบบลำดับขั้นที่กษัตริย์พระราชทานที่ดินแก่ขุนนาง (Lords) แลกกับความจงรักภักดีและกำลังทหาร โดยมีอัศวิน (Knights) ให้ความคุ้มครอง และชาวนาทาสติดที่ดิน (Serfs) เป็นผู้เพาะปลูก"
  whyItMatters: "กำหนดระเบียบสังคม เศรษฐกิจ และความมั่นคงของยุโรปเป็นเวลานานเกือบพันปีก่อนเกิดรัฐชาติสมัยใหม่"

- id: renaissance
  word: "Renaissance (ยุคฟื้นฟูศิลปวิทยาการ)"
  pronunciation: "ren-uh-sahns"
  category: culture
  shortDefinition: "ขบวนการฟื้นฟูศิลปะ วรรณกรรม และวิทยาการคลาสสิกของกรีก-โรมัน เกิดขึ้นในอิตาลีช่วงศตวรรษที่ 14-17"
  detailedDefinition: "เน้นแนวคิดมนุษยนิยม (Humanism) ที่เชื่อมั่นในคุณค่า ศักยภาพ และเหตุผลของมนุษย์ ก่อให้เกิดผลงานศิลปะชิ้นเอกและการตั้งคำถามต่อความเชื่องมงาย"
  whyItMatters: "เป็นสะพานเชื่อมระหว่างยุคกลางอันมืดมนสู่ยุคใหม่ และเป็นรากฐานของการปฏิวัติวิทยาศาสตร์"

- id: industrial-rev
  word: "Industrial Revolution (การปฏิวัติอุตสาหกรรม)"
  pronunciation: "in-duhs-tree-uhl rev-uh-loo-shuhn"
  category: economy
  shortDefinition: "การเปลี่ยนผ่านจากกระบวนการผลิตด้วยมือและแรงงานสัตว์สู่การใช้เครื่องจักรและระบบโรงงาน"
  detailedDefinition: "เริ่มต้นในอังกฤษช่วงศตวรรษที่ 18 ด้วยการประดิษฐ์เครื่องจักรไอน้ำของเจมส์ วัตต์ ขยายสู่การคมนาคมรถไฟ และการเติบโตอย่างรวดเร็วของสังคมเมือง (Urbanization)"
  whyItMatters: "เพิ่มกำลังการผลิตอย่างมหาศาล สร้างระบบทุนนิยมสมัยใหม่ และก่อให้เกิดการเปลี่ยนแปลงโครงสร้างชนชั้นแรงงาน"

- id: cold-war
  word: "Cold War (สงครามเย็น)"
  pronunciation: "kohld wawr"
  category: politics
  shortDefinition: "ความขัดแย้งและการแข่งขันทางอุดมการณ์ระหว่างค่ายเสรีประชาธิปไตย (นำโดยสหรัฐฯ) และค่ายคอมมิวนิสต์ (นำโดยสหภาพโซเวียต)"
  detailedDefinition: "ดำเนินอยู่ระหว่าง ค.ศ. 1947–1991 ไม่มีการปะทะทางทหารโดยตรงระหว่างสองมหาอำนาจ แต่แข่งขันผ่านสงครามตัวแทน (Proxy Wars) การสะสมอาวุธนิวเคลียร์ และการแข่งขันด้านอวกาศ"
  whyItMatters: "กำหนดภูมิรัฐศาสตร์และความสัมพันธ์ระหว่างประเทศทั่วโลกในครึ่งหลังของศตวรรษที่ 20"

- id: silk-road
  word: "Silk Road (เส้นทางสายไหม)"
  pronunciation: "silk rohd"
  category: trade
  shortDefinition: "เครือข่ายเส้นทางการค้าโบราณที่เชื่อมต่อระหว่างเอเชียตะวันออก ตะวันออกกลาง และยุโรป"
  detailedDefinition: "นอกจากจะเป็นเส้นทางขนส่งสินค้ามีค่า เช่น ผ้าไหม เครื่องเทศ เครื่องเคลือบดินเผา ยังเป็นช่องทางแลกเปลี่ยนศาสนา เทคโนโลยี และวัฒนธรรมข้ามทวีป"
  whyItMatters: "เป็นตัวอย่างแรกเริ่มของระบบการค้าข้ามทวีปและโลกาภิวัตน์ในโลกยุคโบราณ"
