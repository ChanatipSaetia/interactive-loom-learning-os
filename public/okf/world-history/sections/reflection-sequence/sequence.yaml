challenges:
  - prompt: "ถอดรหัสลำดับการกำเนิดอารยธรรมลุ่มแม่น้ำโบราณ (Ancient River Valleys):"
    items:
      - id: seq-cuneiform
        text: "ชาวสุเมเรียนประดิษฐ์อักษรรูปลิ่ม (Cuneiform) ในเมโสโปเตเมีย (~3500 BC)"
      - id: seq-pyramid
        text: "การสร้างมหาพีระมิดแห่งกิซาในอียิปต์โบราณ (~2560 BC)"
      - id: seq-hammurabi
        text: "พระเจ้าฮัมมูราบีจารึกประมวลกฎหมายฮัมมูราบีแห่งบาบิโลน (~1754 BC)"
      - id: seq-oracle-bones
        text: "การจารึกอักษรบนกระดูกเสี่ยงทาย (Oracle Bones) ยุคราชวงศ์ซางของจีน (~1200 BC)"
    solution:
      - seq-cuneiform
      - seq-pyramid
      - seq-hammurabi
      - seq-oracle-bones

  - prompt: "ถอดรหัสพัฒนาการนวัตกรรมและการจัดระเบียบสังคมยุคโบราณ:"
    items:
      - id: seq-proto-cuneiform
        text: "การประดิษฐ์ตัวอักษรเพื่อทำบัญชีผลผลิตในเมโสโปเตเมีย (~3500 BC)"
      - id: seq-indus-grid
        text: "การวางผังเมืองตารางหมากรุกและท่อระบายน้ำเมืองโมเฮนโจ-ดาโร (~2500 BC)"
      - id: seq-papyrus-hieroglyph
        text: "การบันทึกคัมภีร์มรณะด้วยอักษรไฮโรกลิฟิกบนกระดาษปาปิรุส (~1500 BC)"
      - id: seq-shang-bronze
        text: "การหล่อเครื่องสำริดและจารึกอักษรเสี่ยงทายในราชวงศ์ซาง (~1200 BC)"
    solution:
      - seq-proto-cuneiform
      - seq-indus-grid
      - seq-papyrus-hieroglyph
      - seq-shang-bronze
