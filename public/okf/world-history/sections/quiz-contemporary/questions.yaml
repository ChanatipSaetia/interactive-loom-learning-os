- id: q1
  question: "สนธิสัญญาใดที่ลงนามในปี ค.ศ. 1919 เพื่อยุติสงครามโลกครั้งที่ 1 และส่งผลต่อภูมิรัฐศาสตร์ยุโรป?"
  hint: "สนธิสัญญาที่ลงนามในพระราชวังแวร์ซายส์ ประเทศฝรั่งเศส"
  choices:
    - id: a
      text: "สนธิสัญญาแวร์ซายส์ (Treaty of Versailles)"
      correct: true
      explanation: "ถูกต้อง สนธิสัญญาแวร์ซายส์กำหนดเงื่อนไขสันติภาพและค่าปฏิกรรมสงครามแก่เยอรมนีหลังสิ้นสุดสงครามโลกครั้งที่ 1"
    - id: b
      text: "สนธิสัญญาเวสต์ฟาเลีย"
      correct: false
      explanation: "สนธิสัญญาเวสต์ฟาเลียลงนามในปี 1648 สิ้นสุดสงครามสามสิบปี"
    - id: c
      text: "มหากฎบัตรแมกนาคาร์ตา"
      correct: false
      explanation: "แมกนาคาร์ตาลงนามในปี 1215"
    - id: d
      text: "กฎหมายสิบสองโต๊ะ"
      correct: false
      explanation: "กฎหมายสิบสองโต๊ะเป็นของโรมันโบราณ"

- id: q2
  question: "องค์การระหว่างประเทศใดที่ก่อตั้งขึ้นในปี ค.ศ. 1945 หลังสงครามโลกครั้งที่ 2 ยุติลง เพื่อธำรงสันติภาพและความมั่นคงของโลก?"
  hint: "มีสำนักงานใหญ่ที่นครนิวยอร์ก"
  choices:
    - id: a
      text: "องค์การสหประชาชาติ (United Nations - UN)"
      correct: true
      explanation: "ถูกต้อง สหประชาชาติก่อตั้งขึ้นในปี ค.ศ. 1945 เพื่อเป็นเวทีเจรจาป้องกันสงครามโลกและส่งเสริมความร่วมมือระหว่างประเทศ"
    - id: b
      text: "สันนิบาตชาติ (League of Nations)"
      correct: false
      explanation: "สันนิบาตชาติก่อตั้งหลังสงครามโลกครั้งที่ 1 และยุบตัวลงหลังเกิดสงครามโลกครั้งที่ 2"
    - id: c
      text: "สหภาพยุโรป (EU)"
      correct: false
      explanation: "สหภาพยุโรปพัฒนามาจากกลุ่มประชาคมถ่านหินและเหล็กกล้าในยุโรป"
    - id: d
      text: "องค์การสนธิสัญญาแอตแลนติกเหนือ (NATO) เพียงองค์กรเดียว"
      correct: false
      explanation: "NATO เป็นพันธมิตรทางทหาร ไม่ใช่องค์การระหว่างประเทศระดับโลกที่รวมทุกฝ่าย"

- id: q3
  question: "ลักษณะสำคัญของ 'สงครามเย็น (Cold War)' ระหว่างสหรัฐอเมริกาและสหภาพโซเวียตคืออะไร?"
  hint: "การแข่งขันทางอุดมการณ์ที่หลีกเลี่ยงการใช้อาวุธนิวเคลียร์รบกันโดยตรง"
  choices:
    - id: a
      text: "การแข่งขันทางอุดมการณ์และแสนยานุภาพผ่านสงครามตัวแทน (Proxy Wars) โดยไม่รบกันโดยตรงด้วยอาวุธนิวเคลียร์"
      correct: true
      explanation: "ถูกต้อง ทั้งสองฝ่ายหลีกเลี่ยงการทำสงครามนิวเคลียร์ล้างโลก (MAD) แต่แข่งขันผ่านสงครามตัวแทน เช่น เกาหลี เวียดนาม และการแข่งขันทางอวกาศ"
    - id: b
      text: "การรบด้วยกองทัพบกขนาดใหญ่ระหว่างสหรัฐฯ และโซเวียตบนแผ่นดินใหญ่ของทั้งสองฝ่าย"
      correct: false
      explanation: "ทั้งสองฝ่ายไม่เคยเปิดศึกรบกันโดยตรงบนแผ่นดินของตน"
    - id: c
      text: "การค้าเสรีอย่างไร้พรมแดนระหว่างทั้งสองฝ่ายตลอดเวลา"
      correct: false
      explanation: "มีการคว่ำบาตรและม่านเหล็กแบ่งแยกโลกออกเป็นสองค่าย"
    - id: d
      text: "การสละอำนาจของทั้งสองฝ่ายให้แก่องค์การสหประชาชาติเป็นผู้บริหารโลก"
      correct: false
      explanation: "มหาอำนาจต่างใช้อำนาจยับยั้ง (Veto) ในคณะมนตรีความมั่นคง UN"

- id: q4
  question: "เหตุการณ์วิกฤตการณ์ขีปนาวุธคิวบา (Cuban Missile Crisis, 1962) มีความสำคัญเชิงประวัติศาสตร์อย่างไร?"
  hint: "ช่วงเวลาที่โลกเข้าใกล้วิกฤตสงครามนิวเคลียร์มากที่สุด"
  choices:
    - id: a
      text: "เป็นจุดที่สหรัฐฯ และสหภาพโซเวียตเผชิญหน้าและเข้าใกล้สงครามนิวเคลียร์มากที่สุด ก่อนคลี่คลายด้วยการเจรจาทางการทูต"
      correct: true
      explanation: "ถูกต้อง การติดตั้งขีปนาวุธในคิวบาเกือบนำไปสู่สงครามนิวเคลียร์ แต่จบลงด้วยการถอนขีปนาวุธและการตั้งสายด่วนฮอตไลน์ระหว่างสองผู้นำ"
    - id: b
      text: "การเริ่มสร้างกำแพงเบอร์ลิน"
      correct: false
      explanation: "กำแพงเบอร์ลินเริ่มสร้างในปี ค.ศ. 1961"
    - id: c
      text: "การลงนามในสนธิสัญญาแวร์ซายส์"
      correct: false
      explanation: "สนธิสัญญาแวร์ซายส์เกิดขึ้นในปี ค.ศ. 1919"
    - id: d
      text: "การส่งดาวเทียมสปุตนิก 1 ขึ้นสู่อวกาศครั้งแรก"
      correct: false
      explanation: "สปุตนิก 1 ถูกส่งขึ้นสู่อวกาศในปี ค.ศ. 1957"

- id: q5
  question: "ความสำเร็จของยานอะพอลโล 11 ในปี ค.ศ. 1969 สะท้อนถึงชัยชนะในมิติใดของการแข่งขันในสงครามเย็น?"
  hint: "นีล อาร์มสตรอง ก้าวเหยียบพื้นผิวดวงจันทร์"
  choices:
    - id: a
      text: "ชัยชนะด้านการแข่งขันทางอวกาศ (Space Race) และเทคโนโลยีวิทยาศาสตร์การสำรวจอวกาศ"
      correct: true
      explanation: "ถูกต้อง ภารกิจอะพอลโล 11 พามนุษย์ไปลงจอดบนดวงจันทร์สำเร็จ ถือเป็นหมุดหมายสูงสุดของการแข่งขันทางอวกาศในยุคสงครามเย็น"
    - id: b
      text: "การค้นพบเส้นทางการค้าทางทะเลสายใหม่สู่เอเชีย"
      correct: false
      explanation: "การสำรวจทางทะเลเกิดขึ้นในศตวรรษที่ 15–16"
    - id: c
      text: "การประดิษฐ์เครื่องจักรไอน้ำรุ่นแรก"
      correct: false
      explanation: "เครื่องจักรไอน้ำพัฒนาในศตวรรษที่ 18"
    - id: d
      text: "การรวมกลุ่มจัดตั้งประชาคมอาเซียน"
      correct: false
      explanation: "อาเซียนก่อตั้งในปี ค.ศ. 1967 ที่กรุงเทพฯ"

- id: q6
  question: "เหตุการณ์การล่มสลายของกำแพงเบอร์ลินในปี ค.ศ. 1989 สะท้อนถึงจุดเปลี่ยนประวัติศาสตร์เรื่องใด?"
  hint: "สัญลักษณ์แห่งการปิดฉากสงครามเย็นและการรวมเยอรมนี"
  choices:
    - id: a
      text: "การสิ้นสุดของสงครามเย็น การเสื่อมสลายของระบอบคอมมิวนิสต์ในยุโรปตะวันออก และการรวมชาติเยอรมนี"
      correct: true
      explanation: "ถูกต้อง การพังทลายของกำแพงเบอร์ลินเป็นสัญลักษณ์สำคัญที่สุดของการปิดฉากสงครามเย็นและการรวมเยอรมนีตะวันออกและตะวันตกเข้าด้วยกัน"
    - id: b
      text: "จุดเริ่มต้นของสงครามโลกครั้งที่ 1"
      correct: false
      explanation: "สงครามโลกครั้งที่ 1 เริ่มต้นในปี ค.ศ. 1914"
    - id: c
      text: "การประกาศอิสรภาพของสหรัฐอเมริกา"
      correct: false
      explanation: "การประกาศอิสรภาพสหรัฐฯ เกิดขึ้นในปี ค.ศ. 1776"
    - id: d
      text: "การประดิษฐ์ตัวอักษรรูปลิ่มเป็นครั้งแรก"
      correct: false
      explanation: "อักษรรูปลิ่มเกิดขึ้นตั้งแต่ 3500 ปีก่อนคริสตกาล"
