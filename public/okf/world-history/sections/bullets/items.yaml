- text: "ยุคฟื้นฟูศิลปวิทยาการ (Renaissance & Humanism)"
  children:
    - text: "แนวคิดมนุษยนิยม (Humanism): เชื่อมั่นในคุณค่า ศักยภาพ สติปัญญา และการใช้เหตุผลของมนุษย์ในการค้นหาความจริง"
    - text: "การประดิษฐ์แท่นพิมพ์ของกูเทนแบร์ก (Gutenberg Press, AD 1440): ระบบเรียงพิมพ์โลหะช่วยให้ความรู้และตำราแพร่กระจายอย่างรวดเร็ว หลุดพ้นจากการผูกขาดของศาสนจักร"
    - text: "การสิ้นสุดจักรวรรดิไบแซนไทน์ (AD 1453): กรุงคอนสแตนติโนเปิลเสียแก่จักรวรรดิออตโตมัน ทำให้นักปราชญ์กรีกอพยพพร้อมตำราโบราณเข้าสู่อิตาลี"

- text: "ยุคแห่งการสำรวจทางทะเล (Age of Exploration)"
  children:
    - text: "การเดินเรือของโคลัมบัส (AD 1492): เดินเรือข้ามมหาสมุทรแอตแลนติกค้นพบทวีปอเมริกา เชื่อมต่อโลกเก่าและโลกใหม่"
    - text: "การแลกเปลี่ยนโคลัมเบียน (Columbian Exchange): การแพร่กระจายของพืชผล (มันฝรั่ง ข้าวโพด ยาสูบ) สัตว์เลี้ยง เชื้อโรค และประชากรข้ามมหาสมุทรแอตแลนติก"
    - text: "การเปลี่ยนผ่านเส้นทางการค้าโลก: การค้าทางทะเลในมหาสมุทรแอตแลนติกและอินเดียเข้ามาแทนที่เส้นทางสายไหมทางบก"

- text: "การปฏิวัติวิทยาศาสตร์ (Scientific Revolution)"
  children:
    - text: "การปฏิวัติทางฟิสิกส์และคณิตศาสตร์: เซอร์ไอแซก นิวตัน ตีพิมพ์หนังสือ Principia (AD 1687) วางรากฐานกฎการเคลื่อนที่และแรงโน้มถ่วงสากล"
    - text: "ระเบียบวิธีทางวิทยาศาสตร์ (Scientific Method): การตั้งสมมติฐาน การทดลอง และการสังเกตเชิงประจักษ์เข้ามาแทนที่ความเชื่อตามตำราโบราณ"

- text: "ยุคจักรวรรดินิยมและการแบ่งดินแดน (Imperialism)"
  children:
    - text: "การประชุมเบอร์ลิน (Berlin Conference, 1884–1885): ชาติมหาอำนาจยุโรปตกลงจัดสรรแบ่งดินแดนทวีปแอฟริกา (Scramble for Africa) เพื่อแสวงหาวัตถุดิบและตลาดอุตสาหกรรม"
