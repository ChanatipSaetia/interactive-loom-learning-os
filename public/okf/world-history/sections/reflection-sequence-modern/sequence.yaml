challenges:
  - prompt: "ถอดรหัสยุคฟื้นฟูศิลปวิทยาการและการสำรวจโลก (Renaissance & Scientific Revolution):"
    items:
      - id: seq-gutenberg
        text: "โยฮันเนส กูเทนแบร์ก ประดิษฐ์แท่นพิมพ์ระบบเรียงพิมพ์โลหะในยุโรป (AD 1440)"
      - id: seq-columbus
        text: "คริสโตเฟอร์ โคลัมบัส เดินเรือข้ามมหาสมุทรแอตแลนติก นำสู่การแลกเปลี่ยนโคลัมเบียน (AD 1492)"
      - id: seq-scientific-rev
        text: "เซอร์ไอแซก นิวตัน ตีพิมพ์หนังสือ Principia วางรากฐานฟิสิกส์สมัยใหม่ (AD 1687)"
    solution:
      - seq-gutenberg
      - seq-columbus
      - seq-scientific-rev

  - prompt: "ถอดรหัสยุคแห่งการปฏิวัติอุตสาหกรรมและการเมือง (Industrial & Political Revolutions):"
    items:
      - id: seq-steam-engine
        text: "เจมส์ วัตต์ จดสิทธิบัตรเครื่องจักรไอน้ำประสิทธิภาพสูงในอังกฤษ (AD 1769)"
      - id: seq-french-rev
        text: "การปฏิวัติฝรั่งเศสและคำประกาศว่าด้วยสิทธิมนุษยชนและพลเมือง (AD 1789)"
      - id: seq-railway-era
        text: "การเปิดทางรถไฟโดยสารสายแรกของโลก Liverpool & Manchester Railway (AD 1830)"
      - id: seq-berlin-conf
        text: "การประชุมเบอร์ลิน (Berlin Conference) จัดสรรแบ่งดินแดนทวีปแอฟริกา (AD 1884)"
    solution:
      - seq-steam-engine
      - seq-french-rev
      - seq-railway-era
      - seq-berlin-conf
