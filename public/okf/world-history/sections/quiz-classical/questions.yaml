- id: q1
  question: "นครรัฐเอเธนส์และนครรัฐสปาร์ตาในกรีกโบราณมีความแตกต่างทางโครงสร้างสังคมและการปกครองอย่างไร?"
  hint: "หนึ่งเมืองเน้นประชาธิปไตยและปรัชญา อีกเมืองเน้นวินัยการรบและการทหาร"
  choices:
    - id: a
      text: "เอเธนส์เน้นประชาธิปไตยทางตรงและการศึกษา ส่วนสปาร์ตาเน้นระบอบคณาธิปไตยและรัฐทหารเข้มงวด"
      correct: true
      explanation: "ถูกต้อง เอเธนส์ให้พลเมืองชายมีส่วนร่วมในการปกครองและส่งเสริมศิลปวิทยาการ ขณะที่สปาร์ตาสร้างรัฐทหารเพื่อความมั่นคง"
    - id: b
      text: "เอเธนส์ปกครองด้วยระบอบกษัตริย์เทวสิทธิ์ ส่วนสปาร์ตาปกครองด้วยสภาพระคริสต์"
      correct: false
      explanation: "ทั้งสองนครรัฐไม่ได้ปกครองด้วยระบอบเทวสิทธิ์หรือศาสนาคริสต์ซึ่งเกิดในยุคต่อมา"
    - id: c
      text: "สปาร์ตาเป็นศูนย์กลางการค้าทางทะเล ส่วนเอเธนส์เป็นรัฐเกษตรกรรมปิดประเทศ"
      correct: false
      explanation: "สลับกัน เอเธนส์เป็นมหาอำนาจทางทะเลและการค้า ส่วนสปาร์ตาเน้นเกษตรกรรมบนบก"
    - id: d
      text: "เอเธนส์ไม่มีทาสในสังคม แต่สปาร์ตามีการใช้แรงงานทาสเท่านั้น"
      correct: false
      explanation: "ทั้งสองนครรัฐมีการใช้แรงงานทาส (ในสปาร์ตาเรียกว่า เฮลอต - Helot)"

- id: q2
  question: "มรดกทางนิติศาสตร์ที่สำคัญที่สุดของจักรวรรดิโรมันซึ่งกลายเป็นรากฐานกฎหมายของโลกตะวันตกคืออะไร?"
  hint: "คิดถึงแผ่นจารึกกฎหมาย 12 แผ่นและหลักความเสมอภาคทางกฎหมาย"
  choices:
    - id: a
      text: "กฎหมายสิบสองโต๊ะ (Twelve Tables) และหลักนิติธรรมที่ใช้บังคับพลเมืองเท่าเทียมกัน"
      correct: true
      explanation: "ถูกต้อง กฎหมายสิบสองโต๊ะทำให้กฎหมายเป็นลายลักษณ์อักษรที่เปิดเผย ช่วยปกป้องสิทธิของชนชั้นสามัญ (Plebeians) และพัฒนาเป็นระบบประมวลกฎหมายโรมัน"
    - id: b
      text: "คำสอนสิบประการแห่งคัมภีร์ฮีบรู"
      correct: false
      explanation: "เป็นหลักศีลธรรมทางศาสนาของยิว ไม่ใช่ระบบกฎหมายแห่งรัฐโรมัน"
    - id: c
      text: "การปกครองแบบเผด็จการเบ็ดเสร็จไร้การตรวจสอบ"
      correct: false
      explanation: "โรมันให้ความสำคัญกับหลักนิติธรรมและการคุ้มครองสิทธิตามกฎหมาย"
    - id: d
      text: "สนธิสัญญาเวสต์ฟาเลีย"
      correct: false
      explanation: "เกิดขึ้นในปี ค.ศ. 1648 สิ้นสุดสงครามสามสิบปีในยุโรป"

- id: q3
  question: "การแผ่ขยายจักรวรรดิของพระเจ้าอเล็กซานเดอร์มหาราชส่งผลให้เกิดวัฒนธรรมแบบใด?"
  hint: "การผสมผสานวัฒนธรรมกรีกเข้ากับโลกตะวันออก"
  choices:
    - id: a
      text: "วัฒนธรรมเฮลเลนิสติก (Hellenistic) ที่ผสานวัฒนธรรมกรีกเข้ากับเปอร์เซีย อียิปต์ และอินเดีย"
      correct: true
      explanation: "ถูกต้อง อเล็กซานเดอร์มหาราชได้เผยแพร่วัฒนธรรมกรีกและผสมผสานกับอารยธรรมตะวันออก เกิดเป็นยุคเฮลเลนิสติก"
    - id: b
      text: "การทำลายวัฒนธรรมกรีกและเปลี่ยนไปนับถือศาสนาคริสต์ทั้งหมด"
      correct: false
      explanation: "ศาสนาคริสต์ยังไม่กำเนิดในยุคของอเล็กซานเดอร์มหาราช"
    - id: c
      text: "การปิดกั้นวัฒนธรรมภายนอกและคงเอกลักษณ์เฉพาะสปาร์ตา"
      correct: false
      explanation: "อเล็กซานเดอร์ส่งเสริมการแต่งงานข้ามวัฒนธรรมและการเปิดกว้างทางวิชาการ"
    - id: d
      text: "การนำระบบวรรณะของอินเดียมาใช้ทั่วยุโรป"
      correct: false
      explanation: "ไม่ได้มีการนำระบบวรรณะมาใช้ในโลกตะวันตก"

- id: q4
  question: "เหตุการณ์ใดในปี ค.ศ. 476 ถือเป็นหมุดหมายการสิ้นสุดของยุคโบราณและการเริ่มต้นของยุคกลาง?"
  hint: "การล่มสลายของมหาอำนาจตะวันตก"
  choices:
    - id: a
      text: "จักรวรรดิโรมันตะวันตกถูกชนเผ่าเยอร์แมนิกรุกรานและล่มสลาย"
      correct: true
      explanation: "ถูกต้อง การล่มสลายของโรมตะวันตกในปี ค.ศ. 476 ทำให้ยุโรปเข้าสู่ยุคกลางและระบบฟิวดัล"
    - id: b
      text: "การลงนามในมหากฎบัตรแมกนาคาร์ตา"
      correct: false
      explanation: "แมกนาคาร์ตาลงนามในปี ค.ศ. 1215"
    - id: c
      text: "การประดิษฐ์แท่นพิมพ์ของกูเทนแบร์ก"
      correct: false
      explanation: "แท่นพิมพ์ประดิษฐ์ในราวปี ค.ศ. 1440"
    - id: d
      text: "การเริ่มสร้างพีระมิดแห่งกิซา"
      correct: false
      explanation: "พีระมิดสร้างขึ้นเมื่อประมาณ 2560 ปีก่อนคริสตกาล"

- id: q5
  question: "ในยุคกลาง ระบบศักดินาสวามิภักดิ์ (Feudalism) ในยุโรปมีความสัมพันธ์เชิงอำนาจและที่ดินอย่างไร?"
  hint: "การแลกเปลี่ยนความจงรักภักดี กำลังทหาร และที่ดินทำกิน"
  choices:
    - id: a
      text: "กษัตริย์มอบที่ดินให้ขุนนาง (Lords) ดูแล เพื่อแลกกับความจงรักภักดีและกำลังทหาร โดยมีศาสนจักรเป็นศูนย์รวมจิตใจ"
      correct: true
      explanation: "ถูกต้อง ระบบฟิวดัลเป็นโครงสร้างกระจายอำนาจผ่านพันธะสัญญาระหว่างลอร์ดและวัสซาล โดยมีศาสนจักรคาทอลิกเป็นศูนย์กลางทางจิตวิญญาณ"
    - id: b
      text: "การรวมศูนย์อำนาจและการค้าเสรีระดับโลกผ่านระบบอินเทอร์เน็ต"
      correct: false
      explanation: "นั่นเป็นลักษณะของยุคสมัยใหม่และโลกาภิวัตน์"
    - id: c
      text: "การปกครองแบบประชาธิปไตยทางตรงที่ประชาชนทุกคนมีสิทธิเลือกตั้งเท่าเทียมกัน"
      correct: false
      explanation: "ยุคกลางไม่มีประชาธิปไตยทางตรงแบบยุคปัจจุบัน"
    - id: d
      text: "การยกเลิกระบบชนชั้นและการถือครองที่ดินร่วมกันแบบคอมมูน"
      correct: false
      explanation: "สังคมยุคกลางแบ่งชนชั้นอย่างเคร่งครัด (นักบวช ขุนนาง อัศวิน ชาวนาติดที่ดิน)"

- id: q6
  question: "มหากฎบัตรแมกนาคาร์ตา (Magna Carta, AD 1215) ในอังกฤษมีความสำคัญเชิงประวัติศาสตร์อย่างไร?"
  hint: "การจำกัดพระราชอำนาจและหลักการที่ว่ากษัตริย์ต้องอยู่ใต้กฎหมาย"
  choices:
    - id: a
      text: "เป็นการจำกัดพระราชอำนาจของกษัตริย์ และวางรากฐานว่ากษัตริย์ต้องอยู่ภายใต้กฎหมาย"
      correct: true
      explanation: "ถูกต้อง แมกนาคาร์ตาช่วยป้องกันการใช้อำนาจตามอำเภอใจของกษัตริย์ และกลายเป็นแม่แบบของรัฐธรรมนูญและสิทธิเสรีภาพสากล"
    - id: b
      text: "การสถาปนาระบอบสมบูรณาญาสิทธิราชย์เบ็ดเสร็จเด็ดขาด"
      correct: false
      explanation: "แมกนาคาร์ตาทำหน้าที่จำกัดอำนาจกษัตริย์ ไม่ใช่ส่งเสริมอำนาจเบ็ดเสร็จ"
    - id: c
      text: "การประกาศสงครามครูเสดครั้งแรก"
      correct: false
      explanation: "สงครามครูเสดเริ่มขึ้นก่อนหน้านั้น (ปลายศตวรรษที่ 11)"
    - id: d
      text: "การก่อตั้งองค์การสหประชาชาติ"
      correct: false
      explanation: "สหประชาชาติก่อตั้งในปี ค.ศ. 1945"

