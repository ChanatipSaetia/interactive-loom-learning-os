- id: q1
  question: "เหตุการณ์ใดถือเป็นเกณฑ์แบ่งระหว่าง 'ยุคก่อนประวัติศาสตร์' กับ 'ยุคประวัติศาสตร์'?"
  hint: "นึกถึงเครื่องมือที่มนุษย์ใช้บันทึกเรื่องราว"
  choices:
    - id: a
      text: "การเริ่มใช้เครื่องมือหินขัด"
      correct: false
      explanation: "การใช้เครื่องมือหินเป็นลักษณะของยุคหินซึ่งอยู่ในยุคก่อนประวัติศาสตร์"
    - id: b
      text: "การประดิษฐ์ตัวอักษรขึ้นใช้บันทึกเรื่องราว (เช่น อักษรรูปลิ่ม)"
      correct: true
      explanation: "ถูกต้อง การมีตัวอักษรบันทึกเรื่องราว เช่น อักษรรูปลิ่มของชาวสุเมเรียน ถือเป็นจุดเริ่มต้นของยุคประวัติศาสตร์"
    - id: c
      text: "การค้นพบไฟและการปรุงอาหาร"
      correct: false
      explanation: "การค้นพบไฟเกิดขึ้นในยุคหินเก่า ซึ่งเป็นยุคก่อนประวัติศาสตร์"
    - id: d
      text: "การสร้างกำแพงเมืองป้องกันข้าศึก"
      correct: false
      explanation: "การสร้างกำแพงเมืองเป็นพัฒนาการทางสถาปัตยกรรม แต่ไม่ใช่เกณฑ์หลักในการแบ่งยุค"

- id: q2
  question: "ประมวลกฎหมายฮัมมูราบีแห่งบาบิโลนในดินแดนเมโสโปเตเมีย มีหลักการลงโทษที่โดดเด่นอย่างไร?"
  hint: "คิดถึงสำนวนความเท่าเทียมในการตอบโต้การกระทำ"
  choices:
    - id: a
      text: "การไกล่เกลี่ยด้วยการจ่ายเงินชดเชยทุกกรณี"
      correct: false
      explanation: "มีค่าปรับในบางกรณี แต่ไม่ใช่หลักการเด่นอันเป็นเอกลักษณ์ของกฎหมายนี้"
    - id: b
      text: "ตาต่อตา ฟันต่อฟัน (An eye for an eye)"
      correct: true
      explanation: "ถูกต้อง ฮัมมูราบีใช้หลักการลงโทษที่สอดคล้องกับความผิดที่กระทำ เรียกว่า ตาต่อตา ฟันต่อฟัน"
    - id: c
      text: "การจำคุกตลอดชีวิตโดยไม่ประหารชีวิต"
      correct: false
      explanation: "ในยุคโบราณยังไม่มีระบบเรือนจำจำคุกระยะยาวแบบสมัยใหม่"
    - id: d
      text: "การเนรเทศออกนอกดินแดนจักรวรรดิ"
      correct: false
      explanation: "การเนรเทศไม่ใช่แก่นหลักของประมวลกฎหมายนี้"

- id: q3
  question: "การสร้างมหาพีระมิดและการทำมัมมี่ของชาวอียิปต์โบราณสะท้อนถึงความเชื่อเรื่องใด?"
  hint: "คิดถึงการเดินทางของวิญญาณและคัมภีร์มรณะ"
  choices:
    - id: a
      text: "ความเชื่อเรื่องชีวิตหลังความตายและการรักษาร่างกายเพื่อรอการฟื้นคืนชีพ"
      correct: true
      explanation: "ถูกต้อง ชาวอียิปต์เชื่อว่าวิญญาณต้องกลับคืนสู่ร่าง จึงสร้างพีระมิดเป็นสุสานและรักษาสภาพศพด้วยการทำมัมมี่"
    - id: b
      text: "ความเชื่อเรื่องการดับสูญโดยสิ้นเชิงเมื่อเสียชีวิต"
      correct: false
      explanation: "ชาวอียิปต์มองว่าความตายคือจุดเริ่มต้นของการเดินทางสู่ชีวิตนิรันดร์"
    - id: c
      text: "การบูชาเทพเจ้าแห่งสงครามเพียงองค์เดียว"
      correct: false
      explanation: "อียิปต์นับถือพหุเทวนิยม (เทพเจ้าหลายองค์)"
    - id: d
      text: "การตัดขาดจากโลกียวิสัยตามแนวคิดอเทวนิยม"
      correct: false
      explanation: "ศาสนาอียิปต์ผูกพันกับฟาโรห์ ธรรมชาติ และชีวิตประจำวันอย่างแนบแน่น"

- id: q4
  question: "ลักษณะเด่นที่เป็นเอกลักษณ์ทางวิศวกรรมของอารยธรรมลุ่มแม่น้ำสินธุ (โมเฮนโจ-ดาโร และ ฮารัปปา) คืออะไร?"
  hint: "คิดถึงความเป็นเลิศด้านผังเมืองและสุขอนามัย"
  choices:
    - id: a
      text: "การวางผังเมืองแบบตารางหมากรุก (Grid Plan) และระบบระบายน้ำเสียใต้ดิน"
      correct: true
      explanation: "ถูกต้อง อารยธรรมสินธุมีความก้าวหน้าด้านสุขาภิบาลสูงมาก มีการตัดถนนเป็นตาราง อิฐเผาขนาดมาตรฐาน และท่อระบายน้ำเชื่อมทุกบ้าน"
    - id: b
      text: "การสร้างมหาปิรามิดขนาดใหญ่เพื่อเป็นสุสานกษัตริย์"
      correct: false
      explanation: "ปิรามิดเป็นเอกลักษณ์ของอารยธรรมอียิปต์โบราณ"
    - id: c
      text: "การทำสงครามแผ่ขยายอาณาเขตด้วยกองทัพม้าเร็ว"
      correct: false
      explanation: "หลักฐานของสินธุเน้นการค้าและสันติวิธี ไม่พบร่องรอยการทหารขนาดใหญ่"
    - id: d
      text: "การประดิษฐ์เข็มทิศและกระดาษเป็นแห่งแรกของโลก"
      correct: false
      explanation: "เข็มทิศและกระดาษเป็นนวัตกรรมของอารยธรรมจีนโบราณ"

- id: q5
  question: "หลักฐานการบันทึกตัวอักษรจีนยุคแรกเริ่มในอารยธรรมลุ่มแม่น้ำฮวงโห ปรากฏบนวัตถุใด?"
  hint: "การทำนายดวงชะตาและเสี่ยงทายในยุคราชวงศ์ซาง"
  choices:
    - id: a
      text: "กระดูกเสี่ยงทาย (Oracle Bones) และกระดองเต่า"
      correct: true
      explanation: "ถูกต้อง ในยุคราชวงศ์ซาง จีนใช้อักษรภาพจารึกลงบนกระดูกสัตว์และกระดองเต่าเพื่อทำนายและบันทึกเหตุการณ์"
    - id: b
      text: "แผ่นดินเหนียวดิบแบบอักษรรูปลิ่ม"
      correct: false
      explanation: "แผ่นดินเหนียวเป็นของชาวสุเมเรียนในเมโสโปเตเมีย"
    - id: c
      text: "กระดาษปาปิรุส"
      correct: false
      explanation: "กระดาษปาปิรุสเป็นนวัตกรรมของชาวอียิปต์โบราณ"
    - id: d
      text: "แผ่นศิลาจารึกกฎหมาย 12 แผ่น"
      correct: false
      explanation: "ศิลาจารึกกฎหมาย 12 แผ่นเป็นของโรมันโบราณ"

- id: q6
  question: "ปัจจัยทางภูมิศาสตร์ใดที่ส่งผลให้อารยธรรมแรกเริ่มของโลกกำเนิดขึ้นบริเวณลุ่มแม่น้ำใหญ่?"
  hint: "คิดถึงความอุดมสมบูรณ์หลังน้ำท่วมและการจัดการน้ำ"
  choices:
    - id: a
      text: "ดินตะกอนอันอุดมสมบูรณ์และความจำเป็นในการพัฒนาระบบชลประทานร่วมกัน"
      correct: true
      explanation: "ถูกต้อง ดินตะกอนจากการท่วมของแม่น้ำเหมาะแก่การเพาะปลูก และการจัดการน้ำต้องการการรวมกลุ่มจัดระเบียบสังคมจนเกิดนครรัฐ"
    - id: b
      text: "ความหนาวเย็นของน้ำช่วยถนอมอาหารได้นานขึ้น"
      correct: false
      explanation: "ลุ่มแม่น้ำโบราณมักอยู่ในเขตอบอุ่นและกึ่งแห้งแล้ง ไม่ใช่เขตหนาวจัด"
    - id: c
      text: "การป้องกันการรุกรานจากสัตว์ป่าบนภูเขา"
      correct: false
      explanation: "ไม่ใช่ปัจจัยหลักในการตั้งถิ่นฐานและกำเนิดอารยธรรม"
    - id: d
      text: "การสกัดแร่เหล็กและถ่านหินใต้ท้องน้ำ"
      correct: false
      explanation: "การถลุงเหล็กและถ่านหินเป็นพัฒนาการในยุคหลัง ไม่ใช่ปัจจัยแรกเริ่มของอารยธรรมลุ่มน้ำ"
