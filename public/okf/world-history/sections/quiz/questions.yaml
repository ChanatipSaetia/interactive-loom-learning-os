- id: q1
  question: "เหตุการณ์ใดถือเป็นเกณฑ์แบ่งระหว่าง 'ยุคก่อนประวัติศาสตร์' กับ 'ยุคประวัติศาสตร์'?"
  hint: "นึกถึงเครื่องมือที่มนุษย์ใช้บันทึกเรื่องราว"
  choices:
    - id: a
      text: "การเริ่มใช้เครื่องมือหินขัด"
      correct: false
      explanation: "การใช้เครื่องมือหินเป็นลักษณะของยุคหินใหม่ซึ่งยังอยู่ในยุคก่อนประวัติศาสตร์"
    - id: b
      text: "การประดิษฐ์ตัวอักษรขึ้นใช้บันทึกเรื่องราว"
      correct: true
      explanation: "ถูกต้อง การมีตัวอักษรบันทึกเรื่องราว (เช่น อักษรรูปลิ่มในสุเมเรีย) คือจุดเริ่มต้นของยุคประวัติศาสตร์"
    - id: c
      text: "การค้นพบไฟและการปรุงอาหาร"
      correct: false
      explanation: "การค้นพบไฟเกิดขึ้นในยุคหินเก่า ซึ่งเป็นยุคก่อนประวัติศาสตร์"
    - id: d
      text: "การสร้างกำแพงเมืองป้องกันข้าศึก"
      correct: false
      explanation: "การสร้างกำแพงเมืองเป็นพัฒนาการทางสถาปัตยกรรม แต่ไม่ใช่เกณฑ์หลักในการแบ่งยุค"

- id: q2
  question: "ประมวลกฎหมายฮัมมูราบีแห่งบาบิโลนมีหลักการลงโทษที่โดดเด่นอย่างไร?"
  hint: "คิดถึงสำนวนความเท่าเทียมในการตอบโต้การกระทำ"
  choices:
    - id: a
      text: "การไกล่เกลี่ยด้วยการจ่ายเงินชดเชยทุกกรณี"
      correct: false
      explanation: "มีค่าปรับในบางสถานะ แต่ไม่ใช่หลักการเด่นอันเป็นเอกลักษณ์ของกฎหมายนี้"
    - id: b
      text: "ตาต่อตา ฟันต่อฟัน (An eye for an eye)"
      correct: true
      explanation: "ถูกต้อง ฮัมมูราบีใช้หลักการลงโทษที่สอดคล้องกับความผิดที่กระทำ เรียกว่า ตาต่อตา ฟันต่อฟัน"
    - id: c
      text: "การจำคุกตลอดชีวิตโดยไม่ประหารชีวิต"
      correct: false
      explanation: "ในยุคโบราณยังไม่มีระบบเรือนจำจำคุกระยะยาวแบบสมัยใหม่"

- id: q3
  question: "การปฏิวัติอุตสาหกรรมในศตวรรษที่ 18 มีจุดเริ่มต้นที่ประเทศใดและเกิดจากการพัฒนาเทคโนโลยีใด?"
  hint: "ประเทศที่เป็นเกาะในยุโรปและเครื่องจักรที่ใช้พลังงานจากน้ำเดือด"
  choices:
    - id: a
      text: "ฝรั่งเศส — กังหันลมพลังงานลม"
      correct: false
      explanation: "ฝรั่งเศสเกิดการปฏิวัติทางการเมืองในปี 1789 แต่ไม่ใช่จุดเริ่มต้นการปฏิวัติอุตสาหกรรม"
    - id: b
      text: "อังกฤษ — เครื่องจักรไอน้ำ (Steam Engine)"
      correct: true
      explanation: "ถูกต้อง อังกฤษมีทรัพยากรถ่านหินและเหล็กอุดมสมบูรณ์ ผสานกับการพัฒนาเครื่องจักรไอน้ำของเจมส์ วัตต์"
    - id: c
      text: "เยอรมนี — เครื่องยนต์สันดาปภายใน"
      correct: false
      explanation: "เยอรมนีมีบทบาทสำคัญในการปฏิวัติอุตสาหกรรมระลอกสองช่วงปลายศตวรรษที่ 19"
    - id: d
      text: "สหรัฐอเมริกา — ไฟฟ้ากระแสสลับ"
      correct: false
      explanation: "สหรัฐฯ มีบทบาทในยุคอุตสาหกรรมระลอกสองเช่นกัน"

- id: q4
  question: "แนวคิดมนุษยนิยม (Humanism) ในยุคฟื้นฟูศิลปวิทยาการ (Renaissance) ให้ความสำคัญกับสิ่งใดมากที่สุด?"
  hint: "เปรียบเทียบกับยุคกลางที่ทุกอย่างขึ้นอยู่กับพระเจ้าและศาสนจักร"
  choices:
    - id: a
      text: "การสวดอ้อนวอนและการละทิ้งความสุขทางโลก"
      correct: false
      explanation: "นั่นเป็นแนวคิดทางศาสนาแบบยุคกลางดั้งเดิม"
    - id: b
      text: "คุณค่า ศักยภาพ การใช้เหตุผล และความสามารถของมนุษย์"
      correct: true
      explanation: "ถูกต้อง มนุษยนิยมเน้นความเชื่อมั่นในสติปัญญา ศักยภาพ และความงดงามของมนุษย์ในการค้นหาความจริง"
    - id: c
      text: "การรวมศูนย์อำนาจสู่กษัตริย์โดยสมบูรณ์"
      correct: false
      explanation: "การรวมศูนย์อำนาจเกิดขึ้นในยุคสมบูรณาญาสิทธิราชย์ ไม่ใช่แก่นของมนุษยนิยม"
