- id: q1
  question: "เหตุการณ์ใดถือเป็นเกณฑ์แบ่งระหว่าง 'ยุคก่อนประวัติศาสตร์' กับ 'ยุคประวัติศาสตร์'?"
  hint: "นึกถึงเครื่องมือที่มนุษย์ใช้บันทึกเรื่องราว"
  choices:
    - id: a
      text: "การเริ่มใช้เครื่องมือหินขัด"
      correct: false
      explanation: "การใช้เครื่องมือหินเป็นลักษณะของยุคหินใหม่ซึ่งยังอยู่ในยุคก่อนประวัติศาสตร์"
    - id: b
      text: "การประดิษฐ์ตัวอักษรขึ้นใช้บันทึกเรื่องราว"
      correct: true
      explanation: "ถูกต้อง การมีตัวอักษรบันทึกเรื่องราว (เช่น อักษรรูปลิ่มในสุเมเรีย) คือจุดเริ่มต้นของยุคประวัติศาสตร์"
    - id: c
      text: "การค้นพบไฟและการปรุงอาหาร"
      correct: false
      explanation: "การค้นพบไฟเกิดขึ้นในยุคหินเก่า ซึ่งเป็นยุคก่อนประวัติศาสตร์"
    - id: d
      text: "การสร้างกำแพงเมืองป้องกันข้าศึก"
      correct: false
      explanation: "การสร้างกำแพงเมืองเป็นพัฒนาการทางสถาปัตยกรรม แต่ไม่ใช่เกณฑ์หลักในการแบ่งยุค"

- id: q2
  question: "ประมวลกฎหมายฮัมมูราบีแห่งบาบิโลนมีหลักการลงโทษที่โดดเด่นอย่างไร?"
  hint: "คิดถึงสำนวนความเท่าเทียมในการตอบโต้การกระทำ"
  choices:
    - id: a
      text: "การไกล่เกลี่ยด้วยการจ่ายเงินชดเชยทุกกรณี"
      correct: false
      explanation: "มีค่าปรับในบางสถานะ แต่ไม่ใช่หลักการเด่นอันเป็นเอกลักษณ์ของกฎหมายนี้"
    - id: b
      text: "ตาต่อตา ฟันต่อฟัน (An eye for an eye)"
      correct: true
      explanation: "ถูกต้อง ฮัมมูราบีใช้หลักการลงโทษที่สอดคล้องกับความผิดที่กระทำ เรียกว่า ตาต่อตา ฟันต่อฟัน"
    - id: c
      text: "การจำคุกตลอดชีวิตโดยไม่ประหารชีวิต"
      correct: false
      explanation: "ในยุคโบราณยังไม่มีระบบเรือนจำจำคุกระยะยาวแบบสมัยใหม่"
    - id: d
      text: "การเนรเทศออกนอกดินแดนจักรวรรดิ"
      correct: false
      explanation: "การเนรเทศไม่ใช่แก่นหลักของประมวลกฎหมายนี้"

- id: q3
  question: "ความเชื่อทางศาสนาและการทำมัมมี่ของชาวอียิปต์โบราณสะท้อนถึงโลกทัศน์เรื่องใด?"
  hint: "คิดถึงการเดินทางของวิญญาณและคัมภีร์มรณะ (Book of the Dead)"
  choices:
    - id: a
      text: "ความเชื่อเรื่องชีวิตหลังความตายและการรักษาร่างกายเพื่อรอการฟื้นคืนชีพ"
      correct: true
      explanation: "ถูกต้อง ชาวอียิปต์เชื่อว่าวิญญาณ (Ka และ Ba) ต้องกลับคืนสู่ร่าง จึงต้องรักษาสภาพศพด้วยการทำมัมมี่และฝังสมบัติไว้ในสุสาน"
    - id: b
      text: "ความเชื่อเรื่องการดับสูญโดยสิ้นเชิงเมื่อเสียชีวิต"
      correct: false
      explanation: "ชาวอียิปต์ไม่เชื่อเรื่องการดับสูญ แต่มองว่าความตายคือจุดเริ่มต้นของการเดินทางสู่ชีวิตนิรันดร์"
    - id: c
      text: "การบูชาเทพเจ้าแห่งสงครามเพียงองค์เดียว"
      correct: false
      explanation: "อียิปต์นับถือพหุเทวนิยม (เทพเจ้าหลายองค์) เช่น รา (Ra), โอซิริส (Osiris), อนูบิส (Anubis)"
    - id: d
      text: "การตัดขาดจากโลกียวิสัยตามแนวคิดอเทวนิยม"
      correct: false
      explanation: "ศาสนาอียิปต์ผูกพันกับธรรมชาติ กษัตริย์ฟาโรห์ และชีวิตประจำวันอย่างแนบแน่น"

- id: q4
  question: "นครรัฐเอเธนส์และนครรัฐสปาร์ตาในกรีกโบราณมีความแตกต่างทางโครงสร้างสังคมและการปกครองอย่างไร?"
  hint: "หนึ่งเมืองเน้นประชาธิปไตยและปรัชญา อีกเมืองเน้นวินัยการรบและการทหาร"
  choices:
    - id: a
      text: "เอเธนส์เน้นประชาธิปไตยทางตรงและการศึกษา ส่วนสปาร์ตาเน้นระบอบคณาธิปไตยและการฝึกทหารเข้มงวด"
      correct: true
      explanation: "ถูกต้อง เอเธนส์ให้พลเมืองชายมีส่วนร่วมในการปกครองและส่งเสริมศิลปวิทยาการ ขณะที่สปาร์ตาสร้างรัฐทหารเพื่อความมั่นคง"
    - id: b
      text: "เอเธนส์ปกครองด้วยระบอบกษัตริย์เทวสิทธิ์ ส่วนสปาร์ตาปกครองด้วยสภาพระคริสต์"
      correct: false
      explanation: "ทั้งสองนครรัฐไม่ได้ปกครองด้วยระบอบเทวสิทธิ์หรือศาสนาคริสต์ซึ่งเกิดในยุคต่อมา"
    - id: c
      text: "สปาร์ตาเป็นศูนย์กลางการค้าทางทะเล ส่วนเอเธนส์เป็นรัฐเกษตรกรรมปิดประเทศ"
      correct: false
      explanation: "สลับกัน เอเธนส์เป็นมหาอำนาจทางทะเลและการค้า ส่วนสปาร์ตาเน้นเกษตรกรรมบนบก"
    - id: d
      text: "เอเธนส์ไม่มีทาสในสังคม แต่สปาร์ตามีการใช้แรงงานทาสเท่านั้น"
      correct: false
      explanation: "ทั้งสองนครรัฐมีการใช้แรงงานทาส (ในสปาร์ตาเรียกว่า เฮลอต - Helot)"

- id: q5
  question: "มรดกทางนิติศาสตร์ที่สำคัญที่สุดของจักรวรรดิโรมันซึ่งกลายเป็นรากฐานกฎหมายของโลกตะวันตกคืออะไร?"
  hint: "คิดถึงแผ่นจารึกกฎหมาย 12 แผ่นและหลักความเสมอภาคทางกฎหมาย"
  choices:
    - id: a
      text: "กฎหมายสิบสองโต๊ะ (Twelve Tables) และหลักนิติธรรมที่ใช้บังคับพลเมืองเท่าเทียมกัน"
      correct: true
      explanation: "ถูกต้อง กฎหมายสิบสองโต๊ะทำให้กฎหมายเป็นลายลักษณ์อักษรที่เปิดเผย ช่วยปกป้องสิทธิของชนชั้นสามัญ (Plebeians) และพัฒนาเป็นระบบประมวลกฎหมายโรมัน (Corpus Juris Civilis)"
    - id: b
      text: "คำสอนสิบประการแห่งคัมภีร์ฮีบรู"
      correct: false
      explanation: "เป็นหลักศีลธรรมทางศาสนาของยิว ไม่ใช่ระบบกฎหมายแห่งรัฐโรมัน"
    - id: c
      text: "กฎบัตรแมกนาคาร์ตา (Magna Carta)"
      correct: false
      explanation: "แมกนาคาร์ตาเกิดขึ้นในอังกฤษยุคกลาง (ค.ศ. 1215)"
    - id: d
      text: "สนธิสัญญาเวสต์ฟาเลีย"
      correct: false
      explanation: "เกิดขึ้นในปี 1648 สิ้นสุดสงครามสามสิบปีในยุโรป"

- id: q6
  question: "ลักษณะเด่นที่เป็นเอกลักษณ์ของอารยธรรมลุ่มแม่น้ำสินธุ (โมเฮนโจ-ดาโร และ ฮารัปปา) คืออะไร?"
  hint: "คิดถึงความเป็นเลิศด้านผังเมืองและสุขอนามัย"
  choices:
    - id: a
      text: "การวางผังเมืองแบบตารางหมากรุก (Grid Plan) และระบบระบายน้ำเสียใต้ดินที่ทันสมัย"
      correct: true
      explanation: "ถูกต้อง อารยธรรมสินธุมีความก้าวหน้าด้านสุขาภิบาลสูงมาก มีการตัดถนนเป็นตาราง อิฐเผาขนาดมาตรฐาน และท่อระบายน้ำเชื่อมทุกบ้าน"
    - id: b
      text: "การสร้างมหาปิรามิดขนาดใหญ่เพื่อเป็นสุสานกษัตริย์"
      correct: false
      explanation: "ปิรามิดเป็นเอกลักษณ์ของอารยธรรมอียิปต์โบราณ"
    - id: c
      text: "การทำสงครามแผ่ขยายอาณาเขตด้วยกองทัพม้าเร็ว"
      correct: false
      explanation: "หลักฐานทางโบราณคดีของสินธุเน้นการค้าและสันติวิธี ไม่พบร่องรอยการทหารขนาดใหญ่"
    - id: d
      text: "การประดิษฐ์เข็มทิศและกระดาษเป็นแห่งแรกของโลก"
      correct: false
      explanation: "เข็มทิศและกระดาษเป็นนวัตกรรมของอารยธรรมจีนโบราณ"
