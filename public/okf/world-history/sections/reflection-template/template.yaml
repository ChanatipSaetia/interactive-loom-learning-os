challenges:
  - prompt: "เติมคำในช่องว่างเพื่ออธิบายการเปลี่ยนผ่านสู่ยุคใหม่และการปฏิวัติอุตสาหกรรม (Part 1):"
    template: "การประดิษฐ์แท่นพิมพ์ของกูเทนแบร์กช่วยให้ความรู้แพร่กระจายอย่าง {zone-1} ส่งผลให้เกิดยุคฟื้นฟูศิลปวิทยาการ ต่อมาการพัฒนาเครื่องจักรไอน้ำทำให้เกิดการผลิตสินค้าในปริมาณที่ {zone-2} มากขึ้น และทำให้ประชากรย้ายถิ่นฐานเข้าสู่เขต {zone-3} อย่างรวดเร็ว"
    chips:
      - id: "chip-fast"
        text: "รวดเร็วและกว้างขวาง"
      - id: "chip-slow"
        text: "จำกัดเฉพาะชนชั้นสูง"
      - id: "chip-mass"
        text: "มหาศาลแบบอุตสาหกรรม"
      - id: "chip-few"
        text: "ลดน้อยลง"
      - id: "chip-urban"
        text: "เมืองใหญ่ (Urbanization)"
      - id: "chip-rural"
        text: "ชนบทห่างไกล"
    solution:
      zone-1: "chip-fast"
      zone-2: "chip-mass"
      zone-3: "chip-urban"
    explanation: "<strong>ยอดเยี่ยม!</strong> แท่นพิมพ์ทำให้ความรู้หลุดพ้นจากการผูกขาดของศาสนจักร นำไปสู่การปฏิวัติวิทยาศาสตร์ ส่วนเครื่องจักรไอน้ำทำให้โรงงานต้องการแรงงานจำนวนมาก จึงเกิดการขยายตัวของเมืองใหญ่ (Urbanization)"
  - prompt: "เติมคำในช่องว่างเพื่ออธิบายความเปลี่ยนแปลงหลังสงครามโลกครั้งที่ 2 (Part 2):"
    template: "หลังปี ค.ศ. 1945 โลกเข้าสู่ยุคสงครามเย็น ซึ่งเป็นการแข่งขันทางอุดมการณ์ระหว่างระบอบเสรีประชาธิปไตยและ {zone-1} โดยมหาอำนาจหลีกเลี่ยงสงครามนิวเคลียร์โดยตรง แต่หันไปสู้รบผ่าน {zone-2} ในภูมิภาคต่างๆ แทน"
    chips:
      - id: "chip-communist"
        text: "คอมมิวนิสต์"
      - id: "chip-feudal"
        text: "ศักดินาโบราณ"
      - id: "chip-proxy"
        text: "สงครามตัวแทน (Proxy Wars)"
      - id: "chip-space-only"
        text: "การแข่งขันกีฬาเท่านั้น"
    solution:
      zone-1: "chip-communist"
      zone-2: "chip-proxy"
    explanation: "<strong>ถูกต้อง!</strong> สงครามเย็นคือการแข่งขันระหว่างค่ายเสรีนิยมทุนนิยม (สหรัฐฯ) กับค่ายคอมมิวนิสต์ (สหภาพโซเวียต) ซึ่งเกิดสงครามตัวแทน เช่น สงครามเกาหลีและสงครามเวียดนาม"
