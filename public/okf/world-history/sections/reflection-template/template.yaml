challenges:
  - prompt: "เติมคำในช่องว่างเพื่ออธิบายการเปลี่ยนผ่านสู่ยุคใหม่และการปฏิวัติอุตสาหกรรม (Part 1):"
    template: "การประดิษฐ์แท่นพิมพ์ของกูเทนแบร์กช่วยให้ความรู้แพร่กระจายอย่าง {zone-1} ส่งผลให้เกิดยุคฟื้นฟูศิลปวิทยาการ ต่อมาการพัฒนาเครื่องจักรไอน้ำทำให้เกิดการผลิตสินค้าในปริมาณที่ {zone-2} มากขึ้น และทำให้ประชากรย้ายถิ่นฐานเข้าสู่เขต {zone-3} อย่างรวดเร็ว"
    chips:
      - id: "chip-fast"
        text: "รวดเร็วและกว้างขวาง"
      - id: "chip-slow"
        text: "จำกัดเฉพาะชนชั้นสูง"
      - id: "chip-mass"
        text: "มหาศาลแบบอุตสาหกรรม"
      - id: "chip-few"
        text: "ลดน้อยลง"
      - id: "chip-urban"
        text: "เมืองใหญ่ (Urbanization)"
      - id: "chip-rural"
        text: "ชนบทห่างไกล"
    solution:
      zone-1: "chip-fast"
      zone-2: "chip-mass"
      zone-3: "chip-urban"
    explanation: "<strong>ยอดเยี่ยม!</strong> แท่นพิมพ์ทำให้ความรู้หลุดพ้นจากการผูกขาดของศาสนจักร นำไปสู่การปฏิวัติวิทยาศาสตร์ ส่วนเครื่องจักรไอน้ำทำให้โรงงานต้องการแรงงานจำนวนมาก จึงเกิดการขยายตัวของเมืองใหญ่ (Urbanization)"

  - prompt: "เติมคำในช่องว่างเพื่ออธิบายความเปลี่ยนแปลงหลังสงครามโลกครั้งที่ 2 (Part 2):"
    template: "หลังปี ค.ศ. 1945 โลกเข้าสู่ยุคสงครามเย็น ซึ่งเป็นการแข่งขันทางอุดมการณ์ระหว่างระบอบเสรีประชาธิปไตยและ {zone-1} โดยมหาอำนาจหลีกเลี่ยงสงครามนิวเคลียร์โดยตรง แต่หันไปสู้รบผ่าน {zone-2} ในภูมิภาคต่างๆ แทน"
    chips:
      - id: "chip-communist"
        text: "คอมมิวนิสต์"
      - id: "chip-feudal"
        text: "ศักดินาโบราณ"
      - id: "chip-proxy"
        text: "สงครามตัวแทน (Proxy Wars)"
      - id: "chip-space-only"
        text: "การแข่งขันกีฬาเท่านั้น"
    solution:
      zone-1: "chip-communist"
      zone-2: "chip-proxy"
    explanation: "<strong>ถูกต้อง!</strong> สงครามเย็นคือการแข่งขันระหว่างค่ายเสรีนิยมทุนนิยม (สหรัฐฯ) กับค่ายคอมมิวนิสต์ (สหภาพโซเวียต) ซึ่งเกิดสงครามตัวแทน เช่น สงครามเกาหลีและสงครามเวียดนาม"

  - prompt: "เติมคำในช่องว่างเพื่ออธิบายปัจจัยการกำเนิดอารยธรรมลุ่มแม่น้ำโบราณ (Part 3):"
    template: "อารยธรรมยุคโบราณมักกำเนิดบริเวณลุ่มแม่น้ำใหญ่ เช่น ดินแดนพระจันทร์เสี้ยวอันอุดมสมบูรณ์ในเมโสโปเตเมียและลุ่มแม่น้ำไนล์ เพราะมี {zone-1} ที่อุดมด้วยแร่ธาตุจากการท่วมของแม่น้ำ ทำให้มนุษย์ต้องร่วมมือกันพัฒนาระบบ {zone-2} ซึ่งกลายเป็นรากฐานของการรวมศูนย์อำนาจและการเกิด {zone-3}"
    chips:
      - id: "chip-silt"
        text: "ดินตะกอนอันอุดมสมบูรณ์"
      - id: "chip-sand"
        text: "ทะเลทรายแห้งแล้ง"
      - id: "chip-irrigation"
        text: "การชลประทานและคูคลอง"
      - id: "chip-random-flood"
        text: "การปล่อยให้น้ำท่วมตามยถากรรม"
      - id: "chip-city-state"
        text: "นครรัฐและการจัดระเบียบสังคม"
      - id: "chip-nomad"
        text: "ชนเผ่าเร่ร่อนไร้ผู้นำ"
    solution:
      zone-1: "chip-silt"
      zone-2: "chip-irrigation"
      zone-3: "chip-city-state"
    explanation: "<strong>ถูกต้อง!</strong> การเกษตรในเขตแม่น้ำต้องการการจัดการน้ำและการชลประทานขนาดใหญ่ ทำให้สังคมต้องมีผู้นำ กฎหมาย และแรงงาน เกิดเป็นนครรัฐและอารยธรรมแรกของโลก"

  - prompt: "เติมคำในช่องว่างเพื่ออธิบายมรดกทางการเมืองของกรีกและโรมัน (Part 4):"
    template: "นครรัฐเอเธนส์เป็นผู้ริเริ่มระบอบ {zone-1} ที่เปิดโอกาสให้พลเมืองชายร่วมอภิปรายและลงคะแนน ขณะที่จักรวรรดิโรมันได้วางรากฐานของ {zone-2} โดยการบันทึกข้อกฎหมายเป็นลายลักษณ์อักษร เพื่อสร้างความเท่าเทียมและจำกัดการใช้อำนาจตามอำเภอใจ"
    chips:
      - id: "chip-direct-democracy"
        text: "ประชาธิปไตยทางตรง"
      - id: "chip-monarchy"
        text: "สมบูรณาญาสิทธิราชย์เบ็ดเสร็จ"
      - id: "chip-rule-of-law"
        text: "หลักนิติธรรมและประมวลกฎหมาย"
      - id: "chip-anarchy"
        text: "ความไร้ระเบียบกฎเกณฑ์"
    solution:
      zone-1: "chip-direct-democracy"
      zone-2: "chip-rule-of-law"
    explanation: "<strong>ยอดเยี่ยม!</strong> กรีกมอบแนวคิดเรื่องเสรีภาพและการมีส่วนร่วมของพลเมือง ส่วนโรมันมอบโครงสร้างระบบกฎหมายและนิติรัฐที่ยังใช้อ้างอิงจนถึงปัจจุบัน"

  - prompt: "เติมคำในช่องว่างเพื่อสังเคราะห์ระบบฟิวดัลและศาสนจักรในยุคกลาง (Part 5):"
    template: "ในยุคกลาง ยุโรปกระจายอำนาจผ่านระบบศักดินา โดยกษัตริย์มอบที่ดินให้แก่ {zone-1} เพื่อแลกกับความภักดีและกำลังทหาร ขณะเดียวกัน {zone-2} ทำหน้าที่เป็นศูนย์รวมจิตใจและสถาบันเดียวที่มีอิทธิพลครอบคลุมทั่วยุโรป จนกระทั่งเกิด {zone-3} ที่ช่วยฟื้นฟูการค้าระหว่างยุโรปและเอเชีย"
    chips:
      - id: "chip-nobles"
        text: "ขุนนางและอัศวิน (Lords/Vassals)"
      - id: "chip-slaves-only"
        text: "ทาสกรรมกรเท่านั้น"
      - id: "chip-church"
        text: "ศาสนจักรคาทอลิก"
      - id: "chip-merchants-guild"
        text: "สมาคมพ่อค้าเร่ร่อน"
      - id: "chip-crusades"
        text: "สงครามครูเสด"
      - id: "chip-world-war"
        text: "สงครามโลก"
    solution:
      zone-1: "chip-nobles"
      zone-2: "chip-church"
      zone-3: "chip-crusades"
    explanation: "<strong>สมบูรณ์แบบ!</strong> ระบบฟิวดัลพึ่งพาขุนนางและอัศวินในระดับท้องถิ่น โดยมีศาสนจักรเป็นศูนย์กลางความเชื่อ และสงครามครูเสดได้กระตุ้นการค้าและนำวิทยาการจากตะวันออกกลางกลับเข้าสู่ยุโรป"

