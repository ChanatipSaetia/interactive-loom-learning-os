- icon: "Wrench"
  title: "Component Workshop"
  subtitle: "Isolated UI development environment"
  description: "The core job: develop every component state in a dedicated sandbox that runs beside your app."
  details: "Each state is a story rendered from real component code in an isolated preview iframe. Hot module replacement keeps the loop to sub-second, and no routes, auth flows, or API mocks are required to reach deep states like error or empty views."
  analogy: "A machinist's workbench: you tune a single part under a lamp instead of restarting the whole engine to inspect one bolt."
  primaryFocus: "Building and reviewing individual component states fast, independent of app screens."
  inScope:
    - "Per-state stories with args and argTypes"
    - "Interactive Controls, viewport, and zoom tools"
    - "Decorators supplying providers around a component"
  outOfScope:
    - "Hosting or routing your production application"
    - "End-to-end user journeys across real backend systems"
  color: "blue"

- icon: "BookOpen"
  title: "Living Documentation"
  subtitle: "Docs & MDX generated from stories"
  description: "Storybook turns the story catalog into a searchable documentation site that never goes stale."
  details: "Autodocs generate props tables and examples straight from meta, JSDoc comments, and argTypes. MDX pages interleave prose with live, interactive story embeds, so guidelines are executed by the same code the tests run."
  analogy: "A cookbook where every recipe demo cooks itself at the touch of a button — and updates itself when the kitchen changes."
  primaryFocus: "Keeping usage guidance, props references, and visual examples in sync with code."
  inScope:
    - "Autodocs pages with props tables per component"
    - "MDX pages mixing prose, sections, and live Canvas embeds"
    - "Publishing a static docs build for the whole team"
  outOfScope:
    - "General-purpose wiki or blog hosting"
    - "Backend or infrastructure API references"
  color: "green"

- icon: "ShieldCheck"
  title: "Automated Testing Platform"
  subtitle: "Stories become executable tests"
  description: "Every story doubles as a test case: the test runner executes them headlessly and play functions assert behavior."
  details: "test-storybook boots the built Storybook and runs each story (plus its play function) in Playwright or Puppeteer in CI. Visual regression services snapshot every story per commit and diff pixels across browsers and viewports, blocking silent UI changes."
  analogy: "A full-scale firing range where every weapon you built is test-fired automatically before the shipment leaves."
  primaryFocus: "Catching rendering, behavior, and pixel regressions on the pull request."
  inScope:
    - "Play functions scripted with userEvent-style APIs"
    - "Headless test runner across browsers in CI"
    - "Visual snapshot diffing and review workflows"
  outOfScope:
    - "Unit-testing pure non-UI business logic"
    - "Load and performance benchmarking"
  color: "peach"

- icon: "Users"
  title: "Review & Collaboration Hub"
  subtitle: "Shareable links per branch"
  description: "Static Storybook builds give designers, PMs, and QA a clickable UI catalog to review per branch or PR."
  details: "Each commit gets a live URL (e.g. via Chromatic) where stakeholders click through states, leave inline comments, and approve visual changes. Reviewers exercise Controls themselves instead of requesting prop screenshots."
  analogy: "A printed proof in publishing: everyone signs the exact sheet that will be printed, not a description of it."
  primaryFocus: "Making UI changes reviewable and sign-off auditable before merge."
  inScope:
    - "Publishing static builds per commit/branch"
    - "Visual change review and baseline acceptance"
    - "Shareable links to an exact story + arg state"
  outOfScope:
    - "Replacing code review of application logic"
    - "Formal project sign-off or ticket workflows"
  color: "mauve"

- icon: "Library"
  title: "Design System Catalog"
  subtitle: "Composition & single source of truth"
  description: "Design systems use Storybook as the canonical, browsable catalog of every component and pattern they ship."
  details: "Composition stitches several Storybooks (core primitives, product-specific kits, legacy libs) into one navigable portal with a shared sidebar. Teams version the catalog alongside npm releases so consumers browse documentation matching installed code."
  analogy: "A national library with one reading room card catalog, even though the books live in many branches."
  primaryFocus: "A single browsable truth for which components exist and how they behave."
  inScope:
    - "Composing multiple Storybook instances into one site"
    - "Tagging and filtering stories (e.g. experimental, stable)"
    - "Versioned catalogs released with component packages"
  outOfScope:
    - "Distributing the component library binaries themselves"
    - "Design token storage independent of code"
  color: "red"
