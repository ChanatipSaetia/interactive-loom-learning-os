challenges:
  - prompt: "Order the hot-reload pipeline from saving a story file to a rendered story (Part 1):"
    items:
      - id: "seq-3"
        text: "Story Indexer re-extracts meta and story exports to refresh the sidebar"
        icon: "ListTree"
      - id: "seq-1"
        text: "Developer saves the story file and the dev server detects the change"
        icon: "Save"
      - id: "seq-4"
        text: "Preview runtime renders the story component in its iframe"
        icon: "MonitorPlay"
      - id: "seq-2"
        text: "Dev server hot-replaces only the changed story module (HMR)"
        icon: "Zap"
    solution:
      - "seq-1"
      - "seq-2"
      - "seq-3"
      - "seq-4"
  - prompt: "Order the Controls tuning loop from panel click to live update (Part 2):"
    items:
      - id: "tune-2"
        text: "Args Updated event is sent to the preview runtime over the channel"
        icon: "Send"
      - id: "tune-1"
        text: "Reviewer edits a control widget (e.g. toggles disabled) in the addons panel"
        icon: "SlidersHorizontal"
      - id: "tune-3"
        text: "Preview re-renders the component with the merged new args"
        icon: "RefreshCw"
    solution:
      - "tune-1"
      - "tune-2"
      - "tune-3"
