challenges:
  - prompt: "Complete the architecture statement describing how a story reaches the screen (Part 1):"
    template: "In Component Story Format, the file's default export is the {zone-1}, which declares the title and component; each named export is one {zone-2}. The indexer scans these exports to build the sidebar, while the {zone-3} iframe mounts the component with the story's args as props."
    chips:
      - id: "chip-meta"
        text: "meta"
      - id: "chip-decorator"
        text: "decorator"
      - id: "chip-story"
        text: "story"
      - id: "chip-manager"
        text: "manager"
      - id: "chip-preview"
        text: "preview"
      - id: "chip-addon"
        text: "addon"
    solution:
      zone-1: "chip-meta"
      zone-2: "chip-story"
      zone-3: "chip-preview"
    explanation: "<strong>Correct!</strong> Meta is the file-level default export, each named export is one story, and the <em>preview</em> iframe is the runtime that actually renders your component — while the <em>manager</em> is just the chrome around it."
  - prompt: "Complete the safety-net statement forged from the testing track (Part 2):"
    template: "A {zone-1} scripts userEvent interactions so behavior is tested; the {zone-2} executes every story headlessly in CI; and {zone-3} diffing catches silent pixel changes — but its baseline approvals need {zone-4}, or the net becomes a rubber stamp."
    chips:
      - id: "chip-play"
        text: "play function"
      - id: "chip-argtypes"
        text: "argTypes table"
      - id: "chip-testrunner"
        text: "test runner"
      - id: "chip-composition"
        text: "composition"
      - id: "chip-visual"
        text: "visual regression"
      - id: "chip-snapshot"
        text: "MDX snapshot"
      - id: "chip-discipline"
        text: "owners and review discipline"
      - id: "chip-luck"
        text: "random luck"
    solution:
      zone-1: "chip-play"
      zone-2: "chip-testrunner"
      zone-3: "chip-visual"
      zone-4: "chip-discipline"
    explanation: "<strong>Correct! The safety net is forged.</strong> Play functions test behavior, the test runner executes stories as tests, visual regression guards pixels — and the Release-Day crisis proved that unreviewed baseline acceptance ships the bug anyway."
