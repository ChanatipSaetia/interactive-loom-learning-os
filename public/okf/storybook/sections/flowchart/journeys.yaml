- id: "journey_hot_reload"
  label: "Hot-Reload Loop"
  description: "From saving a story file to a freshly rendered story in the preview iframe."
  steps:
    - stepId: "step_author"
      name: "1. Save Story File"
      description: "The developer edits a story and the dev server detects the change."
      processGroup: "planning"
    - stepId: "step_hmr"
      name: "2. Hot-Replace Module"
      description: "HMR swaps the changed story module without reloading the whole app."
      processGroup: "execution"
    - stepId: "step_index"
      name: "3. Re-index Stories"
      description: "The indexer refreshes sidebar entries from the new exports."
      processGroup: "execution"
    - stepId: "step_render"
      name: "4. Render in Preview"
      description: "The preview runtime mounts the story with its args."
      processGroup: "execution"

- id: "journey_controls"
  label: "Controls Tuning Loop"
  description: "A reviewer mutates args live and the story re-renders instantly."
  steps:
    - stepId: "step_tune"
      name: "1. Edit a Control"
      description: "The reviewer toggles a boolean in the Controls panel."
      processGroup: "planning"
    - stepId: "step_rerender"
      name: "2. Live Re-render"
      description: "Args flow over the channel and the component repaints."
      processGroup: "evaluation"
