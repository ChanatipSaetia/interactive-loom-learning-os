- id: "step_author"
  type: "linear"
  initiatedBy: "frontend_dev"
  policy: "When Story Source Is Saved"
  command: "Persist Story File Change"
  handledBy: "dev_server"
  resultEvents:
    - id: "evt_file_saved"
      title: "Story File Saved"
      desc: "Bundler detects the changed .stories module in the graph"
  continuesAs: "step_hmr"
  description: "Developer saves Button.stories.ts with a new args tweak"

- id: "step_hmr"
  type: "linear"
  policy: "When Module Graph Is Invalidated"
  command: "Hot-Replace Story Module"
  handledBy: "dev_server"
  resultEvents:
    - id: "evt_module_replaced"
      title: "Story Module Hot-Replaced"
      desc: "Updated story module pushed to the preview runtime without a full reload"
  continuesAs: "step_index"
  description: "Vite/Webpack HMR swaps only the changed story module"

- id: "step_index"
  type: "linear"
  policy: "When Story Module Is Replaced"
  command: "Re-extract Meta & Story Exports"
  handledBy: "story_indexer"
  resultEvents:
    - id: "evt_index_updated"
      title: "Story Index Updated"
      desc: "Sidebar entries and story parameters refreshed from exports"
  continuesAs: "step_render"
  description: "Indexer re-reads default/named exports to refresh the sidebar"

- id: "step_render"
  type: "linear"
  policy: "When Selected Story Must Be Displayed"
  command: "Render Story Component in Preview Iframe"
  handledBy: "preview_runtime"
  resultEvents:
    - id: "evt_story_rendered"
      title: "Story Rendered"
      desc: "Component mounted in isolation with the story's args as props"
  continuesAs: "step_outcome"
  description: "Preview mounts the component with args; success or error decides the branch"

- id: "step_outcome"
  type: "branch"
  event: "evt_story_rendered"
  branches:
    - id: "branch_ok"
      label: "Story mounts cleanly"
      policy: "When Mount Succeeds"
      command: "Expose Story to Addons Panel"
      handledBy: "controls_addon"
      resultEvents:
        - id: "evt_interactive"
          title: "Story Interactive"
          desc: "Controls, Docs, and viewport tools bind to the live story"
    - id: "branch_error"
      label: "Render throws"
      dashed: true
      policy: "When Error Boundary Catches"
      command: "Display Error Overlay"
      handledBy: "preview_runtime"
      resultEvents:
        - id: "evt_error_shown"
          title: "Error Overlay Shown"
          desc: "Stack trace surfaces in the preview for immediate debugging"

- id: "step_tune"
  type: "linear"
  initiatedBy: "frontend_dev"
  policy: "When Reviewer Edits a Control Widget"
  command: "Dispatch Arg Update Over Channel"
  handledBy: "controls_addon"
  resultEvents:
    - id: "evt_args_updated"
      title: "Args Updated"
      desc: "New arg values sent from the manager to the preview runtime"
  continuesAs: "step_rerender"
  description: "Reviewer flips disabled or edits the label in the Controls panel"

- id: "step_rerender"
  type: "linear"
  policy: "When Args Updated"
  command: "Re-render Story With New Args"
  handledBy: "preview_runtime"
  resultEvents:
    - id: "evt_story_updated"
      title: "Story Live-Updated"
      desc: "Component re-renders with merged args in milliseconds"
  description: "Preview merges the updated args and repaints the story"
