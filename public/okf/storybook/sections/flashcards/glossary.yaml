- id: "story"
  word: "Story"
  pronunciation: "/ˈstɔː.ri/"
  category: "Core Format"
  shortDefinition: "A named export describing one specific state of one component (e.g. Primary, Disabled, Error)."
  detailedDefinition: "In Component Story Format, each story is a named export of a `.stories.ts` file. A story object typically declares `args` (the props to render), optional `parameters`, an optional `render` function, and tags. Because a story is plain ESM code, it is importable, testable, and diffable like any other module."
  whyItMatters: "Stories are the atomic unit of Storybook: they double as development fixtures, documentation examples, and the inputs to automated visual and interaction tests."
  dialogue:
    user: "How do I show the loading state of my Button?"
    aiThoughts: "They need one more named export for that state."
    aiQuestion: "Add `export const Loading: Story = { args: { loading: true } };` — a new story per state."

- id: "meta"
  word: "Meta"
  pronunciation: "/ˈmeɪ.tə/"
  category: "Core Format"
  shortDefinition: "The default export of a story file that describes the component as a whole."
  detailedDefinition: "Meta declares shared configuration for every story in the file: a `title` (which positions the component in the sidebar hierarchy, e.g. `Button`), the `component` itself (enabling autodocs and automatic Controls), and shared `argTypes` or `parameters`."
  whyItMatters: "Meta is the single source of component-level truth; without it Storybook cannot group stories, generate props tables, or infer control types."
  dialogue:
    user: "Where do I declare which component these stories belong to?"
    aiThoughts: "That is file-level configuration — the default export."
    aiQuestion: "Set `export default { title: 'Button', component: Button };` at the top of `Button.stories.ts`."

- id: "csf"
  word: "Component Story Format (CSF)"
  pronunciation: "/kəmˈpoʊ.nənt stɔː.ri ˈfɔːr.mæt/"
  category: "Core Format"
  shortDefinition: "The standard ES-module file format for writing stories using exports instead of a registry API."
  detailedDefinition: "CSF files (conventionally `Component.stories.ts`) use a default export for meta and named exports for stories. CSF 3 makes the `render` function optional and infers story names from export names. Newer CSF Factories wraps meta and stories in `preview.meta()` / `meta.story()` factory calls for stronger TypeScript type safety."
  whyItMatters: "Because stories are just module exports, they can be statically indexed by the bundler, type-checked, linted, and reused as test fixtures without any Storybook-specific DSL."
  dialogue:
    user: "Do I need a special registry call to register stories?"
    aiThoughts: "No — registration is implicit via exports."
    aiQuestion: "No registry needed: export default meta, export named stories, and Storybook indexes them automatically."

- id: "args"
  word: "Args & argTypes"
  pronunciation: "/ɑːɡz ænd ˈɑːɡ.taɪps/"
  category: "Interactivity"
  shortDefinition: "`args` are the props a story passes to the component; `argTypes` declare metadata (type, options, range) for each arg."
  detailedDefinition: "Each story's `args` object becomes the component's props. `argTypes` (usually declared once in meta) tell Controls how to render an editor for each prop — a boolean toggle, a color picker, a dropdown of options, or a numeric range — and power autodocs props tables."
  whyItMatters: "Args turn a static example into a playground: reviewers can flip booleans and edit strings live without touching code."
  dialogue:
    user: "How do I get a dropdown for the button size in the panel?"
    aiThoughts: "They need argTypes metadata for Controls to know the options."
    aiQuestion: "Declare `argTypes: { size: { options: ['sm','md','lg'], control: 'select' } }` in meta."

- id: "controls"
  word: "Controls"
  pronunciation: "/kənˈtroʊlz/"
  category: "Interactivity"
  shortDefinition: "The addon panel UI that edits a story's args live and re-renders the component instantly."
  detailedDefinition: "Controls reads the story's args and argTypes and renders an editor widget per arg. Mutating an arg re-renders the story in the preview with the new props, and the URL can encode args so an exact state is shareable."
  whyItMatters: "Controls replaces 'change a prop, recompile, screenshot' loops with instant manual exploration of the whole props surface."
  dialogue:
    user: "Can a designer try the disabled + loading combination without code?"
    aiThoughts: "Controls is exactly for ad-hoc state combinations."
    aiQuestion: "Yes — open the Controls tab and toggle `disabled` and `loading` in the panel."

- id: "decorator"
  word: "Decorator"
  pronunciation: "/ˈdek.ə.reɪ.tər/"
  category: "Interactivity"
  shortDefinition: "A wrapper function that adds providers or context around a story's render."
  detailedDefinition: "Decorators wrap a story to supply anything the component expects from outside itself: theme providers, routers, stores, or layout padding. They can be applied globally, per-file in meta, or per-story."
  whyItMatters: "Components in isolation still need their application context; decorators re-create that harness without importing the real app."
  dialogue:
    user: "My component crashes because it needs a ThemeProvider."
    aiThoughts: "A decorator is the idiomatic provider wrapper."
    aiQuestion: "Add `decorators: [Story => <ThemeProvider><Story /></ThemeProvider>]` in meta."

- id: "play"
  word: "Play Function"
  pronunciation: "/pleɪ ˈfʌŋk.ʃən/"
  category: "Testing"
  shortDefinition: "An async function attached to a story that automates interactions when the story runs."
  detailedDefinition: "A play function receives a user-interaction API (like `userEvent` and `screen`) and scripts clicks, typing, and assertions against the rendered story. Play functions execute both interactively in the browser and headlessly in CI via the Storybook test runner."
  whyItMatters: "The same code that demonstrates a workflow to humans becomes an executable interaction test — one artifact for docs and CI."
  dialogue:
    user: "How do I prove the modal opens when clicking the trigger?"
    aiThoughts: "Script the click as a play function."
    aiQuestion: "Add `play: async ({ userEvent, canvas }) => { await userEvent.click(...); }` to the story."

- id: "manager-preview"
  word: "Manager & Preview"
  pronunciation: "/ˈmæn.ɪ.dʒər ænd priːˈvjuː/"
  category: "Architecture"
  shortDefinition: "The Manager is Storybook's chrome (sidebar, toolbar, addons panel); the Preview is the iframe that actually renders your components."
  detailedDefinition: "Storybook is an app of two frames: the Manager runs the navigation and addon UI, while the Preview boots a separate runtime (built by Vite or Webpack) that imports your story files and renders the selected story into an iframe. The two frames communicate over the channel API, which is how addons like Controls send new args into the rendered story."
  whyItMatters: "Understanding the split explains why args changes re-render instantly and why addon builders must register code on both sides."
  dialogue:
    user: "Why does my component run in a separate iframe?"
    aiThoughts: "That is the preview/manager architecture."
    aiQuestion: "Isolation: the preview runtime loads only your component's module graph, keeping the manager UI stable."

- id: "addon"
  word: "Addon"
  pronunciation: "/əˈdɒn/"
  category: "Architecture"
  shortDefinition: "A plugin that extends Storybook's manager and preview — e.g. Controls, Actions, a11y, docs."
  detailedDefinition: "Addons register tooling into the manager UI and behaviors into the preview. First-party addons include Controls, Actions, Viewport, and Accessibility; the ecosystem adds design integration, theming, and test integrations."
  whyItMatters: "The addon model keeps Storybook core small while letting teams bolt on exactly the workflow tools they need."
  dialogue:
    user: "I want a click-logger panel while developing."
    aiThoughts: "That is what the Actions addon provides."
    aiQuestion: "Enable the Actions addon and wire event props via `parameters.actions` or `fn()` args."

- id: "docs-mdx"
  word: "Docs & MDX"
  pronunciation: "/dɒks ənd ˌem-diːˈeks/"
  category: "Documentation"
  shortDefinition: "Story pages rendered as documentation — autodocs generate props tables from meta; MDX mixes prose with live story embeds."
  detailedDefinition: "Each component can get a docs page: autodocs render stories, descriptions, and a props table automatically from meta and JSDoc. MDX files let authors interleave long-form prose, custom sections, and `<Story>` embeds that are still live, interactive components."
  whyItMatters: "Documentation stays in sync with code because it is generated from the same stories the tests run."
  dialogue:
    user: "How do I publish usage guidelines next to live examples?"
    aiThoughts: "Docs pages with MDX prose plus story embeds."
    aiQuestion: "Tag stories with `docs` and write an MDX page that embeds `<Canvas>` blocks between prose sections."

- id: "test-runner"
  word: "Test Runner & Visual Regression"
  pronunciation: "/test ˈrʌn.ər ænd ˈvɪʒ.u.əl rɪˈɡreʃ.ən/"
  category: "Testing"
  shortDefinition: "The CLI test runner executes every story (with its play function) in headless browsers; visual regression diffs screenshots between branches."
  detailedDefinition: "Storybook's test runner (test-storybook) boots the built Storybook and runs each story as a test in Playwright or Puppeteer, failing when a play function assertion throws. Visual regression tools like Chromatic snapshot every story per commit and block merges when pixels change unexpectedly."
  whyItMatters: "Together they convert the story catalog into a full regression suite covering rendering, behavior, and pixels across viewports."
  dialogue:
    user: "How do we stop silent UI regressions from merging?"
    aiThoughts: "Stories + snapshots + CI gating."
    aiQuestion: "Run the test runner and a visual regression service on every PR so changed pixels fail the build."
