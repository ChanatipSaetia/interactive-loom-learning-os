- id: procedural
  word: "Procedural Knowledge"
  pronunciation: "pruh-see-jer-uhl nol-ij"
  category: "Knowledge"
  shortDefinition: "Knowing the steps."
  detailedDefinition: "Knowing how to carry out a documented task. Brittle when the situation changes."
  whyItMatters: "Necessary, but not enough on its own."
- id: conceptual
  word: "Conceptual Knowledge"
  pronunciation: "kuhn-sep-choo-uhl nol-ij"
  category: "Knowledge"
  shortDefinition: "Knowing what the parts are, how they relate, and why."
  detailedDefinition: "The understanding that lets users reason about the system and work out undocumented steps."
  whyItMatters: "It's what makes transfer possible."
- id: transfer
  word: "Transfer"
  pronunciation: "trans-fur"
  category: "Knowledge"
  shortDefinition: "Applying learning to a new situation."
  detailedDefinition: "Acting correctly in a case the training never showed."
  whyItMatters: "No manual can document every case."
- id: mental-model
  word: "Mental Model"
  pronunciation: "men-tl mod-l"
  category: "Foundation"
  shortDefinition: "A person's inner picture of how a system works."
  detailedDefinition: "Don Norman separates the designer's model, the system image (UI + docs) and the user's model, which users build only from the system image."
  whyItMatters: "Wrong models cause confident mistakes."
- id: refutation
  word: "Refutation Text"
  pronunciation: "ref-yoo-tey-shuhn tekst"
  category: "Technique"
  shortDefinition: "Name the misconception, reject it, explain the truth."
  detailedDefinition: "A way of writing that makes readers notice the conflict between their belief and the truth."
  whyItMatters: "Stating the truth alone often doesn't replace a wrong belief."
- id: dual-coding
  word: "Dual Coding"
  pronunciation: "doo-uhl koh-ding"
  category: "Technique"
  shortDefinition: "Words plus visuals."
  detailedDefinition: "Pairing text with a simple diagram gives two routes into memory (Allan Paivio's theory)."
  whyItMatters: "Structures are easier to see than to read."
- id: cognitive-load
  word: "Cognitive Load"
  pronunciation: "kog-ni-tiv lohd"
  category: "Constraint"
  shortDefinition: "How much working memory a task uses."
  detailedDefinition: "Working memory holds only a few new items at once (John Sweller's cognitive load theory), so introduce few new concepts at a time."
  whyItMatters: "Overloaded readers retain nothing."
- id: explorable
  word: "Explorable Explanation"
  pronunciation: "ik-splawr-uh-buhl ek-spluh-ney-shuhn"
  category: "Interactive"
  shortDefinition: "An explanation you can play with."
  detailedDefinition: "Readers change inputs and watch the idea respond. Popularised by Bret Victor's 2011 essay."
  whyItMatters: "Discovering a relationship beats being told it."
- id: poe
  word: "Predict-Observe-Explain (POE)"
  pronunciation: "pee oh ee"
  category: "Interactive"
  shortDefinition: "Predict, see the real outcome, explain the difference."
  detailedDefinition: "A teaching strategy (White & Gunstone) that makes learners notice when their mental model is wrong."
  whyItMatters: "A failed prediction is the moment a model can be corrected."
- id: retrieval-practice
  word: "Retrieval Practice"
  pronunciation: "ri-tree-vuhl prak-tis"
  category: "Retention"
  shortDefinition: "Recalling from memory to strengthen it."
  detailedDefinition: "Also called the testing effect: quick recall questions beat re-reading."
  whyItMatters: "Understanding that isn't retrieved fades."
