title: "Teaching Concepts in Software Docs"
subtitle: "Help users understand the ideas behind a web app, not just the clicks"
estimatedTime: "40 min"
what:
  definition: "Teaching concepts in software docs means helping users build a correct mental model of how the product works, so they can act correctly even when the manual's steps don't cover their situation."
  summary: "Steps tell users what to click; concepts tell them why. This topic covers why understanding matters (mental models and transfer), techniques for explaining (analogies, worked examples, refutation, diagrams), interactive explanations (simulators, what-ifs, Predict → Observe → Explain), and findings from learning science that make understanding stick."
  bullets:
    - "Procedural vs conceptual knowledge, transfer, and Don Norman's three models"
    - "Analogy with limits, concrete before abstract, refutation, non-examples, dual coding, cognitive load"
    - "Explorable explanations, concept simulators, clickable flows, what-if scenarios, POE"
    - "Retrieval practice, spacing, self-explanation and explanatory feedback"
  tags:
    - documentation
    - instructional-design
    - mental-models
    - learning-science
    - explanation
why:
  summary: "No manual can document every situation. Users who understand the idea handle the undocumented cases; users who only know the clicks guess."
  impact: "Docs that teach only steps create the Hollow Clicker: users who follow the manual perfectly, then archive confidential data thinking it's deleted, or give a contractor access to every project."
