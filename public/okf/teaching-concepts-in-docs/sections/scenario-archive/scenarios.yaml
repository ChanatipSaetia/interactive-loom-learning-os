id: archive-not-delete
title: "Archive Is Not Delete"
intro: "Your project-management web app has an Archive button with a box-shaped icon. Every month, support gets tickets: some users are afraid to archive ('will I lose it?'), and others archive projects to 'get rid of' confidential data, which is still there. You own the docs."
nodes:
  start:
    prompt: "What's the root problem?"
    choices:
      - id: steps-problem
        text: "The steps for archiving are unclear"
        next: result-steps
      - id: model-problem
        text: "Users have the wrong mental model: they think archive means delete"
        next: technique
  result-steps:
    outcome:
      verdict: "You rewrite the three archiving steps beautifully. Users still archive confidential data thinking it's gone."
      lesson: "Users can already click the button. The problem is conceptual: their model of what archiving does is wrong."
      rating: c
  technique:
    prompt: "How do you fix the mental model?"
    choices:
      - id: add-fact
        text: "Add a line: 'Archived projects can be restored.'"
        next: result-fact
      - id: refute-plus
        text: "Refutation + diagram + non-example: 'You might think archiving deletes a project. It doesn't…', a diagram of Active → Archived → Restored, and 'Deleting is different: it removes the data permanently.'"
        next: check
  result-fact:
    outcome:
      verdict: "True, but skimmed over. The misconception survives."
      lesson: "Stating the truth often doesn't replace a wrong belief. Name the misconception and reject it explicitly."
      rating: b-minus
  check:
    prompt: "How do you check users really understand it?"
    choices:
      - id: what-if
        text: "A what-if with prediction: 'You archive a project with salary data. Can other workspace members still open it?' Then show the answer with explanatory feedback."
        next: result-a
      - id: read-confirm
        text: "A checkbox: 'I have read and understood this page'"
        next: result-checkbox
  result-a:
    outcome:
      verdict: "Many users predict 'no', see that the answer is 'yes, archived projects are only hidden', and read why. Tickets about lost and leaked archives drop sharply."
      lesson: "Wrong model named and refuted, shown in a diagram, then tested in a new situation with a prediction and explanatory feedback. That's teaching a concept, not just a click."
      rating: a
  result-checkbox:
    outcome:
      verdict: "Everyone ticks the box. The misconception is untouched."
      lesson: "Ticking a box isn't retrieval. Ask a question about a new situation and give feedback that explains why."
      rating: c
