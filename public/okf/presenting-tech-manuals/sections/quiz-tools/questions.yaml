- id: q1
  question: "You want to author slides as plain markdown in the same Git repo as the code, and still export a PPTX for stakeholders who demand PowerPoint. Which tool fits?"
  hint: "It is described as 'a README.md that stands up and gives a talk'."
  choices:
    - id: a
      text: "Marp"
      correct: true
      explanation: "Correct. Marp compiles CommonMark into themed slides and exports to HTML, PDF, and PPTX."
    - id: b
      text: "Redoc"
      correct: false
      explanation: "Redoc renders readable API references from OpenAPI specs — it does not make slide decks."
    - id: c
      text: "mdBook"
      correct: false
      explanation: "mdBook is a minimal docs site generator for pure-text handbooks, not a slide deck exporter."
- id: q2
  question: "Your developer audience keeps getting burned by API docs that drifted from the real API. What instrument makes the reference impossible to stale?"
  hint: "The manual becomes the running contract itself."
  choices:
    - id: a
      text: "Longer release-notes emails"
      correct: false
      explanation: "Prose release notes drift exactly like screenshots do. Generate the reference from the OpenAPI spec instead."
    - id: b
      text: "A Swagger UI console rendered from the OpenAPI spec"
      correct: true
      explanation: "Correct. Swagger UI (and Redoc) render the live contract — the reference cannot be out of date because it is generated from the code."
    - id: c
      text: "High-resolution screenshots of Postman requests"
      correct: false
      explanation: "A screenshot of a request is still a screenshot — it goes stale the moment the API changes. Render the spec itself."
- id: q3
  question: "Instead of a keynote, you want users to learn the Web App's new onboarding flow by clicking through it with highlight-and-explain overlays. Which category do you reach for?"
  hint: "A museum audio guide inside the actual room."
  choices:
    - id: a
      text: "Intro.js or Shepherd in-app tours"
      correct: true
      explanation: "Correct. Intro.js and Shepherd render step-by-step overlay tours on the live product screens."
    - id: b
      text: "Marp theme directives"
      correct: false
      explanation: "Marp makes slides; an overlay tour on live screens is the job of the In-App & In-Code Guided Tours category (Intro.js, Shepherd)."
    - id: c
      text: "OBS Studio"
      correct: false
      explanation: "OBS records video — clickable, self-serve overlay tours on running screens are Intro.js/Shepherd territory."
- id: q4
  question: "Where does the safety-net clip for a live product demo come from, and which tool makes it?"
  hint: "Recorded once, it lives three lives."
  choices:
    - id: a
      text: "A screen recording made with OBS Studio, reused as fallback clip, async manual, and docs GIF"
      correct: true
      explanation: "Correct. OBS Studio captures the real UI with narration; the same recording serves as fallback, async manual, and embedded clip."
    - id: b
      text: "A second presenter with a backup laptop running reveal.js"
      correct: false
      explanation: "reveal.js is a presentation framework, not a recording tool. The taught safety net is a pre-recorded OBS Studio clip."
    - id: c
      text: "An animated walkthrough generated by Docusaurus"
      correct: false
      explanation: "Docusaurus hosts docs sites; the fallback clip is a screen recording captured with OBS Studio."
- id: q5
  question: "Which markdown-deck tool is specifically described as a presentation that runs as an HTML/JS web app, deployable to the same web server as the product itself?"
  hint: "Its decks open in a browser tab like any other web app."
  choices:
    - id: a
      text: "Marp"
      correct: false
      explanation: "Marp exports static decks to HTML/PDF/PPTX; the browser-native HTML/JS presentation framework in this landscape is reveal.js."
    - id: b
      text: "reveal.js"
      correct: true
      explanation: "Correct. reveal.js builds presentations as HTML/JS web apps with nested slides and speaker notes."
    - id: c
      text: "VitePress"
      correct: false
      explanation: "VitePress builds documentation sites from markdown; the HTML/JS presentation framework is reveal.js."
