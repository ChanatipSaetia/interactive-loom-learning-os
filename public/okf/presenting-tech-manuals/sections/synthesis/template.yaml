challenges:
  - prompt: "Complete the audience doctrine (Track 1):"
    template: "Before choosing any tool, map your audience: {zone-1} need task walkthroughs of real UI screens, while {zone-2} read the manual defensively for runbooks and incident triage."
    chips:
      - id: chip-endusers
        text: "end users"
      - id: chip-operators
        text: "operators"
      - id: chip-executives
        text: "executives"
    solution:
      zone-1: "chip-endusers"
      zone-2: "chip-operators"
    explanation: "<strong>Correct!</strong> End users need task-oriented UI walkthroughs; operators read defensively (what breaks, how to see it, what to type). Executives were never one of the three taught archetypes."
  - prompt: "Complete the presentation arc (Track 1):"
    template: "The six-stage arc opens by hooking the audience with {zone-1}, proves the task in a {zone-2} of the running product, and closes by pinning the docs-site {zone-3}."
    chips:
      - id: chip-pain
        text: "the user's pain"
      - id: chip-arch-diagram
        text: "an architecture diagram"
      - id: chip-live-demo
        text: "live demo"
      - id: chip-permalink
        text: "permalink"
    solution:
      zone-1: "chip-pain"
      zone-2: "chip-live-demo"
      zone-3: "chip-permalink"
    explanation: "<strong>Correct!</strong> Hook with the pain (never the architecture diagram), prove one persona task in a live demo of the real product, and end on the permalink — findability beats memorability."
  - prompt: "Complete the instrument doctrine (Tracks 2 & 3):"
    template: "Authoring slides as markdown with {zone-1} keeps the deck in Git, rendering the OpenAPI spec with {zone-2} keeps the API reference un-stale, and recording the walkthrough with {zone-3} yields the live demo's fallback clip."
    chips:
      - id: chip-marp
        text: "Marp"
      - id: chip-swagger
        text: "Swagger UI"
      - id: chip-obs
        text: "OBS Studio"
      - id: chip-photoshop
        text: "Photoshop"
    solution:
      zone-1: "chip-marp"
      zone-2: "chip-swagger"
      zone-3: "chip-obs"
    explanation: "<strong>Correct!</strong> Marp compiles markdown decks that live in the repo, Swagger UI renders the API contract itself so it can never be stale, and OBS Studio records the clip that saves the live demo. Photoshop is a distractor — it appears nowhere in the realm."
