type: intro
title: "Presenting IT System, Web App & Developer Experience Manuals"
subtitle: "Turn documentation into presentations people actually finish — with markdown, code-based, and web-app presentation tools"
estimatedTime: "35 min"
moduleCount: 15
what:
  definition: "Presenting a user manual is the craft of turning written documentation for an IT system, Web App, or Developer Experience (DX) into a live, audience-shaped story — a guided walkthrough of one real task, proven in the running product, and backed by durable, findable reference material."
  summary: "Most manual presentations fail the same way: someone reads release notes aloud over an architecture diagram while the real audience — the people who must click buttons at 2am — silently disengages. This realm teaches the opposite: analyze the audience first, walk one realistic scenario end-to-end in the real UI, keep a fallback for the live demo, and hand everyone a permanent permalink to a docs site."
  bullets:
    - "Audience First: end users, operators/admins, and developers each need a completely different cut of the same manual"
    - "One-Scenario Arc: hook with the user's pain, walk one persona task end-to-end, show gotchas, end with a permalink"
    - "Markdown-Native Tooling: Marp, Slidev, and reveal.js keep slides in the same Git repo as the code"
    - "Docs-as-Code Delivery: Docusaurus, MkDocs, and VitePress turn the manual into a searchable, versioned web app"
    - "Live Demo with a Safety Net: every live demo of the product ships with a pre-recorded OBS fallback clip"
  tags:
    - "Technical Communication"
    - "Documentation"
    - "Presentation"
    - "Developer Experience"
    - "Docs-as-Code"
why:
  summary: "A manual nobody watches or finds is a manual that doesn't exist. Teams spend weeks writing documentation, then present it in the format least likely to stick — walls of text read aloud — and then wonder why the support queue never shrinks."
  impact: "Presentations grounded in one realistic task and delivered with the right instrument (a Marp deck for a release webinar, a Swagger UI playground for API consumers, an in-app tour for self-serve onboarding) measurably cut support tickets, speed up onboarding, and make the manual self-service instead of person-service."
