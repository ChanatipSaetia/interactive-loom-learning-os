- id: "step_init_filter"
  type: "linear"
  initiatedBy: "render_ticker"
  policy: "When Filtered Container Encountered In Scene Graph"
  command: "Calculate Padded Bounding Box & Push Filter State"
  handledBy: "filter_system"
  resultEvents:
    - id: "evt_bounds_calculated"
      title: "Padded Bounding Box Computed"
      desc: "Bounding rect expanded with filter.padding margin"
  continuesAs: "step_acquire_target"
  description: "FilterSystem intercepts rendering and computes offscreen canvas dimensions"

- id: "step_acquire_target"
  type: "linear"
  policy: "When Padded Dimensions Known"
  command: "Lease Temporary Offscreen Framebuffer"
  handledBy: "target_pool"
  resultEvents:
    - id: "evt_target_acquired"
      title: "RenderTarget Leased From Pool"
      desc: "Clean offscreen texture allocated without VRAM churn"
  continuesAs: "step_render_children"
  description: "Leases pre-allocated RenderTarget matching padded dimensions"

- id: "step_render_children"
  type: "linear"
  policy: "When Offscreen Target Bound"
  command: "Render Child Display Tree Into Offscreen Target"
  handledBy: "display_container"
  resultEvents:
    - id: "evt_children_rendered"
      title: "Child Hierarchy Rendered Offscreen"
      desc: "Sprites and geometry drawn into offscreen texture buffer"
  continuesAs: "step_bind_shader"
  description: "Container renders all children into the leased RenderTarget"

- id: "step_bind_shader"
  type: "linear"
  policy: "When Offscreen Texture Complete"
  command: "Upload Uniforms, Textures, & uFilterMatrix"
  handledBy: "shader_program"
  resultEvents:
    - id: "evt_shader_ready"
      title: "Shader Program & Uniforms Configured"
      desc: "Vertex/fragment uniforms, samplers, and matrices bound to GPU"
  continuesAs: "step_branch_pass"
  description: "Prepares shader program with matrix mapping and uniform values"

- id: "step_branch_pass"
  type: "branch"
  event: "evt_shader_ready"
  branches:
    - id: "branch_single_pass"
      label: "Single-Pass Effect"
      policy: "If Filter Has Single Shader Pass"
      command: "Execute Fragment Quad Directly To Destination Framebuffer"
      handledBy: "gpu_driver"
      resultEvents:
        - id: "evt_single_pass_completed"
          title: "Single-Pass Filter Rendered"
          desc: "Output composited to target buffer in one GPU draw call"
    - id: "branch_multi_pass"
      label: "Multi-Pass Convolution"
      dashed: true
      policy: "If Filter Has Multiple Sequential Passes"
      command: "Execute Ping-Pong Convolution Intermediate Passes"
      handledBy: "gpu_driver"
      resultEvents:
        - id: "evt_multi_pass_completed"
          title: "Multi-Pass Ping-Pong Completed"
          desc: "Sequential convolution passes combined into final output"

- id: "step_recycle_targets"
  type: "linear"
  policy: "When Filter Execution Finishes"
  command: "Return Temporary Framebuffers Back To Pool"
  handledBy: "target_pool"
  resultEvents:
    - id: "evt_targets_recycled"
      title: "RenderTargets Recycled To Pool"
      desc: "Offscreen textures released for next frame without memory leaks"
  description: "FilterSystem cleans up and returns all leased buffers"
