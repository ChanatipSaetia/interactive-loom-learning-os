- id: "journey_single_pass"
  label: "Single-Pass Shader Execution"
  description: "Standard execution path for single-pass filters like ColorMatrixFilter or AlphaFilter."
  steps:
    - stepId: "step_init_filter"
      name: "1. Filter Interception & Padding"
      description: "FilterSystem computes padded bounds around the container."
      processGroup: "planning"
    - stepId: "step_acquire_target"
      name: "2. Pool Allocation"
      description: "Leases temporary RenderTarget from internal pool."
      processGroup: "execution"
    - stepId: "step_render_children"
      name: "3. Offscreen Draw"
      description: "Container renders child sprites into offscreen target."
      processGroup: "execution"
    - stepId: "step_bind_shader"
      name: "4. Uniform Binding"
      description: "Shader program uploads uFilterMatrix and uniforms."
      processGroup: "execution"
    - stepId: "step_recycle_targets"
      name: "5. Texture Recycling"
      description: "Returns leased framebuffers back to pool."
      processGroup: "evaluation"

- id: "journey_multi_pass"
  label: "Multi-Pass Ping-Pong Convolution"
  description: "Execution lifecycle for multi-pass filters like separable Gaussian blur or Kawase blur."
  steps:
    - stepId: "step_init_filter"
      name: "1. Padded Bounds"
      description: "Calculates expanded bounding box for blur halo."
      processGroup: "planning"
    - stepId: "step_acquire_target"
      name: "2. Ping-Pong Targets"
      description: "Leases pair of RenderTargets for intermediate passes."
      processGroup: "execution"
    - stepId: "step_render_children"
      name: "3. Offscreen Capture"
      description: "Renders unblurred source into first target."
      processGroup: "execution"
    - stepId: "step_bind_shader"
      name: "4. Multi-Pass Shader"
      description: "Executes horizontal and vertical passes across ping-pong buffers."
      processGroup: "execution"
    - stepId: "step_recycle_targets"
      name: "5. Pool Cleanup"
      description: "Recycles intermediate buffers back to pool."
      processGroup: "evaluation"
