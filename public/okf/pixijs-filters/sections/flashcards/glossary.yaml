- id: "filtersystem"
  word: "FilterSystem"
  pronunciation: "/ˈfɪltər ˈsɪstəm/"
  category: "Core Architecture"
  shortDefinition: "The core PixiJS rendering subsystem that coordinates filter stacks, offscreen targets, and shader passes."
  detailedDefinition: "FilterSystem manages the lifecycle of filter execution. When a filtered container is drawn, FilterSystem computes padded bounding rectangles, pushes temporary RenderTargets, executes shader passes, and composites pixels to the target destination."
  whyItMatters: "Abstracts low-level WebGL framebuffer binding, viewport scaling, and multi-pass ping-pong buffer management into a clean declarative API."
  dialogue:
    user: "How does PixiJS know when to draw to an offscreen buffer?"
    aiThoughts: "Explain the FilterSystem push/pop interception mechanism."
    aiQuestion: "When the renderer encounters an object with `filters.length > 0`, it calls `filterSystem.push()` to redirect child drawing into a temporary RenderTarget."

- id: "rendertarget"
  word: "RenderTarget Pool"
  pronunciation: "/ˈrɛndər ˈtɑːrɡɪt puːl/"
  category: "Memory & Assets"
  shortDefinition: "A reusable pool of GPU framebuffers and textures used for intermediate offscreen filter rendering."
  detailedDefinition: "Creating WebGL textures and framebuffers dynamically causes severe garbage collection pauses and GPU memory fragmentation. PixiJS maintains a pool of RenderTargets, leasing them during filter passes and recycling them immediately after."
  whyItMatters: "Prevents VRAM allocation churn and ensures consistent 60 FPS performance during heavy post-processing effects."
  dialogue:
    user: "Does applying filters create new GPU textures every single frame?"
    aiThoughts: "Clarify RenderTarget pooling vs fresh allocation."
    aiQuestion: "No! PixiJS borrows existing RenderTargets from its internal pool and returns them immediately after shader compositing."

- id: "fragment-shader"
  word: "Fragment Shader"
  pronunciation: "/ˈfræɡmənt ˈʃeɪdər/"
  category: "Shaders & GLSL"
  shortDefinition: "A GPU program executed for every pixel to compute color, alpha, and visual transformations."
  detailedDefinition: "In PixiJS filters, the fragment shader receives the offscreen texture via the uniform `uSampler` and texture coordinates via `vTextureCoord`. It calculates per-pixel colors using math algorithms (e.g. convolutions, color matrices, noise functions)."
  whyItMatters: "Provides total per-pixel artistic control, enabling real-time lighting, distortion, bloom, and stylized rendering."
  dialogue:
    user: "What is the primary input to a filter fragment shader?"
    aiThoughts: "Identify the sampler and coordinate uniforms."
    aiQuestion: "The offscreen texture `uSampler` containing the rendered display object, sampled at `vTextureCoord`!"

- id: "filter-padding"
  word: "Filter Padding"
  pronunciation: "/ˈfɪltər ˈpædɪŋ/"
  category: "Rendering Bounds"
  shortDefinition: "Extra margin added around a display object bounding box to prevent clipping outward visual effects."
  detailedDefinition: "Effects like `BlurFilter`, `GlowFilter`, and `DropShadowFilter` generate pixels that extend outside the original geometry boundaries. Setting `filter.padding` expands the offscreen RenderTarget dimensions so these blurred edges are not harshly clipped."
  whyItMatters: "Without padding, blurred sprites appear inside hard square cutoffs matching their original rectangular sprite bounding boxes."
  dialogue:
    user: "Why is my drop shadow cut off at the edge of the sprite?"
    aiThoughts: "Identify missing filter padding."
    aiQuestion: "Increase `filter.padding` (e.g. `filter.padding = 20`) to give the offscreen render target enough margin for the shadow!"

- id: "multi-pass"
  word: "Multi-Pass Filter"
  pronunciation: "/ˈmʌlti pæs ˈfɪltər/"
  category: "Pipeline Architecture"
  shortDefinition: "A filter technique executing multiple sequential shader stages using ping-pong intermediate textures."
  detailedDefinition: "Complex effects (such as separable 2D Gaussian blurs or bloom) cannot be calculated in a single shader pass. A multi-pass filter renders pass 1 into texture A, uses texture A as input for pass 2 into texture B, and repeats until the final composite."
  whyItMatters: "Reduces computational complexity of 2D convolutions from O(N²) to O(2N), turning unplayable lag into smooth 60 FPS rendering."
  dialogue:
    user: "Why is a 2-pass blur faster than a single-pass 2D convolution blur?"
    aiThoughts: "Highlight 1D separable math efficiency."
    aiQuestion: "A separable blur performs a horizontal 1D pass then a vertical 1D pass (N + N samples), rather than an N x N 2D grid of samples per pixel!"

- id: "kawase-blur"
  word: "Kawase Blur"
  pronunciation: "/kɑːˈwɑːseɪ blɜːr/"
  category: "Algorithms"
  shortDefinition: "A fast multi-pass box-offset blur algorithm optimized for high performance on mobile GPUs."
  detailedDefinition: "Kawase Blur applies multiple successive passes with increasing sampling offsets around the center pixel. It yields a smooth, soft blur nearly indistinguishable from Gaussian blur but requires far fewer texture fetches per pass."
  whyItMatters: "The standard choice for real-time mobile games, UI glassmorphism, and bloom effects where Gaussian blur is too expensive."
  dialogue:
    user: "Which blur filter should I use for smooth performance on mobile web?"
    aiThoughts: "Recommend Kawase blur over Gaussian."
    aiQuestion: "Use `KawaseBlurFilter` from pixi-filters! It provides smooth blur quality with minimal GPU fillrate overhead."

- id: "displacement-filter"
  word: "DisplacementFilter"
  pronunciation: "/dɪsˈpleɪsmənt ˈfɪltər/"
  category: "Effects"
  shortDefinition: "A filter using pixel color channels from a map texture to offset the sampling coordinates of the source."
  detailedDefinition: "DisplacementFilter reads the Red and Green channels of a displacement sprite (e.g. perlin noise or water ripples) and uses those values as (dX, dY) coordinate offsets when sampling the target texture, creating refraction and distortion."
  whyItMatters: "Enables realistic water ripples, shockwaves, glass refraction, heat haze, and magical warp portals."
  dialogue:
    user: "How do I create an animated water ripple effect across a game map?"
    aiThoughts: "Describe DisplacementFilter with a scrolling noise sprite."
    aiQuestion: "Create a `DisplacementFilter` pointing to a seamless noise sprite, and increment the displacement sprite position in your Ticker loop!"

- id: "color-matrix-filter"
  word: "ColorMatrixFilter"
  pronunciation: "/ˈkʌlər ˈmeɪtrɪks ˈfɪltər/"
  category: "Color & Tones"
  shortDefinition: "A single-pass 5x4 matrix transformation filter for brightness, contrast, hue, saturation, and color grading."
  detailedDefinition: "ColorMatrixFilter multiplies each pixel RGBA vector by a 5x4 transformation matrix. PixiJS provides built-in presets including `desaturate()`, `sepia()`, `hue()`, `brightness()`, `contrast()`, `night()`, and `predator()`."
  whyItMatters: "Extremely fast single-pass filter that enables instant screen transitions, damage flashes, night mode tinting, and retro color grading."
  dialogue:
    user: "How do I make the whole screen black-and-white when the player dies?"
    aiThoughts: "Recommend ColorMatrixFilter desaturation."
    aiQuestion: "Apply a `ColorMatrixFilter` to your root container and call `filter.desaturate()`!"

- id: "cache-as-bitmap"
  word: "cacheAsBitmap"
  pronunciation: "/kæʃ æz ˈbɪtmæp/"
  category: "Performance Optimization"
  shortDefinition: "A container property that bakes complex child display trees and filters into a single static GPU texture."
  detailedDefinition: "When `container.cacheAsBitmap = true`, PixiJS renders the container and its active filters once into a private RenderTexture. In subsequent frames, it draws that single cached texture as a normal sprite, bypassing all filter shader calculations."
  whyItMatters: "Transforms heavy multi-pass filter costs from an ongoing 60 FPS tax into a one-time setup cost for static UI backgrounds and cards."
  dialogue:
    user: "My static UI panel has heavy drop shadows and blurs that lag the game. How do I fix it?"
    aiThoughts: "Suggest cacheAsBitmap."
    aiQuestion: "Enable `uiContainer.cacheAsBitmap = true`! PixiJS will bake the panel and filters into a single texture and draw it in 1 batched quad."
