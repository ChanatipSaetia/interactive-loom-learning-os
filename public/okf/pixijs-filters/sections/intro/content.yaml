type: intro
title: "PixiJS Filters & Post-Processing Shaders"
subtitle: "GPU-accelerated visual effects, custom fragment shaders, and the FilterSystem architecture"
estimatedTime: "30 min"
moduleCount: 14
what:
  definition: "PixiJS Filters are post-processing shader programs that intercept the rendering of a DisplayObject or Container, capture its output into an offscreen RenderTarget, and execute GPU fragment shaders to transform pixels."
  summary: "A powerful effects subsystem in PixiJS that enables blurs, color grading, displacement maps, glows, outlines, and custom GLSL/WGSL shaders with automatic bounding box padding and render target pooling."
  bullets:
    - "Post-Processing Pipeline: Intercepts display tree rendering into offscreen framebuffers"
    - "Built-in & Community Filters: Blur, ColorMatrix, Displacement, Noise, Glow, Outline, Shockwave"
    - "Custom GLSL Shaders: Write custom vertex and fragment shaders with animated uniforms"
    - "FilterSystem & Resource Pooling: Reusable RenderTarget pools to prevent VRAM memory churn"
  tags:
    - "PixiJS"
    - "GLSL"
    - "WebGL"
    - "Shaders"
    - "Post-Processing"
why:
  summary: "Standard 2D sprite rendering is limited to linear tinting and alpha blending. Creating atmospheric effects like heat distortion, bloom, chromatic aberration, or dynamic drop shadows requires per-pixel fragment manipulation."
  impact: "PixiJS Filters provide hardware-accelerated post-processing without writing complex framebuffer ping-pong pipelines from scratch, giving 2D games and web applications studio-grade visual polish."
