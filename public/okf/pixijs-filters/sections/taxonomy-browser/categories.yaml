- type: "taxonomy-category"
  icon: "Sparkles"
  title: "Spatial & Convolution Blurs"
  subtitle: "Gaussian, Kawase, and Directional Blurs"
  color: "sapphire"
  description: "Algorithms that blend adjacent pixel neighborhoods to create defocus, motion blur, and soft glowing aesthetics."
  details: "Includes BlurFilter (separable 2-pass Gaussian), KawaseBlurFilter (fast multi-pass box offset), MotionBlurFilter, and ZoomBlurFilter."
  analogy: "Like viewing the world through frosted glass or a camera lens shifted out of focus."
  primaryFocus: "Softening edges, depth of field, UI glassmorphism, and atmospheric glow"
  inScope:
    - "Multi-pass ping-pong texture sampling"
    - "Configurable kernel size and sampling quality"
    - "Separable horizontal and vertical convolution passes"
  outOfScope:
    - "Directional pixel displacement or geometric warping"

- type: "taxonomy-category"
  icon: "Palette"
  title: "Color & Tonal Grading"
  subtitle: "Matrix Transformations & Tonal Grading"
  color: "mauve"
  description: "Single-pass shader operations that transform RGBA color vectors for artistic color correction, grading, and visual state indicators."
  details: "Includes ColorMatrixFilter (5x4 linear color matrix), AdjustmentFilter (gamma, saturation, contrast), AlphaFilter, and ColorOverlayFilter."
  analogy: "Like placing colored optical filters or vintage film lenses over a camera."
  primaryFocus: "Fast single-pass color manipulation, damage effects, day/night cycles, and retro color palettes"
  inScope:
    - "Instantaneous matrix multiplication on RGBA vectors"
    - "Single-pass zero ping-pong overhead"
    - "Built-in presets (sepia, grayscale, invert, polaroid, night)"
  outOfScope:
    - "Sampling neighboring pixel coordinates"

- type: "taxonomy-category"
  icon: "Waves"
  title: "Geometric & Coordinate Warping"
  subtitle: "UV Coordinate Distortion & Refraction"
  color: "teal"
  description: "Filters that read secondary texture maps or mathematical equations to perturb UV texture sampling coordinates."
  details: "Includes DisplacementFilter (normal map / noise map sampling), ShockwaveFilter (expanding spherical waves), BulgePinchFilter, and TwistFilter."
  analogy: "Like looking at an image reflected on undulating water or through a magnifying lens."
  primaryFocus: "Simulating physical optical distortion, shockwaves, whirlpools, and fluid surfaces"
  inScope:
    - "Secondary texture map binding and sampling"
    - "Dynamic UV coordinate offset calculation"
    - "Time-based wave propagation and radial distortions"
  outOfScope:
    - "Modifying mesh vertex buffer positions directly"

- type: "taxonomy-category"
  icon: "Layers"
  title: "Stylized & Edge Effects"
  subtitle: "Outlines, Glows, Shadows & CRT Retro"
  color: "peach"
  description: "Specialized post-processing shaders that generate outlines, halos, drop shadows, and retro display characteristics."
  details: "Includes GlowFilter, OutlineFilter, DropShadowFilter, CRTFilter, GlitchFilter, and PixelateFilter."
  analogy: "Like graphic design stroke layers and vintage cathode-ray tube television scanlines."
  primaryFocus: "Unit selection indicators, combat emphasis, user interface shadows, and retro aesthetics"
  inScope:
    - "Alpha threshold edge detection and expansion"
    - "Color tinting of peripheral blur halos"
    - "Scanline, curvature, and chromatic aberration simulation"
  outOfScope:
    - "Volumetric 3D raymarched lighting"

- type: "taxonomy-category"
  icon: "Code"
  title: "Custom GLSL & WGSL Shaders"
  subtitle: "Bespoke Vertex & Fragment Programs"
  color: "green"
  description: "User-defined GPU shader programs implemented via the PIXI.Filter base class with custom uniforms and shaders."
  details: "Allows developers to write arbitrary GLSL (WebGL) or WGSL (WebGPU) code, declare animated uniforms, bind multi-texture samplers, and build proprietary visual effects."
  analogy: "Like having direct access to the GPU painting canvas with custom mathematical brushes."
  primaryFocus: "Unique gameplay mechanics, procedural terrain generation, custom dissolve shaders, and custom transitions"
  inScope:
    - "Custom vertex and fragment shader source code"
    - "Binding custom CPU uniform values (time, resolution, mouse coords)"
    - "Multi-texture custom sampling"
  outOfScope:
    - "Fixed-function legacy pipeline rendering"
