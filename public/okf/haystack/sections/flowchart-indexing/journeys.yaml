- id: "indexing-flow"
  label: Indexing Pipeline
  description: "Raw files are converted, chunked, embedded, and stored."
  steps:
    - stepId: start_indexing
      name: "Start Indexing"
      description: "Files are loaded from a document directory. Indexing begins by reading all supported file formats."
    - stepId: convert_files
      name: "Convert to Text"
      description: "Documents in various formats (PDF, DOCX, TXT) are converted to plain text for uniform processing."
      processGroup: execution
    - stepId: split_texts
      name: "Split into Chunks"
      description: "Large text documents are split into smaller, overlapping chunks to fit model context windows."
      processGroup: execution
    - stepId: compute_embeddings
      name: "Compute Embeddings"
      description: "Each text chunk is passed through an embedding model to produce a vector representation for semantic search."
      processGroup: execution
    - stepId: write_docs
      name: "Store in Document Store"
      description: "Chunks and their embeddings are saved to the document store (e.g., SQLite, FAISS) for later retrieval."
      processGroup: execution
