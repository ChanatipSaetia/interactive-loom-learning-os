estimatedTime: "7 min read"
moduleCount: 10

what:
  definition: "Haystack 2.x is an open-source Python framework designed to build composable, production-grade LLM applications, semantic search, and RAG pipelines."
  summary: "Comprehensive guide to Haystack 2.x — the open-source LLM orchestration and RAG pipeline framework."
  bullets:
    - "Pipeline DAG architecture for DocumentStores, Retrievers, and Generators"
    - "Hybrid search combining BM25 keyword matching and dense vector embeddings"
    - "Production component validation, error handling, and latency optimization"
  tags:
    - "Haystack 2.x"
    - "RAG Pipelines"
    - "Vector Search"
    - "LLM Orchestration"

why:
  summary: "Basic RAG tutorials break down in production due to static chunking, retriever mismatch, and unhandled component state errors."
  impact: "Haystack 2.x provides modular component validation, typed pipeline connections, and seamless model switching."

