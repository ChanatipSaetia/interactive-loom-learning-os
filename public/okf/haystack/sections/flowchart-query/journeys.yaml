- id: "rag-query"
  label: RAG Query Pipeline
  description: "Query is embedded, documents retrieved, ranked, and LLM generates answer."
  steps:
    - stepId: submit_query
      name: "Submit Query"
      description: "User types a question into the chat interface. The query enters the RAG pipeline."
    - stepId: embed_query
      name: "Embed Query"
      description: "The query text is passed through the same embedding model used during indexing, producing a vector for comparison."
      processGroup: planning
    - stepId: retrieve
      name: "Retrieve Documents"
      description: "The query vector is compared against stored document embeddings using similarity search. Top-k matching chunks are returned."
      processGroup: execution
    - stepId: rank
      name: "Rank Results"
      description: "Retrieved chunks are re-scored and ranked by a cross-encoder model for higher precision."
      processGroup: evaluation
    - stepId: build_prompt
      name: "Build Prompt"
      description: "Ranked chunks are combined with the original query into a prompt template for the LLM."
      processGroup: planning
    - stepId: generate_answer
      name: "Generate Answer"
      description: "LLM reads the enriched prompt and generates a grounded answer based on the retrieved context."
      processGroup: execution

- id: "simple-retrieval"
  label: "Simple Retrieval (No LLM)"
  description: "Query is embedded and documents retrieved directly without RAG."
  steps:
    - stepId: embed_query
      name: "Embed Query"
      description: "The query is converted to a vector using the embedding model."
      processGroup: planning
    - stepId: retrieve
      name: "Retrieve Documents"
      description: "Vector similarity search finds matching document chunks, which are returned directly without LLM generation."
      processGroup: execution
