- id: q_parkinsons_law
  question: "What is Parkinson's Law, and why does it matter for meetings?"
  choices:
    - id: a
      text: "Work expands to fill the time available for its completion."
      correct: true
      explanation: "Exactly! If you schedule a 60-minute meeting, the discussion will fill all 60 minutes, even if the actual problem could have been solved in 15 minutes."
    - id: b
      text: "Every project requirement will double in size once code starts being written."
      correct: false
      explanation: "This describes Scope Creep or planning optimism, not Parkinson's Law."
    - id: c
      text: "Meetings double in attendance size when project deadlines are missed."
      correct: false
      explanation: "While common in high-overhead projects, this is not the definition of Parkinson's Law."
  hint: "Think about how meetings stretch out to fit calendar blocks."

- id: q_async_first
  question: "When is an asynchronous design document (RFC) better than a synchronous meeting?"
  choices:
    - id: a
      text: "When the problem is well-defined and we need technical feedback from multiple engineers."
      correct: true
      explanation: "Yes! Writing down solutions and soliciting comments asynchronously protects engineering focus and creates a permanent record of decisions."
    - id: b
      text: "When there is a critical database incident and the site is down."
      correct: false
      explanation: "An active incident requires immediate high-bandwidth real-time syncs, not waiting for async comments."
    - id: c
      text: "When team members have low alignment and conflict needs to be resolved."
      correct: false
      explanation: "Conflicting viewpoints are best aligned in a brief, focused live discussion to avoid long, exhausting text arguments."
  hint: "Think about protecting maker focus time vs resolving urgent issues."

- id: q_standup_rule
  question: "What is the primary rule of an effective Daily Standup (Sync) meeting?"
  choices:
    - id: a
      text: "Focus strictly on identifying blockers and alignment, keeping the duration under 15 minutes."
      correct: true
      explanation: "Correct! The standup is a quick checkpoint, not a technical deep-dive. Detail troubleshooting should be pushed to separate sub-group discussions."
    - id: b
      text: "Every developer must walk through their code changes line-by-line."
      correct: false
      explanation: "Doing code review in a daily sync wastes everyone else's time and disrupts the meeting's speed."
    - id: c
      text: "Use the meeting to update task tracking software boards live."
      correct: false
      explanation: "Updating Jira or boards live during the call slows down momentum and is boring for the team."
  hint: "The meeting should feel like a quick sports team huddle."
