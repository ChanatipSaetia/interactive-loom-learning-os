id: boss-encounter
title: "Boss Encounter"
intro: "You face a massive elemental-resistant boss in a narrow chamber. Your party is low on healing. What's your strategy?"
nodes:
  start:
    prompt: "The boss has resistance to Fire and Cold. Your Ki pool is full (5 Ki). What's your opening move?"
    choices:
      - id: four_point_open
        text: "All-in with Four Point Attack — four guaranteed elemental hits bypass resistance splitting"
        next: four_point-result
      - id: spell_open
        text: "Cast Call Lightning — lightning damage ignores the boss's fire/cold resistance"
        next: spell-result
      - id: defense_open
        text: "Flowing Barrier first — survive the boss's opening barrage"
        next: defense-result
  four_point-result:
    outcome:
      verdict: "Four Point Attack devastates the boss with four different elements. Even with two resistances, Lightning and Acid hit full damage."
      lesson: "Four Point Attack's strength is resistance coverage. Four elements mean at most two are resisted."
      rating: a
  spell-result:
    outcome:
      verdict: "Call Lightning deals solid lightning damage, but you spent Ki and your action. The boss closes distance and hits your party hard."
      lesson: "Single-element spells are predictable. Bosses often resist one or two elements, making single-element focus risky."
      rating: b-plus
  defense-result:
    outcome:
      verdict: "Flowing Barrier absorbs the boss's attacks, but you lost a turn dealing damage. The fight drags on longer."
      lesson: "Defense-first is safe but passive. Four Element Monk excels at overwhelming damage — use it."
      rating: c
