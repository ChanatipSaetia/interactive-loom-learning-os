- id: ki-points
  word: "Ki Points"
  pronunciation: "key POINTS"
  category: mechanic
  shortDefinition: "Resource pool spent on monk abilities and elemental spellcasting."
  detailedDefinition: "Ki Points are the core resource for Four Element Monk. They scale with Monk level (starting at 2 at level 2, reaching 5 at level 13). Elemental spells cost Ki to cast, Twin Elemental Wrath costs 1 Ki, and Four Point Attack costs 4 Ki. Ki refreshes on a Short Rest."
  whyItMatters: "Every aspect of the build revolves around Ki economy. Managing Ki spending between combat rounds determines your damage output and survivability."
  dialogue:
    user: "How many Ki do I get?"
    aiThoughts: "Player needs Ki scaling info."
    aiQuestion: "Ki scales with Monk level: 2 at lvl 2, 3 at lvl 5, 4 at lvl 11, 5 at lvl 13. All refresh on Short Rest."

- id: elemental-attunement
  word: "Elemental Attunement"
  pronunciation: "el-uh-MEN-tul uhn-TOO-neh-ment"
  category: feature
  shortDefinition: "Gain cantrips from all four elemental schools."
  detailedDefinition: "At Monk 3, you gain access to one cantrip from each elemental school: Fire (Produce Flame), Cold (Ray of Frost), Lightning (Shocking Grasp), and Acid (Acid Splash). At Monk 11, you can change these cantrips on a Long Rest."
  whyItMatters: "Your baseline damage options. Acid Splash is especially valuable since it hits multiple targets."
  dialogue:
    user: "What cantrips do I get?"
    aiThoughts: "Player needs cantrip list."
    aiQuestion: "Produce Flame, Ray of Frost, Shocking Grasp, and Acid Splash. Swap on Long Rest at Monk 11+."

- id: twin-elemental-wrath
  word: "Twin Elemental Wrath"
  pronunciation: "TWIN el-uh-MEN-tul RATH"
  category: feature
  shortDefinition: "Infuse unarmed strikes with two elemental damages for 1 Ki."
  detailedDefinition: "At Monk 3, spend 1 Ki to attune two unarmed strikes with elemental damage. Choose two elements from Fire, Cold, Lightning, or Acid. Each attuned strike deals 1d6 of the chosen elemental damage on top of your normal unarmed strike damage. Attunements last until end of next turn."
  whyItMatters: "Your most-used combat ability. Consistent elemental damage on every attack, triggering elemental resistances and vulnerabilities."
  dialogue:
    user: "Should I use Twin Elemental Wrath every fight?"
    aiThoughts: "Player needs usage guidance."
    aiQuestion: "Yes — 1 Ki for two 1d6-infused strikes is excellent value. Pair with high-Dexterity builds for maximum hit rate."

- id: four-point-attack
  word: "Four Point Attack"
  pronunciation: "four point uh-TACK"
  category: feature
  shortDefinition: "Make four unarmed strikes, each infused with a different element for 4 Ki."
  detailedDefinition: "At Monk 11, spend 4 Ki to make four unarmed strikes. Each strike is automatically attuned to a different element (one Fire, one Cold, one Lightning, one Acid), dealing 1d6 extra elemental damage per strike. Cannot miss — each strike automatically hits a target within reach."
  whyItMatters: "Your ultimate nuke. Bypasses resistance splitting and guarantees four elemental hits. Devastating against single targets or groups."
  dialogue:
    user: "Is Four Point Attack worth 4 Ki?"
    aiThoughts: "Player weighs Ki cost."
    aiQuestion: "Four guaranteed hits with different elements — it shredssingle targets and ignores resistance. Best saved for bosses."

- id: elemental-mastery
  word: "Elemental Mastery"
  pronunciation: "el-uh-MEN-tul MAS-ter-ee"
  category: feature
  shortDefinition: "Cast elemental spells without spending Ki points."
  detailedDefinition: "At Monk 15, your elemental spells no longer consume Ki points. You can still spend Ki to cast them at a higher level, but the base cast is free. This transforms your Ki economy dramatically."
  whyItMatters: "Game-changing at level 15. You can spam Conjure Flame, Ice Knife, and Call Lightning without touching your Ki pool."
  dialogue:
    user: "What changes at Monk 15?"
    aiThoughts: "Player needs late-game info."
    aiQuestion: "Elemental Mastery makes your spells free to cast. Save Ki for Twin Elemental Wrath and Four Point Attack."

- id: flowing-barrier
  word: "Flowing Barrier"
  pronunciation: "FLOW-ing BAR-ee-er"
  category: feature
  shortDefinition: "Spend Ki to temporarily boost AC."
  detailedDefinition: "At Monk 7, spend Ki points to increase your AC. Each Ki point spent adds +1 to your AC until the start of your next turn. This stacks with your existing Dexterity-based AC calculation."
  whyItMatters: "Critical survivability tool. Spending 2-3 Ki can raise your AC to 20+, making you nearly unhittable for a round."
  dialogue:
    user: "How do I survive boss fights?"
    aiThoughts: "Player needs defense options."
    aiQuestion: "Flowing Barrier + Patient Defense + high Dexterity. Stack to AC 20+ and use Step of the Wind to reposition."

- id: empty-body
  word: "Empty Body"
  pronunciation: "EMP-tee BOD-ee"
  category: feature
  shortDefinition: "Cast Mirror Image and Teleport without spell slots."
  detailedDefinition: "At Monk 14, you can spend 4 Ki to cast Mirror Image or Teleport at will. These spells don't consume spell slots since they're monk abilities, not spellcasting."
  whyItMatters: "Teleport is invaluable for repositioning, escaping grapple ranges, and flanking. Mirror Image provides massive AC soft cap."
  dialogue:
    user: "Can I teleport in combat?"
    aiThoughts: "Player needs mobility info."
    aiQuestion: "Yes — Empty Body lets you Teleport for 4 Ki. Use it to flank, escape, or reposition for Four Point Attack."

- id: strix-cove-cloak
  word: "Strix Cove Monk Cloak"
  pronunciation: "striks KOV monk CLOAK"
  category: gear
  shortDefinition: "Legendary cloak granting monk features and out-of-combat spellcasting."
  detailedDefinition: "A legendary item found in Act 3 that grants access to monk features and lets Four Element Monk cast spells outside of combat. Normally, monks can only cast elemental spells during combat. This cloak removes that restriction and saves an equipment Quiver slot."
  whyItMatters: "Best-in-slot item for this build. Enables exploration utility from spells like Conjure Flame for light and Ice Knife for crowd control outside combat."
  dialogue:
    user: "Can I cast spells outside combat?"
    aiThoughts: "Player needs cloak info."
    aiQuestion: "Only with the Strix Cove Monk Cloak from Act 3. It's mandatory for full build flexibility."

- id: patient-0
  word: "Patient-0"
  pronunciation: "PAY-shunt ZERO"
  category: gear
  shortDefinition: "Legendary gauntlets that boost damage when Ki is spent."
  detailedDefinition: "Legendary gauntlets found in Act 2 that increase unarmed strike damage and gain additional effects when Ki abilities are used. Synergizes perfectly with Four Element Monk's Ki-heavy playstyle."
  whyItMatters: "Massive damage multiplier for unarmed strikes. Combined with Twin Elemental Wrath, each hit deals significantly more damage."
  dialogue:
    user: "What gauntlets should I use?"
    aiThoughts: "Player needs gear recommendations."
    aiQuestion: "Patient-0 gauntlets are best-in-slot. They amplify unarmed strike damage and trigger on Ki abilities."

- id: sorcerer-multiclass
  word: "Sorcerer Multiclass"
  pronunciation: "sore-SAIR-er mul-tee-KLAS"
  category: class
  shortDefinition: "Take Sorcerer levels for Metamagic and spell slot flexibility."
  detailedDefinition: "Dipping into Sorcerer (typically 2-4 levels) grants Metamagic Adept feat-equivalent abilities. Twinned Spell lets you target two enemies with single-target spells. Quickened Spell allows casting a spell and attacking in the same turn."
  whyItMatters: "Twinned Spell with Conjure Flame or Ice Knife doubles your AoE potential. Sorcerer spell slots supplement monk casting."
  dialogue:
    user: "Should I multiclass into Sorcerer?"
    aiThoughts: "Player weighs multiclass value."
    aiQuestion: "Sorcerer 2-4 is the optimal dip. Twinned Spell alone transforms single-target spells into dual-target nukes."

- id: dragon-claw-gloves
  word: "Dragon's Claw Gloves"
  pronunciation: "DRAG-ons CLOE GLOVZ"
  category: gear
  shortDefinition: "Rare gloves that add elemental damage to unarmed strikes."
  detailedDefinition: "Rare gauntlets that add elemental damage to unarmed strikes. Synergizes with Twin Elemental Wrath by adding an additional layer of elemental damage on top of the monk's infused strikes."
  whyItMatters: "Stacks with Twin Elemental Wrath for triple-layered elemental damage on unarmed strikes."
  dialogue:
    user: "What gloves stack with Twin Elemental Wrath?"
    aiThoughts: "Player wants damage synergy."
    aiQuestion: "Dragon's Claw Gloves add elemental damage that stacks with your monk infusion."

- id: staff-woodland-romance
  word: "Staff of the Woodland Romance"
  pronunciation: "STAF of the WOOD-land rom-UHNS"
  category: gear
  shortDefinition: "Spellcasting staff boosting spell damage and granting spell attacks."
  detailedDefinition: "A powerful spellcasting staff that enhances spell attack rolls and damage. Provides spellcasting stat bonuses and additional spell effects that complement the Four Element Monk's spell-heavy gameplay."
  whyItMatters: "Boosts spell attack rolls and damage for your elemental spells, increasing both hit rate and damage output."
  dialogue:
    user: "Do I need a staff?"
    aiThoughts: "Player needs weapon guidance."
    aiQuestion: "A spellcasting staff boosts your spell attacks. The Staff of the Woodland Romance is a strong option in Act 2."
