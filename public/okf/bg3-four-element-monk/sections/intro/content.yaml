estimatedTime: "8 min read"
moduleCount: 12

what:
  definition: "Four Element Monk is a Baldur's Gate 3 build that combines Monk martial abilities with elemental spellcasting from all four schools: Fire, Cold, Lightning, and Acid."
  summary: "Comprehensive build guide for the Monk of the Four Elements, covering subclass features, spell selection, Ki point optimization, and multiclass synergy with Sorcerer metamagic."
  bullets:
    - "Elemental Attunement grants free cantrips at all four elements"
    - "Twin Elemental Wrath infuses unarmed strikes with dual-element damage"
    - "Four Point Attack unleashes four elemental strikes per turn"
    - "Strix Cove Monk Cloak enables out-of-combat casting and saves a Quiver slot"
    - "Sorcerer multiclass unlocks Twinned Spell for double-target magic"
  tags:
    - "Baldur's Gate 3"
    - "Monk"
    - "Four Elements"
    - "Spellcaster"
    - "Ki Points"

why:
  summary: "Pure monks struggle with AoE and range. Pure spellcasters lack survivability. Four Element Monk bridges both, delivering burst elemental damage with monk mobility and defense."
  impact: "Twin Elemental Wrath and Four Point Attack create unmatched single-target and AoE flexibility, while Empty Body provides invulnerability and mist form for clutch moments."

