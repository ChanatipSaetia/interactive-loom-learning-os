id: build-advisor
title: "Four Element Monk Build Advisor"
root: playstyle
nodes:
  playstyle:
    prompt: "What's your preferred combat style?"
    choices:
      - id: melee-focused
        text: "Close-range martial combat with elemental strikes"
        next: level-choice
        rationale: "Pure Monk path maximizes Ki and martial features."
        recommended: true
      - id: spell-focused
        text: "Ranged spellcasting with mobility"
        next: multiclass-path
        rationale: "Multiclass path enhances spellcasting versatility."
      - id: hybrid
        text: "Mix of melee and spells"
        next: level-choice
  level-choice:
    prompt: "What act are you planning for?"
    choices:
      - id: early-game
        text: "Acts 1-2 (levels 1-8)"
        next: rec-early
        rationale: "Early game needs survivability and consistent damage."
      - id: late-game
        text: "Act 3 (levels 9-12+)"
        next: rec-late
        rationale: "Late game unlocks Four Point Attack and legendary gear."
  multiclass-path:
    prompt: "How deep should the Sorcerer dip go?"
    choices:
      - id: shallow-dip
        text: "Just Metamagic (Sorcerer 2)"
        next: rec-twinned
        rationale: "Minimum investment for maximum value."
        recommended: true
      - id: deep-dip
        text: "Full spellcaster (Sorcerer 4+)"
        next: rec-spell-heavy
  rec-early:
    leaf:
      recommendation: "Pure Monk 6-8, focus on Twin Elemental Wrath + Conjure Flame."
      explanation: "Early game, Ki is limited. Twin Elemental Wrath (1 Ki) + Conjure Flame zone damage creates excellent sustained pressure. Prioritize Dexterity for AC and hit rate. Grab Patient-0 gauntlets in Act 2."
      tradeoffs:
        - "Limited Ki means careful spending every fight"
        - "No Four Point Attack until Monk 11"
        - "Conjure Flame is your primary AoE tool"
  rec-late:
    leaf:
      recommendation: "Monk 12-13 pure, leverage Four Point Attack and legendary gear."
      explanation: "At Monk 12-13, you have 5 Ki, Four Point Attack, and access to both Patient-0 and Strix Cove Monk Cloak. Save 4 Ki for Four Point Attack on bosses, use Twin Elemental Wrath for clears. At Monk 15, Elemental Mastery makes spells free."
      tradeoffs:
        - "Four Point Attack consumes most of your Ki"
        - "Balance between offense (nuke) and defense (Barrier)"
        - "Strix Cove Cloak enables exploration utility"
  rec-twinned:
    leaf:
      recommendation: "Monk 10/Sorcerer 2 with Twinned Spell + Quickened Spell."
      explanation: "Twinned Spell doubles Ice Knife and Conjure Flame targets. Quickened Spell lets you cast a cantrip and make unarmed strikes in the same turn. The 2-level dip is the optimal investment — you get metamagic without sacrificing too much monk progression."
      tradeoffs:
        - "Delayed Four Point Attack by 2 levels"
        - "Fewer Ki points than pure monk at same total level"
        - "Metamagic uses are limited per Short Rest"
  rec-spell-heavy:
    leaf:
      recommendation: "Monk 8/Sorcerer 4+ for expanded spell repertoire."
      explanation: "Deeper Sorcerer dip grants 3rd level spells like Fireball and Call Lightning, plus more metamagic points. You sacrifice monk features like Four Point Attack for broader spellcasting. Best for players who prefer spell diversity over martial abilities."
      tradeoffs:
        - "Never reaches Four Point Attack or Empty Body"
        - "Reduced Ki pool limits monk abilities"
        - "Broader spell access compensates for lost martial features"
