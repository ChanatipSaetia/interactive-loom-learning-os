id: reset-password-page
title: "Rewrite 'Admin Guide – Users' into Something People Can Follow"
description: "The old page is 3,000 words covering user management from creation to deletion, with a screenshot after every click. Support gets tickets about password resets every day. Make choices and watch the meters."
metrics:
  - id: followability
    label: "Easy to Follow"
    baseValue: 30
    min: 0
    max: 100
    direction: higher
  - id: findability
    label: "Easy to Find"
    baseValue: 30
    min: 0
    max: 100
    direction: higher
  - id: upkeep
    label: "Ease of Upkeep per Release"
    baseValue: 40
    min: 0
    max: 100
    direction: higher
steps:
  - id: split
    title: "Page Structure"
    description: "How do you break up the 3,000-word page?"
    recommended: split-tasks
    choices:
      - id: keep-one
        label: "Keep one long page, add a table of contents"
        description: "Everything stays together."
        metrics:
          followability: 5
          findability: 5
        pros:
          - title: "Quick to do"
        cons:
          - title: "Still one giant page"
            description: "Readers must find their part inside it; searching 'reset password' lands at the top."
      - id: split-tasks
        label: "Split into short task pages"
        description: "'Create a user', 'Reset a user's password', 'Deactivate a user', each its own page."
        metrics:
          followability: 25
          findability: 30
          upkeep: 5
        pros:
          - title: "Each task is short and findable"
            description: "Search for 'reset password' lands on exactly that page."
        cons:
          - title: "More pages to link together"
        whyThisFits: "Splitting long procedures into several short tasks makes each one easier to follow and to find."
  - id: screenshots
    title: "Screenshots"
    description: "The old page has a screenshot after every click. What now?"
    recommended: where-needed
    choices:
      - id: every-step
        label: "Keep a screenshot for every step"
        description: "Readers can always see the screen."
        metrics:
          followability: 5
          upkeep: -30
        pros:
          - title: "Reassuring for novices"
        cons:
          - title: "Stale every release"
            description: "Every UI change breaks several images, and long pages of images are slow to scan."
      - id: where-needed
        label: "Only where a control is hard to find"
        description: "e.g. the reset option hidden in a ⋯ menu gets one annotated screenshot."
        metrics:
          followability: 10
          upkeep: 10
        pros:
          - title: "Help where text isn't enough"
          - title: "Few images to update"
        cons:
          - title: "Needs judgement for each page"
        whyThisFits: "Screenshots help readers find hard-to-spot controls but go stale every release, so use them only where text alone isn't enough."
      - id: none
        label: "No screenshots at all"
        description: "Text only."
        metrics:
          followability: -10
          upkeep: 20
        pros:
          - title: "Nothing to go stale"
        cons:
          - title: "Hidden controls stay hidden"
            description: "Nobody finds the reset option in the ⋯ menu from text alone."
  - id: steps
    title: "Step Style"
    description: "How do you write the steps?"
    recommended: one-action
    choices:
      - id: paragraph
        label: "A friendly paragraph"
        description: "'Head over to Users, find the person, open the menu and reset their password.'"
        metrics:
          followability: -15
        pros:
          - title: "Reads conversationally"
        cons:
          - title: "Hard to follow while clicking"
            description: "Readers lose their place between the screen and the text."
      - id: one-action
        label: "Numbered steps, one action each, with the result"
        description: "'1. Select Users. 2. Select the user's name. 3. Select ⋯ > Reset password. A confirmation e-mail is sent to the user.'"
        metrics:
          followability: 25
        pros:
          - title: "Easy to keep your place"
          - title: "Shows that it worked"
        cons:
          - title: "Looks less friendly"
        whyThisFits: "Numbered steps with one action each, plus the result, are the anatomy of a task page."
