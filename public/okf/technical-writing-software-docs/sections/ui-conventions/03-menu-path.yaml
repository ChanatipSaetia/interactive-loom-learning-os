description: "Write menu paths with a > separator, e.g. File > Export > PDF."
details: "A menu path compresses several clicks into one readable line: **File** > **Export** > **PDF**. Each item stays bold, and the > shows the order. Use it for straightforward menu navigation; if something happens between the clicks, such as a dialog, write separate steps instead."
