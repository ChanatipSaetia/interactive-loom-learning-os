title: "Technical Writing for Software Docs"
subtitle: "Write web app manuals that users can find, follow and trust"
estimatedTime: "40 min"
what:
  definition: "Technical writing for software docs is the craft of writing pages that help a specific reader do or understand one thing in a software product, clearly, accurately and consistently."
  summary: "Most bad manuals fail the same way: they describe the software instead of helping the reader. This topic covers choosing the right kind of page (Diátaxis), writing task pages whose steps actually work, plain language and style guides, and a review loop that proves the page is true before users see it."
  bullets:
    - "Four kinds of docs: tutorial, how-to, reference, explanation, and why not to mix them"
    - "Task pages: goal titles, prerequisites, one action per step, bold UI labels, results"
    - "Plain language: short sentences, active voice, one term per concept, style guides and Vale"
    - "Review: subject-matter expert check, follow-every-step test, editorial review"
  tags:
    - documentation
    - technical-writing
    - diataxis
    - style-guide
    - plain-language
why:
  summary: "Every page users can't follow becomes a support ticket, a mistake in the real system, or a user who gives up."
  impact: "Teams that skip the craft grow the Wall-of-Text Wyrm: long pages that mix history, field tables and a vague 'then export it as needed', so users still can't finish their task."
