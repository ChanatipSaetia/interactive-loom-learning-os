- id: diataxis
  word: "Diátaxis"
  pronunciation: "dee-uh-tak-sis"
  category: "Framework"
  shortDefinition: "A framework that sorts docs into tutorials, how-to guides, reference and explanation."
  detailedDefinition: "Created by Daniele Procida, it places content on two axes, action vs cognition and acquisition vs application, giving four page types with different jobs."
  whyItMatters: "Deciding the page type first prevents the everything page."
- id: how-to
  word: "How-to Guide"
  pronunciation: "how too gahyd"
  category: "Doc type"
  shortDefinition: "Steps that get a competent user to one real goal."
  detailedDefinition: "Goal-oriented and action-focused, without teaching basics or explaining theory. Most pages of a web app manual."
  whyItMatters: "It's what most users open the manual for."
- id: reference
  word: "Reference"
  pronunciation: "ref-er-uhns"
  category: "Doc type"
  shortDefinition: "Complete, accurate facts to look up while working."
  detailedDefinition: "Fields, settings, limits, permissions and error codes, described consistently and without instructions."
  whyItMatters: "It answers the one fact a user needs mid-task."
- id: prerequisite
  word: "Prerequisite"
  pronunciation: "pree-rek-wuh-zit"
  category: "Task page"
  shortDefinition: "What must be true before step 1."
  detailedDefinition: "A role or permission, data ready, or earlier setup, listed before the first step."
  whyItMatters: "Without it, users fail halfway and don't know why."
- id: minimalism
  word: "Minimalism"
  pronunciation: "min-uh-muh-liz-uhm"
  category: "Task page"
  shortDefinition: "John Carroll's approach: act quickly, cut the unneeded, support error recovery."
  detailedDefinition: "A documentation philosophy from 'The Nurnberg Funnel' (1990): users learn by doing, so docs should get them acting fast and help them recover from mistakes."
  whyItMatters: "It's the reason task pages are short and action-first."
- id: plain-language
  word: "Plain Language"
  pronunciation: "pleyn lang-gwij"
  category: "Style"
  shortDefinition: "Writing that readers understand the first time they read it."
  detailedDefinition: "Short sentences, active voice, 'you', key information first, one term per concept, no idioms."
  whyItMatters: "Readers skim while working; plain language survives skimming and translation."
- id: active-voice
  word: "Active Voice"
  pronunciation: "ak-tiv vois"
  category: "Style"
  shortDefinition: "The subject does the action: 'You select Save'."
  detailedDefinition: "The opposite of passive voice ('Save should be selected'), which hides who acts."
  whyItMatters: "Instructions must make clear who does what."
- id: house-style
  word: "House Style Guide"
  pronunciation: "hous stahyl gahyd"
  category: "Style"
  shortDefinition: "Your team's own decisions on top of a public guide."
  detailedDefinition: "Product names, terminology and exceptions, deferring everything else to e.g. the Microsoft Writing Style Guide."
  whyItMatters: "Consistency across writers without a 50-page rulebook."
- id: vale
  word: "Vale"
  pronunciation: "veyl"
  category: "Tool"
  shortDefinition: "A prose linter for docs."
  detailedDefinition: "Checks Markdown against rule packages (Microsoft, Google, your own) in the editor and in CI."
  whyItMatters: "Machines check the commas so reviewers can check the meaning."
- id: flesch
  word: "Flesch Reading Ease"
  pronunciation: "flesh ree-ding eez"
  category: "Tool"
  shortDefinition: "A readability score from sentence and word length."
  detailedDefinition: "206.835 − 1.015 × words per sentence − 84.6 × syllables per word. Higher is easier."
  whyItMatters: "A warning light for dense text, not proof of clarity."
- id: sme
  word: "SME (Subject-Matter Expert)"
  pronunciation: "es em ee"
  category: "Review"
  shortDefinition: "The person who knows how the feature really works."
  detailedDefinition: "Usually a developer or product owner who does the technical review of a page."
  whyItMatters: "Writers describe; SMEs confirm it's true."
