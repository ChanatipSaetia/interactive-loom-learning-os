type: flashcards
terms:
  - id: driving-port
    word: Driving Port (Primary)
    pronunciation: ˈdraɪvɪŋ pɔːrt
    category: Domain Architecture
    shortDefinition: An entry point contract (interface) exposed by the Application Core that defines what tasks the domain can perform for external actors.
    detailedDefinition: Driving Ports define the explicit use-case boundary of the core application. External actors like REST controllers or CLI handlers invoke these contracts to trigger business logic.
    whyItMatters: Decouples entry points from concrete web framework handlers.
    dialogue:
      user: How do REST controllers interact with core logic?
      aiThoughts: Evaluating dependency direction; HTTP controllers should invoke inbound Port interfaces, not domain entities directly.
      aiQuestion: Does the Express controller call the PlaceOrderPort interface or directly instantiate ORM models?
  - id: driven-port
    word: Driven Port (Secondary)
    pronunciation: ˈdrɪv.ən pɔːrt
    category: Domain Architecture
    shortDefinition: An exit point contract (interface) declared by the Application Core defining requirements for external infrastructure.
    detailedDefinition: Driven Ports allow the Domain Core to express persistence and external service needs without depending on concrete ORM classes or HTTP clients.
    whyItMatters: Enables replacing databases or third-party APIs without modifying business logic.
    dialogue:
      user: How does the domain save data without knowing about SQL?
      aiThoughts: Checking Dependency Inversion; domain defines OrderRepositoryPort interface, infrastructure implements it.
      aiQuestion: Which layer owns the OrderRepositoryPort interface definition?
  - id: driving-adapter
    word: Driving (Primary) Adapter
    pronunciation: ˈdraɪvɪŋ əˈdæp.tər
    category: Domain Architecture
    shortDefinition: An external component (HTTP REST controller, CLI command, gRPC handler) that converts requests into Driving Port calls.
    detailedDefinition: Driving Adapters sit outside the Hexagon. They parse external protocol payloads (JSON, CLI flags, protobufs) and translate them into domain command invocations.
    whyItMatters: Allows supporting multiple UI drivers (Web, Mobile, CLI, gRPC) against the exact same core logic.
    dialogue:
      user: Can we add a gRPC endpoint without rewriting the business logic?
      aiThoughts: Verifying multi-driver capability; adding a gRPC Driving Adapter simply calls existing Driving Ports.
      aiQuestion: Would adding a gRPC adapter require editing any code inside the domain hexagon?
  - id: driven-adapter
    word: Driven (Secondary) Adapter
    pronunciation: ˈdrɪv.ən əˈdæp.tər
    category: Domain Architecture
    shortDefinition: A concrete implementation of a Driven Port interface that communicates with external technology.
    detailedDefinition: Driven Adapters implement Secondary Port contracts using specific libraries like Prisma, TypeORM, Redis, or Stripe SDKs.
    whyItMatters: Isolates vendor-specific dependencies and database query details outside the core domain.
    dialogue:
      user: How do we test domain logic without connecting to PostgreSQL?
      aiThoughts: Evaluating test doubles; swap PostgresDrivenAdapter with InMemoryOrderAdapter.
      aiQuestion: Can we run unit tests using an InMemoryDrivenAdapter in under 10 milliseconds?
  - id: dependency-inversion
    word: Dependency Inversion Principle
    pronunciation: dɪˈpen.dən.si ɪnˈvɜːr.ʒən
    category: Domain Architecture
    shortDefinition: High-level domain modules do not depend on low-level infrastructure details; both depend on abstractions (Ports).
    detailedDefinition: 'Dependency Inversion flips traditional dependency direction: infrastructure depends on domain contracts, ensuring the core remains pure and isolated.'
    whyItMatters: Prevents framework creep and database entities from leaking into application logic.
    dialogue:
      user: Why is Dependency Inversion critical for long-term maintainability?
      aiThoughts: Analyzing software longevity; domain logic outlives framework versions and database drivers.
      aiQuestion: What happens to your domain code when you upgrade or switch web frameworks?
