type: taxonomy-browser
categories:
  - id: "driving-adapters"
    title: "Primary (Driving) Adapters"
    subtitle: "Inbound Request Adapters"
    description: "Adapters that drive application execution by taking external user or system inputs and calling Driving Ports."
    details: "Driving Adapters sit at the entry edge of the Hexagon. They convert transport-level payloads (JSON over HTTP, CLI arguments, gRPC messages) into domain commands or queries, then invoke the application's Driving Ports."
    analogy: "Like a TV Remote Control or Game Controller sending user inputs to the internal console."
    primaryFocus: "Translating external triggers into internal domain use case calls."
    color: "mauve"
    icon: "LayoutGrid"
    inScope:
      - "REST API Controllers (Express / NestJS / Spring MVC)"
      - "CLI Handlers (Commander / Cobra)"
      - "gRPC Service Handlers"
      - "GraphQL Query / Mutation Resolvers"
    outOfScope:
      - "Database Repositories"
      - "Outbound HTTP API Clients"
      - "ORM Schema Mappers"
  - id: "driven-adapters"
    title: "Secondary (Driven) Adapters"
    subtitle: "Outbound Infrastructure Adapters"
    description: "Adapters that are driven by the Application Core to interact with external storage, APIs, and infrastructure."
    details: "Driven Adapters implement Secondary Ports defined by the domain. They handle SQL/NoSQL persistence, third-party REST API integrations, and event publishing."
    analogy: "Like a Power Adapter or Cable converting wall outlet electricity into what your device needs."
    primaryFocus: "Fulfilling data persistence and external infrastructure contracts defined by the domain."
    color: "sky"
    icon: "Database"
    inScope:
      - "SQL Repositories (Prisma / TypeORM / Hibernate)"
      - "NoSQL Stores (Redis / Mongo / DynamoDB)"
      - "Third-party payment gateway clients (Stripe / PayPal)"
      - "Event Bus Publishers (Kafka / RabbitMQ / SQS)"
    outOfScope:
      - "HTTP Route Controllers"
      - "UI Views and Form State"
  - id: "test-adapters"
    title: "Testing Mocks & In-Memory Adapters"
    subtitle: "In-Memory Test Doubles"
    description: "Lightweight in-memory adapter implementations designed for fast unit/integration testing."
    details: "Test Adapters implement Driven Ports using in-memory HashMaps or mocks. They allow running 100% of domain use cases without booting databases, Docker containers, or network connections."
    analogy: "Like a flight simulator providing realistic controls without burning jet fuel."
    primaryFocus: "Enabling fast, deterministic, zero-dependency unit tests for business logic."
    color: "green"
    icon: "CheckCircle"
    inScope:
      - "InMemoryOrderRepository implementing OrderRepositoryPort"
      - "MockNotificationService implementing NotificationPort"
      - "StubPaymentGateway returning static success responses"
    outOfScope:
      - "Production SQL Connection Pools"
