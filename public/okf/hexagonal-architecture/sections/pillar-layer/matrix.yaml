type: pillar-layer
title: "Hexagonal Architecture (Ports & Adapters) 5-Tier Stack"
description: "5-Tier layer stack showing how Driving Inbound Adapters, Port Contracts, Domain Kernel, and individual Driven Storage/Infrastructure Adapters stack together."

layers:
  - id: "l-driving-adapters"
    title: "1. Driving (Inbound) Adapters"
    description: "External entrypoints that translate HTTP, CLI, or Webhook requests into domain calls."

  - id: "l-driving-ports"
    title: "2. Driving Input Port Contracts"
    description: "Inbound interface contracts defined by the domain and invoked by driving adapters."

  - id: "l-domain-kernel"
    title: "3. Hexagon Core Domain Kernel"
    description: "Pure business rules, aggregates, entities, and calculation policies."

  - id: "l-driven-ports"
    title: "4. Driven Output Port Contracts"
    description: "Outbound interface contracts defined by the domain for persistence, messaging, and notifications."

  - id: "l-driven-adapters"
    title: "5. Driven (Outbound) Adapters & Infrastructure"
    description: "Pluggable infrastructure adapters (PostgreSQL, Redis, Kafka, SendGrid) implementing output ports."

matrix_blocks:
  # Layer 1: Driving Adapters
  - id: "b-http-adapter"
    title: "HTTP REST API Controller"
    description: "Parses REST/JSON requests and invokes the OrderUseCasePort."
    layer_id: "l-driving-adapters"
    col_offset: 0
    col_span: 1
    row_span: 1
    color: "blue"
    depends_on: ["b-order-usecase-port"]

  - id: "b-cli-adapter"
    title: "CLI Command Runner"
    description: "Executes terminal commands against input ports."
    layer_id: "l-driving-adapters"
    col_offset: 1
    col_span: 1
    row_span: 1
    color: "sky"
    depends_on: ["b-order-usecase-port"]

  - id: "b-webhook-adapter"
    title: "Webhook Ingress Listener"
    description: "Handles asynchronous inbound webhooks from third-party partners."
    layer_id: "l-driving-adapters"
    col_offset: 2
    col_span: 2
    row_span: 1
    color: "sapphire"
    depends_on: ["b-payment-port"]

  # Layer 2: Driving Input Ports
  - id: "b-order-usecase-port"
    title: "OrderUseCasePort (Inbound Contract)"
    description: "Primary interface defining order placement and management capabilities."
    layer_id: "l-driving-ports"
    col_offset: 0
    col_span: 2
    row_span: 1
    color: "mauve"
    depends_on: ["b-order-aggregate"]

  - id: "b-payment-port"
    title: "PaymentServicePort (Inbound Contract)"
    description: "Interface contract for initiating payment authorization flows."
    layer_id: "l-driving-ports"
    col_offset: 2
    col_span: 2
    row_span: 1
    color: "lavender"
    depends_on: ["b-pricing-policy"]

  # Layer 3: Hexagon Core Domain Kernel
  - id: "b-order-aggregate"
    title: "Order Aggregate & Entities"
    description: "Encapsulates order invariants, item line validation, and state changes."
    layer_id: "l-domain-kernel"
    col_offset: 0
    col_span: 3
    row_span: 1
    color: "green"
    depends_on: ["b-repo-port", "b-event-port"]

  - id: "b-pricing-policy"
    title: "Pricing & Discount Policy"
    description: "Stateless domain rules for volume discounts and tax calculations."
    layer_id: "l-domain-kernel"
    col_offset: 3
    col_span: 1
    row_span: 1
    color: "teal"
    depends_on: ["b-cache-port", "b-email-port"]

  # Layer 4: Driven Output Ports
  - id: "b-repo-port"
    title: "OrderRepositoryPort"
    description: "Driven port interface for persistent storage operations."
    layer_id: "l-driven-ports"
    col_offset: 0
    col_span: 1
    row_span: 1
    color: "peach"
    depends_on: ["b-postgres-adapter"]

  - id: "b-cache-port"
    title: "CachePort"
    description: "Driven port interface for fast key-value session caching."
    layer_id: "l-driven-ports"
    col_offset: 1
    col_span: 1
    row_span: 1
    color: "yellow"
    depends_on: ["b-redis-adapter"]

  - id: "b-event-port"
    title: "EventPublisherPort"
    description: "Driven port interface for publishing domain events."
    layer_id: "l-driven-ports"
    col_offset: 2
    col_span: 1
    row_span: 1
    color: "maroon"
    depends_on: ["b-kafka-adapter"]

  - id: "b-email-port"
    title: "NotificationPort"
    description: "Driven port interface for sending customer notifications."
    layer_id: "l-driven-ports"
    col_offset: 3
    col_span: 1
    row_span: 1
    color: "pink"
    depends_on: ["b-sendgrid-adapter"]

  # Layer 5: Driven (Outbound) Adapters & Infrastructure (Individual DBs/Services)
  - id: "b-postgres-adapter"
    title: "PostgreSQL Order Repository (DB 1)"
    description: "Relational database persistence adapter implementing OrderRepositoryPort."
    layer_id: "l-driven-adapters"
    col_offset: 0
    col_span: 1
    row_span: 1
    color: "blue"

  - id: "b-redis-adapter"
    title: "Redis Cache & Session Adapter (DB 2)"
    description: "In-memory caching adapter implementing CachePort."
    layer_id: "l-driven-adapters"
    col_offset: 1
    col_span: 1
    row_span: 1
    color: "red"

  - id: "b-kafka-adapter"
    title: "Kafka Event Stream Publisher (Broker)"
    description: "Message streaming adapter implementing EventPublisherPort."
    layer_id: "l-driven-adapters"
    col_offset: 2
    col_span: 1
    row_span: 1
    color: "mauve"

  - id: "b-sendgrid-adapter"
    title: "SendGrid Email Dispatcher (SaaS)"
    description: "Outbound notification adapter implementing NotificationPort."
    layer_id: "l-driven-adapters"
    col_offset: 3
    col_span: 1
    row_span: 1
    color: "green"
