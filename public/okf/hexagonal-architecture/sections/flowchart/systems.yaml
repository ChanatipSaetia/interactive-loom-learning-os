order_aggregate:
  title: "Order Aggregate (Domain Core)"
  desc: "Core domain business entity maintaining state and business invariants."
  type: aggregate
  stateMachine:
    states:
      - id: DRAFT
        label: Draft
        color: "var(--ctp-overlay1)"
      - id: CREATING
        label: Creating
        color: "var(--ctp-blue)"
      - id: VALIDATED
        label: Validated
        color: "var(--ctp-mauve)"
      - id: PERSISTING
        label: Persisting
        color: "var(--ctp-peach)"
      - id: PERSISTED
        label: Persisted
        color: "var(--ctp-green)"
    initialState: DRAFT

http_controller:
  title: "Express HTTP Controller (Driving Adapter)"
  desc: "Receives HTTP REST requests and translates DTOs into domain commands."
  type: external

create_order_port:
  title: "CreateOrderUseCase (Driving Port)"
  desc: "Inbound application port interface exposing order creation operations."
  type: external

order_repo_port:
  title: "OrderRepositoryPort (Driven Port)"
  desc: "Outbound infrastructure port interface for order persistence."
  type: external

postgres_adapter:
  title: "PostgresOrderAdapter (Driven Adapter)"
  desc: "Outbound database adapter executing SQL queries against Postgres."
  type: external
