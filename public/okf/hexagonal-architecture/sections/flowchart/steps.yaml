steps:
  - id: "step_checkout"
    event: "Checkout Requested"
    eventDesc: "Customer submits cart payload via Web UI."
    policy: "Parse HTTP Payload Policy"
    policyDesc: "Validate HTTP JSON request body in REST Controller."
    command: "Invoke CreateOrderPort"
    commandDesc: "Map HTTP DTO into CreateOrderCommand DTO."
    handledBy: "http_controller_s1"
    next: "step_invoke_port"

  - id: "step_invoke_port"
    event: "CreateOrderPort Invoked"
    eventDesc: "Driving Adapter calls CreateOrderUseCase interface method."
    policy: "Route To Domain Service Policy"
    policyDesc: "Application layer authorizes user and starts domain transaction."
    command: "Instantiate Order Aggregate"
    commandDesc: "Pass command parameters to Order.create() domain factory."
    handledBy: "create_order_port_s2"
    next: "step_domain_logic"

  - id: "step_domain_logic"
    event: "Order Aggregate Created"
    eventDesc: "Domain Aggregate validates items, price calculations, and stock invariants."
    policy: "Persist New Order Policy"
    policyDesc: "Domain Service requests order persistence."
    command: "Call OrderRepositoryPort.save()"
    commandDesc: "Pass new Order entity to Driven Port interface."
    handledBy: "order_aggregate_s3"
    next: "step_call_driven_port"

  - id: "step_call_driven_port"
    event: "OrderRepositoryPort Called"
    eventDesc: "Outbound interface receives Order entity for persistence."
    policy: "Delegate To Database Adapter Policy"
    policyDesc: "Interface delegates execution to active infrastructure implementation."
    command: "Execute SQL Insert"
    commandDesc: "Driven Adapter translates Order entity to SQL query."
    handledBy: "order_repo_port_s4"
    next: "step_db_persist"

  - id: "step_db_persist"
    event: "Order Record Saved to Postgres"
    eventDesc: "Postgres database commits transaction successfully."
    policy: "Return Success DTO Policy"
    policyDesc: "Driven adapter returns saved ID back through port to HTTP controller."
    command: "Respond 201 Created"
    commandDesc: "Driving Adapter formats JSON response with Order ID."
    handledBy: "postgres_adapter_s5"
