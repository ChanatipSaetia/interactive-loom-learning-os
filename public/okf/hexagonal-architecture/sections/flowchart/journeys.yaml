- id: "happy-path"
  label: "Complete Request Cycle (Inbound → Domain → Outbound)"
  description: "Traces an HTTP order placement from the Express Driving Controller through Ports into the Domain Core and Postgres Driven Adapter."
  steps:
    - stepId: "step_checkout"
      name: "1. HTTP Request Received"
      description: "Express Controller validates request payload and maps HTTP DTO into CreateOrderCommand."
      processGroup: "planning"
    - stepId: "step_invoke_port"
      name: "2. Driving Port Invoked"
      description: "Driving Adapter calls CreateOrderUseCase interface; application layer initiates domain transaction."
      processGroup: "planning"
    - stepId: "step_domain_logic"
      name: "3. Domain Core Execution"
      description: "Order Aggregate validates business invariants, item calculations, and instantiates order state."
      processGroup: "execution"
    - stepId: "step_call_driven_port"
      name: "4. Driven Port Call"
      description: "Domain Core invokes OrderRepositoryPort interface for persistence."
      processGroup: "execution"
    - stepId: "step_db_persist"
      name: "5. Postgres Persistence & Response"
      description: "Driven Postgres Adapter executes SQL insert, commits transaction, and returns result to HTTP Controller."
      processGroup: "evaluation"
