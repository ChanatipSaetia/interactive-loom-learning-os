challenges:
  - id: "hexagonal-synthesis"
    prompt: "Fill in the blank fields to complete the explanation of Hexagonal Architecture mechanics:"
    template: "In Hexagonal Architecture, the core business logic resides inside the domain hexagon and depends only on {zone-1}. External HTTP requests enter the system through {zone-2}, which invoke {zone-3}. Outbound infrastructure services like databases implement {zone-4}, allowing unit tests to swap real databases with {zone-5}."
    chips:
      - id: "chip-ports"
        text: "Port interfaces"
      - id: "chip-driving-adapters"
        text: "Driving Adapters"
      - id: "chip-driving-ports"
        text: "Driving Ports"
      - id: "chip-driven-ports"
        text: "Driven Ports"
      - id: "chip-in-memory-adapters"
        text: "In-Memory Adapters"
    solution:
      zone-1: "chip-ports"
      zone-2: "chip-driving-adapters"
      zone-3: "chip-driving-ports"
      zone-4: "chip-driven-ports"
      zone-5: "chip-in-memory-adapters"
    explanation: "<strong>Correct! Excellent Hexagonal Architecture synthesis.</strong><br/>The core domain depends only on <em>Port interfaces</em>. External HTTP requests enter via <em>Driving Adapters</em> which invoke <em>Driving Ports</em>. Outbound infrastructure implements <em>Driven Ports</em>, allowing tests to easily swap real infrastructure for <em>In-Memory Adapters</em>."
