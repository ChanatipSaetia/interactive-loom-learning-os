type: taxonomy-category
icon: ArrowLeftRight
title: "Reflexion Agent"
subtitle: "Self-Reflection with Memory"
color: red
description: "The agent attempts a task, then reflects on what went wrong, stores lessons learned in a memory buffer, and uses those lessons to improve the next attempt."
details: "Unlike ReAct which observes immediate tool outputs, Reflexion maintains a persistent memory of past failures. Each retry incorporates the accumulated reflection log, allowing the agent to avoid repeating the same mistakes."
analogy: "Like a chess player who reviews game replays to identify recurring tactical errors."
primaryFocus: "Learning from past failures across attempts"
inScope:
  - "Failure analysis and reflection"
  - "Persistent memory of lessons learned"
  - "Iterative improvement across retries"
outOfScope:
  - "Single-pass task completion"
  - "Tasks where failure is not informative"
