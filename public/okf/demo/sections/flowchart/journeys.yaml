- id: happy-path
  label: "Happy Path"
  description: "Agent uses tools successfully and passes QA."
  steps:
    - stepId: run_agent
      name: "Launch Agent"
      description: "Developer submits a task. Orchestrator agent starts a new session and begins planning."
      processGroup: planning
    - stepId: call_llm
      name: "LLM Planning"
      description: "Agent sends the task context to the LLM for reasoning. LLM decides whether to use tools, call MCP, or finish."
      processGroup: planning
    - stepId: execute_tool
      name: "Execute Tool"
      description: "LLM requests a tool. Tools router dispatches and runs it, returning the output back to the agent."
      processGroup: execution
    - stepId: call_mcp
      name: "Call MCP Server"
      description: "LLM requests an external API via MCP protocol. MCP server processes the call and returns the result."
      processGroup: execution
    - stepId: eval
      name: "Compile Answer"
      description: "LLM integrates all tool results and MCP responses into a coherent final answer."
      processGroup: evaluation
    - stepId: qa_review
      name: "QA Review"
      description: "Orchestrator agent reviews the final output against QA standards before delivery."

- id: feedback-loop
  label: "Feedback Loop"
  description: "Agent needs more info from same actor."
  steps:
    - stepId: execute_tool
      name: "Execute Tool"
      description: "LLM requests a tool. Tools router dispatches and runs it, but the result indicates missing input."
      processGroup: execution
    - stepId: send_message
      name: "Request Input"
      description: "Orchestrator agent detects missing information and sends a notification to the user."
    - stepId: provide_feedback
      name: "Provide Feedback"
      description: "Developer responds with the requested information. Orchestrator captures the feedback and resumes."
    - stepId: call_llm
      name: "LLM Re-Planning"
      description: "Agent re-sends the task context with the new feedback to the LLM for updated reasoning."
      processGroup: planning

- id: direct-llm
  label: "Direct LLM Answer"
  description: "No tools needed."
  steps:
    - stepId: call_llm
      name: "LLM Planning"
      description: "Agent sends the task to the LLM. The LLM determines no tools are needed and generates a direct answer."
      processGroup: planning
    - stepId: direct_complete
      name: "Complete Task"
      description: "LLM produces the final answer directly, skipping tool execution and MCP calls."
      processGroup: evaluation
