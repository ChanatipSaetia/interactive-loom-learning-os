challenges:
  - prompt: "Complete the statement explaining chunk size and overlap properties (Part 1):"
    template: "Reducing chunk size results in {zone-1} individual content segments. This allows semantic matching algorithms to find {zone-2} refined context points, which improves precision. However, it also demands {zone-3} overlap percentages to prevent split-sentence data loss, which subsequently {zone-4} total RAG ingestion cost."
    chips:
      - id: "chip-smaller"
        text: "smaller"
      - id: "chip-larger"
        text: "larger"
      - id: "chip-more"
        text: "more precise"
      - id: "chip-less"
        text: "coarser"
      - id: "chip-higher"
        text: "higher"
      - id: "chip-lower"
        text: "lower"
      - id: "chip-increases"
        text: "increases"
      - id: "chip-decreases"
        text: "decreases"
    solution:
      zone-1: "chip-smaller"
      zone-2: "chip-more"
      zone-3: "chip-higher"
      zone-4: "chip-increases"
    explanation: "<strong>Correct! Excellent RAG tradeoff analysis.</strong><br/>By dropping the chunk size, you query <em>smaller</em> segments. This gives <em>more precise</em> matching vectors. However, you must increase overlap percentage (<em>higher</em>) to keep from cutting sentences in half. In turn, you send more text to context window, which <em>increases</em> final token costs."
  - prompt: "Complete the statement explaining larger chunk sizes (Part 2):"
    template: "Increasing chunk size yields {zone-1} individual database entries. This leads to {zone-2} context windows filled with broader themes, but potentially {zone-3} overall vector search matching accuracy."
    chips:
      - id: "chip-fewer"
        text: "fewer"
      - id: "chip-more-entries"
        text: "more"
      - id: "chip-wider"
        text: "wider"
      - id: "chip-narrower"
        text: "narrower"
      - id: "chip-higher-acc"
        text: "higher"
      - id: "chip-lower-acc"
        text: "lower"
    solution:
      zone-1: "chip-fewer"
      zone-2: "chip-wider"
      zone-3: "chip-lower-acc"
    explanation: "<strong>Correct!</strong> Larger chunks result in <em>fewer</em> segments. They cover <em>wider</em> themes, but reduce specific matching precision, leading to <em>lower</em> search accuracy."
