prompt: "Complete the statement explaining chunk size and overlap properties:"
template: "Reducing chunk size results in {zone-1} individual content segments. This allows semantic matching algorithms to find {zone-2} refined context points, which improves precision. However, it also demands {zone-3} overlap percentages to prevent split-sentence data loss, which subsequently {zone-4} total RAG ingestion cost."
