explanation: "<strong>Correct! Excellent RAG tradeoff analysis.</strong><br/>By dropping the chunk size, you query <em>smaller</em> segments. This gives <em>more precise</em> matching vectors. However, you must increase overlap percentage (<em>higher</em>) to keep from cutting sentences in half. In turn, you send more text to context window, which <em>increases</em> final token costs."
