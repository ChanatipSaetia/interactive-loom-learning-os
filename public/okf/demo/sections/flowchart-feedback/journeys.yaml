- id: fb_journey_pass
  label: "QA Pass"
  description: "Output passes evaluation on first attempt"
  steps:
    - stepId: fb_check
      name: "Evaluate Output"
      description: "QA evaluator reviews the output against quality criteria."
      processGroup: evaluation
    - stepId: fb_pass
      name: "Accept Output"
      description: "Output meets all criteria and is approved without revision."
      processGroup: evaluation

- id: fb_journey_revise
  label: "Revision Loop"
  description: "Output fails evaluation, triggering a revision cycle"
  steps:
    - stepId: fb_check
      name: "Evaluate Output"
      description: "QA evaluator reviews the output and finds it does not meet criteria."
      processGroup: evaluation
    - stepId: fb_fail
      name: "Trigger Revision"
      description: "Output fails evaluation. Revision flag is raised to start the correction cycle."
      processGroup: escalation
    - stepId: fb_store
      name: "Store Failure Context"
      description: "Failure details and feedback are stored in memory so the LLM can reference them during revision."
      processGroup: execution
    - stepId: fb_rerun
      name: "Regenerate with Context"
      description: "LLM receives the stored failure context and regenerates the output with corrections."
      processGroup: planning
    - stepId: fb_check
      name: "Re-Evaluate"
      description: "Revised output is evaluated again to check if it now meets quality criteria."
      processGroup: evaluation
