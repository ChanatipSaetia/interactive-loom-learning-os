id: deploy_decision
title: "Choosing a Deployment Strategy"
intro: "Your team needs to deploy an AI agent system. Requirements: low latency, cost control, observability."
nodes:
  start:
    prompt: "What is the primary constraint?"
    choices:
      - id: latency
        text: "Low latency is critical"
        next: infra_choice
      - id: cost
        text: "Budget is tight"
        next: cloud_choice
      - id: obs
        text: "We need full observability first"
        next: tool_choice
  infra_choice:
    prompt: "Where should the agent run?"
    choices:
      - id: edge
        text: "Edge deployment closest to users"
        next: outcome_edge
      - id: regional
        text: "Regional cloud with CDN"
        next: outcome_regional
  cloud_choice:
    prompt: "Which cloud model fits best?"
    choices:
      - id: serverless
        text: "Serverless functions for on-demand scaling"
        next: outcome_serverless
      - id: containers
        text: "Managed containers with auto-scaling"
        next: outcome_containers
  tool_choice:
    prompt: "What observability layer do you need first?"
    choices:
      - id: tracing
        text: "Distributed tracing for agent decision chains"
        next: outcome_tracing
      - id: metrics
        text: "Metrics dashboard for throughput and cost"
        next: outcome_metrics
  outcome_edge:
    outcome:
      verdict: "Good for ultra-low latency, but higher infrastructure cost."
      lesson: "Edge deployment minimizes network hops but multiplies deployment complexity."
      rating: b-plus
  outcome_regional:
    outcome:
      verdict: "Balanced approach with acceptable latency for most regions."
      lesson: "Regional cloud with CDN gives a good latency/cost trade-off for global audiences."
      rating: a
  outcome_serverless:
    outcome:
      verdict: "Minimal upfront cost, but cold starts hurt latency."
      lesson: "Serverless is cost-efficient for sporadic workloads but struggles with real-time agent interactions."
      rating: b-minus
  outcome_containers:
    outcome:
      verdict: "Predictable performance with manageable cost."
      lesson: "Managed containers give you warm instances, horizontal scaling, and reasonable pricing."
      rating: a
  outcome_tracing:
    outcome:
      verdict: "Strong foundation for debugging agent behavior."
      lesson: "Distributed tracing reveals where agents stall, but adds overhead to every decision step."
      rating: b-plus
  outcome_metrics:
    outcome:
      verdict: "Good cost visibility but limited behavioral insight."
      lesson: "Metrics tell you what happened, not why. Combine with tracing for full picture."
      rating: c
