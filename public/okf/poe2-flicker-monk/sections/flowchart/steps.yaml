- type: linear
  id: step_enter
  initiatedBy: player
  command: "Enter Map & Initiate Attack"
  policy: "Trigger Run"
  handledBy: whirling_assault
  delegatesTo: pack
  resultEvents:
    - id: evt_clear_packs
      title: "Clear Packs with Whirling Assault"
  continuesAs: step_charges

- type: linear
  id: step_charges
  command: "Generate Power Charges"
  policy: "On Critical Strike Hit"
  handledBy: cast_on_crit
  resultEvents:
    - id: evt_power_charges
      title: "Power Charges Generated"
  continuesAs: step_clear_branch

- type: branch
  id: step_clear_branch
  event: evt_power_charges
  branches:
    - id: branch_ft
      label: "Falling Thunder (dense packs)"
      policy: "If Pack is Dense"
      command: "Cast Falling Thunder"
      handledBy: falling_thunder
      delegatesTo: trinity
      resultEvents:
        - id: evt_pack_cleared
          title: "Pack Wiped (360 Lightning)"
      continuesAs: step_heralds
    - id: branch_fs
      label: "Flicker Strike (mobility)"
      policy: "If Pack is Scattered"
      command: "Cast Flicker Strike"
      handledBy: flicker_strike
      delegatesTo: hollow_focus
      resultEvents:
        - id: evt_repositioned
          title: "Dashed Through Pack"
      continuesAs: step_heralds

- type: linear
  id: step_heralds
  command: "Trigger Herald Explosions"
  policy: "On Enemy Death"
  handledBy: heralds
  resultEvents:
    - id: evt_explosions
      title: "Herald Explosions Clean Up"
  continuesAs: step_boss_check

- type: branch
  id: step_boss_check
  event: evt_explosions
  branches:
    - id: branch_mapping
      label: "Continue Mapping"
      dashed: true
      policy: "If More Packs Remain"
      command: "Loop Back to Clear"
      handledBy: whirling_assault
      resultEvents:
        - id: evt_mapping_loop
          title: "Loop Back to Clear More"
    - id: branch_boss
      label: "Boss Fight"
      policy: "If Boss Encountered"
      command: "Build Combo Stacks"
      handledBy: mantra_destruction
      delegatesTo: boss
      resultEvents:
        - id: evt_combo_ready
          title: "20 Combo Stacks Built"
      continuesAs: step_boss_charges

- type: linear
  id: step_boss_charges
  command: "Expend Combo Stacks"
  policy: "On 20 Combo Stacks"
  handledBy: ailiths_chimes
  resultEvents:
    - id: evt_boss_charges
      title: "Boss Power Charges Ready"
  continuesAs: step_boss_nuke

- type: linear
  id: step_boss_nuke
  command: "Activate Charged Staff Buff"
  policy: "On Boss Power Charges Ready"
  handledBy: charged_staff
  delegatesTo: ci
  resultEvents:
    - id: evt_buffed
      title: "Charged Staff Lightning Buff Active"
  continuesAs: step_boss_commit

- type: branch
  id: step_boss_commit
  event: evt_buffed
  branches:
    - id: branch_fs_boss
      label: "Flicker Strike Boss"
      policy: "Prefer Flicker Strike"
      command: "Cast Flicker Strike on Boss"
      handledBy: flicker_strike
      resultEvents:
        - id: evt_boss_dead
          title: "Boss One-Shotted"
    - id: branch_ft_boss
      label: "Falling Thunder Boss"
      policy: "Prefer Falling Thunder"
      command: "Cast Falling Thunder on Boss"
      handledBy: falling_thunder
      resultEvents:
        - id: evt_boss_dead2
          title: "Boss One-Shotted"