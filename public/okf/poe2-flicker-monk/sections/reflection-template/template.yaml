      - id: "chip-higher"
        text: "higher"
      - id: "chip-lower"
        text: "lower"
      - id: "chip-increases"
        text: "increases"
      - id: "chip-decreases"
        text: "decreases"
    solution:
      zone-1: "chip-higher"
      zone-2: "chip-increases"
    explanation: "<strong>Correct!</strong> Perfect crits lead to higher peak hits and guarantee shock infliction, multiplying base damage output."
