- id: q1
  question: "What does CAP theorem state?"
  choices:
    - id: a
      text: "A distributed system can guarantee all three: consistency, availability, and partition tolerance"
      correct: false
      explanation: "CAP theorem states you can only guarantee two of three properties."
    - id: b
      text: "A distributed system can only guarantee two of three: consistency, availability, and partition tolerance"
      correct: true
      explanation: "The CAP theorem states that a distributed system can only guarantee two of three properties."
    - id: c
      text: "A distributed system must sacrifice partition tolerance"
      correct: false
      explanation: "Partition tolerance is typically non-negotiable in distributed systems."
    - id: d
      text: "A distributed system prioritizes availability over all else"
      correct: false
      explanation: "Different systems prioritize different properties based on their requirements."

- id: q2
  question: "Which scaling approach adds more machines to handle increased load?"
  choices:
    - id: a
      text: "Vertical scaling"
      correct: false
      explanation: "Vertical scaling adds more power to existing machines."
    - id: b
      text: "Horizontal scaling"
      correct: true
      explanation: "Horizontal scaling involves adding more machines/servers to distribute the load."
    - id: c
      text: "Functional scaling"
      correct: false
      explanation: "Functional scaling is not a standard term in system design."
    - id: d
      text: "Linear scaling"
      correct: false
      explanation: "Linear scaling refers to proportional growth, not the approach of adding machines."

- id: q3
  question: "What is the primary benefit of redundancy in system design?"
  choices:
    - id: a
      text: "Reduced costs"
      correct: false
      explanation: "Redundancy typically increases costs due to additional hardware."
    - id: b
      text: "Improved reliability and fault tolerance"
      correct: true
      explanation: "Redundancy provides backup components that can take over in case of failures."
    - id: c
      text: "Faster response times"
      correct: false
      explanation: "Redundancy may actually add latency due to synchronization overhead."
    - id: d
      text: "Simpler architecture"
      correct: false
      explanation: "Redundancy makes architecture more complex, not simpler."

- id: q4
  question: "Which is NOT a characteristic of good maintainability?"
  choices:
    - id: a
      text: "Modularity"
      correct: false
      explanation: "Modularity is a key characteristic of maintainable systems."
    - id: b
      text: "Lack of documentation"
      correct: true
      explanation: "Good maintainability requires documentation, not lack of it."
    - id: c
      text: "Comprehensive testing"
      correct: false
      explanation: "Testing helps ensure changes don't break existing functionality."
    - id: d
      text: "Clear interfaces"
      correct: false
      explanation: "Clear interfaces make it easier to understand and modify components."

- id: q5
  question: "In a distributed database, which choice prioritizes data accuracy over response speed?"
  choices:
    - id: a
      text: "AP (Availability + Partition Tolerance)"
      correct: false
      explanation: "AP systems prioritize availability over consistency."
    - id: b
      text: "CP (Consistency + Partition Tolerance)"
      correct: true
      explanation: "CP systems prioritize consistency and partition tolerance, ensuring data accuracy."
    - id: c
      text: "AC (Availability + Consistency)"
      correct: false
      explanation: "AC is not a common choice as it sacrifices partition tolerance."
    - id: d
      text: "PC (Partition tolerance + Consistency without availability)"
      correct: false
      explanation: "This would mean the system is often unavailable, which is rarely desirable."
