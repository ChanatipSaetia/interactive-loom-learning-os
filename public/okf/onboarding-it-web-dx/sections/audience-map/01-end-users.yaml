type: taxonomy-category
icon: MousePointer2
title: "Web App End Users"
subtitle: "Customers & business users"
color: green
description: "People who must complete business tasks in your Web App. For them, good onboarding means reaching their first successful task without ever leaving the product or opening a ticket."
details: "End users do not care how the system works; they care whether they can finish their job today. Onboarding for them is product work: a guided first-run flow, sensible sample data, one golden-path task (create the first project, invite the first teammate, run the first report), and help that appears exactly when they hover over the confusing button. Every extra login, jargon word, or blank screen is a quit-point where users quietly churn. Pros and cons of each delivery method (tours, docs, cohorts) are weighed later in Track 2 — the doctrine is the same: first value inside the product, fast."
analogy: "A hotel check-in: nobody tours you through the HVAC plant — you get your key, your room is warm, and you're asleep in twenty minutes."
primaryFocus: "First successful business task inside the product"
inScope:
  - "Guided first-run experience and activation moments"
  - "Sample data so the app is never a terrifying blank page"
  - "Contextual help at the exact point of confusion"
outOfScope:
  - "Server architecture the user will never see"
  - "Admin configuration and user-management screens"
