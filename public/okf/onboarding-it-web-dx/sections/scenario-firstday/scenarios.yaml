id: monday-without-a-path
title: "Monday Without a Path"
intro: "It is 9:10 on Monday morning. Forty newcomers — end users, operators, and five platform developers — are logged in (most of them) to a Wi-Fi guest network, a wiki nobody has refreshed since last quarter, and a Slack channel called #newest-hires. As the onboarding lead, what do you do first?"
nodes:
  start:
    prompt: "Forty pairs of eyes are on you. What is the first move?"
    choices:
      - id: read-wiki
        text: "Send everyone the wiki link and a 40-page handbook to read while you put out fires"
        next: result-firehose
      - id: triage-access
        text: "Stop everything and triage access: who can actually log in and touch a real environment today?"
        next: result-triage
      - id: big-slides
        text: "Book the afternoon for a full architecture presentation so everyone shares context"
        next: result-slides
  result-firehose:
    outcome:
      verdict: "By lunch the handbook has 3 comments, the #newest-hires channel has 27 questions, and you have answered none of them. Two developers have already quietly left to 'explore the API later'."
      lesson: "The information firehose with no human anchor is the doctrine's textbook failure: passive content plus unanswered questions at hour three is exactly where motivation dies."
      rating: c
  result-slides:
    outcome:
      verdict: "You covered the microservices diagram beautifully. The operators wanted their runbooks, the end users wanted their first task, and the developers wanted their API keys. All three got slides instead."
      lesson: "An architecture tour is not onboarding. Each audience needed its own first value — a task, a graded change, a first API call — not a shared context nobody asked for."
      rating: c
  result-triage:
    prompt: "Triage reveals the truth: the 5 developers have no API keys, 3 operators are missing production-reach entitlements, and the end users' sample workspace is empty. You have one day and one team. Where do you spend it?"
    choices:
      - id: fix-all-yourself
        text: "Personality-provision all 40 people yourself, one browser tab at a time"
        next: result-hero
      - id: scripted-fastest
        text: "Fix the fastest scripted wins first: mint dev keys via the self-serve flow, fill the sample workspace, file the privileged grants properly"
        next: result-wins
      - id: wait-ticket-queue
        text: "File everything into the normal IT queue and tell people to expect access 'soon'"
        next: result-queue
  result-hero:
    outcome:
      verdict: "You personally fix 14 people's access by 11pm. The remaining 26 wait for the hero to recover. Next Monday's cohort gets nothing, because you are asleep."
      lesson: "Heroic manual provisioning is the anti-pattern the provisioning flow exists to automate: SSO group rules and self-serve key minting scale; your browser tabs do not."
      rating: b-minus
  result-queue:
    outcome:
      verdict: "The queue is honest, at least. It is also three weeks deep. Week one becomes week three of 'ping me when you're stuck', and three newcomers quit-point to silence."
      lesson: "Waiting-for-access is the number-one onboarding killer: Access First means credentials exist before day one, and 'soon' is how first value slips from week one to never."
      rating: c
  result-wins:
    outcome:
      verdict: "By 3pm the developers ship their first test call against seeded sandbox data, the end users complete their first real record in a populated workspace, and the operators are shadowing an afternoon incident with runbooks open. You book office hours for Thursday and pin the handbook's single golden-path page in the channel."
      lesson: "This is the doctrine in one day: access unblocked through automation, one golden-path task per audience to first value, progressive depth via the handbook, and a scheduled human anchor for the questions. Measure who stalls next and fix that first."
      rating: a
