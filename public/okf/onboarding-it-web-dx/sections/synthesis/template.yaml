challenges:
  - prompt: "Complete the doctrine (Track 1):"
    template: "The doctrine grants {zone-1} before day one, drives every newcomer to one {zone-2} task in week one, and reveals complexity through {zone-3}."
    chips:
      - id: chip-access
        text: "day-zero access"
      - id: chip-wiki
        text: "a 40-page handbook"
      - id: chip-golden
        text: "golden-path"
      - id: chip-firehose
        text: "an information firehose"
      - id: chip-disclosure
        text: "progressive disclosure"
    solution:
      zone-1: "chip-access"
      zone-2: "chip-golden"
      zone-3: "chip-disclosure"
    explanation: "<strong>Correct!</strong> Principle 1 grants day-zero access, Principle 2 drives one golden-path task in week one, and Principle 4 reveals complexity through progressive disclosure — the handbook firehose is the anti-pattern."
  - prompt: "Complete the method doctrine (Track 2):"
    template: "At hundred-thousand-user scale only {zone-1} scale at near-zero marginal cost; high-risk operator roles climb best via {zone-2}; and the docs-first {zone-3} is the backbone, never the only door."
    chips:
      - id: chip-bootcamps
        text: "bootcamps"
      - id: chip-tours
        text: "self-serve in-app tours"
      - id: chip-buddy
        text: "buddy apprenticeship"
      - id: chip-handbook
        text: "handbook"
    solution:
      zone-1: "chip-tours"
      zone-2: "chip-buddy"
      zone-3: "chip-handbook"
    explanation: "<strong>Correct!</strong> In-app tours carry the mass audience, apprenticeship carries the high-risk climb (watching for burnout), and the handbook is the spine everything links to — bootcamps are calendar-locked and cost-per-head."
  - prompt: "Complete the measurement doctrine (Track 3):"
    template: "The dashboard's north star is {zone-1}; a {zone-2} is an unanswered-documentation signal; and the provisioning flow's rework loop is nicknamed {zone-3}."
    chips:
      - id: chip-ttfv
        text: "time-to-first-value"
      - id: chip-pages
        text: "pages-read count"
      - id: chip-storm
        text: "ticket storm"
      - id: chip-4003
        text: "'4003 access denied'"
      - id: chip-smoke
        text: "'Monday morning'"
    solution:
      zone-1: "chip-ttfv"
      zone-2: "chip-storm"
      zone-3: "chip-4003"
    explanation: "<strong>Correct!</strong> Time-to-first-value is the north star the whole stack feeds; ticket storms are the cohort telling you where the path broke; and the manual credential-fix loop earns its name from the day-one 4003 that exposes it. Pages-read counts are the vanity metric the realm rejects."
