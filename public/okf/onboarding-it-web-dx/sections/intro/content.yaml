type: intro
title: "Onboarding Craft for IT Systems, Web Apps & Developer Experience"
subtitle: "Get newcomers to their first real win fast — with the right onboarding method for the right audience"
estimatedTime: "40 min"
moduleCount: 15
what:
  definition: "Onboarding is the engineered path from 'a stranger is granted a account, a seat, or an API key' to 'this person has delivered something real without asking for help'. For an IT system that means staff and operators; for a Web App it means end users; for Developer Experience it means integrators building on your platform."
  summary: "Most onboarding fails the same way: a firehose of documentation, a pile of passwords, and a week of 'ping me if you're stuck'. This realm teaches the opposite discipline — grant access before day one, drive every newcomer to one golden-path task that produces real value in the first week, reveal complexity progressively, and measure the friction instead of guessing. Then pick the method that fits the audience: docs-first handbooks, buddy apprenticeship, cohort academies, self-serve in-app tours, or sandbox quests."
  bullets:
    - "Access First: credentials, licenses, and environments are ready on day zero — waiting for access is the number-one onboarding killer"
    - "Time-to-First-Value: the only week-one metric that matters is how fast a newcomer completes one real, meaningful task"
    - "One Golden Path: a single canonical end-to-end journey beats a feature tour of every button"
    - "Progressive Disclosure: teach the next step only when the newcomer needs it — information firehoses create quit-points"
    - "Human Anchor: every method, even fully self-serve ones, needs a named human or office hours to land questions on"
    - "Measure the Friction: day-1 login success, golden-path completion, and ticket storms tell you where onboarding breaks"
  tags:
    - "Onboarding"
    - "Developer Experience"
    - "User Activation"
    - "IT Operations"
    - "Enablement"
why:
  summary: "Bad onboarding is invisible until it shows up as a support queue full of 'how do I…' tickets, developers who quietly abandon your API after an afternoon of setup, and new staff who spend a month afraid to touch production. Onboarding is the highest-leverage moment in the whole lifecycle: attention is high, habits are unformed, and everything you teach sticks."
  impact: "Teams that pre-provision access and script a golden-path first task cut time-to-first-value from weeks to hours, slash newcomer support tickets, and dramatically improve both user activation and developer retention. Every onboarding method trades cost, consistency, and speed differently — choosing deliberately instead of defaulting to 'read the wiki' is the whole game."
