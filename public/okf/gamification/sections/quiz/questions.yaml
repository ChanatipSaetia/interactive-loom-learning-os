- id: q1
  question: "According to Deterding et al. (2011), gamification is..."
  hint: "Focus on the word 'elements', not 'games'."
  choices:
    - id: a
      text: "The creation of full games for educational purposes"
      correct: false
      explanation: "That describes game-based learning. Gamification applies game design elements to non-game contexts — it does not require building a game."
    - id: b
      text: "The use of game design elements in non-game contexts"
      correct: true
      explanation: "Correct. This is the standard academic definition — note 'elements', not whole games."
    - id: c
      text: "Adding points to any software product"
      correct: false
      explanation: "Points are just one element among many. The definition covers any game design element used in a non-game context."
    - id: d
      text: "Making work feel like a video game"
      correct: false
      explanation: "Close, but imprecise. The context does not need to feel like a game — it borrows game design elements."
- id: q2
  question: "Self-Determination Theory holds that intrinsic motivation depends on satisfying three basic needs. Which is NOT one of them?"
  hint: "Think: control, effectiveness, connection."
  choices:
    - id: a
      text: "Autonomy"
      correct: false
      explanation: "Autonomy is one of the three needs — feeling in control of your own behavior."
    - id: b
      text: "Competence"
      correct: false
      explanation: "Competence is one of the three needs — feeling effective and growing."
    - id: c
      text: "Obedience"
      correct: true
      explanation: "Correct. Obedience is not a basic psychological need in SDT. The third need is relatedness."
    - id: d
      text: "Relatedness"
      correct: false
      explanation: "Relatedness is one of the three needs — feeling connected to others."
- id: q3
  question: "What is the overjustification effect?"
  hint: "Think about what happens when you pay someone for something they already enjoy."
  choices:
    - id: a
      text: "The tendency to overrate a reward when it is unexpected"
      correct: false
      explanation: "That describes surprise reward salience, not overjustification."
    - id: b
      text: "Extrinsic rewards undermining intrinsic motivation for an activity"
      correct: true
      explanation: "Correct. When the reward explains the behavior, people shift attribution from enjoyment to payment — and intrinsic motivation drops when the reward stops."
    - id: c
      text: "Users farming more points than they actually earned"
      correct: false
      explanation: "That is point-farming — a metric-gaming behavior, not a motivation effect."
    - id: d
      text: "Justifying poor design choices with metrics"
      correct: false
      explanation: "That is post-hoc rationalization in product teams, not a documented motivation effect."
- id: q4
  question: "In Octalysis, a user's fear of breaking a 100-day streak is an example of which Core Drive?"
  hint: "It is about losing what you have, not gaining what you don't."
  choices:
    - id: a
      text: "Development & Accomplishment"
      correct: false
      explanation: "Accomplishment is about gaining progress — the fear of losing it belongs to a different drive."
    - id: b
      text: "Scarcity & Impatience"
      correct: false
      explanation: "Scarcity is about limited quantity or time, not about losing accumulated progress."
    - id: c
      text: "Loss & Avoidance"
      correct: true
      explanation: "Correct. Core Drive 8 — loss aversion. The streak converts your progress into something you can lose, and the pain of loss outweighs the joy of gain."
    - id: d
      text: "Epic Meaning & Purpose"
      correct: false
      explanation: "Meaning is about a higher purpose — unrelated to the fear of losing a streak."
- id: q5
  question: "Why do global top-10 leaderboards tend to demotivate most users?"
  hint: "Ask what a user in the bottom 99% sees."
  choices:
    - id: a
      text: "Rendering ten rows is expensive for the app"
      correct: false
      explanation: "Ten rows are trivial to render. The problem is psychological, not technical."
    - id: b
      text: "The gap between most users and the top feels unreachable"
      correct: true
      explanation: "Correct. When the target is out of reach, effort collapses. Nearest-competitor boards fix this by showing a small, winnable gap."
    - id: c
      text: "Users dislike seeing other people's names"
      correct: false
      explanation: "Names are not the issue — the unreachable distance is."
    - id: d
      text: "Leaderboards are inherently dark patterns"
      correct: false
      explanation: "Leaderboards are not inherently dark patterns — poorly designed ones (global top-10 as a default) can be demotivating."
- id: q6
  question: "Why did Duolingo add streak freezes?"
  hint: "Think about what happens the day after a user misses one day."
  choices:
    - id: a
      text: "To reduce the server cost of streak calculations"
      correct: false
      explanation: "Freezes are a behavioral design feature, not a cost optimization."
    - id: b
      text: "To provide an escape valve so one missed day doesn't collapse weeks of progress"
      correct: true
      explanation: "Correct. Freezes keep the motivating power of loss aversion while preventing streak anxiety from turning into quitting — pairing pressure with relief."
    - id: c
      text: "Because app stores require them"
      correct: false
      explanation: "No such requirement exists — it was a deliberate retention design decision."
    - id: d
      text: "To make streaks longer and more impressive"
      correct: false
      explanation: "Freezes don't make streaks longer — they reduce the penalty of a missed day so users keep coming back."
