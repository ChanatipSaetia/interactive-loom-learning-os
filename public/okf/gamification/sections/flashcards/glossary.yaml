- id: gamification
  word: "Gamification"
  pronunciation: "gam-ih-fih-KAY-shun"
  category: concept
  shortDefinition: "Using game design elements in non-game contexts to motivate behavior."
  detailedDefinition: "Coined in 2002 and defined academically by Deterding et al. (2011) as 'the use of game design elements in non-game contexts'. It covers everything from points and badges to narrative, feedback loops, and social dynamics."
  whyItMatters: "It is the umbrella term for the whole discipline - every mechanic and framework in this topic serves it."
  dialogue:
    user: "Can we just add points to our onboarding?"
    aiThoughts: "They're thinking about one mechanic, not a system. Points alone decay fast."
    aiQuestion: "What behavior do you want to sustain, and which motivation drive would actually sustain it - before we pick any mechanic?"

- id: intrinsic-motivation
  word: "Intrinsic Motivation"
  pronunciation: "in-TRINS-ik mo-tuh-VAY-shun"
  category: motivation
  shortDefinition: "Doing something because it is inherently interesting or satisfying."
  detailedDefinition: "The internal fuel of long-term engagement: curiosity, enjoyment, mastery. It is what makes people keep doing an activity long after external rewards stop arriving."
  whyItMatters: "Intrinsic motivation is the most durable kind - but it is fragile and can be undermined by poorly designed rewards."
  dialogue:
    user: "Users love the sandbox mode way more than the main campaign."
    aiThoughts: "Sandbox mode is open-ended - they choose, they experiment. That's intrinsic fuel."
    aiQuestion: "What makes the sandbox feel free - and can the main campaign give that same sense of choice?"

- id: extrinsic-motivation
  word: "Extrinsic Motivation"
  pronunciation: "ek-STRINS-ik mo-tuh-VAY-shun"
  category: motivation
  shortDefinition: "Doing something for separable outcomes - rewards, grades, or avoiding punishment."
  detailedDefinition: "Behavior driven by external consequences: points, money, recognition, deadlines. Powerful for short-term behavior change, but fragile - it fades when the reward stops."
  whyItMatters: "Most naive gamification is pure extrinsic motivation, which is why it decays within weeks."
  dialogue:
    user: "Let's pay users 5 dollars per completed tutorial."
    aiThoughts: "Cash rewards are the strongest extrinsic motivator - and the fastest to corrupt intrinsic interest."
    aiQuestion: "Will users still complete tutorials for the joy of it once the payments stop?"

- id: pbl
  word: "PBL (Points, Badges, Leaderboards)"
  pronunciation: "P-B-L"
  category: mechanism
  shortDefinition: "The classic trio of gamification mechanics."
  detailedDefinition: "Points track progress, badges symbolize accomplishment, leaderboards enable social comparison. Cheap to implement, but they address only one core drive - Development & Accomplishment."
  whyItMatters: "PBL is the default first move of most teams and the most common cause of 'sprinkles and donuts' failure."
  dialogue:
    user: "Ship the PBL layer this sprint, we'll think about the rest later."
    aiThoughts: "PBL is the easy 10% - but engagement will decay the moment novelty fades."
    aiQuestion: "Which core drives beyond accomplishment do we actually need for this product?"

- id: octalysis
  word: "Octalysis"
  pronunciation: "ok-TAL-sis"
  category: framework
  shortDefinition: "Yu-kai Chou's framework of 8 core drives of human motivation."
  detailedDefinition: "Maps all motivation into 8 drives: Epic Meaning, Development, Creativity, Ownership, Social Influence (white hat), and Scarcity, Unpredictability, Loss (black hat). Used by Google, LEGO, and Tesla."
  whyItMatters: "It forces designers to ask 'which drive am I targeting?' before choosing a mechanic."
  dialogue:
    user: "Our app has badges, XP, and streaks."
    aiThoughts: "That's three mechanics all hitting the same drive - Development & Accomplishment, plus a dose of Loss."
    aiQuestion: "Which of the other six drives is missing, and which one would move engagement next?"

- id: overjustification
  word: "Overjustification Effect"
  pronunciation: "oh-ver-JUS-tih-fih-KAY-shun"
  category: psychology
  shortDefinition: "Extrinsic rewards can undermine intrinsic motivation for an activity."
  detailedDefinition: "Demonstrated in the 1970s (Lepper, Greene & Nisbett): children paid to draw a picture drew less for free afterwards. The reward re-attributed their behavior from enjoyment to payment."
  whyItMatters: "The single biggest trap in gamifying anything people already find enjoyable."
  dialogue:
    user: "Our forum members post constantly - let's reward the best posts with gift cards."
    aiThoughts: "They post because the community is interesting. Gift cards shift the reason to the gift card."
    aiQuestion: "What will the posting rate look like the month the gift cards run out?"

- id: variable-reward
  word: "Variable Reward"
  pronunciation: "VARY-uh-bul RIRD"
  category: mechanism
  shortDefinition: "An unpredictable outcome that keeps users wanting to try again."
  detailedDefinition: "The variable-ratio reinforcement schedule behind slot machines, loot boxes, and surprise XP bonuses. Because the reward is uncertain, the brain stays engaged between attempts."
  whyItMatters: "The strongest short-term engagement hook - and the most ethically delicate one."
  dialogue:
    user: "Randomize the bonus XP on every lesson."
    aiThoughts: "Randomity boosts completion in the short term, but it can create a slot-machine dynamic."
    aiQuestion: "Are we randomizing the reward on top of skill, or replacing skill assessment with luck?"

- id: streak
  word: "Streak"
  pronunciation: "STREEK"
  category: mechanism
  shortDefinition: "A consecutive-day (or consecutive-action) counter that builds habits."
  detailedDefinition: "Converts progress into something you can lose, weaponizing loss aversion. Duolingo's streak is the canonical example - and its streak freezes are the escape valve that prevents all-or-nothing collapse."
  whyItMatters: "The most effective habit mechanic ever shipped at scale - and the most common source of user burnout."
  dialogue:
    user: "Users are quitting the day their streak breaks."
    aiThoughts: "Classic streak anxiety - the loss pain outweighs the gain joy, and one bad day ends weeks of progress."
    aiQuestion: "What escape valve - freeze, repair card, or weekly goal - fits our users' lives?"

- id: flow
  word: "Flow"
  pronunciation: "FLOH"
  category: psychology
  shortDefinition: "Deep engagement when challenge matches skill (Csikszentmihalyi)."
  detailedDefinition: "The state of absorbed focus that happens when a task is neither too easy nor too hard. Games sustain flow by dynamically tuning difficulty; gamified systems should do the same."
  whyItMatters: "No amount of points compensates for a system that pushes users out of flow."
  dialogue:
    user: "New users churn on day 3 - the early lessons are too hard."
    aiThoughts: "Challenge exceeds skill, so they never enter flow and never get the first reward hit."
    aiQuestion: "How do we tune early difficulty so the first win is near-certain, then ramp gradually?"

- id: dark-pattern
  word: "Dark Pattern (in gamification)"
  pronunciation: "DAARK PATE-rn"
  category: ethics
  shortDefinition: "A manipulation tactic disguised as a game mechanic."
  detailedDefinition: "Manufactured scarcity, guilt-tripping notifications, fake countdowns, and punitive resets. They exploit black hat drives to extract behavior the user wouldn't choose freely."
  whyItMatters: "Dark patterns win short-term metrics and destroy long-term trust - and some are now regulated."
  dialogue:
    user: "Let's send a sad-owl notification when users break their streak."
    aiThoughts: "Guilt as a retention tactic is a textbook dark pattern - it converts anxiety into DAU."
    aiQuestion: "Would the user say this nudge respects their autonomy, or pressures them?"
