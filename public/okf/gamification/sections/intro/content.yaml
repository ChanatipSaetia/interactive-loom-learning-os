estimatedTime: "8 min read"
moduleCount: 11
what:
  definition: "Gamification is the use of game design elements and principles — points, levels, challenges, feedback, and narrative — in non-game contexts to motivate, engage, and sustain behavior."
  summary: "A guided tour of why games are engaging, the psychology of motivation behind them, and how to design reward systems that build real habits instead of hollow point-farming."
  bullets:
    - "Intrinsic vs extrinsic motivation and the overjustification trap"
    - "The Octalysis framework — 8 core drives of human motivation"
    - "Reward loop design: trigger, action, variable reward, investment"
  tags:
    - "Behavioral Design"
    - "Motivation Psychology"
    - "Reward Systems"
    - "Octalysis"
why:
  summary: "Most gamification fails because teams bolt on points, badges, and leaderboards without understanding what actually motivates people. Superficial PBL decay within weeks."
  impact: "Understanding core motivation drives lets designers choose mechanics that sustain engagement, build habits, and respect users instead of manipulating them."
