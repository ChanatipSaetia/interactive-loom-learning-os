- icon: "Layers"
  title: "Display Objects & Scene Graph"
  subtitle: "Hierarchical visual tree structure"
  description: "The core nodes used to organize, position, and render visual content in PixiJS."
  details: "Containers provide hierarchical spatial transforms (x, y, scale, rotation, skew) and alpha blending. Sprites bind 2D textures to quads. AnimatedSprite cycles frame sequences, and NineSliceSprite preserves borders during UI resizing."
  analogy: "Like a Photoshop layer hierarchy where moving a group folder automatically moves all sub-layers inside it."
  primaryFocus: "Organizing game worlds, UI panels, and multi-part character puppets."
  inScope:
    - "Container hierarchy & transform propagation"
    - "Sprite & AnimatedSprite rendering"
    - "NineSliceSprite & TilingSprite"
    - "Local vs World coordinate space conversion"
  outOfScope:
    - "Complex 3D skeletal bones (use Spine/DragonBones extensions)"
    - "Physics simulation (delegate to Matter.js or Rapier)"
  color: "#89b4fa"

- icon: "Shapes"
  title: "Vector Graphics & Geometry"
  subtitle: "Procedural shapes, paths, and meshes"
  description: "Dynamic shape drawing and custom vertex mesh manipulation on the GPU."
  details: "Graphics generates 2D vector shapes (rectangles, circles, bezier paths, polygons) converted on-the-fly into triangulated vertex buffers. MeshSimple and MeshRope allow deformable ribbons, flags, and custom geometry."
  analogy: "Like an SVG vector canvas with stroke and fill commands, but compiled into GPU triangle primitives."
  primaryFocus: "Drawing debug bounds, dynamic UI wireframes, health bars, and deformable rope ribbons."
  inScope:
    - "PIXI.Graphics path drawing & bezier curves"
    - "Holes, fills, and parametric strokes"
    - "MeshSimple & MeshRope triangulated ribbons"
    - "Dynamic redraw vs pre-baked RenderTexture"
  outOfScope:
    - "3D polygon modeling (PixiJS is strictly 2D)"
    - "Font vector tracing at runtime"
  color: "#a6e3a1"

- icon: "Type"
  title: "Typography & Text Rendering"
  subtitle: "Canvas text vs GPU bitmap fonts"
  description: "Text display strategies balancing styling flexibility against 60 FPS render performance."
  details: "PIXI.Text rasterizes fonts using HTML5 2D Canvas context and generates an internal texture. PIXI.BitmapText renders characters from pre-baked XML/JSON font atlases using batched quads for zero CPU overhead."
  analogy: "PIXI.Text is like printing a new photo each time words change; BitmapText is like stamping pre-carved wooden letter blocks."
  primaryFocus: "Rendering dialog boxes, score counters, HUD indicators, and localized strings."
  inScope:
    - "PIXI.Text with styling (drop shadow, gradient fill, stroke)"
    - "PIXI.BitmapText with high-speed batched character quads"
    - "HTMLText for rich HTML/CSS formatted labels"
    - "Font atlas generation and loading"
  outOfScope:
    - "Complex RTL bidirectional text shaping without plugins"
    - "Live vector font glyph deformation"
  color: "#f9e2af"

- icon: "Sparkles"
  title: "Shaders, Filters & Post-Processing"
  subtitle: "Custom GLSL effects and full-screen passes"
  description: "GPU fragment and vertex shader pipelines for lighting, blur, distortion, and stylization."
  details: "Filters render target objects into offscreen framebuffers and pass them through custom GLSL shaders. ColorMatrixFilter provides tinting/grayscale, BlurFilter softens edges, and DisplacementFilter creates liquid ripples."
  analogy: "Like applying real-time Instagram filters and optical lenses over rendered canvas layers."
  primaryFocus: "Visual juice: shockwaves, water reflections, CRT monitors, glow highlights, and color grading."
  inScope:
    - "Built-in filters (ColorMatrix, Blur, Alpha, Noise)"
    - "Custom GLSL fragment and vertex shader filters"
    - "Displacement maps & uv animation"
    - "Filter padding and resolution scaling"
  outOfScope:
    - "Raytracing and global illumination"
    - "Multi-pass deferred 3D lighting"
  color: "#cba6f7"

- icon: "Zap"
  title: "High-Performance Batching & Particles"
  subtitle: "Ultra-high-throughput rendering pipelines"
  description: "Techniques for rendering tens of thousands of simultaneous entities at locked 60 FPS."
  details: "ParticleContainer strips complex scene-graph overhead to pump raw vertex buffers directly to the GPU. Texture atlases group assets into single BaseTextures to avoid draw-call batch breaks."
  analogy: "Like a freight train loading thousands of identical shipping crates at once rather than sending individual courier trucks."
  primaryFocus: "Bullet hell shoot-em-ups, weather effects (snow/rain), particle explosions, and massive starfields."
  inScope:
    - "ParticleContainer with selective dynamic properties (position, scale, uv)"
    - "Spritesheet atlas packaging to eliminate batch breaks"
    - "RenderTexture baking for static sub-trees"
    - "Object pooling to avoid GC pauses"
  outOfScope:
    - "Complex nested hierarchy inside particle containers"
    - "Custom per-particle shader uniforms"
  color: "#fab387"
