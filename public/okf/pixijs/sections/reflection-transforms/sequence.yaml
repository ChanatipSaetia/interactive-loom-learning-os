challenges:
  - prompt: "Order the stages of coordinate matrix transformation from local entity properties to canvas screen viewport:"
    items:
      - id: "t-3"
        text: "Child local matrix is multiplied by parent worldTransform matrix during depth-first traversal"
        icon: "Layers"
      - id: "t-1"
        text: "Developer modifies entity local properties (x, y, scale, rotation, pivot)"
        icon: "Edit"
      - id: "t-5"
        text: "Vertex Buffer Object coordinates are transformed by projection matrix onto WebGL viewport"
        icon: "Monitor"
      - id: "t-2"
        text: "Local affine transformation matrix (a, b, c, d, tx, ty) is constructed"
        icon: "Grid"
      - id: "t-4"
        text: "Four corner quad vertices are multiplied by resulting worldTransform to produce absolute coordinates"
        icon: "Box"
    solution:
      - "t-1"
      - "t-2"
      - "t-3"
      - "t-4"
      - "t-5"
