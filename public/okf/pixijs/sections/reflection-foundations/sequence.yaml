challenges:
  - prompt: "Arrange the PixiJS Application startup and initialization lifecycle in correct chronological order:"
    items:
      - id: "init-3"
        text: "Initialize root app.stage Container as the top-level display tree node"
        icon: "Layers"
      - id: "init-1"
        text: "Instantiate new PIXI.Application() orchestrator object"
        icon: "Sparkles"
      - id: "init-5"
        text: "Append app.canvas element into the HTML document body to display graphics"
        icon: "Monitor"
      - id: "init-2"
        text: "Await asynchronous app.init() with canvas dimensions and WebGL/WebGPU options"
        icon: "Settings"
      - id: "init-4"
        text: "Start internal Ticker loop listening to window.requestAnimationFrame"
        icon: "Clock"
    solution:
      - "init-1"
      - "init-2"
      - "init-3"
      - "init-4"
      - "init-5"
