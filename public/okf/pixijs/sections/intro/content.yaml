    title: "Architecture & Scene Graph Map"
    type: "concept-map"
    description: "Explore the structural relationships between Application, Stage, Container, Sprite, Texture, and Renderer."
  - sectionId: "flashcards"
    title: "Essential PixiJS Terminology"
    type: "flashcards"
    description: "Master vocabulary including Batching, Ticker, World Transforms, Blend Modes, and Texture Atlases."
  - sectionId: "taxonomy-browser"
    title: "Display Object Categories"
    type: "taxonomy-browser"
    description: "Compare Containers, ParticleContainers, Vector Graphics, Text renderers, and GLSL Filters."
  - sectionId: "text-core"
    title: "The PixiJS Render Pipeline"
    type: "text"
    description: "Deep dive into matrix transform propagation, batching breaks, and memory lifecycle."
  - sectionId: "flowchart"
    title: "60 FPS Frame Render Loop"
    type: "flowchart"
    description: "Trace the step-by-step event storming lifecycle from Ticker tick to WebGL framebuffer swap."
  - sectionId: "reflection-sequence"
