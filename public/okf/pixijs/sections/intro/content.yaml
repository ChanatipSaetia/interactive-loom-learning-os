type: intro
title: "PixiJS — 2D WebGL & WebGPU Creation Engine"
subtitle: "High-performance hardware-accelerated 2D graphics, scene graphs, and batch rendering"
estimatedTime: "25 min"
moduleCount: 10
what:
  definition: "PixiJS is a rendering engine that allows you to create rich, interactive 2D graphics, cross-platform applications, and games using WebGL and WebGPU without dealing with complex lower-level shader code."
  summary: "A battle-tested 2D rendering library that provides a hierarchical scene graph, automatic draw-call batching, multi-texture optimization, custom filters, and asset management for 60+ FPS web graphics."
  bullets:
    - "Hierarchical Scene Graph: Tree structure with Containers, Sprites, Graphics, and Text"
    - "Automatic Batch Rendering: Bundles thousands of draw calls into single GPU passes"
    - "WebGL & WebGPU Dual Backends: Modern hardware acceleration with automatic fallbacks"
    - "Asset Management & Texture Atlases: Asynchronous loading, caching, and sprite sheet slicing"
  tags:
    - "PixiJS"
    - "WebGL"
    - "WebGPU"
    - "2D Graphics"
    - "Game Engine"
why:
  summary: "Raw HTML5 2D Canvas struggles when animating thousands of objects due to CPU rasterization bottlenecks, while raw WebGL requires hundreds of lines of shader setup and matrix math boilerplate."
  impact: "PixiJS bridges this gap by offering a clean, intuitive display tree API while unlocking the full speed of the GPU, powering interactive maps, data visualizations, and production web games at locked 60 FPS."
roadmap:
