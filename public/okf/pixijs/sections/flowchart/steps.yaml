- id: "step_tick"
  type: "linear"
  initiatedBy: "app_ticker"
  policy: "When Screen Refresh Triggered"
  command: "Dispatch Delta Time Tick"
  handledBy: "ticker_manager"
  resultEvents:
    - id: "evt_tick_dispatched"
      title: "Delta Tick Dispatched"
      desc: "Frame interval and delta multiplier sent to scene graph"
  continuesAs: "step_transforms"
  description: "Ticker calculates elapsed time and fires frame update"

- id: "step_transforms"
  type: "linear"
  policy: "When Delta Tick Received"
  command: "Update Local & World Transform Matrices"
  handledBy: "scene_graph"
  resultEvents:
    - id: "evt_transforms_updated"
      title: "World Transforms Updated"
      desc: "Hierarchical matrix multiplications complete for all display nodes"
  continuesAs: "step_traverse"
  description: "Traverses container hierarchy to compute absolute world coordinates"

- id: "step_traverse"
  type: "linear"
  policy: "When Transforms Validated"
  command: "Traverse Display Tree & Cull Offscreen Nodes"
  handledBy: "scene_graph"
  resultEvents:
    - id: "evt_visible_nodes_collected"
      title: "Visible Sprites Collected"
      desc: "Render list assembled with visible textured quads"
  continuesAs: "step_batch"
  description: "Collects visible sprites and skips hidden or out-of-bound nodes"

- id: "step_batch"
  type: "linear"
  policy: "When Sprites Queued For Rendering"
  command: "Pack Quad Vertices Into Multi-Texture Batch"
  handledBy: "batch_renderer"
  resultEvents:
    - id: "evt_batches_assembled"
      title: "Batch Geometry Buffers Packed"
      desc: "Vertex and UV buffers filled for compatible sprites sharing textures"
  continuesAs: "step_draw"
  description: "Assembles maximum quad buffers before hitting batch boundary"

- id: "step_draw"
  type: "linear"
  policy: "When Batch Capacity Reached Or State Changes"
  command: "Execute GPU Draw Call"
  handledBy: "webgl_driver"
  resultEvents:
    - id: "evt_frame_rendered"
      title: "Frame Rendered & Displayed"
      desc: "Framebuffer swapped to canvas context at locked 60 FPS"
  description: "WebGL issues gl.drawElements to render batched geometry"
