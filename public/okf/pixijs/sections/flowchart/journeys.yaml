- id: "render_loop"
  label: "60 FPS Render Pipeline Loop"
  description: "Complete execution lifecycle of a single PixiJS frame from requestAnimationFrame tick to GPU draw call."
  steps:
    - stepId: "step_tick"
      name: "1. Animation Tick"
      description: "App ticker receives requestAnimationFrame pulse and computes elapsed delta time."
      processGroup: "planning"
    - stepId: "step_transforms"
      name: "2. Transform Propagation"
      description: "Scene graph multiplies local transforms by parent world matrices."
      processGroup: "execution"
    - stepId: "step_traverse"
      name: "3. Scene Traversal"
      description: "Culling and sorting visible display objects into a render list."
      processGroup: "execution"
    - stepId: "step_batch"
      name: "4. Geometry Batching"
      description: "BatchRenderer packs vertex coordinates, UVs, and texture indices."
      processGroup: "execution"
    - stepId: "step_draw"
      name: "5. GPU Draw Execution"
      description: "WebGL driver executes shader program and swaps canvas buffer."
      processGroup: "evaluation"
