title: "The Dual Pestilence Witchhunter"
subtitle: "Poison + Bleed DoT Mercenary Build — PoE 2 v0.5"
estimatedTime: "8 min read"
moduleCount: 8

what:
  definition: "Poison + Bleed Witchhunter is a dual-ailment DoT build in Path of Exile 2 patch 0.5 that melts enemies through simultaneous Poison and Bleed damage-over-time. It pairs Gas Grenade for area poison clouds with Barrage for rapid bleed application, synergised by the Poison 3, Bleed 3, and At Mixture keystones."
  summary: "Complete build guide for the Witchhunter ascendancy Mercenary, covering dual-ailment mechanics, ascendancy synergies, gear milestones, and DPS calculations."
  bullets:
    - "Dual-ailment loop: Poison 3 + Bleed 3 + At Mixture multiplicative synergy"
    - "Witchhunter ascendancy — No Mercy, Obsessive Rituals, Sorcery Ward"
    - "Gas Grenade for area poison clouds, Barrage for rapid bleed hits"
    - "Budget league-starter scaling into late-game Uber viability"
  tags:
    - "PoE 2"
    - "Witchhunter"
    - "Poison & Bleed"
    - "Damage over Time"

why:
  summary: "Dual-ailment DoT is one of the most forgiving endgame damage types in PoE 2 — apply ailments once and step back while ticks do the work. But misconfiguring the synergy keystones or skipping Obsessive Rituals' offensive trade-off leaves huge damage on the table."
  impact: "Mastering the Poison + Bleed interaction loop, Concentration management via No Mercy, and defensive positioning around Sorcery Ward turns a budget league-starter into a build capable of deleting Uber bosses."

