- id: witchhunter
  word: "Witchhunter"
  pronunciation: "WITCH-hun-ter"
  category: ascendancy
  image: "https://www.poe2wiki.net/images/thumb/9/93/Mercenary_portrait.png/96px-Mercenary_portrait.png"
  shortDefinition: "Third Mercenary ascendancy focused on ballista summons and precision attacks."
  detailedDefinition: "The Witchhunter ascendancy specializes in summoning ballistas that fire projectiles, combined with precision-based offense. Key nodes include Ballista summons, attack speed scaling, and ailment-focused damage multipliers."
  whyItMatters: "Core ascendancy for this build. Provides ballista summons for sustained ailment application and precision nodes that amplify poison and bleed damage."
  dialogue:
    user: "Why Witchhunter over other Mercenary ascendancies?"
    aiThoughts: "Player comparing ascendancy options."
    aiQuestion: "Witchhunter's ballista summons apply ailments independently from your character, letting you stack poison and bleed while kiting safely."

- id: no-mercy
  word: "No Mercy"
  pronunciation: "noh MER-si"
  category: ascendancy
  image: "https://www.poe2wiki.net/images/thumb/b/b1/No_Mercy_passive_icon.png/48px-No_Mercy_passive_icon.png"
  shortDefinition: "Ascendancy node giving up to 40% more damage based on enemy missing Concentration."
  detailedDefinition: "A notable Witchhunter node that grants increasing More Damage as the target's Concentration drops. At maximum effect, enemies with no remaining Concentration take 40% More Damage from all sources."
  whyItMatters: "Massive damage multiplier against boss-tier enemies with Concentration bars. Synergizes with sustained ailment damage that keeps pressure on fleeing targets."
  dialogue:
    user: "Does No Mercy work on normal maps?"
    aiThoughts: "Player unsure about map applicability."
    aiQuestion: "No Mercy only activates against enemies with a Concentration mechanic — mainly Expedition and Delve bosses. On standard maps, focus on raw ailment magnitude instead."

- id: obsessive-rituals
  word: "Obsessive Rituals"
  pronunciation: "ob-SESS-iv RIT-yuh-lz"
  category: ascendancy
  image: "https://www.poe2wiki.net/images/thumb/0/07/Obsessive_Rituals_passive_icon.png/48px-Obsessive_Rituals_passive_icon.png"
  shortDefinition: "50% less Armour and Evasion in exchange for offensive power."
  detailedDefinition: "A Witchhunter notable that trades 50% less Armour and 50% less Evasion Rating for substantial offensive gains, including ailment magnitude and attack speed. Intentional fragility for maximum damage output."
  whyItMatters: "Defines the build's risk-reward identity. You sacrifice physical defense to become an ailment damage specialist — positioning and ballista distance become your real defense."
  dialogue:
    user: "Won't Obsessive Rituals make me too squishy?"
    aiThoughts: "Player worried about survivability trade-off."
    aiQuestion: "It does remove physical defenses, but the ballista summons handle clearing from range. Position carefully and rely on movement skills to survive."

- id: sorcery-ward
  word: "Sorcery Ward"
  pronunciation: "SOR-uh-see WAR-d"
  category: skill
  image: "https://www.poe2wiki.net/images/8/82/Sorcery_Ward_inventory_icon.png"
  shortDefinition: "Barrier mechanic that absorbs damage and recharges over time."
  detailedDefinition: "A defensive skill unique to the Mercenary that creates a damage-absorbing barrier. The ward recharges gradually over time, providing a reliable layer of damage mitigation without requiring active management."
  whyItMatters: "Primary defense layer after taking Obsessive Rituals. Compensates for lost Armour/Evasion with a rechargeable damage shield."
  dialogue:
    user: "How do I stay alive without Armour?"
    aiThoughts: "Player needs defense guidance post-Obsessive Rituals."
    aiQuestion: "Sorcery Ward is your main damage buffer. Keep it topped up during boss fights and use movement to avoid sustained hits."

- id: poison
  word: "Poison"
  pronunciation: "POY-zun"
  category: ailment
  image: "https://www.poe2wiki.net/images/d/d3/Poisoned_debuff_icon.png"
  shortDefinition: "Chaos damage over time with base magnitude equal to 20% of Physical + Chaos damage from the hit."
  detailedDefinition: "An ailment that deals chaos damage over time. The base magnitude captures 20% of the combined Physical and Chaos damage from the triggering hit. Duration scales with attack speed and skill modifiers, allowing multiple overlapping stacks."
  whyItMatters: "One half of the dual-ailment engine. Poison's chaos damage type bypasses enemy resistance more reliably than elemental ailments at endgame."
  dialogue:
    user: "How is poison damage calculated?"
    aiThoughts: "Player needs the math explained simply."
    aiQuestion: "Each poison tick equals 20% of your Physical + Chaos hit damage, modified by more/faster poison nodes. Stack multiple hits for overlapping damage."

- id: bleeding
  word: "Bleeding"
  pronunciation: "BLEE-ding"
  category: ailment
  image: "https://www.poe2wiki.net/images/1/19/Bleeding_debuff_icon.png"
  shortDefinition: "Physical damage over time with base magnitude of 15% of Physical damage, doubled while target moves."
  detailedDefinition: "A physical damage over time ailment. Base magnitude captures 15% of the Physical damage from the triggering hit. Critically, bleeding damage doubles while the affected target is moving, making it exceptionally strong against mobile enemies."
  whyItMatters: "The other half of the dual-ailment engine. The movement damage multiplier makes bleeding synergize with kiting plays and area denial setups."
  dialogue:
    user: "Why does bleeding double when enemies move?"
    aiThoughts: "Player curious about the movement multiplier."
    aiQuestion: "It's a built-in design to reward kiting. Circle-strafe bosses and bleed damage spikes — this is your build's core loop."

- id: magnitude
  word: "Magnitude"
  pronunciation: "MAG-nih-tood"
  category: mechanic
  image: "https://www.poe2wiki.net/images/thumb/d/d0/Magnitude_passive_icon.png/48px-Magnitude_passive_icon.png"
  shortDefinition: "The base damage value captured by an ailment before modifiers are applied."
  detailedDefinition: "The snapshot value that determines how much damage a single ailment instance deals per tick. For poison, magnitude = 20% of (Physical + Chaos) from the hit. For bleeding, magnitude = 15% of Physical from the hit. All % more magnitude modifiers multiply this base value."
  whyItMatters: "The fundamental stat to optimize. Every damage node in this build funnels into magnitude — higher magnitude means stronger ticks per stack."
  dialogue:
    user: "Should I care about magnitude or duration?"
    aiThoughts: "Player confused about ailment priorities."
    aiQuestion: "Magnitude first, always. Duration only matters to ensure ticks outlast the fight. A high-magnitude short poison outdamages a weak long one."

- id: poison-3
  word: "Poison 3"
  pronunciation: "POY-zun three"
  category: keystone
  image: "https://www.poe2wiki.net/images/thumb/f/f9/Poison_passive_icon.png/48px-Poison_passive_icon.png"
  shortDefinition: "Gives more poison magnitude against enemies that are also bleeding."
  detailedDefinition: "A keystone passive that significantly increases poison magnitude specifically when the target is also affected by bleeding. This creates a conditional damage spike that rewards maintaining both ailments simultaneously."
  whyItMatters: "Core keystone that justifies the dual-ailment approach. Without it, poison and bleed operate independently. With it, they multiply each other's value."
  dialogue:
    user: "What does Poison 3 actually do?"
    aiThoughts: "Player needs keystone function clarified."
    aiQuestion: "Poison 3 says 'your poison hits harder when the enemy is also bleeding.' It's the reason this build runs both ailments."

- id: bleed-3
  word: "Bleed 3"
  pronunciation: "BLEED three"
  category: keystone
  image: "https://www.poe2wiki.net/images/thumb/5/50/Bleed_passive_icon.png/48px-Bleed_passive_icon.png"
  shortDefinition: "Gives more bleeding magnitude against enemies that are also poisoned."
  detailedDefinition: "A keystone passive that significantly increases bleeding magnitude specifically when the target is also affected by poison. Paired with Poison 3, it creates a symmetric dual-ailment amplification loop."
  whyItMatters: "The mirror keystone to Poison 3. Together they ensure both ailments are always stronger when stacked, making the dual-ailment strategy mandatory rather than optional."
  dialogue:
    user: "Do I need both Poison 3 and Bleed 3?"
    aiThoughts: "Player weighing keystone investment."
    aiQuestion: "Yes — they feed each other. Poison 3 strengthens poison when bleed is present, and Bleed 3 does the reverse. Dropping one halves the synergy."

- id: at-mixture
  word: "At Mixture"
  pronunciation: "at MIX-chur"
  category: support
  image: "https://www.poe2wiki.net/images/3/34/At_Mixture_inventory_icon.png"
  shortDefinition: "20% more bleeding magnitude against poisoned enemies and 20% more poison magnitude against bleeding enemies."
  detailedDefinition: "A support gem that provides bidirectional ailment magnitude bonuses. When linked to a physical attack, it increases bleeding magnitude by 20% on poisoned targets and poison magnitude by 20% on bleeding targets, amplifying the dual-ailment synergy."
  whyItMatters: "Stacks multiplicatively with Poison 3 and Bleed 3 keystones, creating a compounding damage loop that makes dual ailments dramatically stronger than either alone."
  dialogue:
    user: "Is At Mixture worth linking?"
    aiThoughts: "Player evaluating support gem slot usage."
    aiQuestion: "Absolutely — At Mixture stacks with both keystones. It's the cheapest way to spike dual-ailment damage before investing in expensive uniques."

- id: gas-grenade
  word: "Gas Grenade"
  pronunciation: "gas gre-NAYD"
  category: skill
  image: "https://www.poe2wiki.net/images/6/60/Gas_Grenade_inventory_icon.png"
  shortDefinition: "Fires a bouncing grenade that causes poison gas burst and leaves a growing poison cloud."
  detailedDefinition: "An attack skill that launches a bouncing grenade, dealing an initial poison gas burst on impact and leaving a poison cloud that grows in radius over time. Excellent for area denial and applying poison to multiple enemies simultaneously."
  whyItMatters: "Primary clearing and poison-application skill. The growing cloud ensures sustained poison uptime on groups, feeding into the Poison 3 / Bleed 3 synergy."
  dialogue:
    user: "Which skill should I use for clearing?"
    aiThoughts: "Player needs skill guidance."
    aiQuestion: "Gas Grenade is your clear skill. Bounce it into dense packs and let the expanding cloud apply poison to everything."

- id: barrage
  word: "Barrage"
  pronunciation: "buh-RAJ"
  category: skill
  image: "https://www.poe2wiki.net/images/8/86/Barrage_inventory_icon.png"
  shortDefinition: "Fires a rapid volley of projectiles, empowered to repeat multiple times."
  detailedDefinition: "An attack skill that fires a volley of projectiles in the target direction. When empowered through passive nodes or support gems, Barrage repeats multiple times in a single activation, making it effective for applying bleeding through repeated physical hits."
  whyItMatters: "Strong single-target and AoE option for applying bleeding. Each projectile attempt is a separate hit chance, maximizing bleed application rate."
  dialogue:
    user: "Barrage or Gas Grenade for bosses?"
    aiThoughts: "Player choosing between skills for bossing."
    aiQuestion: "Barrage excels at single-target bleed application through repeated hits. Gas Grenade is better for multi-target poison clouds."

- id: concentration
  word: "Concentration"
  pronunciation: "kon-sen-tray-SHUN"
  category: mechanic
  image: "https://www.poe2wiki.net/images/c/c2/Concentration_debuff_icon.png"
  shortDefinition: "Enemy resource that causes them to flee when depleted; No Mercy scales damage based on missing Concentration."
  detailedDefinition: "A mechanic present on Expedition and Delve enemies where they possess a Concentration bar. When depleted, the enemy enters a fleeing state, attempting to escape the arena. The No Mercy ascendancy node converts their missing Concentration into More Damage dealt against them."
  whyItMatters: "The damage-scaling engine for No Mercy. Pushing Concentration to zero maximizes your damage output on bosses that use this mechanic."
  dialogue:
    user: "How do I maximize No Mercy damage?"
    aiThoughts: "Player wants to optimize the Concentration interaction."
    aiQuestion: "Break the enemy's Concentration bar as fast as possible early in the fight. The lower it is, the higher your No Mercy damage bonus."

- id: escalating-poison
  word: "Escalating Poison"
  pronunciation: "es-kal-AY-ting POY-zun"
  category: mechanic
  image: "https://www.poe2wiki.net/images/thumb/e/e2/Escalating_Poison_passive_icon.png/48px-Escalating_Poison_passive_icon.png"
  shortDefinition: "Increases the maximum number of poison stacks maintainable on a single target."
  detailedDefinition: "A mechanic or node that raises the cap on poison stacks per target. By default, a limited number of poison instances can exist on one enemy. Escalating Poison increases this cap, allowing more simultaneous poison ticks and higher total damage output."
  whyItMatters: "Directly multiplies poison damage by allowing more stacks. Combined with high magnitude, escalating poison turns single-target encounters into chaos damage fountains."
  dialogue:
    user: "How many poison stacks can I have on a boss?"
    aiThoughts: "Player needs stack limit info."
    aiQuestion: "Stack count depends on your Escalating Poison investment. More stacks mean more simultaneous ticks, each dealing magnitude damage."
