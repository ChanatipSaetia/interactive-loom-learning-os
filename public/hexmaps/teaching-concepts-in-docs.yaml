    status: "locked"
    unlockedBy:
      - "capital"
    sectionRef: "concept-techniques"
    description: "Tools for building understanding: analogy with its limits, the worked example, refutation, the non-example, and words with pictures."
    rewards:
      - id: "concept-techniques-relic"
        name: "Explainer's Lens"
        icon: "🔍"
        description: "Proof you can explain a new idea several ways."

