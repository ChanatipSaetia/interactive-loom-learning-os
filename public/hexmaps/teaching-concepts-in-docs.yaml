    type: "archive_spire"
    status: "locked"
    unlockedBy:
      - "knowledge-kinds"
    sectionRef: "mental-models"
    description: "The designer's mirror, the system's mirror and the user's mirror. Only the middle one can be seen, so the docs must reflect what the UI can't."

  - id: "quiz-why"
