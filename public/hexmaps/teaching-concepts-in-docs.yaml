topicId: "teaching-concepts-in-docs"
topicTitle: "Realm of the Understood Idea"
capitalId: "capital"

nodes:
  - id: "capital"
    title: "The Lantern Academy"
    type: "capital"
    status: "unlocked"
    sectionRef: "intro"
    description: "Where the realm's guides learn to light up ideas, not just point at buttons. Their creed: a user who understands can find a path no manual drew."

  - id: "knowledge-kinds"
    title: "The Two Roads"
    type: "archive_spire"
    status: "locked"
    unlockedBy:
      - "capital"
    sectionRef: "knowledge-kinds"
    description: "One road is memorised steps and ends at the first closed gate. The other is understanding, and leads anywhere."
    rewards:
      - id: "knowledge-kinds-relic"
        name: "Map of the Two Roads"
        icon: "🗺️"
        description: "Proof you know why steps alone aren't enough."

  - id: "mental-models"
