    tradeoffMapping:
      clarity: "wisdom"
      reliability: "armor"
      prep: "agility"
      reuse: "fortune"

  - id: "advisor-spire"
    title: "Instrument Selection Advisor"
    type: "archive_spire"
    status: "locked"
    unlockedBy:
      - "webinar-forge"
