    rewards:
      - id: "lens-of-empathy"
        name: "Lens of Empathy"
        icon: "📿"
        description: "A relic that forces every slide to be read through the audience's eyes before it is shown."

  - id: "arc-archive"
    title: "Archive of the Six-Stage Arc"
    type: "archive_spire"
    status: "locked"
    unlockedBy:
      - "audience-spire"
    sectionRef: "narrative-arc"
    description: "Study the canonical presentation arc: hook, roadmap, scenario, demo, gotchas, recap."

  - id: "narrative-arena"
    title: "Trial of the Narrative"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
      - "arc-archive"
    sectionRef: "quiz-narrative"
    description: "Battle the Slide Golem by choosing the right narrative moves for the right audience!"
    monster:
      id: "slide-golem"
      name: "Slide Golem"
      type: "goblin"
      maxHp: 100
      damage: 15
      icon: "🗿"

  - id: "rehearsal-vault"
    title: "Rehearsal Chamber"
    type: "reflection_decryption"
    status: "locked"
    unlockedBy:
      - "narrative-arena"
    sectionRef: "reflection-prep"
    description: "Decrypt the chronological cipher: reorder the rehearsal ritual before the countdown ring expires."

