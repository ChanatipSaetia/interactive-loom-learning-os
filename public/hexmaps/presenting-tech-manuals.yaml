    description: "Survey the five instrument categories: markdown decks, docs sites, API references, guided tours, and recordings."

  - id: "tools-arena"
    title: "Trial of the Instrument Choice"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
