      - "launch-nexus"
    sectionRef: "synthesis"
    healingAmount: 30
    description: "Bind the three tracks: audience doctrine, presentation arc, and instrument mastery."

  # Final Boss
  - id: "boss-lair"
    title: "Lair of the Wall-of-Text Lich"
    type: "boss_lair"
    status: "locked"
    unlockedBy:
      - "synthesis-sanctuary"
    description: "Face the central failure mode of every manual presentation! Requires the Lens of Empathy, the Compass of Instrument Choice, and the Ember of the Flawless Demo."
    requiredItems:
      - "lens-of-empathy"
      - "compass-of-instruments"
      - "ember-of-flawless-demo"
    monster:
      id: "wall-of-text-lich"
      name: "Wall-of-Text Lich"
      type: "boss"
      maxHp: 240
      damage: 38
      icon: "💀"
