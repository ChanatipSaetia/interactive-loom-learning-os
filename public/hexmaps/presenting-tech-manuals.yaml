    description: "Navigate the branching advisor to match any audience to its perfect instrument loadout."
    rewards:
      - id: "compass-of-instruments"
        name: "Compass of Instrument Choice"
        icon: "🧭"
        description: "A relic that always points to the tool that makes the manual impossible to stale."

