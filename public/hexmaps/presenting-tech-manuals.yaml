topicId: "presenting-tech-manuals"
topicTitle: "Realm of the Presented Manual: Docspeak Citadel"
capitalId: "capital"
nodes:
  # Ring 0: Capital Center
  - id: "capital"
    title: "Capital of the Presented Manual: Broadcast Hub"
    type: "capital"
    status: "unlocked"
    sectionRef: "intro"
    description: "The central hub of manual presentation. Learn why presenting the manual is a craft, not a chore!"

  # Side Branch: Memory Monoliths
  - id: "lexicon-monolith"
    title: "Lexicon of the Realm"
    type: "concept_monolith"
    status: "unlocked"
    unlockedBy:
      - "capital"
    sectionRef: "glossary"
    description: "Master the vocabulary of docs-as-code: runbooks, permalinks, quickstarts, and fallback clips."

  - id: "constellation-monolith"
