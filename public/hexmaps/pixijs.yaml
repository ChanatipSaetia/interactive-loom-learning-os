topicId: "pixijs"
topicTitle: "Realm of PixiJS: 2D WebGL Citadel"
capitalId: "capital"
nodes:
  # ─── Capital Center ───
  - id: "capital"
    title: "Citadel of PixiJS: WebGL Hub"
    type: "capital"
    status: "unlocked"
    sectionRef: "intro"
    description: "The grand citadel of 2D hardware-accelerated graphics. Master PixiJS scene graphs, batch rendering, and WebGL pipelines!"

  # ─── Entry Sanctuaries (Heads of 3 Parallel Wings) ───
  # Wing A (Left): Display Primitives & Scene Composition
  - id: "sanctuary-taxonomies"
    title: "Archive Spire of Display Taxonomies"
    type: "archive_spire"
    status: "unlocked"
    unlockedBy:
      - "capital"
    sectionRef: "taxonomy-browser"
    healingAmount: 35
    description: "Explore the capabilities and trade-offs of Containers, ParticleContainers, Vector Graphics, and GLSL Shaders."

  # Wing B (Center): Frame Execution & 60 FPS Pipeline
  - id: "sanctuary-map"
    title: "Monolith of the Scene Graph Hierarchy"
    type: "concept_monolith"
    status: "unlocked"
    unlockedBy:
      - "capital"
    sectionRef: "concept-map"
    healingAmount: 30
    description: "Study the architectural hierarchy linking Application, Stage, Container, Sprite, Texture, and Renderer."

  # Wing C (Right): Coordinates, Matrices & Terminology
  - id: "sanctuary-vocabulary"
    title: "Archive of Engine Vocabulary"
    type: "concept_monolith"
    status: "unlocked"
    unlockedBy:
      - "capital"
    sectionRef: "flashcards"
    healingAmount: 30
    description: "Master essential terms: Batching, Ticker, World Transforms, RenderTargets, and BaseTextures."

  # ─── Initial Wing Challenges (1-to-1 Prerequisite for Deep Sanctuaries) ───
  # Wing A Challenge
  - id: "encounter-taxonomies"
    title: "Unbatched Sprite Marauder Camp"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
      - "sanctuary-taxonomies"
    sectionRef: "quiz-taxonomies"
    description: "An aggressive Marauder spawning un-batched loose sprites! Solve display selection questions to claim the Batch Shield."
    monster:
      id: "sprite-marauder"
      name: "Unbatched Sprite Marauder"
      type: "orc"
      maxHp: 110
      damage: 20
      icon: "👺"
    rewards:
      - id: "batch-shield"
        name: "Shield of Batching"
        icon: "🛡️"
        description: "Combines thousands of sprite quads into single draw calls."

  # Wing B Challenge
  - id: "encounter-vocabulary"
    title: "VRAM Texture Imp Den"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
      - "sanctuary-vocabulary"
    sectionRef: "quiz-vocabulary"
    description: "A mischievous Imp scrambling Texture and BaseTexture allocations! Test your vocabulary recall to defeat it."
    monster:
      id: "imp-vram"
      name: "VRAM Texture Imp"
      type: "goblin"
      maxHp: 90
      damage: 14
      icon: "🧌"
    rewards:
      - id: "key-texture-core"
        name: "Key of BaseTextures"
        icon: "🔑"
        description: "Unlocks GPU texture buffer knowledge."

  # Wing C Challenge
  - id: "reflection-transforms"
    title: "Matrix Transform Vault"
    type: "reflection_decryption"
    status: "locked"
    unlockedBy:
      - "sanctuary-map"
    sectionRef: "reflection-transforms"
    description: "Arrange the chronological stages of coordinate transformation from local entity to WebGL viewport."
    rewards:
      - id: "compass-affine-matrix"
        name: "Compass of Affine Matrices"
        icon: "🧭"
        description: "Calculates local-to-world transformations flawlessly."

  # ─── Deep Sanctuaries (Unlocked by Initial Wing Challenges) ───
  # Wing A Deep Sanctuary
  - id: "sanctuary-decision"
    title: "Grove of the Primitive Advisor"
    type: "reading_sanctuary"
    status: "locked"
    unlockedBy:
      - "encounter-taxonomies"
    sectionRef: "decision-tree"
    healingAmount: 30
    description: "Consult the diagnostic tree to choose the optimal display primitive for any 2D visual task."

  # Wing B Deep Sanctuary
  - id: "sanctuary-flowchart"
    title: "Simulation Nexus of the 60 FPS Flowchart"
    type: "simulation_nexus"
    status: "locked"
    unlockedBy:
      - "reflection-transforms"
    sectionRef: "flowchart"
    healingAmount: 40
    description: "Trace the Event Storming process diagram of the frame execution pipeline."

  # Wing C Deep Sanctuary
  - id: "sanctuary-pipeline"
    title: "Sanctuary of the Render Pipeline"
    type: "reading_sanctuary"
    status: "locked"
    unlockedBy:
      - "encounter-vocabulary"
    sectionRef: "text-core"
    healingAmount: 35
    description: "Master affine transform matrices, batch buffering, and VRAM memory disposal in deep text."

  # ─── Follow-up Wing Challenges & Workshop ───
  # Wing A Follow-up Challenge
  - id: "encounter-optimization"
    title: "VRAM Memory Leak Catacombs"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
      - "sanctuary-decision"
    sectionRef: "quiz-optimization"
    description: "A haunting Spectre spawned from undeallocated WebGL texture buffers! Solve optimization questions to banish it."
    monster:
      id: "leak-spectre"
      name: "VRAM Memory Leak Spectre"
      type: "boss"
      maxHp: 180
      damage: 32
      icon: "👻"
    rewards:
      - id: "atlas-blade"
        name: "Blade of Texture Atlases"
        icon: "⚔️"
        description: "A radiant multiplication blade that packs all sprite assets into unified GPU memory."

  # Wing B Follow-up Challenge
  - id: "reflection-render-loop"
    title: "Render Loop Decryption Crypt"
    type: "reflection_decryption"
    status: "locked"
    unlockedBy:
      - "sanctuary-flowchart"
    sectionRef: "reflection-sequence"
    description: "Order the complete execution lifecycle from requestAnimationFrame pulse to GPU framebuffer swap."
    rewards:
      - id: "tome-60fps-pipeline"
        name: "Tome of the 60 FPS Loop"
        icon: "📖"
        description: "Chronicles the complete lifecycle from requestAnimationFrame to framebuffer swap."

  # Wing C Workshop
  - id: "tradeoff-workshop"
    title: "Rendering Architecture Workshop"
    type: "tradeoff_workshop"
    status: "locked"
    unlockedBy:
      - "capital"
    sectionRef: "tradeoff-sandbox"
    description: "Tune render architecture trade-offs between draw calls, VRAM, and FPS throughput to forge stat buffs."
    tradeoffMapping:
      fps_performance: "evasion"
      draw_calls: "armor"
      memory_footprint: "chaos_shield"
      visual_fidelity: "intelligence"

  # ─── Campaign Climax: Boss Lair ───
  - id: "boss-lair"
    title: "Lair of the Framerate Stutter Dragon"
    type: "boss_lair"
    status: "locked"
    unlockedBy:
      - "encounter-taxonomies"
      - "encounter-vocabulary"
      - "reflection-transforms"
      - "encounter-optimization"
      - "reflection-render-loop"
    description: "The supreme Framerate Stutter Dragon! Requires the Shield of Batching, Key of BaseTextures, Compass of Affine Matrices, Blade of Texture Atlases, and Tome of the 60 FPS Loop to breach its gates."
    requiredItems:
      - "batch-shield"
      - "key-texture-core"
      - "compass-affine-matrix"
      - "atlas-blade"
      - "tome-60fps-pipeline"
    monster:
      id: "gpu-lag-dragon"
      name: "Framerate Stutter Dragon"
      type: "boss"
      maxHp: 280
      damage: 45
      icon: "🐲"
