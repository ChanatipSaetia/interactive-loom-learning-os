topicId: "system-design"
topicTitle: "Realm of System Design: Architecture Citadel"
capitalId: "capital"
nodes:
  # Ring 0: Capital Center
  - id: "capital"
    title: "Capital of System Design: Architecture Hub"
    type: "capital"
    status: "unlocked"
    sectionRef: "intro"
    description: "The central hub of system design knowledge. Learn the foundations of scalable architecture!"

  # Learning Sanctuaries
  - id: "sanctuary-principles"
    title: "Sanctuary of Core Principles"
    type: "reading_sanctuary"
    status: "unlocked"
    unlockedBy:
      - "capital"
    sectionRef: "text"
    healingAmount: 30
    description: "Study the core principles: scalability, reliability, and maintainability."
    rewards:
      - id: "architecture-shield"
        name: "Aegis of Scalability"
        icon: "🛡️"
        description: "A solid architectural shield that withstands high throughput traffic."

  # Knowledge Encounters
  - id: "quiz-chamber"
    title: "Chamber of Knowledge"
    type: "quiz_encounter"
    status: "locked"
    unlockedBy:
      - "sanctuary-principles"
    sectionRef: "quiz"
    description: "Test your understanding with challenging system design questions!"
    monster:
      id: "complexity-creature"
      name: "Complexity Creature"
      type: "goblin"
      maxHp: 100
      damage: 15
      icon: "👾"
    rewards:
      - id: "clarity-amulet"
        name: "Amulet of Clarity"
        icon: "📿"
        description: "A mystical amulet that brings clarity to complex system designs."

  # Reflection Vault
  - id: "reflection-vault"
    title: "Reflection Vault"
    type: "reflection_decryption"
    status: "locked"
    unlockedBy:
      - "sanctuary-principles"
    sectionRef: "reflection"
    description: "Enter the vault of reflection. Analyze real-world trade-offs in system design!"
    rewards:
      - id: "insight-crystal"
        name: "Crystal of Insight"
        icon: "💎"
        description: "A crystal that reveals the hidden trade-offs in architectural decisions."

  # Trade-off Workshop (Challenge Node)
  - id: "tradeoff-workshop"
    title: "Trade-off Workshop"
    type: "tradeoff_workshop"
    status: "locked"
    unlockedBy:
      - "sanctuary-principles"
    sectionRef: "tradeoff"
    description: "Experiment with consistency, availability, latency, and cost trade-offs!"
    tradeoffMapping:
      consistency: "armor"
      availability: "evasion"
      latency: "intelligence"
      cost_efficiency: "chaos_shield"

  # Final Boss
  - id: "boss-lair"
    title: "Lair of Architectural Complexity"
    type: "boss_lair"
    status: "locked"
    unlockedBy:
      - "quiz-chamber"
      - "reflection-vault"
    description: "Face the ultimate system design challenge! Requires the Aegis of Scalability, Amulet of Clarity, and Crystal of Insight."
    requiredItems:
      - "clarity-amulet"
      - "insight-crystal"
      - "architecture-shield"
    monster:
      id: "complexity-dragon"
      name: "Architectural Complexity Dragon"
      type: "boss"
      maxHp: 250
      damage: 40
      icon: "🐲"
